# ── PaperTrail configuration ───────────────────────────────────────────────────

keywords:
  - tumor evolution
  - clonal evolution
  - chromosomal instability
  - CIN
  - aneuploidy
  - genomic instability
  - digital pathology
  - histopathology
  - genomics
  - cancer

# Minimum relevance score (0.0–1.0). Start at 0.30, tune up to reduce noise.
threshold: 0.30

# Sources to query (comment out any you don't need)
sources:
  - arxiv
  - biorxiv
  - pubmed

# ── Journal filtering ──────────────────────────────────────────────────────────
#
# whitelist_only: true  → only journals listed below pass (preprints always pass)
# whitelist_only: false → all unknown journals pass; filter by min_impact_factor
whitelist_only: true
min_impact_factor: 10.0  

# Fragments that match any journal name → always blocked (case-insensitive)
journal_blacklist_fragments:
  - veterinary
  - equine
  - bovine
  - porcine
  - poultry
  - aquaculture
  - fisheries
  - agronomy
  - horticulture
  - plant science
  - soil science
  - dental
  - dentistry
  - orthodontic

