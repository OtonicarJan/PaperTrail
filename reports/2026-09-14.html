.4% for gastric cancer (STAD). A controlled benchmark applying two alternative clustering methods (PyNBS; a dense autoencoder) to identical ATR-RWR propagation matrices recovered no significant driver enrichment (OR = 1.79 and 1.52, n.s.), versus OR = 144.29 (p = 1.77x10^-12) for VARION, confirming that the GIS-weighted centroid architecture, not propagation alone, drives performance; generalization without retraining was further confirmed in two independent cohorts (ICGC CCA, n = 396; PCAWG, n = 110; OR = {infty}, p < 5x10^-9). Together, these results indicate that VARION's GIS-weighted centroid architecture enables individual-patient molecular subtyping that outperforms existing NBS and graph-learning clustering approaches, with high sensitivity for clinically actionable rare subtypes and robust cross-platform generalization.", "authors": "Kwon, T.; Park, Y.-G.; Choi, J.-G.", "date": "2026-09-12", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6088, "score_semantic": 0.6088, "score_lexical": 0.813, "matched": ["cancer"]}, {"id": "https://doi.org/10.1016/j.ccell.2026.08.008", "title": "Ensemble learning of pathology foundation models for precision oncology.", "abstract": "Histopathology is essential for cancer diagnosis and treatment selection, and pathology foundation models learn visual representations from whole-slide images (WSIs). However, existing foundation models are trained on disparate datasets with varying strategies, leading to inconsistent performance and limited generalizability. Here, we introduce ELF (Ensemble Learning of Foundation models), which integrates five pretrained pathology foundation models into unified slide-level representations. Trained on 53,699 WSIs spanning 20 anatomical sites, ELF leverages ensemble learning to capture complementary information across models. ELF's slide-level architecture is designed for data-efficient downstream evaluation, including settings with limited data such as therapeutic response prediction. We evaluate ELF for disease classification and biomarker detection, as well as anticancer and immunotherapy response prediction across multiple cancer types. ELF achieves higher performance than the evaluated constituent and slide-level foundation models across the tested tasks, supporting further evaluation of ensemble learning for pathology applications in oncology.", "authors": "Luo X, Wang X, Eweje F, Zhang X, Gomez Marti JL, Cascarino S, Yang S, Li Y, Quinton R, Xiang J, Ji Y, Li Z, Chen Y, Bergstrom C, Kim T, Olguin FM, Yuan K, Abikenari M, Heider A, Willens S, Rajaram S, West R, Neal J, Schoenfeld A, Diehn M, Vanderbilt C, Li R", "date": "2026-Sep-10", "source": "PubMed", "journal": "Cancer cell", "if": 38.6, "score": 0.6071, "score_semantic": 0.6071, "score_lexical": 0.7037, "matched": ["histopathology", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.1101/2025.02.10.637460", "title": "Dissecting DNA-mismatch-repair-driven mutational processes in human cells", "abstract": "Mismatch repair (MMR) is an essential DNA repair pathway that preserves genome stability by correcting replication errors and other DNA lesions. MMR deficiency (MMRd) leads to increased mutation rates and microsatellite instability, and contributes to tumorigenesis in multiple cancer types, yet the full spectrum of mutational patterns caused by MMRd remains incompletely defined. Here, using CRISPR-Cas9 knockouts in human isogenic cell lines, we systematically profile mutations arising in MMR-deficient cells. We observe a marked increase in mutation burden and the appearance of established MMRd-associated mutational signatures. Unexpectedly, we also detect signatures SBS57 and DBS14 and connect them to germline single-nucleotide polymorphisms that co-occur with MMR-driven indels. In addition, we provide experimental genomic evidence supporting a role of MMR in preventing mutations underlying the widespread SBS1 signature, and we link MMR deficiency to the indel signature ID12, which currently lacks a known aetiology. Finally, comparing in vitro MMRd profiles from rapidly dividing cells without exogenous mutagen exposure to in vivo tumour genomes that reflect lifelong mutation accumulation reveals pronounced differences in signature composition, underscoring the context dependence of MMR-linked mutagenesis. Together, our results broaden the known mutational footprint of MMR deficiency and illuminate previously uncharacterised mechanisms relevant to cancer development.", "authors": "Owusu, M.; Menche, J.; Loizou, J.; Weghorn, D.", "date": "2026-09-10", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5948, "score_semantic": 0.5948, "score_lexical": 0.6517, "matched": ["genomic instability", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.09.10.26362759", "title": "Genomic alterations in histologically clear low grade dysplasia resection margins forecast advanced neoplasia in ulcerative colitis", "abstract": "BackgroundEndoscopic resection is used for the management of dysplasia in ulcerative colitis (UC), but a subset of patients develop subsequent advanced neoplasia (AN), i.e., high-grade dysplasia and/or colorectal cancer, despite apparently complete resection with histologically clear margins. Current risk stratification relies predominantly on histopathological and procedural features, which does not capture underlying genomic field cancerization of morphologically normal mucosa.  ObjectiveTo determine whether genomic alterations within histologically non-dysplastic resection margins are associated with subsequent neoplastic progression following endoscopic resection of UC-associated dysplasia.  DesignWe analysed a retrospective cohort of 51 UC patients, who underwent endoscopic resection of dysplastic lesions at a tertiary referral centre, with a median follow-up of 1947 days. 11 of these had local progression. We performed low-coverage whole genome sequencing (lcWGS) of 56 dysplastic lesions and 91 adjacent histologically non-dysplastic margins. Somatic copy number alteration (CNA) burden and phylogenetic analysis were correlated with progression to AN.  ResultsHistologically non-dysplastic margins from lesions that subsequently progressed to AN demonstrated significantly higher CNA burden compared with non-progressors. In multivariate analysis high margin CNA burden was independently associated with local progression, whereas histologically clear resection margins and en bloc excisions were not.  ConclusionHistological clearance does not necessarily indicate clearance of the cancerised field in UC-associated dysplasia. Genomic detection of field cancerisation within histologically non-dysplastic resection margins identifies patients at increased risk of subsequent neoplasia and provides a potential biomarker for biologically informed post-resection surveillance.  What is already known on this topicO_LIEndoscopic resection is increasingly used for colitis-associated dysplasia, but some patients subsequently develop advanced neoplasia despite histologically complete resections with clear margins. C_LIO_LICurrent risk stratification post-resection relies on histopathological and procedural features, which likely do not capture the cancerised field. C_LI  What this study addsO_LIHistomorphologically non-dysplastic margins can harbour genomic alterations that are shared with the dysplastic lesion, indicating a cancerised field. C_LIO_LIA high burden of copy number alterations in resection margins independently predicts subsequent progression to advanced neoplasia, beyond conventional measures of resection completeness. C_LI  How this study might affect research, practice or policyO_LIBeyond histopathology, genomic assessment of resection margins is low-cost, fast and reproducible and may enable biologically informed risk stratification following endoscopic resection of colitis-associated dysplasia. C_LI", "authors": "Fisher, J.; Brautigam, K.; Grant, H. E.; Mossner, M.; Sakr, C.; Al Bakir, I.; Saunders, B.; Suzuki, N.; Wilson, A.; Baker, A.-M.; Hart, A. L.; Graham, T. A.", "date": "2026-09-11", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.5842, "score_semantic": 0.5842, "score_lexical": 0.4683, "matched": ["histopathology", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.04.749407", "title": "The Greatwall/PP2A-B55α axis remodels the G2/M boundary and shapes cellular dependence on PKMYT1", "abstract": "The switch-like G2/M transition and mitotic exit depend on a feedback loop comprising CDK1, Greatwall kinase, and the PP2A-B55 phosphatase. Monogenic disruptions of these regulators impair cellular functions, drive genomic instability, and promote cancer-associated characteristics. Yet how perturbations of this feedback loop interact, and whether their effects depend on cellular context, remain unclear. Here, we assess how combinatorial perturbations of CDK1, Greatwall, and PP2A-B55 affect cell-cycle control in non-transformed RPE-1 and tumour-derived HeLa cells. We identify PP2A-B55 as a context-dependent G2/M repressor with a critical role in cancer cells, where it cooperates with PKMYT1 and, to a lesser extent, WEE1 to prevent premature mitosis. In cancer cells, but not in non-transformed cells, reduced PP2A-B55 activity and Greatwall overexpression produce marked sensitisation to the PKMYT1-selective RP-6306 and modest sensitisation to the WEE1-selective adavosertib. This asymmetric sensitisation reflects a functional separation between WEE1 and PKMYT1 in S- and G2-phase control. Our work outlines fundamental and cell-type-specific contributions of CDK1, Greatwall and PP2A-B55 to cell-cycle regulation and proposes G2/M plasticity as a vulnerability with utility in PKMYT1-targeted therapy.", "authors": "Zach, R.; Herbert, A.; Dragoi, C.-M.; Meredith, M.; Gadelkarim, L.; Foster, W.; Hochegger, H.", "date": "2026-09-08", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5803, "score_semantic": 0.5803, "score_lexical": 0.7513, "matched": ["genomic instability", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.03.748884", "title": "STED microscopy reveals mitotic stage-dependent CENP-A organization", "abstract": "Chromosome segregation is vital. Its disruption can cause aneuploidy, a hallmark of cancer. Centromere protein A (CENP-A) is an important protein during the segregation as it marks the location of the centromere, where the kinetochore assembles for microtubule attachment. Each mammalian centromere contains hundreds of CENP-A nucleosomes, whose spatial arrangement is expected to be critical for kinetochore function and error-free chromosome segregation. However, previous studies--mostly in fixed cells and focused on metaphase--have yielded conflicting results on CENP-A organization. Given the centromere's sub-diffraction size, we used stimulated emission depletion (STED) super-resolution microscopy to visualize the CENP-A organization in both living (about 45 nm resolution) and fixed (about 30 nm resolution) immortalized human retinal pigment epithelial cells (hTERT RPE-1). We found that CENP-A organization does not adopt a single architecture but spans a spectrum from dense clusters to fragmented subclusters, with mitotic stage-dependent abundance and morphology. CENP-A chromatin is most dispersed in prophase, and progressively compacts during prometaphase and metaphase as microtubules attach. In meta- and anaphase predominantly dense organizations are formed, often with a plate-like morphology. Yet, non-dense and non-plate-like organizations persist through metaphase and anaphase, suggesting CENP-A spatial reorganization is heterogeneous during cell division.", "authors": "Burgers, T. C. Q.; Dijt, S. J.; Vitrano, L.; van den Bogaart, G.; Vlijm, R.", "date": "2026-09-07", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5754, "score_semantic": 0.5754, "score_lexical": 0.8763, "matched": ["aneuploidy", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.09.10.26362768", "title": "Effective tumor kinetics inferred from single routine H&E biopsies enable counterfactual virtual radiotherapy trials", "abstract": "Routine H&E-histopathology captures spatial snapshots of tumor ecosystems, yet computational pathology largely treats them as textures without explicit links to underlying kinetics. We show that patient-specific parameters of a mechanistic reaction-diffusion model can be inferred from a single biopsy. Cell-nucleus point patterns are fitted jointly to the analytical two-point correlation function and power spectral density, recovering patient-specific mechanistic proliferation and diffusion rates across eleven multicenter cohorts. Derived dispersion length and front velocity define mechanistic phenotypes stratifying progression-free and overall survival and adding information independent of routine covariates. We illustrate counterfactual radiotherapy simulations in glioblastoma and show that a virtual clinical trial deescalating histology-calibrated faster-growing tumors to hypofractionation while dose-intensifying slower-growing tumors adds 96.7 days of restricted mean progression-free in silico survival over standard of care (permutation p < 0.001 against random allocation to the same arms). This provides a low-barrier transition from routine histopathology to mechanistically interpretable model-based forward simulations.", "authors": "Schlicke, P.; Ercan, C.; Ranjbar, S.; Seldomridge, A. N.; Aggarwal, S.; Mehta, A.; Sainz, T. P.; Zahid, M. U.; Fang, P.; Hofmann, V. A.; Pasetto, S.; Cisneros Napravnik, T.; Puebla-Osorio, N.; Kuttler, C.; Klopp, A.; Colbert, L.; Holder, A. M.; Weiser, R.; Lin, S. H.; Torres-Cabala, C. A.; Vega, F.; Yuan, Y.; Enderling, H.", "date": "2026-09-12", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.5731, "score_semantic": 0.5731, "score_lexical": 0.9208, "matched": ["histopathology"]}, {"id": "https://doi.org/10.1126/sciadv.aed0587", "title": "Substrate heterogeneity promotes cancer cell dissemination through interface roughening.", "abstract": "Although studies of tumor invasion have mainly emphasized the evolution of genetic and epigenetic heterogeneity, cellular behaviors also depend on the physical microenvironment. Yet, the tumor microenvironment is both complex and continuously remodeled, making it hard to rigorously test its causal influence on tumor dissemination. Here, we adopted a reductionist approach to studying tumor cell invasion in microengineered environments of tunable patterned geometries. We find that not only the presence of obstacles but more unexpectedly their spatial disorder causes a drastic shift from a collective to a single-cell mode of invasion-comparable in strength to loss of cell-cell adhesion. Combining live-imaging and perturbation experiments with minimal biophysical modeling, we demonstrate that cell dissemination results both from local geometrical constraints and a global integration of spatial disorder over time. We identify generic universality classes of invasion dynamics dependent on environmental geometry, enabling us to identify quantitative physical principles for tumor dissemination.", "authors": "Dunajová Z, Tasciyan S, Májek J, Merrin J, Jenkins RP, Sahai E, Sixt M, Hannezo E", "date": "2026-Sep-11", "source": "PubMed", "journal": "Science advances", "if": 13.6, "score": 0.5693, "score_semantic": 0.5693, "score_lexical": 1.0, "matched": ["tumor evolution", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.09.08.26362505", "title": "Genetic mechanisms of mitotic error in 840,853 blood genomes", "abstract": "Mosaic aneuploidies in leukocytes are commonly detectable in aging individuals. Here, we studied inherited genetic influences on susceptibility to such aneuploidies by precisely quantifying chromosomal ploidy from whole-genome sequencing read-depth in 840,853 individuals. This approach revealed autosomal gains in [~]70,000 individuals (7-fold more than previous data sets) and ubiquitous loss of the X chromosome in females and loss of Y in males, each of which exhibited >50% heritability. Genome-wide association analyses of 12 mosaic aneuploidies identified >800 common inherited influences on the generation and proliferation of aneuploid cells. Variants in mitotic spindle assembly checkpoint genes consistently affected aneuploidy of most chromosomes, whereas a missense variant in PMF1 (which encodes a subunit of the outer kinetochore) associated with increased segregation fidelity of some chromosomes at the expense of others. Structural variation within multiple chromosomes associated with allele-specific effects on missegregation rates. An inherited hybrid centromere formed by an ancient recombination of 22q with 13p--generating the largest common structural variant in the human genome--associated with 4-fold greater risk of chromosome 22 gain. Abundant copy number and sequence variation in two X-linked CTCF-binding repeat arrays, ICCE and DXZ4, associated with a 4-fold range in the likelihoods of different X chromosomes to be lost. These results show how genetic risk of chromosomal gains and losses varies greatly across chromosomes and across people, providing instruments for assessing the effects of mosaic aneuploidies on health.", "authors": "Si, Y.; Kamitaki, N.; Tang, D.; Loh, P.-R.", "date": "2026-09-09", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.5605, "score_semantic": 0.5605, "score_lexical": 0.8303, "matched": ["aneuploidy"]}, {"id": "https://www.biorxiv.org/content/10.1101/2025.06.27.661875", "title": "Pan-cancer prediction of tumor immune activation and response to immune checkpoint blockade from tumor transcriptomics and histopathology", "abstract": "Accurately predicting which patients will respond to immune checkpoint blockade (ICB) remains a major challenge. Here, we present TIME_ACT, an unsupervised 66-gene transcriptomic signature of tumor immune activation derived from TCGA (The Cancer Genome Atlas) melanoma data. First, we demonstrate that TIME_ACT scores accurately identify tumors with activated immune microenvironments across different cancer types. Further, analysis of spatial features reveals that tumor microenvironment regions with dense lymphocyte infiltration near tumor cells have high TIME_ACT scores, successfully marking localized immune activation. Second, across 25 transcriptomic ICB cohorts encompassing nine cancer types, TIME_ACT achieves a mean AUC of 0.76 and a mean odds ratio of 5.77, significantly outperforming 30 established transcriptomic signatures and prediction methods for ICB response, including a recently developed foundation model for immunotherapy response prediction. Third, we show that TIME_ACT scores can be accurately inferred from routine tumor histopathology slides and that slide-inferred TIME_ACT scores predict ICB response across nine new independent patient cohorts spanning eight cancer types, achieving a mean AUC of 0.72 and a mean odds ratio of 4.99. These findings establish TIME_ACT as a robust, pan-cancer biomarker that enables accurate, low-cost, and clinically scalable prediction of ICB response from routine histopathology.", "authors": "Mukherjee, S.; Patiyal, S.; Pal, L. R.; Yao, K.; Chang, T.; Biswas, S.; Dhruba, S. R.; Stemmer, A.; Singh, A.; Yousefi-Rad, A.; Chen, T.-H.; Wang, B.; Marino, D.; Shon, W.; Yuan, Y.; Faries, M.; Hamid, O.; Reckamp, K.; Waissengrin, B.; Ornelas, B.; Chu, P.-Y.; Ley, L.; Akbulut, D.; Ahmar, N. E.; Signoretti, S.; Braun, D. A.; Lee, J. S.; Joo, H.; Kim, H.; Osipov, A.; Figlin, R. A.; Bar, J.; Barshack, I.; Day, C.-P.; Hannenhalli, S.; Sargsyan, K.; Apolo, A. B.; Aldape, K.; Yang, M.-H.; Atkins, M. B.; Ronai, Z. A.; Hoang, D.-T.; Ruppin, E.", "date": "2026-09-12", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5497, "score_semantic": 0.5497, "score_lexical": 1.0, "matched": ["histopathology", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.11.750869", "title": "Meiotic kinetochore reconstitution identifies chromosome segregation factors", "abstract": "Kinetochores are complex protein assemblies at centromeres that direct and regulate chromosome segregation1. During gamete formation by meiosis, kinetochore specialisations drive two sequential and distinct segregation events to partition half the genome to the offspring2,3. Age-dependent segregation errors in human oocytes are a major cause of reproductive failure and are linked to kinetochore dysfunction4-6, however the molecular composition and function of mammalian meiotic centromeric chromatin and kinetochores remains poorly defined. Here, we reconstitute vertebrate meiosis I and II centromeric chromatin using meiosis I and II endogenous proteins to uncover conserved regulators of chromosome segregation in mammalian meiosis. We find that, in addition to canonical kinetochore proteins, a specific subset of chromatin regulators is enriched on meiotic centromeric chromatin. We discover previously unrecognized kinetochore proteins conserved from frogs to mouse and humans and demonstrate their localisation at mammalian oocyte centromeres. Among these, we show that the newly identified centromeric protein HSPBAP1, is required to maintain chromosome integrity and ensure faithful segregation in both mouse and human oocytes. These findings define the composition of vertebrate meiotic kinetochores and uncover conserved factors that safeguard mammalian meiotic chromosome segregation, a highly error-prone process and major cause of aneuploidy and reproductive failure in humans7.", "authors": "Pieper, G. H.; O'Loughhlin, N.; Aboelenain, M.; Munro, L.; Sundararajan, K.; Torres-Arce, E.; Lisichkina, D.; Spanos, C.; Ly, T.; Anderson, R. A.; Straight, A. F.; Marston, A.", "date": "2026-09-13", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5465, "score_semantic": 0.5465, "score_lexical": 0.8961, "matched": ["aneuploidy"]}, {"id": "https://doi.org/10.1093/nar/gkag878", "title": "CIZ1 regulates G1 length and the CDK threshold for initiation of DNA replication to prevent DNA replication stress.", "abstract": "Eukaryotic cell division is regulated by CDK activity that must reach critical CDK threshold levels to progress through cell cycle stages. In low-mitogen, low-CDK environments, cells exit the cell cycle into a non-proliferative quiescent state, G0, that plays essential roles in stem cell maintenance and cellular homeostasis. CIZ1 regulates cell cycle and epigenetic programmes, and CIZ1 ablation promotes genomic instability after release from quiescence. Here, we show that CIZ1 contributes to mechanisms that temporally regulate cell cycle transitions in post-quiescent cells. CIZ1-/- (CIZ1 KO) fibroblasts re-entering the cell cycle from quiescence have reduced G1 phase and cell cycle length, mediated by increased intracellular CDK activity and early restriction point bypass via G1/S cyclin overexpression. In addition, CIZ1-/- cells are deficient in cyclin A chromatin binding and require increased CDK activity to initiate DNA replication, leading to DNA replication stress. Importantly, ectopic expression of CIZ1 or addition of recombinant CIZ1 reinstates the CDK threshold for initiation of DNA replication, reversing DNA replication stress and increasing replication fork rates. These data suggest that in post-quiescent cells, CIZ1 determines the threshold CDK activity required for the G1/S transition to prevent DNA replication stress.", "authors": "Tollitt J, Preedy MK, Briggs T, Allinson SL, Staples CJ, Parsons JL, Mort RL, Copeland NA", "date": "2026-Sep-07", "source": "PubMed", "journal": "Nucleic acids research", "if": 14.9, "score": 0.5307, "score_semantic": 0.5307, "score_lexical": 0.5908, "matched": ["genomic instability"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.02.748725", "title": "Single-Cell Indel Detection Enhances Genetic Ancestry and Cellular Lineage Analysis", "abstract": "Small insertions and deletions (Indels) provide critical information for cancer genomics and clonal evolution, yet their detection from single-cell sequencing (SCS) such as scRNA-seq and scATAC-seq remains challenging due to sparse coverage, alignment artifacts, and RNA editing. Here, we present Monopogen-Indel, a bioinformatics framework for accurate germline and somatic Indel detection through haplotype-aware variant calling, dynamic template matching in repetitive regions, and cell-population- based allele segregation analysis. We validated germline Indel detection in human retina snRNA-seq with matched bulk whole genome sequencing (WGS). Monopogen-Indel detected 41,000-45,000 germline Indels per sample, with >70% precision and >90% genotyping accuracy. Using 65 heart left ventricle snATAC-seq samples, indel-based global ancestry inference segregated genetic ancestry comparably to SNVs, establishing indels as an independent marker of genetic diversity in SCS. In scRNA-seq from 43,717 cells across four anatomic sites of a patient with high grade serous ovarian cancer (HGSOC), Monopogen- Indel identified ~50,000 germline Indels per sample at 86% WGS-validated precision and an average of 1,040 de novo Indels per sample. Approximately 50% of de novo Indels reflected biological sources, including variants WGS variants, RNA editing, and cell-type-specific patterns. Somatic SNVs were correctly restricted to CD45- cells, indicating high specificity in delineating somatic from germline variants. In summary, Monopogen-indel is the first framework dedicated to indel detection from SCS and expands the utility of existing single-cell data for population genetics and cancer evolution. The module is integrated into Monopogen repository https://github.com/KChen-lab/Monopogen.", "authors": "Wang, Z.; Chen, K.; Dou, J.", "date": "2026-09-07", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4877, "score_semantic": 0.4877, "score_lexical": 0.9174, "matched": ["clonal evolution", "genomics", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.07.749823", "title": "Individual mouse mitotic chromosomes exhibit cell type-specific differences in biomechanical properties", "abstract": "Cyclic episodes of chromosome compaction and de-condensation are features of eukaryotic cell division that aid mitotic segregation and help prevent aneuploidy. While biophysical data on mitotic chromosome structure has been previously obtained, heterogeneity within samples can confound analyses and precludes direct like-for-like comparisons. To circumvent this, we employed advanced flow cytometry to purify specific metaphase chromosomes with biotinylated telomeres from stably engineered mouse cells. We show that ESC-derived metaphase chromosomes 3 and 19 display distinct properties but share a conserved force-dependent mechanical response. In contrast, chromosome equivalents isolated from NSCs and preB cells show markedly different force-dependent responses, reflecting progressive differentiation stages. Covalent crosslinking of ESC-derived chromosomes alters biomechanical properties to mimic equivalents from more differentiated cells. Collectively, these results highlight the need to isolate specific, homogeneous metaphase chromosome samples to accurately decipher their complex behaviours.", "authors": "Brown, K. E.; Patra, S.; Dimond, A.; Ray, K. K.; Cheriyamkunnel, S.; Patel, B.; Gim, D. H.; Whilding, C.; Llobet Ayala, M.; Kilic, M. E.; Rueda, D. S.; Fisher, A. G.", "date": "2026-09-10", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4762, "score_semantic": 0.4762, "score_lexical": 1.0, "matched": ["aneuploidy"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.06.749715", "title": "A single-cell view of human tissue aging reveals architectural decline beyond cellular composition", "abstract": "Aging reshapes the human body at the cellular level, yet how cell identity, morphology, and spatial organization remodel across organs and the adult lifespan remains poorly mapped, at a scale and lifespan coverage that molecular spatial assays cannot yet reach. Treating the GTEx histopathology archive as a population-scale, lifespan-resolved resource for spatial biology, we detected over 3.5 billion single cells across 16 human organs from nearly one thousand individuals. Cell density declined pervasively but organ-specifically, and vision-language phenotyping resolved epithelial cells into nine subtypes with divergent aging trajectories, including loss of ovarian granulosa cells at ~45% per decade. Community detection on spatial cell graphs identified functional tissue units, over a quarter of which remodeled with age along a shared trajectory from dense, specialized units toward sparser, stromal- and immune-enriched structures. Critically, this architectural remodeling was largely decoupled from cell composition (R2=0.07), showing that human tissues age along two partly independent axes, a pervasive loss of cells and a distinct remodeling of the architecture they form, with structural decline exceeding what cellular composition alone predicts.", "authors": "Abila, E.; Zheng, Y.; Bago-Horvath, Z.; Rendeiro, A. F.", "date": "2026-09-13", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4729, "score_semantic": 0.4729, "score_lexical": 0.6545, "matched": ["histopathology"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.09.04.26362267", "title": "PSMA PET SUVmax Adds Information Beyond Conventional Risk Indices in Localized Prostate Cancer: A Prospective Lesion-Level Radiopathologic Study", "abstract": "BackgroundProstate-specific membrane antigen (PSMA) positron emission tomography (PET) is increasingly used to characterize newly diagnosed prostate cancer on the assumption that uptake highlights aggressive disease. However, maximum standardized uptake value (SUVmax) varies widely across localized tumors. Recent genomic assessments have suggested SUVmax reflects tumor biology even when accounting for other tumor indices. Here, we examined highly annotated pathologic, imaging and clinical correlates of intraprostatic SUVmax at the level of individual tumor foci in a prospective multimodal cohort.  MethodsExploratory lesion-level analysis of the radical prostatectomy arm of a single-center prospective diagnostic-accuracy trial (NCT04461509). Patients underwent simultaneous 18F-DCFPyL PSMA PET, multiparametric magnetic resonance imaging (MRI) and high-resolution MRI before prostatectomy, with central blinded pathology and imaging review. Grade Group (GG) [&ge;]2 foci measuring [&ge;]10 mm were eligible. The primary outcome was focus-level SUVmax. Correlates spanning histology, tumor microenvironment, MRI and clinical indices were examined by Spearman correlation and rank-based group comparison, followed by separate linear regressions of log(1+SUVmax) each adjusted for GG and tumor size. A digital-pathology sensitivity analysis quantified immune, stromal and tumor pixel-area fractions on hematoxylin and eosin (H&E) sections from a subset of foci using a trained QuPath classifier.  ResultsTwenty-seven patients contributed 34 tumor foci, of which 21 (61.8%) were GG2. Median SUVmax was 5.7 (interquartile range [IQR] 3.9-12.1; range 0.0-57.9). SUVmax rose across the cribriform/intraductal carcinoma (Crib/IDC) gradient (median 3.9, 4.8 and 10.2 for absent, focal and extensive; p = 0.010), correlated with % Gleason pattern 4 ({rho} = +0.47, p = 0.005) and correlated inversely with stromal content ({rho} = -0.40, p = 0.020). Grade Group (p = 0.115), Prostate Imaging Reporting and Data System (PI-RADS) 4 versus 5 (p = 0.705), standard apparent diffusion coefficient (ADC) ({rho} = -0.27, p = 0.130), baseline prostate-specific antigen (PSA) ({rho} = +0.04, p = 0.816) and PSA density ({rho} = -0.02, p = 0.918) were not associated with SUVmax. In separate models of log(1+SUVmax) adjusted for Grade Group and tumor size, % Gleason pattern 4 remained associated with uptake (standardized {beta} = +0.76, 95% CI +0.11 to +1.41), Crib/IDC ({beta} = +0.36, -0.03 to +0.74), and stromal content ({beta} = -0.30, -0.62 to +0.02). On 18 slides re-quantified by pixel classifier, no pixel-based compartment fraction correlated with SUVmax (immune {rho} = -0.06, stroma {rho} = +0.02, tumor {rho} = -0.04; all p > 0.5).  ConclusionsIn this prospective lesion-level cohort, intraprostatic PSMA SUVmax was associated with increased Gleason pattern 4 and cribriform/intraductal burden but not with other common risk indices. SUVmax therefore appears to carry information additive to conventional risk factors. Further investigations examining the tumor biology that reflects SUVmax are warranted.", "authors": "Motchoffo Simo, G.; Movva, P.; Seo, J.; Shou, B.; Vega, D.; Hagens, T.; Norris, E. C.; Luthringer, D. J.; D'Agnolo, A.; Sung, K. H.; Calais, J.; Brisbane, W. G.; Reiter, R. E.; Daskivich, T. J.; Li, D.; Saouaf, R.; Kim, H. L.; Weiner, A. B.", "date": "2026-09-08", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.453, "score_semantic": 0.453, "score_lexical": 0.6726, "matched": ["digital pathology", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.09.750446", "title": "Candida albicans promotes self-adhesion and tumor cell progression of colorectal cancer cells.", "abstract": "Candida albicans, a benign commensal yeast in the healthy gut, is increasingly being recognized as a tumor-promoting component of the gut mycobiome that is linked to worse patient outcomes in colorectal cancer (CRC). Emerging evidence suggests that in the tumor microenvironment, C. albicans drives tumor progression in its pathogenic hyphal form with the secretion of its peptide toxin, candidalysin, enhancing tumor cell evolution. CRC cells differentially express transglutaminase 2 (TG2), which mediates covalent binding to C. albicans and can promote tumor adaptability and metastases. However, mechanistic insight into how C. albicans infection leads to CRC progression is incomplete. CRC lines that express high (SW480) and low (LoVo, HCT 116) TG2 were infected with C. albicans and examined for effects on epithelial to mesenchymal transition (EMT) and cell migration. Parallel studies were also conducted using a candidalysin-deficient C. albicans strain. C. albicans invasion stimulated TG2 activity that allowed covalent crosslinking of the hyphae adhesin, Hwp1, to SW480 cells in a candidalysin-dependent manner. Independent of TG2 expression, infection of SW480, LoVo, and HCT 116 cells induced EMT-like changes including downregulation of E-cadherin, altered N-glycosylation of N-cadherin, and variable Snail1 expression. Infection increased MGAT5 activity, which raised levels of branched {beta}(1-6) N-glycans. Infection promoted CRC cell motility that was blocked by pharmacological inhibition of MGAT5. Thus, C. albicans engages CRC cells through separable mechanisms: a candidalysin-TG2-Hwp1 axis that may stabilize fungal attachment in TG2-high tumor cells, and a TG2-independent program of epithelial plasticity, altered N-glycosylation and migration-associated behavior that requires validation in vivo.", "authors": "Staab, J. F.; Paulin, O. K. A.; Naglik, J. R.; Zachos, N. C.", "date": "2026-09-11", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4488, "score_semantic": 0.4488, "score_lexical": 0.8045, "matched": ["tumor evolution", "cancer"]}, {"id": "https://doi.org/10.1038/s41467-026-76417-3", "title": "scAmp enables focal gene amplification analysis from single-cell data.", "abstract": "Oncogene amplification on extrachromosomal DNA is a common driver of tumor progression and is associated with acquired drug resistance and poor patient survival. While bulk whole genome sequencing studies have revealed the landscape of genes amplified on extrachromosomal DNA in tumors, it remains challenging to study the subclonal heterogeneity and functional (e.g., transcriptomic) consequences of extrachromosomal DNA on tumors. To address this, we introduce scAmp: a probabilistic algorithm for detecting and analyzing extrachromosomal DNA from single-cell datasets. Using well-characterized cell lines, we demonstrate that scAmp has improved specificity over bulk genome sequencing in predicting extrachromosomal DNA status and can resolve the status of chromosomal amplifications that were historically extrachromosomal. We further showcase scAmp by analyzing 73 patient tumors profiled with single-cell assay for transposase-accessible chromatin by sequencing, where we characterize the subclonal evolution of subclones with extrachromosomal DNA and identify the effect of these amplifications on the chromatin accessibility landscape of cancer cells. Finally, we provide proof-of-concept analyses that scAmp aids in the detection of extrachromosomal DNA from clinical histopathology assays. Together, we anticipate that scAmp will broadly enable further studies - both retrospective and prospective - that dissect critical questions of how extrachromosomal DNAs affect cancer cells and the tumors in which they reside.", "authors": "Jones MG, Weiser NE, Hung KL, Yan X, Agarwal S, Luebeck J, Gnanasekar A, Zhang S, Wong IT, Tang J, Howitt BE, Curtis EJ, Yu K, Rose JC, Kraft K, Valiollah Pour Amiri V, Satpathy L, Bafna V, Mischel PS, Chang HY", "date": "2026-Aug-08", "source": "PubMed", "journal": "Nature communications", "if": 14.7, "score": 0.4485, "score_semantic": 0.4485, "score_lexical": 0.8925, "matched": ["tumor evolution", "histopathology", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.11.750882", "title": "DDRKOL: A Focused CRISPR Library for Systematic Identification of DNA Damage Response Dependencies in Glioblastoma", "abstract": "Background: DNA damage response (DDR) pathways are central regulators of genome maintenance and major determinants of cancer cell survival. The extensive genomic instability and high replicative stress that characterize glioblastoma render tumor cells highly dependent on DDR pathways to preserve genome integrity and sustain proliferation. This reliance creates potential therapeutic vulnerabilities, making the systematic identification of essential DDR genes a promising strategy for uncovering novel therapeutic targets. Methods: We developed DNA Damage Response KnockOut Library (DDRKOL), a custom CRISPR/Cas9 sgRNA library targeting 819 DDR genes with approximately 10 sgRNAs per gene, together with positive (essential), negative (non-essential) and non-targeting controls. Parallel depletion screens were performed in Cas9-expressing U87-MG and A172 cells cultured for 15 population doublings. Hits were prioritized utilizing TCGA and DepMap databases and validated by viability, clonogenic, apoptosis and GFP competition assays. Clinically relevant patient-derived glioblastoma spheroids and an orthotopic xenograft model was employed to characterize the effects of hit genes. Results: Sequencing confirmed near-complete recovery of the designed sgRNAs from the plasmid pool, with uniform representation across the library and complexity preserved through transduction and selection. Essential-gene controls depleted strongly while non-targeting controls remained neutral, confirming screen performance in both cell lines. The screens identified DDR dependencies in each line and defined a shared core composed of 20 genes belonging to homologous recombination, nucleotide excision repair and ATM/DSB signaling pathways. This shared dependency landscape highlighted four high-confidence candidate genes (TOP2A, CDK1, XRCC6, and RAD21), which were successfully validated across multiple orthogonal assays. These genes displayed grade-associated expression and their expressions were positively correlated with proliferation markers in TCGA. Individual knockouts reduced viability, colony formation and competitive fitness, induced apoptosis, and impaired growth of patient-derived glioblastoma spheroids. Both genetic depletion and pharmacological inhibition of TOP2A induced S/G2-M cell cycle arrest. In orthotopic xenografts, TOP2A depletion prevented tumor progression, and led to significantly prolonged survival. Conclusion: DDRKOL represents a robust and versatile focused CRISPR platform for systematic functional interrogation of the DDR associated genes. Using glioblastoma, we demonstrate that the library reliably identifies biologically significant and clinically relevant genetic dependencies through multiple orthogonal validation approaches. As a reusable platform rather than a disease-specific tool, DDRKOL can be broadly applied across diverse biological contexts to discover context-dependent DDR vulnerabilities, therapeutic targets, and mechanisms of treatment resistance.", "authors": "Bayraktar-Odabas, C.; Kok, I.; Ozbiyik, A.; Kayabolen, A.; Aksu, A. C.; Dur Karasayar, A. H.; Sur Erdem, I.; Kulac, I.; Bagci-Onder, T.", "date": "2026-09-13", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4418, "score_semantic": 0.4418, "score_lexical": 0.4349, "matched": ["genomic instability", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.05.14.724910", "title": "Mammalian spermatogenesis at single-cell resolution downstream of genetic perturbations in meiotic double-strand break repair", "abstract": "Fertility in mammals relies on successful pairing of homologous chromosomes mediated by DNA double-strand breaks (DSBs). Here, we develop a system of mouse hybrids in which (a)symmetry of binding by the break-positioning protein PRDM9 to homologs varies over broad scales in the genome. Profiling transcription and chromatin in single nuclei, we trace how resulting delays in repair of variable subsets of meiotic DSBs propagate through spermatogenesis and drive large fertility differences in animals. We demonstrate that only asymmetry-generating mutations in PRDM9-binding motifs, not high average (~1%) divergence, disrupt chromosomal pairing. We observe substantial variation in animal-level sensitivity to asymmetry, and identify an interacting locus containing Dmc1 and Mei1 controlling (R2=0.64) this variation. Silencing of unpaired autosomes downstream of asynapsis and failure of normal sex chromosome silencing independently explain cell death in pachytene. Surprisingly, many cells with synaptic defects evade cell cycle arrest, and even those where physical division arrests still exhibit transcriptional progression to post-division states. Attrition of abnormal cells via arrest continues beyond the first division; nonetheless, cells that complete both meiotic divisions exhibit aneuploidy, especially of the sex chromosomes. This partly reflects de novo segregation errors explained by silencing of only chromosomes 16 and 19. Even \"normal\" euploid spermatids show crossovers redistributed at multi-megabase scales, indicating novel and potentially post-zygotic impacts of delays in meiotic DSB-repair. We thus elucidate cell-level and chromosome-specific impacts of regulatory variation in ~0.03% of the genome cascading through germline development, advancing our understanding of fertility and reproductive isolation.", "authors": "AGARWAL, I.; Myers, B.; Houlard, M.; Hinch, A.; Bitoun, E.; Myers, S.", "date": "2026-09-11", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4386, "score_semantic": 0.4386, "score_lexical": 0.7968, "matched": ["aneuploidy"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.02.748537", "title": "OCTOPUS: A versatile open-source tool creating realistic numericalbrain cells", "abstract": "Brain cell morphology plays a crucial role in function and pathology. Biophysical models of diffusion MRI (dMRI) quantify cell morphology in vivo, enabling the design of novel biomarkers. These models represent cells by simplified geometries, such as spheres and randomly oriented cylinders, for which analytical signal expressions exist. However, dMRI signals are sensitive to morphological features, such as branching, tapering, undulation, beading, and protrusions, unaccounted for in most models, as they often render analytical solutions impossible. Simulations of the dMRI signal in synthetically generated cells offer a powerful tool to explore how microstructural morphology impacts the dMRI signal. Nevertheless, no tool to generate digital replicas of brain cells is available openly. To address this gap, we introduce the OCTOPUS toolbox, which generates cells featuring all geometrical features described above. OCTOPUS, provided via the Python interface OCTOpool, enables accessible, efficient creation of cells with complex geometries. We recreated histologically reconstructed neuronal and glial cells, including pyramidal, GABAergic and glutamatergic neurons, and astro- and microglia. To illustrate the plausibility of OCTOPUS-generated cells, we reproduced established properties of dMRI signals from brain tissue, such as the signatures of short-range disorder, branching and protrusions, and a high-b-value power law. By comparing the geometries and dMRI signals of generated and original cells, we found different growth strategies adequate for more isotropic and more anisotropic cells. We anticipate that realistic cell substrates created by OCTOPUS will help validate biophysical models, design dMRI sequences sensitive to fine-grained cell morphology beyond analytical models, and generate realistic numerical substrates of brain tissue.", "authors": "Brammerloh, M.; de Riedmatten, I.; Beaubis, J.; Nguyen-Duc, J.; Oliveira, A. R.; Le Boeuf Flo, A.; Fischi-Gomez, E.; Patino Lopez, J. R.; Jelescu, I. O.", "date": "2026-09-07", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4329, "score_semantic": 0.4329, "score_lexical": 0.9302, "matched": ["digital pathology"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.03.749104", "title": "The microtubule-associated proteins CKAP2 and its paralog CKAP2-Like control ciliogenesis in human cells", "abstract": "Ciliogenesis is an evolutionarily conserved process that leads to the assembly of cilia. This process relies on microtubule-associated proteins (MAPs) to regulate axonemal microtubule dynamics. Misregulation of MAPs often leads to changes in ciliary homeostasis, contributing to numerous ciliopathies. Although CKAP2 and CKAP2-Like are best known for regulating microtubule dynamics during cell division, they are also components of ciliary organelles. Notably, CKAP2 overexpression promotes chromosomal instability and cancer, whereas CKAP2-Like deficiency causes Filippi syndrome, a developmental disorder with clinical features overlapping those of ciliopathies. How both MAPs operate at primary cilia remains poorly understood. Here, we identify both MAPs as axonemal components of motile and primary cilia in human cells. We find that CKAP2-positive cilia are linked to cell cycle progression and that the conserved intrinsically disordered microtubule-binding domain of CKAP2, which is essential for microtubule polymerization and stabilization, is required for its ciliary localization. Unexpectedly, CRISPR-mediated loss of either paralog results in elongated cilia without affecting ciliogenesis, accompanied by increased ciliary enrichment of the remaining paralog and impaired Gli2 accumulation at the ciliary tip. In contrast, simultaneous deletion of both MAPs suppresses ciliogenesis and has minimal effect on the ciliary length as compared to wild-type levels. These findings uncover that CKAP2 and CKAP2-Like are axonemal MAPs that contribute to ciliogenesis, partially compensating for each other in human cells.", "authors": "Bechstedt, S.; Da Silva, L. E.; Campolina-Silva, G.; Afani, J.; Belleannee, C.", "date": "2026-09-08", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4299, "score_semantic": 0.4299, "score_lexical": 1.0, "matched": ["chromosomal instability", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.09.09.26362553", "title": "Prostate-Specific Membrane Antigen PET/CT Complements MRI for Focal Therapy Selection in Prostate Cancer: A Whole-Mount Histopathologic Study", "abstract": "BackgroundThe incremental value of PSMA PET/CT over multiparametric MRI (mpMRI) for selecting patients for prostate cancer focal therapy is undefined. Unlike lesion-detection studies, we evaluated whether PSMA PET/CT, mpMRI, and their combination correctly determine focal therapy eligibility when validated against whole-mount histopathology (WMHP).  MethodsWe retrospectively analyzed patients undergoing radical prostatectomy (RP) at UCLA (2017-2024) with preoperative PSMA PET/CT and mpMRI, biopsy grade group (GG) [&le;]3, unilateral disease, and prostate-specific antigen <20 ng/mL. Two blinded readers per modality assessed extraprostatic extension (EPE), seminal vesicle invasion (SVI), bilateral disease, and multifocality; a third adjudicated discordances. Eligibility required absence of all four. On WMHP, ineligibility was EPE, SVI, multifocal or bilateral disease with a contralateral or secondary GG[&ge;]2 nodule, or any GG>3 focus at RP. Modalities were compared by McNemar tests.  ResultsOf 112 patients, 77 (69%) were ineligible on WMHP, including 19 (17%) with a GG>3 focus at RP. Sensitivity and specificity were 53% and 54% for PET and 70% and 49% for mpMRI. Combined imaging improved sensitivity to 83% (P<0.001 vs PET; P=0.002 vs MRI) but reduced specificity to 26%. Per 100 patients at this prevalence, this would correctly identify approximately 9 additional ineligible patients while falsely excluding approximately 7 true candidates. mpMRI was more sensitive than PET for EPE (77% vs 32%, P<0.001), whereas PET was more specific (90% vs 58%, P<0.001). Combined imaging improved detection of multifocal (44% vs 23%, P=0.001) and bilateral disease (45% vs 23%, P=0.002) versus MRI alone.  ConclusionsAdding PSMA PET/CT to mpMRI significantly improves sensitivity for exclusionary features, reflecting complementary molecular and anatomic information. However, combined imaging still misses a substantial proportion of adverse pathology, so imaging alone should not determine eligibility.    O_FIG O_LINKSMALLFIG WIDTH=200 HEIGHT=98 SRC=\"FIGDIR/small/26362553v1_ufig1.gif\" ALT=\"Figure 1\"> View larger version (46K): org.highwire.dtl.DTLVardef@e312org.highwire.dtl.DTLVardef@3bce70org.highwire.dtl.DTLVardef@6e56aeorg.highwire.dtl.DTLVardef@1fcbac1_HPS_FORMAT_FIGEXP  M_FIG Graphical Abstract  C_FIG", "authors": "Sonni, I.; Mohammadigoldar, Z.; Furey, G.; Kimura, K.; Movva, P. C.; Holzgreve, A.; Bahri, S.; Sevco, T.; Chung, A.; Sisk, A.; Grogan, T.; Czernin, J.; Sung, K.; Calais, J.; Eggener, S. E.; Brisbane, W.; Reiter, R. E.; Raman, S.; Weiner, A. B.", "date": "2026-09-11", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.4197, "score_semantic": 0.4197, "score_lexical": 0.5434, "matched": ["histopathology", "cancer"]}], "reports": [{"date": "2026-09-28", "label": "Sep 28, 2026", "n": 21}, {"date": "2026-09-21", "label": "Sep 21, 2026", "n": 24}, {"date": "2026-09-14", "label": "Sep 14, 2026", "n": 26}, {"date": "2026-09-07", "label": "Sep 07, 2026", "n": 34}, {"date": "2026-08-31", "label": "Aug 31, 2026", "n": 19}, {"date": "2026-08-24", "label": "Aug 24, 2026", "n": 24}, {"date": "2026-08-17", "label": "Aug 17, 2026", "n": 18}, {"date": "2026-08-10", "label": "Aug 10, 2026", "n": 34}, {"date": "2026-08-03", "label": "Aug 03, 2026", "n": 17}, {"date": "2026-07-27", "label": "Jul 27, 2026", "n": 24}, {"date": "2026-07-20", "label": "Jul 20, 2026", "n": 26}, {"date": "2026-06-26", "label": "Jun 26, 2026", "n": 14}, {"date": "2026-06-19", "label": "Jun 19, 2026", "n": 38}], "prefix": "", "home": "../papers.html"}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const papers = DATA.papers;
  const SHORT = 280;
  // Slider floor: the pipeline threshold, or lower if older data scored below it
  const FLOOR = Math.floor(Math.min(DATA.threshold, ...papers.map(p => p.score)) * 100) / 100;

  // ── Persistent per-browser state (stars / read), keyed by paper URL ──
  const store = {
    get(k, fallback) {
      try { const v = localStorage.getItem('papertrail:' + k); return v ? JSON.parse(v) : fallback; }
      catch { return fallback; }
    },
    set(k, v) {
      try { localStorage.setItem('papertrail:' + k, JSON.stringify(v)); } catch {}
    },
  };
  const starred = new Map(Object.entries(store.get('starred', {})));  // id -> paper snapshot
  const read    = new Set(store.get('read', []));
  const saveStars = () => store.set('starred', Object.fromEntries(starred));
  const saveRead  = () => store.set('read', [...read]);

  const prefs = store.get('prefs', {});
  const state = {
    q: '',
    view: 'all',
    sort: prefs.sort || 'score',
    min: FLOOR,
    sources: new Set(),
    keyword: null,
    expanded: new Set(),
    scope: 'week',        // 'week' = this report, 'all' = every archived week
    limit: 100,           // cards rendered before "Show more"
  };
  const PAGE = 100;

  // ── All-weeks index: loaded on demand from reports/search-index.js ──
  let ALL = null, loadingAll = false;
  function loadAll() {
    if (ALL || loadingAll) return;
    loadingAll = true;
    const s = document.createElement('script');
    s.src = (DATA.prefix || '') + 'search-index.js';
    s.onload = () => { ALL = window.PAPERTRAIL_INDEX || []; loadingAll = false; render(); };
    s.onerror = () => {
      loadingAll = false; state.scope = 'week'; render();
      $('count').textContent = 'Could not load the all-weeks index (reports/search-index.js).';
    };
    document.head.appendChild(s);
  }
  const pool = () => state.scope === 'all' && ALL ? ALL : papers;

  // ── Helpers ──
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const scoreVar = s => s >= 0.5 ? 'var(--high)' : s >= 0.35 ? 'var(--mid)' : 'var(--low)';
  const isPreprint = p => !p.journal || p.journal === 'preprint';
  const url = p => (p.id && !p.id.startsWith('http')) ? 'https://doi.org/' + p.id : p.id;
  // Dates come as "2026-09-02", "2026-Sep-02" (PubMed) or just "2026-Sep"
  const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const dateKey = d => {
    const m = /^(\d{4})(?:-(\w+))?(?:-(\d+))?/.exec(d || '');
    if (!m) return 0;
    const mon = m[2] ? (/^\d+$/.test(m[2]) ? +m[2] - 1 : MONTHS.indexOf(m[2].slice(0, 3).toLowerCase())) : 0;
    return Date.UTC(+m[1], Math.max(mon, 0), m[3] ? +m[3] : 1);
  };

  // Keyword highlighting: whole-token matches, longest first
  const kwRe = DATA.keywords.length
    ? new RegExp('\\b(' + [...DATA.keywords].sort((a, b) => b.length - a.length).map(reEsc).join('|') + ')\\b', 'gi')
    : null;
  function highlight(text) {
    const parts = [];
    const res = [kwRe];
    const q = state.q.trim();
    if (q.length >= 2) res.push(new RegExp('(' + q.split(/\s+/).map(reEsc).join('|') + ')', 'gi'));
    // Collect ranges from all regexes on raw text, then merge and escape
    const ranges = [];
    for (const re of res) {
      if (!re) continue;
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(text))) { if (!m[0]) { re.lastIndex++; continue; } ranges.push([m.index, m.index + m[0].length]); }
    }
    if (!ranges.length) return esc(text);
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [ranges[0].slice()];
    for (const r of ranges.slice(1)) {
      const last = merged[merged.length - 1];
      if (r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push(r.slice());
    }
    let i = 0;
    for (const [a, b] of merged) { parts.push(esc(text.slice(i, a)), '<mark>', esc(text.slice(a, b)), '</mark>'); i = b; }
    parts.push(esc(text.slice(i)));
    return parts.join('');
  }

  const hayCache = new WeakMap();
  const hay = p => {
    let h = hayCache.get(p);
    if (h === undefined) {
      h = [p.title, p.abstract, p.authors, p.journal, p.source].join(' ').toLowerCase();
      hayCache.set(p, h);
    }
    return h;
  };

  // ── Filtering ──
  function filtered() {
    const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    let list = state.view === 'starred'
      ? [...starred.values()]
      : pool();
    list = list.filter(p => {
      if (state.view !== 'starred' && p.score < state.min) return false;
      if (state.view === 'unread' && read.has(p.id)) return false;
      if (state.sources.size && !state.sources.has(p.source)) return false;
      if (state.keyword && !(p.matched || []).includes(state.keyword)) return false;
      if (terms.length) {
        const h = hay(p);
        if (!terms.every(t => h.includes(t))) return false;
      }
      return true;
    });
    const by = {
      score: (a, b) => b.score - a.score,
      date:  (a, b) => dateKey(b.date) - dateKey(a.date) || b.score - a.score,
      if:    (a, b) => (b.if ?? -1) - (a.if ?? -1) || b.score - a.score,
    }[state.sort];
    return [...list].sort(by);
  }

  // ── Rendering ──
  const ICON_STAR = '<svg viewBox="0 0 24 24" fill="FILL" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  // Link to the report(s) a paper appeared in, when not the one being viewed
  const LABELS = Object.fromEntries((DATA.reports || []).map(r => [r.date, r.label]));
  function weekTag(p) {
    const weeks = (p.weeks || []).filter(w => w !== DATA.date || state.scope === 'all');
    if (!weeks.length || (state.scope !== 'all' && state.view !== 'starred')) return '';
    const [w, ...rest] = weeks;
    const label = w === DATA.date ? 'This week' : 'Week of ' + (LABELS[w] || w);
    return `<a class="week-tag" href="${esc((DATA.prefix || '') + w + '.html')}" title="${esc(weeks.map(x => LABELS[x] || x).join(', '))}">${esc(label)}${rest.length ? ` +${rest.length}` : ''}</a>`;
  }

  function card(p) {
    const s = p.score ?? 0;
    const abs = p.abstract || '';
    const long = abs.length > SHORT;
    const open = state.expanded.has(p.id);
    const shown = long && !open ? abs.slice(0, SHORT) + '…' : abs;
    const ifStr = p.if != null ? ` · IF ${Number(p.if).toFixed(1)}` : '';
    const authors = p.authors || '';
    const isStar = starred.has(p.id), isRead = read.has(p.id);
    const u = url(p);
    return `
      <article class="card${isRead ? ' is-read' : ''}" style="--score-color:${scoreVar(s)}" data-id="${esc(p.id)}">
        <div class="card-top">
          <a class="title" href="${esc(u)}" target="_blank" rel="noopener">${highlight(p.title || '')}</a>
          <div class="score-block" title="semantic ${p.score_semantic ?? '–'} · lexical ${p.score_lexical ?? '–'}">
            <div class="score-pill">${s.toFixed(2)}</div>
            <div class="score-bar-track"><div class="score-bar-fill" style="width:${Math.min(s * 100, 100)}%"></div></div>
          </div>
        </div>
        <div class="card-meta">
          <span class="badge${isPreprint(p) ? ' preprint' : ''}">${esc(p.source)}</span>
          ${!isPreprint(p) ? `<span>${esc(p.journal)}${ifStr}</span>` : ''}
          <span>${esc(p.date)}</span>
          <span title="${esc(authors)}">${esc(authors.length > 60 ? authors.slice(0, 60) + '…' : authors)}</span>
          ${weekTag(p)}
        </div>
        <div class="abstract">${highlight(shown)}${long ? `<button class="toggle-btn" data-act="toggle">${open ? 'Show less' : 'Show more'}</button>` : ''}</div>
        <div class="card-foot">
          <div class="matched">${(p.matched || []).map(k => `<button class="kw" data-kw="${esc(k)}" title="Filter by this keyword">${esc(k)}</button>`).join('')}</div>
          <button class="act${isStar ? ' on' : ''}" data-act="star" aria-pressed="${isStar}">${ICON_STAR.replace('FILL', isStar ? 'currentColor' : 'none')}${isStar ? 'Starred' : 'Star'}</button>
          <button class="act${isRead ? ' read-on' : ''}" data-act="read" aria-pressed="${isRead}">${ICON_CHECK}${isRead ? 'Read' : 'Mark read'}</button>
          <a class="doi-link" href="${esc(u)}" target="_blank" rel="noopener">Open ↗</a>
        </div>
      </article>`;
  }

  const $ = id => document.getElementById(id);

  function renderChips() {
    const counts = {};
    const src = state.view === 'starred' ? [...starred.values()] : pool();
    src.forEach(p => { counts[p.source] = (counts[p.source] || 0) + 1; });
    $('sources').innerHTML = Object.keys(counts).sort().map(src =>
      `<button class="chip" data-src="${esc(src)}" aria-pressed="${state.sources.has(src)}">${esc(src)}<span class="n">${counts[src]}</span></button>`
    ).join('');
    const kwCounts = {};
    src.forEach(p => (p.matched || []).forEach(k => { kwCounts[k] = (kwCounts[k] || 0) + 1; }));
    $('keywords').innerHTML = DATA.keywords.map(k =>
      `<button class="chip" data-kw="${esc(k)}" aria-pressed="${state.keyword === k}">${esc(k)}<span class="n">${kwCounts[k] || 0}</span></button>`
    ).join('');
  }

  // Filter changes start from the first page again
  const update = () => { state.limit = PAGE; render(); };

  function render() {
    const list = filtered();
    const papersEl = $('papers');
    if (state.scope === 'all' && !ALL) {
      papersEl.innerHTML = '<div class="empty">Loading all weeks…</div>';
    } else if (list.length) {
      const rest = list.length - state.limit;
      papersEl.innerHTML = list.slice(0, state.limit).map(card).join('') +
        (rest > 0 ? `<button class="more-btn" data-act="more">Show ${Math.min(rest, PAGE)} more (${rest} left)</button>` : '');
    } else {
      papersEl.innerHTML = `<div class="empty">${state.view === 'starred' && !starred.size
        ? 'No starred papers yet — star papers to build a reading list. It is saved in this browser.'
        : 'No papers match these filters.'}</div>`;
    }
    const base = state.view === 'starred' ? starred.size : pool().length;
    const what = state.view === 'starred' ? 'starred papers'
      : state.scope === 'all' ? `papers across ${(DATA.reports || []).length} weeks` : 'papers';
    $('count').textContent = `Showing ${list.length} of ${base} ${what}`;
    $('star-n').textContent = starred.size ? `(${starred.size})` : '';
    $('export').hidden = state.view !== 'starred' || !starred.size;
    const dirty = state.q || state.sources.size || state.keyword || state.min !== FLOOR;
    $('reset').hidden = !dirty;
    document.querySelectorAll('#view button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === state.view));
    document.querySelectorAll('#scope button').forEach(b => b.setAttribute('aria-pressed', b.dataset.scope === state.scope));
    $('scope').hidden = (DATA.reports || []).length < 2;
    renderChips();
  }

  // ── Header / footer ──
  $('meta').textContent =
    `${papers.length} of ${DATA.total} relevant papers · Past ${DATA.days} days · Generated ${DATA.generated}`;
  $('footer').textContent = `Generated by PaperTrail · Sources: ${DATA.sources.join(', ')}`;
  if (DATA.imported) {
    $('meta').insertAdjacentHTML('afterend',
      '<div class="imported-note">Recovered from an older report: author lists are shortened.</div>');
  }

  // ── Week navigation (reports are listed newest first) ──
  const REPORTS = DATA.reports || [];
  const here = REPORTS.findIndex(r => r.date === DATA.date);
  const href = r => (DATA.prefix || '') + r.date + '.html';
  if (REPORTS.length > 1 && here !== -1) {
    $('weeks').hidden = false;
    $('week').innerHTML = REPORTS.map((r, i) =>
      `<option value="${i}"${i === here ? ' selected' : ''}>${esc(r.label)} · ${r.n} papers${i === 0 ? ' · latest' : ''}</option>`
    ).join('');
    $('week').addEventListener('change', e => { location.href = href(REPORTS[+e.target.value]); });
    const link = (el, r) => r ? (el.href = href(r)) : el.setAttribute('aria-disabled', 'true');
    link($('prev'), REPORTS[here + 1]);
    link($('next'), REPORTS[here - 1]);
    if (here === 0) $('latest').hidden = true; else $('latest').href = DATA.home;
  }

  // ── Controls ──
  const min = $('min');
  min.min = FLOOR;
  min.value = state.min;
  $('min-val').textContent = state.min.toFixed(2);
  $('sort').value = state.sort;

  let t;
  $('q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; update(); }, 120); });
  min.addEventListener('input', e => { state.min = +e.target.value; $('min-val').textContent = state.min.toFixed(2); update(); });
  $('sort').addEventListener('change', e => { state.sort = e.target.value; store.set('prefs', { ...prefs, sort: state.sort }); update(); });
  $('view').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.view = b.dataset.view; update();
  });
  $('scope').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.scope = b.dataset.scope;
    if (state.scope === 'all') loadAll();
    update();
  });
  $('sources').addEventListener('click', e => {
    const b = e.target.closest('[data-src]'); if (!b) return;
    const s = b.dataset.src;
    state.sources.has(s) ? state.sources.delete(s) : state.sources.add(s);
    update();
  });
  const toggleKw = k => { state.keyword = state.keyword === k ? null : k; update(); };
  $('keywords').addEventListener('click', e => { const b = e.target.closest('[data-kw]'); if (b) toggleKw(b.dataset.kw); });
  $('reset').addEventListener('click', () => {
    state.q = ''; $('q').value = '';
    state.sources.clear(); state.keyword = null;
    state.min = FLOOR; min.value = state.min; $('min-val').textContent = state.min.toFixed(2);
    update();
  });
  $('export').addEventListener('click', () => {
    const lines = [...starred.values()].sort((a, b) => b.score - a.score).map(p =>
      `- [${p.title}](${url(p)})  \n  ${p.authors ? p.authors.split(/[,;]/)[0].trim() + ' et al. · ' : ''}${isPreprint(p) ? p.source : p.journal} · ${p.date}`);
    const blob = new Blob([`# PaperTrail — starred papers\n\n${lines.join('\n')}\n`], { type: 'text/markdown' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'papertrail-starred.md' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $('papers').addEventListener('click', e => {
    const kw = e.target.closest('.matched [data-kw]');
    if (kw) { toggleKw(kw.dataset.kw); return; }
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    if (btn.dataset.act === 'more') { state.limit += PAGE; render(); return; }
    const id = btn.closest('.card').dataset.id;
    const p = pool().find(x => x.id === id) || papers.find(x => x.id === id) || starred.get(id);
    const act = btn.dataset.act;
    if (act === 'toggle') { state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); }
    if (act === 'star')   { starred.has(id) ? starred.delete(id) : starred.set(id, { ...p, weeks: p.weeks || [DATA.date] }); saveStars(); }
    if (act === 'read')   { read.has(id) ? read.delete(id) : read.add(id); saveRead(); }
    render();
  });

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
    if (e.key === 'Escape' && document.activeElement === $('q')) { $('q').blur(); }
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (!typing && e.key === '[' && $('prev').href) location.href = $('prev').href;
    if (!typing && e.key === ']' && $('next').href) location.href = $('next').href;
  });

  render();
})();
</script>
</body>
</html>
