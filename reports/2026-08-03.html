<title>PaperTrail — August 03, 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #F7F7F5;
    --surface:   #FFFFFF;
    --text:      #1A1A2E;
    --body:      #374151;
    --muted:     #6B7280;
    --accent:    #2D6A4F;
    --accent-bg: #E3F0E9;
    --border:    #E5E7EB;
    --high:      #2D6A4F;
    --mid:       #D97706;
    --low:       #DC2626;
    --badge-bg:  #EEF2FF;
    --badge-fg:  #4338CA;
    --pre-bg:    #FEF3C7;
    --pre-fg:    #92400E;
    --mark:      #FDE68A;
    --star:      #D97706;
    --shadow:    rgba(0,0,0,0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #14161B;
      --surface:   #1C1F26;
      --text:      #ECEDEF;
      --body:      #C9CCD3;
      --muted:     #9097A3;
      --accent:    #6FC69A;
      --accent-bg: #1F3A2D;
      --border:    #2D313A;
      --high:      #6FC69A;
      --mid:       #F0A93B;
      --low:       #F07171;
      --badge-bg:  #262B45;
      --badge-fg:  #A5B4FC;
      --pre-bg:    #3A2F14;
      --pre-fg:    #F5C969;
      --mark:      #5C4A12;
      --star:      #F0A93B;
      --shadow:    rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg:        #14161B;
    --surface:   #1C1F26;
    --text:      #ECEDEF;
    --body:      #C9CCD3;
    --muted:     #9097A3;
    --accent:    #6FC69A;
    --accent-bg: #1F3A2D;
    --border:    #2D313A;
    --high:      #6FC69A;
    --mid:       #F0A93B;
    --low:       #F07171;
    --badge-bg:  #262B45;
    --badge-fg:  #A5B4FC;
    --pre-bg:    #3A2F14;
    --pre-fg:    #F5C969;
    --mark:      #5C4A12;
    --star:      #F0A93B;
    --shadow:    rgba(0,0,0,0.35);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 2rem 1rem 4rem;
  }

  .page { max-width: 780px; margin: 0 auto; }
  button, input, select { font: inherit; color: inherit; }

  /* ── Header ── */
  header { margin-bottom: 1.25rem; }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .logo span { color: var(--text); }
  .head-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.6rem 1rem; }
  .weeks { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; }
  .weeks select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.3rem 0.5rem; font-size: 0.82rem; max-width: 62vw;
  }
  .wk-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); text-decoration: none; font-size: 1.1rem; line-height: 1;
  }
  .wk-btn:hover { border-color: var(--accent); color: var(--accent); }
  .wk-btn[aria-disabled="true"] { opacity: 0.35; pointer-events: none; }
  .weeks .linkish { text-decoration: none; white-space: nowrap; }
  .imported-note { color: var(--muted); font-size: 0.78rem; margin-top: 0.25rem; }
  .meta { margin-top: 0.4rem; color: var(--muted); font-size: 0.85rem; }

  /* ── Controls ── */
  .controls {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 0.75rem 0 0.9rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 0.6rem;
  }
  .search {
    width: 100%;
    padding: 0.55rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    font-size: 0.9rem;
  }
  .search-row { display: flex; gap: 0.5rem; align-items: stretch; }
  .search-row .search { flex: 1; min-width: 0; }
  .search-row .seg button { padding: 0 0.75rem; white-space: nowrap; }
  .week-tag {
    font-size: 0.72rem; font-weight: 500; color: var(--accent);
    text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  .week-tag:hover { border-bottom-style: solid; }
  .more-btn {
    align-self: center; margin-top: 0.25rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.45rem 1.1rem; font-size: 0.85rem; cursor: pointer; color: var(--accent);
  }
  .more-btn:hover { border-color: var(--accent); }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; font-size: 0.82rem; color: var(--muted); }
  .row label { display: inline-flex; align-items: center; gap: 0.4rem; }
  .row select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.2rem 0.4rem; font-size: 0.82rem;
  }
  .row input[type=range] { accent-color: var(--accent); width: 110px; }
  .row input[type=checkbox] { accent-color: var(--accent); }
  .min-val { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 500; min-width: 2.2em; }

  .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .chip {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 0.74rem; font-weight: 500;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .chip .n { opacity: 0.7; margin-left: 0.25rem; font-variant-numeric: tabular-nums; }

  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: var(--surface); border: none; padding: 0.2rem 0.65rem;
    font-size: 0.8rem; cursor: pointer; color: var(--muted);
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }

  .status { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--muted); }
  .linkish { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.8rem; font-weight: 500; }
  .linkish:hover { text-decoration: underline; }

  /* ── Cards ── */
  .papers { display: flex; flex-direction: column; gap: 1rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--score-color, var(--border));
    border-radius: 0 8px 8px 0;
    padding: 1.25rem 1.5rem 1rem;
    transition: box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .card:hover { box-shadow: 0 4px 16px var(--shadow); }
  .card.is-read { opacity: 0.55; }
  .card.is-read:hover { opacity: 1; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 0.5rem;
  }

  .title {
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .title:hover { color: var(--accent); }

  /* Score pill + bar */
  .score-block { flex-shrink: 0; text-align: right; min-width: 48px; }
  .score-pill {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--score-color);
    font-variant-numeric: tabular-nums;
  }
  .score-bar-track {
    width: 48px; height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 4px;
  }
  .score-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--score-color);
  }

  .card-meta {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.6rem;
    display: flex; flex-wrap: wrap; gap: 0.3rem 0.75rem;
    align-items: center;
  }
  .badge {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.1rem 0.45rem;
    border-radius: 4px;
    background: var(--badge-bg);
    color: var(--badge-fg);
  }
  .badge.preprint { background: var(--pre-bg); color: var(--pre-fg); }

  .abstract {
    font-size: 0.875rem;
    color: var(--body);
    line-height: 1.65;
    overflow-wrap: anywhere;
  }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .toggle-btn {
    background: none; border: none; cursor: pointer;
    color: var(--accent); font-size: 0.8rem; font-weight: 500;
    padding: 0; margin-top: 0.3rem; display: block;
  }
  .toggle-btn:hover { text-decoration: underline; }

  .card-foot {
    margin-top: 0.7rem;
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.9rem;
    font-size: 0.78rem;
  }
  .matched { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-right: auto; }
  .matched .kw {
    background: var(--accent-bg); color: var(--accent);
    font-size: 0.7rem; font-weight: 500;
    padding: 0.05rem 0.5rem; border-radius: 999px;
    border: none; cursor: pointer;
  }
  .act {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 0.78rem; padding: 0.1rem 0;
    display: inline-flex; align-items: center; gap: 0.25rem;
  }
  .act:hover { color: var(--accent); }
  .act.on { color: var(--star); }
  .act.read-on { color: var(--accent); }
  .act svg { width: 14px; height: 14px; }
  .doi-link { color: var(--muted); text-decoration: none; }
  .doi-link:hover { color: var(--accent); }

  .empty {
    text-align: center; color: var(--muted); font-size: 0.9rem;
    padding: 3rem 1rem; border: 1px dashed var(--border); border-radius: 8px;
  }

  /* ── Footer ── */
  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
  }

  @media (max-width: 560px) {
    .search-row { flex-direction: column; }
    .search-row .seg button { flex: 1; padding: 0.3rem 0.5rem; }
    body { padding: 1.25rem 1rem 3rem; }
    .card { padding: 1rem 1rem 0.85rem; }
    .controls { position: static; }
  }
</style>
</head>
<body>
<div class="page">

<header>
  <div class="head-row">
    <div class="logo">Paper<span>Trail</span></div>
    <nav class="weeks" id="weeks" aria-label="Weekly reports" hidden>
      <a class="wk-btn" id="prev" title="Previous week  ( [ )" aria-label="Previous week">‹</a>
      <select id="week" aria-label="Choose week"></select>
      <a class="wk-btn" id="next" title="Next week  ( ] )" aria-label="Next week">›</a>
      <a class="linkish" id="latest">Latest →</a>
    </nav>
  </div>
  <div class="meta" id="meta"></div>
</header>

<div class="controls">
  <div class="search-row">
    <input class="search" id="q" type="search" placeholder="Search papers, authors, journals…" autocomplete="off">
    <div class="seg" id="scope" role="group" aria-label="Search scope">
      <button data-scope="week" aria-pressed="true">This week</button>
      <button data-scope="all">All weeks</button>
    </div>
  </div>
  <div class="row">
    <div class="seg" id="view" role="group" aria-label="View">
      <button data-view="all" aria-pressed="true">All</button>
      <button data-view="unread">Unread</button>
      <button data-view="starred">Starred <span id="star-n"></span></button>
    </div>
    <label>Sort
      <select id="sort">
        <option value="score">Relevance</option>
        <option value="date">Newest</option>
        <option value="if">Impact factor</option>
      </select>
    </label>
    <label>Min score
      <input id="min" type="range" min="0" max="1" step="0.01">
      <span class="min-val" id="min-val"></span>
    </label>
  </div>
  <div class="chips" id="sources" aria-label="Sources"></div>
  <div class="chips" id="keywords" aria-label="Keywords"></div>
  <div class="status">
    <span id="count" aria-live="polite"></span>
    <span>
      <button class="linkish" id="export" hidden>Export starred</button>
      <button class="linkish" id="reset" hidden>Clear filters</button>
    </span>
  </div>
</div>

<div class="papers" id="papers"></div>

<footer id="footer"></footer>

</div>

s predicting response to KIF18A inhibition, currently in clinical trials, are lacking.  MethodsWe integrated analyses of patient tumor datasets, neuroendocrine (NE) and non- NE SCLC cell lines, and functional perturbation models to define the determinants of response to KIF18A inhibition. Chromosomal instability metrics, transcriptional programs, mitotic dynamics, and spindle assembly checkpoint (SAC) function were assessed using genomic profiling, live-cell imaging, genetic perturbation, and pharmacologic inhibition.  ResultsKIF18A expression was elevated in SCLC tumors and correlated with CIN-associated transcriptional programs, proliferative markers, and NE status; however, these features did not predict sensitivity to KIF18A inhibition. Instead, response was determined by the functional integrity of the SAC. SAC-proficient SCLC cells underwent sustained mitotic arrest followed by apoptotic cell death upon KIF18A inhibition, whereas SAC-defective cells failed to maintain checkpoint activation and survived. Mechanistically, resistant cells exhibited impaired kinetochore recruitment of core SAC components, including MAD1 and BUBR1. Importantly, transient induction of acute CIN through MPS1 inhibition partially restored sensitivity to KIF18A inhibition in resistant models.  ConclusionsThis study provides the first mechanistic characterization of KIF18A dependency in SCLC, identifying SAC competency as the primary determinant of response. These findings establish a biologically informed framework for patient stratification and rational combination strategies.  Translational RelevanceSmall-cell lung cancer (SCLC) is an aggressive malignancy with few effective targeted therapies and marked chromosomal instability. KIF18A has emerged as a potential therapeutic target in genomically unstable cancers, but biomarkers predicting response to KIF18A inhibition are lacking. We demonstrate that sensitivity to KIF18A inhibition in SCLC is determined not by KIF18A expression, neu ecified population size when cell death is nonzero, serving as a baseline for comparisons to spatial structure. We show that spatial structure, a defining feature of solid tumors, can fundamentally alter how mutant burden depends on the death-to-birth ratio. Relationships that increase monotonically in well-mixed populations can become nonmonotonic or even decrease in spatially expanding populations, depending on population size and the fitness cost of mutants. These results provide a mechanistic framework for understanding why higher tumor turnover has been associated with either improved or worsened outcomes across patients and cancer types. An analysis of the probability that a colony regrows after an environmental change (such as treatment initiation) reveals a similar pattern: spatial structure can reverse or reshape this dependence. Overall, our findings establish spatial structure as a key determinant of how cellular death-to-birth ratios shape mutant accumulation, with implications for interpreting clinical data and predicting the burden of preexisting mutants during tumor evolution.  Significance statementThe number of mutants present when a growing cell population reaches a given size shapes its capacity to adapt, since deleterious mutants can become advantageous once conditions change, such as when cancer treatment begins. Clinical studies report contradictory links between tumor cell turnover (death-to-birth ratio) and patient outcomes, with higher turnover linked to both better and worse prognosis. Building on established theory for well-mixed populations, we show that spatial population structure, a key feature of solid tumors, can make mutant burden increase, decrease, or vary non-monotonically with the death-to-birth ratio, depending on tumor size and mutant fitness cost, patterns absent in the well-mixed system. This resolves the contradiction and clarifies how tumor turnover shapes its potential to evolve and progress.", "authors": "Mondal, S. S.; Komarova, N. L.; Wodarz, D.", "date": "2026-08-01", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5762, "score_semantic": 0.5762, "score_lexical": 0.5698, "matched": ["tumor evolution", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.1101/2025.04.17.649315", "title": "μSeq: Universal mutation rate quantification via deep sequencing of a single clonal expansion.", "abstract": "Understanding and quantifying mutational processes is fundamental for studying evolution in both clinical and experimental contexts. However, current methods are labor intensive and often lack robustness, particularly in mammalian cells. For example, current approaches that rely on subclonal mutations derived directly from patient samples often result in inconsistent or biased outcomes, leading to potentially unreliable conclusions on adaptive dynamics. We used patient-derived colorectal cancer organoids to introduce {micro}Seq, a universal framework for inferring mutation rates in diverse biological systems. Our approach extracts mutation rates from deep sequencing of single clonal expansions, with a time gain of ten-fold or more compared to a mutation accumulation line, at the cost of three billion read whole genome sequencing. {micro}Seq relies on four critical components: (i) a controlled experimental setup enabling validation (ii) a quantitative estimate inspired by the classic Luria-Delbruck spectrum for subclonal mutations derived from population dynamics, (iii) robust statistical models accounting for sampling noise and sequencing errors, and (iv) a data analysis pipeline for subclonal mutation detection that compares endpoint populations to a closely related ancestor. Building on the legacy of Luria and Delbruck, our model adopts core concepts from statistical physics--stochasticity, fluctuation spectra, and inference under noise--to construct a rigorous and scalable inference framework. We demonstrate that the Luria-Delbruck distribution extends to subclonal mutations in expanding populations, and show how this generalization enables robust estimation of the underlying mutation rate. Our models establish precise requirements for sequencing depth, genome size, and mutation frequency detection necessary for accurate mutation rate estimates. Crucially, we show that failing to meet these criteria can lead to errors spanning several orders of magnitude suggesting that biases in patients data arise from analyzing incorrect frequency intervals and from lack of a closely related reference. We validate our approach using parallel mutation accumulation experiments in colorectal cancer organoids, finding mutation rate estimates consistent with previous studies. However, we find that mutation accumulation lines operate under purifying selection in both yeast and human organoids, contradicting the long standing assumption of neutrality in such experiments. This insight has important implications for both evolutionary biology and cancer evolution. Finally, to demonstrate the adaptability of {micro}Seq, we apply it to yeast, leveraging multiple independent replicates to compensate for its much smaller genome, as well as in mouse xenografts, which feature much more complex in vivo population dynamics. The robustness and broad applicability of {micro}Seq establish it as a powerful and universal tool for mutation rate quantification, and imply that existing claims based on subclonal mutations from patient samples must be revisited.  Short AbstractUnderstanding and quantifying mutational processes is fundamental to studying evolution in clinical and experimental contexts. However, current methods are labor intensive and often lack robustness, particularly in mammalian cells. For example, quantification of subclonal mutations directly from patient samples produces inconsistent estimates, leading to unreliable conclusions about adaptive dynamics. Using patient derived colorectal cancer organoids as a model system, we developed {micro}Seq, a novel framework to estimate mutation rates from deep sequencing of a single clonal expansion with a close reference. {micro}Seq builds on the Luria Delbruck model, combining statistical physics concepts with modern sequencing and inference techniques. It integrates (i) a controlled experimental setup, (ii) robust statistical and population dynamics models, and (iii) a data analysis pipeline for subclonal mutation detection. We establish precise requirements for sequencing depth, genome size, and mutation frequency to ensure accuracy despite sequencing errors. {micro}Seq enables accurate estimation of mutation rates as low as 10-9 mutations per base pair per generation, and we validate it across species using yeast data. Critically, {micro}Seq reveals that mutation accumulation lines undergo purifying selection in both human organoids and yeast, It underscores the need to reconsider claims based on subclonal mutations in patient samples.", "authors": "Pompei, S.; Geroldi, A.; Rivetti, P.; Grassi, E.; Vurchio, V.; Tallarico, G.; Corti, G.; Tattini, L.; Liti, G.; Bertotti, A.; Cosentino Lagomarsino, M.", "date": "2026-07-28", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5735, "score_semantic": 0.5735, "score_lexical": 0.8596, "matched": ["clonal evolution", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.07.29.26359138", "title": "Exploring two-way genetic variant interactions associated with select tumour features in colorectal cancer: Application of BOOST to a genome-wide genetic data", "abstract": "BackgroundInteracting genetic variants may explain a part of the genetic basis of biological features associated with colorectal tumours.  ObjectivesTo explore the interacting loci (2-way) in colorectal cancer for their association with four tumour features (tumour grade, Microsatellite Instability (MSI) status, histology, and tumour location) using a genome-wide genotype dataset.  MethodsThe variant dataset included 4,711,309 genotyped and imputed variants in a cohort of colorectal cancer patients from the Newfoundland Familial Colorectal Cancer Registry. After using the BOlean Operation-based Screening and Testing (BOOST) method for screening, we applied logistic regression to the top 1,000 BOOST models for a more accurate test of association. Select variants were explored for functional and disease-related literature findings using databases and bioinformatics tools.  ResultsFunctional annotation analyses of the genes showed that some biological features were shared among the tumour features investigated in this study (e.g. chemical dependency; tobacco use). Logistics regression p-values for top 50 interactions in each dataset ranged from 1.78E-10 to 1.22E-05. Most variants identified were noncoding, and some were located in genes. Most genes were previously identified as being related to cancer.  ConclusionsTo our knowledge, this is the first study that explored interacting variants associated with tumour features in colorectal cancer using large-scale genomic data. This study demonstrates the feasibility and utility of the BOOST method in large genomic datasets to perform interaction analyses. Our results are preliminary but novel, progress the field of genetic interactions that may explain tumour features, and may be replicated in other patient cohorts.", "authors": "Curtis, A. A.; Yu, Y.; Savas, S.", "date": "2026-07-31", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.5659, "score_semantic": 0.5659, "score_lexical": 0.8757, "matched": ["genomic instability", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.1101/2025.04.10.648303", "title": "Cep57 is a cohesin-associated regulator of chromosome segregation, cell cycle progression and genome stability in early embryos", "abstract": "Faithful chromosome segregation and coordinated cell-cycle progression are essential for maintaining genome stability and preserving progenitor populations during vertebrate embryogenesis. Although pathogenic CEP57 variants are associated with developmental disorders including aneuploidy and microcephaly, the molecular mechanisms by which CEP57 coordinates these processes remain poorly understood. Here, we identify Cep57 as a previously unrecognized regulator of chromosome segregation, G1/S transition, centrosome integrity, and genome surveillance during early zebrafish embryogenesis. Cep57 localizes to both the nucleus and centrosomes of zebrafish blastulae, indicating probable dual functions in nuclear cell cycle regulation and centrosome organization. Our results show that Cep57 associates with Rad21, Smc1, and Smc3, revealing an unexpected functional link between Cep57 and the cohesin complex. Loss of Cep57 results in Rad21 depletion, destabilization of the cohesin complex, chromosome segregation errors resulting in supernumerary nuclei, and disruption of pericentriolar material organization, demonstrating a critical role in maintaining mitotic fidelity. We further show that Cep57 interacts with Geminin and promotes an Rb1-dependent G1/S checkpoint, whereas Cep57 deficiency causes widespread cell cycle dysregulation, genome instability, and apoptosis. Quantitative proteomic analyses reveal robust activation of DNA damage and checkpoint signaling pathways, consistent with engagement of genome surveillance mechanisms following Cep57 loss. Importantly, these cellular abnormalities precede extensive neural apoptosis, depletion of neuroprogenitor populations, and the emergence of microcephaly-associated phenotypes. Collectively, our findings establish Cep57 as a cohesin-associated integrator of chromosome segregation, cell cycle progression, and genome stability that is essential for neural progenitor maintenance during vertebrate embryogenesis, thereby expanding its functional repertoire far beyond its canonical role in centrosome regulation.", "authors": "Iyer, S.; Madamanchi, L. P. S.; Gokhale, A.; Kumar, M.", "date": "2026-07-27", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5631, "score_semantic": 0.5631, "score_lexical": 1.0, "matched": ["aneuploidy"]}, {"id": "https://doi.org/10.1016/j.cell.2026.07.009", "title": "Advancing cancer detection and treatment using longitudinal routine clinical data.", "abstract": "Cancer management remains fragmented across its continuum, from late-stage diagnosis and salvage therapies to non-personalized surveillance. Here, we present Oncoformer, a unified multimodal transformer model trained on the China Oncology Multimodal Prediction and Surveillance Study (COMPASS) cohort (3.67 million individuals, 17.7 million clinical visits) and validated on independent external cohorts, including the UK Biobank. Oncoformer integrates longitudinal electronic health records with chest X-ray imaging to address multiple clinical tasks: pan-cancer diagnosis (area under the receiver operating characteristic curve [AUROC] = 0.956), future cancer prediction up to 1 year before diagnosis (AUROC = 0.869), tumor stage inference (mean AUROC > 0.90), patient-specific treatment-response forecasting, and recurrence-free survival stratification across ten cancer types (all p < 0.01). Staging predictions were independently validated against postoperative pathological endpoints and shown to converge on core cancer genomic pathways. By translating routine clinical data into a dynamic view of cancer evolution, Oncoformer provides a framework for risk-informed cancer prediction and treatment stratification using routine clinical data.", "authors": "Liu F, Wang K, Xu H, Tang C, Shen X, Wang M, Yang L, Yang L, Liu L, Hu C, Li G, Wu W, Zou Z, Li B, Liu S, Kang J, Kong J, Li T, Wong IN, Huang X, Chen G, Lu W, Ziyar I, Zhang CL, Sun Y, Lin W, Ou C, Fok M, Hou T, Wang W, Xue K, Yin Y, Zhu H, Gootenberg J, Abudayyeh OO, Karin M, Loupy A, Rasko JEJ, Ideker T, Luo H, Oermann E, Zhang K", "date": "2026-Sep-17", "source": "PubMed", "journal": "Cell", "if": 45.5, "score": 0.5619, "score_semantic": 0.5619, "score_lexical": 0.9649, "matched": ["tumor evolution", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.07.29.741620", "title": "Minimally invasive monitoring of clonal evolution through integrated single cell and ctDNA analysis", "abstract": "Circulating cell-free DNA (cfDNA) offers a minimally invasive lens into tumor evolution. However, the accurate quantification of clonal composition from cfDNA remains challenging. Existing methods for clone tracking using liquid biopsies are constrained by issues such as their reliance on bulk tissue references, incomplete representations of clonal architecture or limited breadth of mutation panels. To address these limitations, we developed cfClone, a Bayesian framework that integrates single-cell whole-genome sequencing (scWGS) derived clonal structures with cfDNA whole-genome sequencing (cfDNA-WGS) data to enable high-resolution tissue-informed clonal tracking. By jointly modeling local copy-number alterations and haplotype-specific signals via Bayesian model selection and Markov chain Monte Carlo (MCMC) sampling, the algorithm yields uncertainty-aware estimates of clonal prevalence and tumour fraction (TF). Applied to longitudinal clinical cohorts, cfClone can be used to reconstruct evolutionary trajectories and uncovers clonal selection driving therapeutic resistance, including the de novo detection of emergent clonal populations. We demonstrate that cfClone achieves accurate TF estimates and circulating tumor DNA (ctDNA) detection in malignancies with varying degrees of copy-number variant (CNV) burden using semi-synthetic data. We then compare to the state of the art scWGS informed panel based approach, and demonstrate cfClone provides comparable accuracy while allowing for the tracking of more clones and detection of novel clones. Finally, we show how cfClone can be used to quantitatively track clonal dynamics in response to treatment in high grade serous ovarian cancer.  Github link: https://github.com/Roth-Lab/cfclone", "authors": "Kabeer, F.; Lepur, M.; Lynch, B.; Hurtado, E.; Zaikova, E.; Senz, J.; Au, V.; Baril, C.; Ma, D.; Nicholson, S.; Ha, G.; McAlpine, J.; Aparicio, S.; Huntsman, D.; Bouchard-Cote, A.; Drew, Y.; Roth, A. J. L.", "date": "2026-07-30", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5264, "score_semantic": 0.5264, "score_lexical": 1.0, "matched": ["tumor evolution", "clonal evolution", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.07.25.26358867", "title": "Surveying the Genomic Landscape of Mantle Cell Lymphoma Indicates the Importance of Multimodal Genomic and Transcriptomic Exploration", "abstract": "Mantle cell lymphoma (MCL) is a B-cell non-Hodgkin lymphoma characterized by heterogeneous clinical courses despite a common pathobiological initiating event. In this work we explore the genomic variants that characterize MCL and integrate transcriptomic data to comprehensively describe MCL biology. We performed whole exome sequencing (WES) on 28 tumor-normal pairs (lymph node and skin, respectively), as well as whole genome sequencing (WGS) and RNA sequencing on subsets of samples. We used established DNA and RNA analysis pipelines to detect single-nucleotide variants (SNV) and indels, structural variants, copy-number alterations, and RNA fusions. The canonical t(11;14)(q13;q32) CCND1::IGH translocation was detected in 8 of 10 WGS samples. Structural variant analysis additionally identified recurrent rearrangements involving KMT2A and PAFAH1B2. SNV and indel analyses revealed frequent mutations in ATM, TP53, CCND1, IGH, and NOTCH1. ATM exhibited diverse variant classes, including missense mutations, frameshift mutations, deletions, and duplications, while all detected NOTCH1 mutations were predicted loss-of-function frameshift variants. Copy-number analysis identified recurrent losses affecting DNA damage response genes, including TP53 and ATM, and recurrent gains involving transcriptional regulators and oncogenic signaling genes. Integrated pathway analysis demonstrated enrichment of transcriptional misregulation, DNA repair, PI3K/AKT signaling, and interleukin signaling pathways. We also identified recurrent alterations in candidate genes, including ASXL1, suggesting additional mechanisms of epigenetic dysregulation in MCL.  Together, these findings provide a comprehensive description of somatic alterations in MCL and demonstrate that diverse genomic lesions converge on common pathways involved in genomic instability, transcriptional regulation, and tumor survival.", "authors": "Jerold, C. N.; Li, B.; Moisor, M.; Russler-Germain, D.; Dahal, A.; Skidmore, Z.; Cotto, K.; Griffith, M.; Fehniger, T. A.; Griffith, O. L.; Kahl, B.; Gomez, F.", "date": "2026-07-29", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.5231, "score_semantic": 0.5231, "score_lexical": 0.8239, "matched": ["genomic instability"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.07.27.26359009", "title": "Histological triage of early-stage mycosis fungoides using a weakly supervised deep learning-based model: a multicentre, external validation, and clinical utility study", "abstract": "BackgroundHistological diagnosis of early-stage mycosis fungoides (MF) is hindered by profound overlap with benign inflammatory dermatoses (BIDs), leading to diagnostic delays and extensive ancillary testing. We developed MIMIC (Multiple Instance-learning for Identification of Mycosis fungoides In Cutaneous biopsies), a weakly supervised deep learning model designed as a triage tool at initial HCE whole-slide image (WSI) review to distinguish classic patch- and plaque-stage MF from BIDs. We externally validated the model and evaluated its clinical utility.  MethodsIn this retrospective multicentre study, we trained a base model using weakly supervised attention-based multiple-instance learning on 3,339 WSIs from two Dutch centres. Crucially, all MF training labels were derived from a deeply phenotyped national cohort featuring strict multidisciplinary expert panel consensus diagnoses (the clinical gold standard). Transportability was evaluated on 371 WSIs from four independent European centres. A blinded reader study on 171 WSIs compared morphology-only performance of MIMIC with 11 (dermato-)pathologists. We then retrained an updated model on all retrospective multicentre data and assessed clinical utility in a strictly held-out, consecutive Utrecht cohort (2022-2023; 486 accessions, 863 WSIs). Primary analysis focused on classic MF versus BIDs (453 accessions). Decision curve analysis, using Platt-scaled probabilities to correct for spectrum bias, evaluated net benefit at a prespecified, safety-oriented threshold of 0.04.  FindingsThe base model showed good multicentre transportability (mean centre-specific AUROC 0.91; pooled AUROC 0.84). In the reader study, MIMIC achieved an AUROC of 0.87, exceeding the mean pathologist AUROC (0.79) and the best individual reader (0.83). In the consecutive MF versus BID cohort, the updated model achieved an AUROC of 0.87 (95% CI 0.81-0.92). At the 0.04 threshold, sensitivity was 97.8% (44/45 MF cases) and specificity 50.2%, reducing unnecessary ancillary workups by 39.9 per 100 screening cases versus a test-all strategy.  InterpretationBy identifying nearly half of BIDs as low risk while preserving near-complete sensitivity for classic early-stage MF in a European digital pathology workflow, this unimodal HCE approach offers a scalable digital solution to reduce defensive ancillary testing and accelerate the diagnostic journey for patients with MF. Further validation is needed in non-European centres and in populations with darker skin phototypes.  FundingThis work was supported by an unrestricted Fellowship grant of Stichting Hanarth Fonds in The Netherlands.  Research in contextO_ST_ABSEvidence before this studyC_ST_ABSMycosis fungoides (MF) is notoriously difficult to diagnose in its early stages due to significant clinical and histopathological overlap with benign inflammatory dermatoses (BIDs), resulting in a median diagnostic delay of 36 months from symptom onset. Standard diagnostic workups are highly resource-intensive and frequently inconclusive, often requiring multiple consecutive biopsies, extensive immunohistochemistry panels, molecular T-cell receptor clonality studies, and iterative clinicopathological correlation in multidisciplinary consensus meetings.  We systematically searched PubMed from database inception up to May 28, 2026, using the terms (\"mycosis fungoides\" OR \"cutaneous T-cell lymphoma\" OR \"CTCL\") AND (\"deep learning\" OR \"machine learning\" OR \"artificial intelligence\" OR \"AI\" OR \"foundation model\") with no language restrictions, identifying 123 raw citations. Only eight original research articles were found to explicitly evaluate machine learning or artificial intelligence applications for cutaneous lymphomas. This pool was supplemented with international conference proceedings and a preprint, identifying a total of thirteen relevant studies. The vast majority of this limited literature focused on non-histological modalities (e.g., clinical photography, dermoscopic imaging, 3D skin tumour burden scoring, or structured electronic health records) or required specialized, non-standard imaging hardware such as non-linear optical microscopy. Furthermore, alternative computational pipelines relied on highly resource-intensive and costly molecular data, such as bulk RNA-sequencing gene-expression classifiers.  Crucially, fewer than five peer-reviewed studies focused on standard brightfield haematoxylin and eosin (HCE) whole-slide images (WSIs) to differentiate early-stage MF from BIDs. While recent baseline architectures, exploratory conference abstracts, and emerging multimodal systems integrating histopathology with clinical metadata have established the existence of a trainable discriminative signal, severe translational limitations persist. Most existing frameworks relied on small development datasets, lacked rigorous external geographic validation across independent international registries, and failed to strictly isolate patient-level clustered data during performance evaluation. Crucially, no prior study has evaluated a unimodal brightfield HCE pathology foundation model within a formalized, Platt-scaled calibration framework to correct for spectrum bias, or utilized decision curve analysis to demonstrate safe, high-sensitivity clinical triage in a consecutive screening pipeline.  Added value of this studyWe developed, externally validated, and evaluated the clinical utility of MIMIC, a clinical decision support tool utilizing a pathology foundation model (H-Optimus-1) for risk-stratified triage at the point of initial histological review. In an external geographic validation across four independent European institutions, the base model demonstrated high transportability with a mean centre-specific AUROC of 0{middle dot}91. In a blinded multi-centre reader study on 171 WSIs, MIMIC achieved an AUROC of 0{middle dot}87, outperforming the mean baseline performance of 11 independent (dermato-)pathologists (AUROC 0{middle dot}79 {+/-} 0{middle dot}03) and exceeding the integrated discriminative area of the top-performing human expert (AUROC 0{middle dot}83). Crucially, following TRIPOD+AI guidelines for model updating, the final candidate was evaluated on a strictly held-out, consecutive clinical screening workflow cohort (N = 453 accessions). Following Platt scaling to robustly calibrate for spectrum bias, MIMIC achieved a diagnostic sensitivity of 97{middle dot}8% at a conservative, safety-oriented operational threshold of 0{middle dot}04, intercepting 44 out of 45 true malignant cases while effectively identifying 50{middle dot}2% of BIDs as low-risk on initial HCE morphology alone.  Implications of all the available evidenceMIMIC can be seamlessly integrated into digital pathology workflows to safely \"de-bulk\" the diagnostic workload by reliably identifying low-risk cases that can be triaged away from automatic ancillary testing. Our automated three-tier workflow analysis demonstrates that a staggering 45{middle dot}5% of the total diagnostic screening volume can be safely classified as low-risk triage zones where ancillary testing could be avoided, translating to substantial direct laboratory cost savings. Decision curve analysis demonstrated a consistent positive net benefit at the 0{middle dot}04 threshold, corresponding to a net reduction of 39{middle dot}9 unnecessary ancillary workups and expert multidisciplinary reviews per 100 screening cases relative to a standard \"test all\" clinical strategy. By acting as a highly sensitive, objective, and reproducible filter at the earliest stage of histopathological review, this unimodal HCE approach offers a scalable, zero-marginal-cost digital solution to mitigate defensive diagnostic reflexes, optimize specialized laboratory resource allocation, and significantly accelerate the diagnostic pathway for patients with early-stage MF.", "authors": "Doeleman, T.; Brussee, S.; Valkema, P.; Kempf, W.; Vermeer, M.; Kers, J.; Wynaendts, L.; Kerckhoffs, K.; de Jonge, M.; Nguyen, A.; Peters, E.; Wobser, M.; Rauert-Wunderlich, H.; Rosenwald, A.; Stadler, R.; Jansen, P.; Battistella, M.; Roccuzzo, G.; Quaglino, P.; Schrader, A.", "date": "2026-07-28", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.4947, "score_semantic": 0.4947, "score_lexical": 0.6744, "matched": ["digital pathology", "histopathology"]}, {"id": "https://doi.org/10.1186/s13073-026-01737-4", "title": "Circulating tumor DNA precision oncology enables effective and sensitive molecular diagnostics and actionable target detection in pediatric solid tumors - the INFORM experience.", "abstract": "Pediatric solid high-risk malignancies mostly lack established molecular biomarkers for early detection, minimal residual disease assessment, or treatment monitoring. Challenges include small patient numbers, limited sample volumes, low tumor mutational burden, and few recurrent alterations. Within the multicenter pediatric precision oncology program INFORM, we prospectively collected liquid biopsies from 130 pediatric patients and optimized cell-free DNA isolation and analysis. Whole-genome, whole-exome, and targeted panel sequencing were performed using liquid biopsy-adapted protocols. Integrating tissue-derived molecular profiles and orthogonal validation revealed that low-coverage whole-genome sequencing reliably detects circulating tumor DNA. An in silico ctDNA estimation score, combining fragment length and genome segment alterations, improved sensitivity and specificity to 95%, enabling plasma-based tumor detection in 93% of patients. Whole-exome and panel sequencing effectively identified clinically relevant, potentially druggable molecular targets. However, their utility varied substantially across different tumor entities, underscoring the need for entity-specific considerations in the interpretation and application of these methodologies. In-depth analyses demonstrated liquid biopsy's potential to track tumor evolution, identifying common tumor ancestors and refining patient stratification. This study advances liquid biopsy methodologies in pediatric oncology and provides a rationale that, as SNVs are more sensitively captured by panel sequencing and WES, while CNVs are better represented by lcWGS and WES. The underlying tumor genomic profile should guide the selection of liquid biopsy assays to optimize clinical decision-making. Systematic liquid biopsy analyses within the pediatric precision oncology INFORM registry enabled a real-world, multicenter comparison of sequencing approaches across high-risk malignancies. By optimizing preanalytical and bioinformatic tools for pediatric settings, we improved plasma-based cancer detection, molecular tumor characterization, and identification of targetable alterations, laying the groundwork for integration into personalized medicine programs and clinical trials.", "authors": "Maass KK, Puranachot P, Volz S, Schad PS, Finster AME, Fischer TT, Jones BC, Schramm K, Henneken SC, Simon N, Montigel SH, Wedig T, Schwarz N, Zuliani C, Fiesel P, Previti C, Balasubramanian G, Iser F, Meyer J, van Tilburg CM, Milde T, Witt O, Rossi C, Sparber-Sauer M, Zimmermann S, Lehrnbecher T, Lauten M, Sill M, Jäger N, Autry RJ, Northcott PA, Sahm F, Jones DTW, Pfister SM, Brors B, Pajtler KW", "date": "2026-Jul-27", "source": "PubMed", "journal": "Genome medicine", "if": 10.4, "score": 0.4812, "score_semantic": 0.4812, "score_lexical": 0.6479, "matched": ["tumor evolution", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.04.08.26350456", "title": "Algorithm-Based Model for Gastrointestinal and Liver Histopathological Analysis Using VGG16 and Specialized Stains: Statistical Validation of Thresholds in AI-Driven Digital Pathology", "abstract": "Digital pathology, coupled with advanced image recognition algorithms, represents a transformative frontier in histopathological diagnosis. This sub-Saharan African laboratorys exploratory study investigates the application of a Convolutional Neural Network (CNN) model, specifically leveraging the VGG16 architecture with transfer learning, for automated analysis and classification of selected gastrointestinal (GIT) and liver tissue samples, incorporating both routine and specialized staining protocols. The study utilized a dataset comprising 114 samples (18 liver, 96 GIT images) derived from archival formalin-fixed paraffin-embedded tissue blocks at University College Hospital, Ibadan, Nigeria. Specialized staining techniques included Alcian Yellow for GIT mucin visualization and Massons Trichrome for liver fibrosis assessment, alongside conventional H&E staining. Model performance was evaluated using statistical methodologies including Wilson Score confidence intervals (CI), Bayesian probability assessment, and effect size analysis. Results reveal a striking dichotomy in model performance. The GIT tissue model achieved perfect classification accuracy (100% test accuracy) with exceptional statistical significance (Z=10.0, p<0.0001), Wilson CI [96.29%, 99.99%], Cohens h=1.571, and Bayesian probability >99.99%. Conversely, the liver tissue model demonstrated diagnostic failure (42.86% test accuracy), with Z=-1.428, p=0.9236, Wilson CI [33.59%, 52.65%], Cohens h=-0.144, and Bayesian probability of 7.64%. This performance divergence correlates with training data availability, as the liver dataset fell far below empirically established thresholds (>100-200 samples) for reliable classification. The liver models failure reveals limitations in transfer learning with insufficient data. These findings underscore critical implications for AI-enhanced digital pathology, demonstrating potential deployment of the GIT model as a promising one that supports tissue-specific model development.", "authors": "Adeluwoye, A. O.; Gbadegesin, M. O.; James, F. M.; Otegbade, P. S.; Alabetutu, A.", "date": "2026-07-28", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.4785, "score_semantic": 0.4785, "score_lexical": 1.0, "matched": ["digital pathology"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.07.25.26358934", "title": "Diagnostic accuracy of intraoperative frozen section in thyroid nodules with Bethesda III cytology: systematic review and meta-analysis", "abstract": "BackgroundBethesda III thyroid nodules remain diagnostically indeterminate, and intraoperative frozen section is used selectively to support surgical decision-making. Its value in this specific cytological category is uncertain because a malignant result may be highly specific while non-malignant and non-definitive results may fail to exclude cancer.  ObjectiveTo estimate the sensitivity and specificity of intraoperative frozen section for detecting malignancy in thyroid nodules with preoperative Bethesda III cytology.  MethodsThe protocol was prospectively registered in PROSPERO (CRD420261416683). A systematic review was conducted in PubMed, Embase, Web of Science, Europe PMC, and the Cochrane Library. Studies were eligible when they reported a separable Bethesda III cohort, intraoperative frozen-section findings, and final histopathology. Frozen section was classified as positive only when malignancy was reported. Benign, suspicious, indeterminate, deferred, inconclusive, and follicular-pattern results were classified as non-malignant. Study-level 2 x 2 tables were synthesised with random-effects logit models. Because all studies reported zero false-positive results, a full bivariate model with freely estimated covariance was not identifiable; a pseudo-bivariate HSROC approximation was therefore used. QUADAS-2 was used for risk-of-bias assessment.  ResultsTen studies comprising 1,069 Bethesda III patients or nodules were included. The pooled sensitivity was 43.1% (95% CI, 21.3-67.9) and the pooled specificity was 98.8% (95% CI, 97.0-99.5). Sensitivity was highly heterogeneous (Q = 83.45, I2 >90%, {tau}2 = 2.15), whereas specificity showed negligible between-study variance. Excluding Mao 2023 reduced pooled sensitivity to 35.6% (95% CI, 23.8-49.5) and reduced sensitivity heterogeneity to moderate levels (Q = 12.44, I2 = 36%, {tau}2 = 0.25); specificity remained 98.7% (95% CI, 96.7-99.5). The approximate HSROC AUC was 0.89 including Mao 2023 and 0.87 excluding Mao 2023, but these values were driven largely by the uniformly high specificity.  ConclusionsIntraoperative frozen section in Bethesda III nodules has excellent specificity but limited and variable sensitivity. It is more suitable as a rule-in test than as a rule-out test. A non-malignant or non-definitive result should not be used alone to exclude malignancy or determine the extent of thyroid surgery.", "authors": "Pardal-Refoyo, J. L.; Zapatero-Sanchez, I.", "date": "2026-07-29", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.4762, "score_semantic": 0.4762, "score_lexical": 0.7349, "matched": ["histopathology", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.07.25.740688", "title": "LINE-1 transposon derepression and epigenetic remodeling in Retinoblastoma", "abstract": "Retinoblastoma (RB), the most common pediatric intraocular malignancy, is initiated by biallelic inactivation of the RB1 tumor suppressor gene. Although LINE-1 (L1) retrotransposon activation has been linked to genomic instability and tumor evolution in several adult cancers, its contribution to pediatric malignancies remains poorly understood. Here, we investigated L1 expression in retinoblastoma samples from an Indian pediatric cohort by integrating transcriptomic, locus-specific, and immunohistochemistry. Transcriptomic profiling revealed increased L1 expression in RB tumors compared with control retinal tissues, which was validated by ORF1p immunostaining in tumor sections. Locus-specific analysis identified a subset of transcriptionally active L1 loci, suggesting selective activation of young L1 elements. We also observed altered expression of genes associated with proliferation, chromatin regulation, and oncogenic signaling, including MYCN, MDM2, E2F3, SOX4 and CREBBP. Our findings identify previously underexplored L1 activation as a molecular feature associated with retinoblastoma and suggest that disruption of transposon silencing accompanies the RB transcriptional landscape. Validation in larger patient cohorts will be important; however, this study provides a foundation for exploring L1 activity as a potential molecular marker and future therapeutic vulnerability in retinoblastoma.  HighlightsO_LITranscriptomic profiling reveals increased LINE-1 expression in retinoblastoma. C_LIO_LIORF1p protein is robustly expressed in retinoblastoma. C_LIO_LIA subset of LINE-1 loci exhibits transcriptional activation, suggesting locus-specific derepression. C_LI  In BriefRetinoblastoma is initiated by RB1 loss, but the contribution of transposable elements to its molecular landscape remains poorly understood. Here, we show that retinoblastoma is associated with LINE-1 promoter hypomethylation, increased LINE-1 transcript expression, ORF1p accumulation, and preferential activation of selected LINE-1 loci. These changes occur together with altered expression of oncogenic signalling pathways and host factors involved in transposable element repression, identifying dysregulated LINE-1 control as a molecular feature of this paediatric cancer.  Graphical Abstract  O_FIG O_LINKSMALLFIG WIDTH=200 HEIGHT=115 SRC=\"FIGDIR/small/740688v1_ufig1.gif\" ALT=\"Figure 1\"> View larger version (24K): org.highwire.dtl.DTLVardef@197e89org.highwire.dtl.DTLVardef@1c26c04org.highwire.dtl.DTLVardef@14180a4org.highwire.dtl.DTLVardef@16493bb_HPS_FORMAT_FIGEXP  M_FIG C_FIG Retinoblastoma exhibits epigenetic activation of LINE-1 characterized by promoter hypomethylation, increased expression of young LINE-1 elements, and ORF1p accumulation. This is accompanied by coordinated transcriptomic remodeling and disruption of host mechanisms that normally restrain transposable elements, linking LINE-1 activation to the molecular landscape of retinoblastoma.", "authors": "Verma, A.; Patel, S. K.; Varshney, A.; Paul, P.; Sachdeva, R.; Sangwan, V. S.; Das, S.; Tiwari, B.; Tiwari, A.", "date": "2026-07-27", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4528, "score_semantic": 0.4528, "score_lexical": 0.6778, "matched": ["tumor evolution", "genomic instability", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.07.26.740799", "title": "Focused Ultrasound Blood-Tumor Barrier Opening Rapidly Augments Intratumor CD4 and CD8 T Cell Representation in a Genetically Engineered Mouse Model of Glioma", "abstract": "Glioblastoma (GBM) is a highly aggressive primary brain tumor that remains difficult to treat due in part to its disorganized and heterogeneous vasculature, known as the blood-tumor barrier (BTB), which limits therapeutic delivery and beneficial immune cell infiltration. Focused ultrasound (FUS) with microbubbles (MBs) can transiently disrupt the BTB to enhance drug delivery and may induce sterile inflammation (SI) that can beneficially remodel the tumor immune landscape. However, this concept has only been explored in implanted tumor models with modest immune effects. Here, we utilized a physiologically relevant genetically engineered mouse model (GEMM) generated via in utero electroporation targeting Nf1, Tp53, and Pten to study tumor-vascular-immune interactions. This 3x CRISPR-Cas9 GEMM recapitulates key features of human glioma, including infiltrative growth, histopathology, molecular alterations, and stage-dependent blood-brain barrier disruption. FUS+MBs were applied to transiently disrupt the BTB, and MRI confirmed increased vascular permeability in treated tumors. Flow cytometry revealed robust increases in tumor-infiltrating CD4+ helper and CD8+ effector T cells three days post-FUS treatment, without altering the CD8/Treg ratio. These findings were supported by immunofluorescence imaging. Double-negative and double-positive T cells were detected, but they were not significantly altered by FUS. Ki67 analysis indicated that increased T-cell accumulation was not driven by local proliferation. By seven days post-treatment, immune differences were no longer observed. Collectively, these results demonstrate that FUS-mediated BTB disruption selectively and rapidly enhances lymphocyte infiltration in a clinically relevant glioma model, supporting its potential as a temporally controlled immunomodulatory strategy for GBM.", "authors": "Nowak, K.; Hoch, M.; Gillespie, W.; Connaroe, C.; Breza, V.; Gorick, C.; Cruz, T.; Gordon, E.; Harris, T. H. J.; Wythe, J.; Price, R. J.", "date": "2026-07-28", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4346, "score_semantic": 0.4346, "score_lexical": 0.8527, "matched": ["histopathology"]}], "reports": [{"date": "2026-09-28", "label": "Sep 28, 2026", "n": 32}, {"date": "2026-09-21", "label": "Sep 21, 2026", "n": 24}, {"date": "2026-09-14", "label": "Sep 14, 2026", "n": 26}, {"date": "2026-09-07", "label": "Sep 07, 2026", "n": 34}, {"date": "2026-08-31", "label": "Aug 31, 2026", "n": 19}, {"date": "2026-08-24", "label": "Aug 24, 2026", "n": 24}, {"date": "2026-08-17", "label": "Aug 17, 2026", "n": 18}, {"date": "2026-08-10", "label": "Aug 10, 2026", "n": 34}, {"date": "2026-08-03", "label": "Aug 03, 2026", "n": 17}, {"date": "2026-07-27", "label": "Jul 27, 2026", "n": 24}, {"date": "2026-07-20", "label": "Jul 20, 2026", "n": 26}, {"date": "2026-06-26", "label": "Jun 26, 2026", "n": 14}, {"date": "2026-06-19", "label": "Jun 19, 2026", "n": 38}], "prefix": "", "home": "../papers.html"}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const papers = DATA.papers;
  const SHORT = 280;
  // Slider floor: the pipeline threshold, or lower if older data scored below it
  const FLOOR = Math.floor(Math.min(DATA.threshold, ...papers.map(p => p.score)) * 100) / 100;

  // ── Persistent per-browser state (stars / read), keyed by paper URL ──
  const store = {
    get(k, fallback) {
      try { const v = localStorage.getItem('papertrail:' + k); return v ? JSON.parse(v) : fallback; }
      catch { return fallback; }
    },
    set(k, v) {
      try { localStorage.setItem('papertrail:' + k, JSON.stringify(v)); } catch {}
    },
  };
  const starred = new Map(Object.entries(store.get('starred', {})));  // id -> paper snapshot
  const read    = new Set(store.get('read', []));
  const saveStars = () => store.set('starred', Object.fromEntries(starred));
  const saveRead  = () => store.set('read', [...read]);

  const prefs = store.get('prefs', {});
  const state = {
    q: '',
    view: 'all',
    sort: prefs.sort || 'score',
    min: FLOOR,
    sources: new Set(),
    keyword: null,
    expanded: new Set(),
    scope: 'week',        // 'week' = this report, 'all' = every archived week
    limit: 100,           // cards rendered before "Show more"
  };
  const PAGE = 100;

  // ── All-weeks index: loaded on demand from reports/search-index.js ──
  let ALL = null, loadingAll = false;
  function loadAll() {
    if (ALL || loadingAll) return;
    loadingAll = true;
    const s = document.createElement('script');
    s.src = (DATA.prefix || '') + 'search-index.js';
    s.onload = () => { ALL = window.PAPERTRAIL_INDEX || []; loadingAll = false; render(); };
    s.onerror = () => {
      loadingAll = false; state.scope = 'week'; render();
      $('count').textContent = 'Could not load the all-weeks index (reports/search-index.js).';
    };
    document.head.appendChild(s);
  }
  const pool = () => state.scope === 'all' && ALL ? ALL : papers;

  // ── Helpers ──
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const scoreVar = s => s >= 0.5 ? 'var(--high)' : s >= 0.35 ? 'var(--mid)' : 'var(--low)';
  const isPreprint = p => !p.journal || p.journal === 'preprint';
  const url = p => (p.id && !p.id.startsWith('http')) ? 'https://doi.org/' + p.id : p.id;
  // Dates come as "2026-09-02", "2026-Sep-02" (PubMed) or just "2026-Sep"
  const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const dateKey = d => {
    const m = /^(\d{4})(?:-(\w+))?(?:-(\d+))?/.exec(d || '');
    if (!m) return 0;
    const mon = m[2] ? (/^\d+$/.test(m[2]) ? +m[2] - 1 : MONTHS.indexOf(m[2].slice(0, 3).toLowerCase())) : 0;
    return Date.UTC(+m[1], Math.max(mon, 0), m[3] ? +m[3] : 1);
  };

  // Keyword highlighting: whole-token matches, longest first
  const kwRe = DATA.keywords.length
    ? new RegExp('\\b(' + [...DATA.keywords].sort((a, b) => b.length - a.length).map(reEsc).join('|') + ')\\b', 'gi')
    : null;
  function highlight(text) {
    const parts = [];
    const res = [kwRe];
    const q = state.q.trim();
    if (q.length >= 2) res.push(new RegExp('(' + q.split(/\s+/).map(reEsc).join('|') + ')', 'gi'));
    // Collect ranges from all regexes on raw text, then merge and escape
    const ranges = [];
    for (const re of res) {
      if (!re) continue;
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(text))) { if (!m[0]) { re.lastIndex++; continue; } ranges.push([m.index, m.index + m[0].length]); }
    }
    if (!ranges.length) return esc(text);
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [ranges[0].slice()];
    for (const r of ranges.slice(1)) {
      const last = merged[merged.length - 1];
      if (r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push(r.slice());
    }
    let i = 0;
    for (const [a, b] of merged) { parts.push(esc(text.slice(i, a)), '<mark>', esc(text.slice(a, b)), '</mark>'); i = b; }
    parts.push(esc(text.slice(i)));
    return parts.join('');
  }

  const hayCache = new WeakMap();
  const hay = p => {
    let h = hayCache.get(p);
    if (h === undefined) {
      h = [p.title, p.abstract, p.authors, p.journal, p.source].join(' ').toLowerCase();
      hayCache.set(p, h);
    }
    return h;
  };

  // ── Filtering ──
  function filtered() {
    const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    let list = state.view === 'starred'
      ? [...starred.values()]
      : pool();
    list = list.filter(p => {
      if (state.view !== 'starred' && p.score < state.min) return false;
      if (state.view === 'unread' && read.has(p.id)) return false;
      if (state.sources.size && !state.sources.has(p.source)) return false;
      if (state.keyword && !(p.matched || []).includes(state.keyword)) return false;
      if (terms.length) {
        const h = hay(p);
        if (!terms.every(t => h.includes(t))) return false;
      }
      return true;
    });
    const by = {
      score: (a, b) => b.score - a.score,
      date:  (a, b) => dateKey(b.date) - dateKey(a.date) || b.score - a.score,
      if:    (a, b) => (b.if ?? -1) - (a.if ?? -1) || b.score - a.score,
    }[state.sort];
    return [...list].sort(by);
  }

  // ── Rendering ──
  const ICON_STAR = '<svg viewBox="0 0 24 24" fill="FILL" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  // Link to the report(s) a paper appeared in, when not the one being viewed
  const LABELS = Object.fromEntries((DATA.reports || []).map(r => [r.date, r.label]));
  function weekTag(p) {
    const weeks = (p.weeks || []).filter(w => w !== DATA.date || state.scope === 'all');
    if (!weeks.length || (state.scope !== 'all' && state.view !== 'starred')) return '';
    const [w, ...rest] = weeks;
    const label = w === DATA.date ? 'This week' : 'Week of ' + (LABELS[w] || w);
    return `<a class="week-tag" href="${esc((DATA.prefix || '') + w + '.html')}" title="${esc(weeks.map(x => LABELS[x] || x).join(', '))}">${esc(label)}${rest.length ? ` +${rest.length}` : ''}</a>`;
  }

  function card(p) {
    const s = p.score ?? 0;
    const abs = p.abstract || '';
    const long = abs.length > SHORT;
    const open = state.expanded.has(p.id);
    const shown = long && !open ? abs.slice(0, SHORT) + '…' : abs;
    const ifStr = p.if != null ? ` · IF ${Number(p.if).toFixed(1)}` : '';
    const authors = p.authors || '';
    const isStar = starred.has(p.id), isRead = read.has(p.id);
    const u = url(p);
    return `
      <article class="card${isRead ? ' is-read' : ''}" style="--score-color:${scoreVar(s)}" data-id="${esc(p.id)}">
        <div class="card-top">
          <a class="title" href="${esc(u)}" target="_blank" rel="noopener">${highlight(p.title || '')}</a>
          <div class="score-block" title="semantic ${p.score_semantic ?? '–'} · lexical ${p.score_lexical ?? '–'}">
            <div class="score-pill">${s.toFixed(2)}</div>
            <div class="score-bar-track"><div class="score-bar-fill" style="width:${Math.min(s * 100, 100)}%"></div></div>
          </div>
        </div>
        <div class="card-meta">
          <span class="badge${isPreprint(p) ? ' preprint' : ''}">${esc(p.source)}</span>
          ${!isPreprint(p) ? `<span>${esc(p.journal)}${ifStr}</span>` : ''}
          <span>${esc(p.date)}</span>
          <span title="${esc(authors)}">${esc(authors.length > 60 ? authors.slice(0, 60) + '…' : authors)}</span>
          ${weekTag(p)}
        </div>
        <div class="abstract">${highlight(shown)}${long ? `<button class="toggle-btn" data-act="toggle">${open ? 'Show less' : 'Show more'}</button>` : ''}</div>
        <div class="card-foot">
          <div class="matched">${(p.matched || []).map(k => `<button class="kw" data-kw="${esc(k)}" title="Filter by this keyword">${esc(k)}</button>`).join('')}</div>
          <button class="act${isStar ? ' on' : ''}" data-act="star" aria-pressed="${isStar}">${ICON_STAR.replace('FILL', isStar ? 'currentColor' : 'none')}${isStar ? 'Starred' : 'Star'}</button>
          <button class="act${isRead ? ' read-on' : ''}" data-act="read" aria-pressed="${isRead}">${ICON_CHECK}${isRead ? 'Read' : 'Mark read'}</button>
          <a class="doi-link" href="${esc(u)}" target="_blank" rel="noopener">Open ↗</a>
        </div>
      </article>`;
  }

  const $ = id => document.getElementById(id);

  function renderChips() {
    const counts = {};
    const src = state.view === 'starred' ? [...starred.values()] : pool();
    src.forEach(p => { counts[p.source] = (counts[p.source] || 0) + 1; });
    $('sources').innerHTML = Object.keys(counts).sort().map(src =>
      `<button class="chip" data-src="${esc(src)}" aria-pressed="${state.sources.has(src)}">${esc(src)}<span class="n">${counts[src]}</span></button>`
    ).join('');
    const kwCounts = {};
    src.forEach(p => (p.matched || []).forEach(k => { kwCounts[k] = (kwCounts[k] || 0) + 1; }));
    $('keywords').innerHTML = DATA.keywords.map(k =>
      `<button class="chip" data-kw="${esc(k)}" aria-pressed="${state.keyword === k}">${esc(k)}<span class="n">${kwCounts[k] || 0}</span></button>`
    ).join('');
  }

  // Filter changes start from the first page again
  const update = () => { state.limit = PAGE; render(); };

  function render() {
    const list = filtered();
    const papersEl = $('papers');
    if (state.scope === 'all' && !ALL) {
      papersEl.innerHTML = '<div class="empty">Loading all weeks…</div>';
    } else if (list.length) {
      const rest = list.length - state.limit;
      papersEl.innerHTML = list.slice(0, state.limit).map(card).join('') +
        (rest > 0 ? `<button class="more-btn" data-act="more">Show ${Math.min(rest, PAGE)} more (${rest} left)</button>` : '');
    } else {
      papersEl.innerHTML = `<div class="empty">${state.view === 'starred' && !starred.size
        ? 'No starred papers yet — star papers to build a reading list. It is saved in this browser.'
        : 'No papers match these filters.'}</div>`;
    }
    const base = state.view === 'starred' ? starred.size : pool().length;
    const what = state.view === 'starred' ? 'starred papers'
      : state.scope === 'all' ? `papers across ${(DATA.reports || []).length} weeks` : 'papers';
    $('count').textContent = `Showing ${list.length} of ${base} ${what}`;
    $('star-n').textContent = starred.size ? `(${starred.size})` : '';
    $('export').hidden = state.view !== 'starred' || !starred.size;
    const dirty = state.q || state.sources.size || state.keyword || state.min !== FLOOR;
    $('reset').hidden = !dirty;
    document.querySelectorAll('#view button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === state.view));
    document.querySelectorAll('#scope button').forEach(b => b.setAttribute('aria-pressed', b.dataset.scope === state.scope));
    $('scope').hidden = (DATA.reports || []).length < 2;
    renderChips();
  }

  // ── Header / footer ──
  $('meta').textContent =
    `${papers.length} of ${DATA.total} relevant papers · Past ${DATA.days} days · Generated ${DATA.generated}`;
  $('footer').textContent = `Generated by PaperTrail · Sources: ${DATA.sources.join(', ')}`;
  if (DATA.imported) {
    $('meta').insertAdjacentHTML('afterend',
      '<div class="imported-note">Recovered from an older report: author lists are shortened.</div>');
  }

  // ── Week navigation (reports are listed newest first) ──
  const REPORTS = DATA.reports || [];
  const here = REPORTS.findIndex(r => r.date === DATA.date);
  const href = r => (DATA.prefix || '') + r.date + '.html';
  if (REPORTS.length > 1 && here !== -1) {
    $('weeks').hidden = false;
    $('week').innerHTML = REPORTS.map((r, i) =>
      `<option value="${i}"${i === here ? ' selected' : ''}>${esc(r.label)} · ${r.n} papers${i === 0 ? ' · latest' : ''}</option>`
    ).join('');
    $('week').addEventListener('change', e => { location.href = href(REPORTS[+e.target.value]); });
    const link = (el, r) => r ? (el.href = href(r)) : el.setAttribute('aria-disabled', 'true');
    link($('prev'), REPORTS[here + 1]);
    link($('next'), REPORTS[here - 1]);
    if (here === 0) $('latest').hidden = true; else $('latest').href = DATA.home;
  }

  // ── Controls ──
  const min = $('min');
  min.min = FLOOR;
  min.value = state.min;
  $('min-val').textContent = state.min.toFixed(2);
  $('sort').value = state.sort;

  let t;
  $('q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; update(); }, 120); });
  min.addEventListener('input', e => { state.min = +e.target.value; $('min-val').textContent = state.min.toFixed(2); update(); });
  $('sort').addEventListener('change', e => { state.sort = e.target.value; store.set('prefs', { ...prefs, sort: state.sort }); update(); });
  $('view').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.view = b.dataset.view; update();
  });
  $('scope').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.scope = b.dataset.scope;
    if (state.scope === 'all') loadAll();
    update();
  });
  $('sources').addEventListener('click', e => {
    const b = e.target.closest('[data-src]'); if (!b) return;
    const s = b.dataset.src;
    state.sources.has(s) ? state.sources.delete(s) : state.sources.add(s);
    update();
  });
  const toggleKw = k => { state.keyword = state.keyword === k ? null : k; update(); };
  $('keywords').addEventListener('click', e => { const b = e.target.closest('[data-kw]'); if (b) toggleKw(b.dataset.kw); });
  $('reset').addEventListener('click', () => {
    state.q = ''; $('q').value = '';
    state.sources.clear(); state.keyword = null;
    state.min = FLOOR; min.value = state.min; $('min-val').textContent = state.min.toFixed(2);
    update();
  });
  $('export').addEventListener('click', () => {
    const lines = [...starred.values()].sort((a, b) => b.score - a.score).map(p =>
      `- [${p.title}](${url(p)})  \n  ${p.authors ? p.authors.split(/[,;]/)[0].trim() + ' et al. · ' : ''}${isPreprint(p) ? p.source : p.journal} · ${p.date}`);
    const blob = new Blob([`# PaperTrail — starred papers\n\n${lines.join('\n')}\n`], { type: 'text/markdown' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'papertrail-starred.md' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $('papers').addEventListener('click', e => {
    const kw = e.target.closest('.matched [data-kw]');
    if (kw) { toggleKw(kw.dataset.kw); return; }
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    if (btn.dataset.act === 'more') { state.limit += PAGE; render(); return; }
    const id = btn.closest('.card').dataset.id;
    const p = pool().find(x => x.id === id) || papers.find(x => x.id === id) || starred.get(id);
    const act = btn.dataset.act;
    if (act === 'toggle') { state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); }
    if (act === 'star')   { starred.has(id) ? starred.delete(id) : starred.set(id, { ...p, weeks: p.weeks || [DATA.date] }); saveStars(); }
    if (act === 'read')   { read.has(id) ? read.delete(id) : read.add(id); saveRead(); }
    render();
  });

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
    if (e.key === 'Escape' && document.activeElement === $('q')) { $('q').blur(); }
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (!typing && e.key === '[' && $('prev').href) location.href = $('prev').href;
    if (!typing && e.key === ']' && $('next').href) location.href = $('next').href;
  });

  render();
})();
</script>
</body>
</html>
