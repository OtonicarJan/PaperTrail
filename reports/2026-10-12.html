g therapies in multiple cancers including leukemia, Ewing sarcoma, head and neck cancers, mesothelioma and small cell lung cancer (SCLC). Here, utilizing immunofluorescence microscopy and single-cell RNA sequencing we characterized SLFN11 expression across eight different human cancer cell lines and found cell-to-cell heterogenous expression both at the protein and RNA levels. Gene set enrichment and pathway analyses show that SLFN11 is coexpressed with a distinct stress-response state and enhanced genome maintenance programs while being inversely correlated with protein translation pathways. Publicly available single-cell RNA-sequencing datasets of human SCLC tumors confirmed the heterogeneous distribution of SLFN11 expression and confirmed its association with replication-related transcriptional programs. These findings indicate that heterogeneous SLFN11 expression reflects dynamic regulation at the single-cell level. They also underscore the limitations of bulk proteomic and transcriptome profiling and point to a potential reservoir of intrinsic chemotherapy resistance.", "authors": "Taniyama, D.; Inoue, Y.; Elloumi, F.; Kim, Y. S.; Roper, N.; Seibert, C.; Kelly, M.; Lobanov, A.; Aladjem, M. I.; Luna, A.; Pommier, Y.", "date": "2026-10-07", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6311, "score_semantic": 0.6311, "score_lexical": 0.7945, "matched": ["cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.10.08.757597", "title": "The adaptive architecture of tRNA dependencies across physiological tumor environments", "abstract": "The genetic code is decoded by a highly redundant transfer RNA (tRNA) repertoire, yet whether this apparent redundancy serves a functional role beyond ensuring robust translation remains unclear. Here, we establish an atlas of tRNA dependencies through large-scale CRISPRi perturbation mapping across matched in vivo tumor growth and in vitro cell culture for 16 cancer cell lines spanning seven tissue types. During in vivo tumor growth, tRNA dependencies exhibited tissue organization at isodecoder resolution and were associated with codon demand at the isoacceptor level. Strikingly, these relationships were reorganized when cells were cultured in vitro, establishing environmental sensitivity of tRNA dependency--in contrast to protein components of the decoding machinery such as aminoacyl-tRNA synthetases (aaRSs), whose dependencies were largely preserved across environments. Despite pronounced context specificity, environmental alterations in tRNA dependency were dominated by a shared response across cancer cell lines, organized across isoacceptor and isodecoder levels. By disentangling stable cellular identity from environment-associated dependency states, we resolved a shared axis of isoacceptor dependency remodeling and identified specific tRNA isoacceptors associated with promoting or restraining adaptation to the tumor environment. We further connect this functional architecture to differential translation of codon-usage-biased programs associated with proliferation and tumor-microenvironmental stress. Together, our study reveals that tRNA redundancy does not imply functional equivalence, but instead forms a structured and environmentally plastic control layer linking coding information to translational output.", "authors": "Chen, S.; Charbonneau, T.; Yousefi, K.; Zirak, B.; Lee, S.; Joshi, T.; Pawluk, A.; Ramani, V.; Goodarzi, H.", "date": "2026-10-09", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6254, "score_semantic": 0.6254, "score_lexical": 0.6371, "matched": ["cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.10.09.758054", "title": "Inferring ecDNA Evolution from Allele Frequency Spectra", "abstract": "Extrachromosomal DNA (ecDNA) can arise early in the development of aggressive tumors or later upon progression, but the impact of chronology on patient outcome is not known. Currently, it is not possible to determine when an ecDNA arose in the course of tumor development and progression, based on genome sequencing data. Here, we develop an analytic method, ecEvol, to infer ecDNA emergence time, selection strength, mutation rate, and clonal dominance from allele frequency spectra in bulk whole-genome sequencing. EcEvol outperforms other methods and predicts parameters with high accuracy across a wide range of parameter values. Applying ecEvol to primary, treatment-naive tumors, we find that ecDNA typically emerges early and undergoes strong positive selection, albeit with substantial variation across cancer types. EcDNAs carrying known oncogenes emerge earlier and reach greater clonal dominance than ecDNAs lacking known oncogenes. In advanced and predominantly treated tumors, ecDNA emerges substantially later than in matched primary tumors, consistent with the generation and selection of new ecDNA during tumor progression and therapy. Longitudinal samples further support continued expansion of ecDNA-bearing lineages. Finally, earlier ecDNA emergence is associated with poorer overall survival. These results provide insight into the chronology of ecDNA formation from a single tumor biopsy taken at any point during the course of the disease, revealing that allele-frequency spectra encode the evolutionary history of ecDNA and provide a quantitative framework for reconstructing its emergence and expansion.", "authors": "Dameracharla, B.; Prasad, G.; Luebeck, J.; Amin, S.; Kirkland, J.; Chapman, O. S.; Chavez, L.; Verhaak, R.; Huang, W.; Mischel, P. S.; Werner, B.; Bafna, V.", "date": "2026-10-11", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6141, "score_semantic": 0.6141, "score_lexical": 0.7229, "matched": ["tumor evolution", "clonal evolution", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.07.24.26358660", "title": "Multimodal ctDNA profiling for cancer detection and monitoring in pan-cancer patients with advanced disease enrolled in the SHI-VA02 trial", "abstract": "BackgroundLiquid biopsy-based monitoring of circulating tumor DNA (ctDNA) holds promises for real-time assessment of tumor burden and treatment response in precision oncology. However, mutation-based approaches alone show limited sensitivity, particularly in low-shedding tumors. We evaluated whether integrating tumor-naive epigenomic biomarkers -- specifically LINE-1 retrotransposon (L1PA) hypomethylation and copy number variation (CNV) -- with standard mutation-based ctDNA analysis could improve cancer detection and longitudinal monitoring in patients enrolled in the SHIVA02 precision oncology trial.  MethodsWe performed a retrospective analysis of 32 patients with 11 different types of advanced or metastatic solid tumors and who received molecularly matched targeted therapies within the SHIVA02 trial (NCT03084757). Plasma samples were collected at baseline, longitudinally every two months and at progression. Multimodal ctDNA profiling was performed using the DRAGON targeted NGS panel covering SNVs, indels and focal CNVs in 571 genes and the DIAMOND assay profiling L1PA methylation and genome-wide CNV. A three-step classification algorithm integrating maximum variant allele frequency (MaxVAF), L1PA methylation-based cancer probability (MethPCancer), and genome-wide CNV scores was developed to maximize ctDNA detectability.  ResultsAt baseline, mutation-based profiling detected ctDNA in 62.5% of patients. L1PA hypomethylation alone identified ctDNA in 90.6% of patients, including cases with undetectable mutations. The three-step integrative model increased overall detectability to 96.9%. The three modalities showed limited pairwise correlation at baseline, supporting their complementarity. Longitudinal analysis demonstrated that changes in MaxVAF, MethPCancer, and L1PA CNV scores over time were informative on treatment response across tumor types, with ctDNA detected in 97.3% of samples collected at disease progression. In selected patients, ctDNA alterations preceded radiological progression by two to four months.  ConclusionsMultimodal ctDNA profiling integrating mutation analysis, CNV profiling, and tumor-naive LINE-1 hypomethylation substantially improves ctDNA detection at baseline and during treatment in a pan-cancer setting. These complementary genomic and epigenomic biomarkers provide a more comprehensive and dynamic assessment of tumor burden than single-modality approaches, supporting prospective validation in larger cohorts for integration into precision oncology workflows.", "authors": "Nedara, K.; Gorse, M.; von Grafenstein, K.; masliah-planchon, J.; Antonio, S.; Bianchi, C.; Sene, M.; Du Rusquec, P.; Mariani, O.; KAMAL, M.; Hamza, A.; Bieche, I.; LE TOURNEAU, C.; Dupain, C.; Proudhon, C.", "date": "2026-10-06", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.6057, "score_semantic": 0.6057, "score_lexical": 0.7886, "matched": ["cancer"]}, {"id": "https://doi.org/10.1158/2159-8290.CD-26-0971", "title": "Universal Germline Genetic Testing after a Diagnosis of Cancer.", "abstract": "Age at diagnosis among patients with cancer is a predictor of pathogenic germline variant prevalence, yet age thresholds often misclassify genetic risk. We performed germline sequencing of 39,184 unselected patients with solid malignancies spanning 32 tumor types, interrogating >90 cancer predisposition genes independent of clinical suspicion. Patients were stratified into early-, average-, and late-onset groups based on standard deviations from tumor-specific mean age at diagnosis. Pathogenic variant prevalence inversely correlated with age at diagnosis: 18.4% in early-onset tumors, 15.6% in average-onset tumors, and 12.3% in late-onset tumors (P < 0.001). Variants in high/moderate-penetrance genes accounted for the enrichment in early-onset cases (12.4%, early-onset; 8.9%, average-onset; 5.1%, late-onset; P < 0.001). Restricting hereditary cancer testing to patients diagnosed before age 50, as is typically done, would miss 4,601 pathogenic variant carriers, 72% of all variants detected. These findings support broad-based germline testing beyond conventional age-based criteria, reflecting the burden of hereditary risk even among late-onset cases. Across 32 solid tumor types in a pan-cancer cohort, we found enrichment of germline pathogenic variants among patients with subtype-specific early-onset cancer. Using age 50 as a testing cutoff misses most patients with inherited predisposition, supporting universal germline genetic testing for all individuals diagnosed with cancer.", "authors": "Stadler ZK, Maio A, Khurram A, Arora K, Bandlamudi C, Liu YL, Kemel Y, Sheehan M, Salo-Mullen E, Padunan A, Alano T, Tap WD, Glade Bender JL, Cercek A, Mellinghoff IK, O'Reilly EM, Ho AL, Offin MD, Shoushtari AN, Kesserwan CA, Abbass M, Banaszak L, DeAngelis LM, Murciano-Goroff YR, Ladanyi M, Ceyhan-Birsoy O, Carlo MI, Latham A, Robson ME, Solit DB, Berger MF, Mandelker DL, Offit K, Diaz LA", "date": "2026-Oct-08", "source": "PubMed", "journal": "Cancer discovery", "if": 29.7, "score": 0.6054, "score_semantic": 0.6054, "score_lexical": 0.9131, "matched": ["cancer"]}, {"id": "https://www.biorxiv.org/content/10.1101/2025.04.16.648783", "title": "Integrated Lineage Tracing in Hepatoblastoma Finds a Plasticity-Proliferation Axis Drives Adaptation", "abstract": "Paediatric cancers, with their developmental context and low mutational burden, are powerful models for studying plasticity in cancer evolution. Hepatoblastoma (HB) has among the lowest mutational burdens of childhood cancers, yet ~20% relapse, implicating non-genetic mechanisms in treatment adaptation. We integrate expressed DNA barcodes with longitudinal single-cell multiomics to trace clonal and phenotypic dynamics following cisplatin treatment in HB cell lines. Cisplatin imposes a phenotypic bottleneck, selecting for progenitor-like cells across clones without a clonal sweep. Exit from persistence involves asynchronous, partly fitness-biased re-expansion and re-diversification towards hepatocytic-like states, also captured in two longitudinal patient cases. Pseudotime and dynamical-landscape analyses reveal a plasticity-proliferation axis underlying recovery, where persister cells occupy an arrested-plastic state, exited to restart proliferation. Chromatin and regulatory analyses identify the E2F target BIRC5 (survivin) as a key node in this axis, epigenetically primed post-recovery. BIRC5 maintains hepatocytic-like states, and its knockdown shifts cells toward progenitor-like phenotypes, while pharmacological inhibition selectively eliminates cisplatin-tolerant persisters. These findings position BIRC5 as a regulator of plasticity-driven adaptation and a candidate vulnerability in the minimal-residual disease window.", "authors": "Chen, E.; English, C.; Allo Anido, A.; Sadat Sadr, A.; Miravet-Marti, M.; Zanatto, L.; Castaneda Moreno, A. M.; Hamer, S.; Inderise, E.; Armengol, C.; Sancho-Bru, P.; Cairo, S.; Bruna, A.", "date": "2026-10-07", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5995, "score_semantic": 0.5995, "score_lexical": 0.7764, "matched": ["clonal evolution", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.1101/2025.10.13.682004", "title": "AP-1 Primes Transcriptional Noise-Led Cancer Treatment Adaptation Through KDM5 Chromatin Rewiring", "abstract": "How drug-tolerant persister (DTP) cells escape quiescence to drive tumour relapse remains a central unresolved question in cancer evolution. Here, we use neuroblastoma and hepatoblastoma, paediatric cancers with low genetic instability, as tractable model systems to study the principles and molecular mechanisms key in the early stages of adaptation to treatment. We identify transcriptional noise, the stochastic variability in gene expression, as a latent cellular property amplified post-treatment, during awakening from persistence, which drives adaptive regrowth following therapy withdrawal. Through functional assays, lineage tracing and single-cell multiomics, we show that treatment enriches for progenitor-like tolerant states with limited detectable clonal selection. Upon drug withdrawal, awakening proceeds via a stochastic process driven by noise-enabled plasticity in cell identity programmes. Mechanistically, AP-1-bound chromatin states emerge post-treatment, and AP-1 activity primes KDM5A recruitment to cell-state identity genes during awakening, driving H3K4me3 peak narrowing at their promoters and an increase in transcriptional noise that enables MES-to-ADRN plasticity. Pharmacological or genetic inhibition of AP-1 or KDM5 activity suppresses transcriptional noise and phenotypic plasticity, blocks DTP exit and prevents tumour recovery in both neuroblastoma and hepatoblastoma models. Together, these results identify KDM5-mediated transcriptional noise, operating within AP-engaged chromatin landscapes, as a key driver of early adaptation to treatment. Targeting this axis offers a strategy to exploit DTP awakening as an evolutionary bottleneck to prevent treatment adaptation and cancer relapse.", "authors": "Allo Anido, A.; Roux, C.; Sadr, A. S.; Hamer, S.; Chen, E.; Shea, A.; English, C.; Butterworth, C.; Che, H.; Bellini, A.; Geoerger, B.; Schleiermacher, G.; Chesler, L.; Morgan, M. D.; Bruna, A.", "date": "2026-10-07", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5968, "score_semantic": 0.5968, "score_lexical": 0.7341, "matched": ["clonal evolution", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.07.09.737611", "title": "Spatial mitochondrial lineage tracing uncovers a premetastatic niche and microenvironment programmed fate switching in osteosarcoma", "abstract": "Osteosarcoma progression involves complex spatiotemporal dynamics, yet the lineage relationships underlying tumor cell fate decisions remain poorly understood. Here we integrate single cell and spatial transcriptomics and mitochondrial variants-based lineage tracing to map the evolution of a late-stage, non-metastatic osteosarcoma. Single cell pseudotemporal reconstruction of malignant cells reveals a stepwise cascade of transcriptional programs that are associated with bifurcation of COL3A1+ progenitors into ALPL+ osteoblastic and THY+ mesenchymal lineages. Critically, we demonstrate that the metastatic THY1+ mesenchymal cell fate is not governed by cell-autonomous transcriptional programs alone; this pro-tumorigenic state is associated with spatial co-localization with PLVAP+ dysfunctional endothelia to form a pro-metastatic niche (THY1_Endo) enriched for PTN/NOTCH signaling. To distinguish clonal ancestry from microenvironmental plasticity, we leveraged spatially resolved somatic mitochondrial variants as endogenous lineage tracers. A spatial autocorrelation filter confirmed significant clonal spatial coherence (Z = 10.07, p {approx} 4 x 10-24). Phylogenetic reconstruction using a Wright-Fisher drift model coupled with a hidden Markov tree (WF-HMT) identified COL3A1+ cells as the ancestral tumour state with ALPL+ and THY1+ states acquired repeatedly and independently across the phylogeny. We propose a \"time-space-lineage\" relay model where sequential microenvironmental signals are associated with tumor cell fate and pre-metastatic niche assembly through clonal commitment. This multi dimensional framework bridges single cell states, spatial organization, temporal dynamics, and clonal ancestry - underscoring the power of somatic mitochondrial variants to resolve clonal history and intercept cancer evolution.", "authors": "Xue, Y.; Su, Z.; Su, J.; Chu, A. S.; Yu, H.; Wan, L.; Chen, M.; Lin, Y.; Cheung, J. P. Y.; Cheung, K. S. C.; Ho, J. W. K.", "date": "2026-10-08", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5702, "score_semantic": 0.5702, "score_lexical": 1.0, "matched": ["tumor evolution", "clonal evolution", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.10.06.757145", "title": "Crowding governs resistance confinement and guides the improvement of adaptive therapy in a 2D melanoma model system", "abstract": "The emergence of treatment resistant mutants is one of the primary contributors to therapy failure in cancer. Evolution-based adaptive therapies aim to exploit the competition between sensitive and resistant cells to prolong therapeutic control. However, in the densely packed tissues of solid tumors, competition is not only determined by cell-intrinsic factors but also a result of local physical interactions between neighboring cells. The successful development of physics-informed adaptive therapies therefore hinges upon the bottom-up integration of tissue mechanics and experimentally grounded models of tumor evolution. Here, we show how population-level treatment response emerges from mechanical interactions between individual cells. Combining genetically tailored therapy-mimicry experiments in spatially structured 2D melanoma colonies with mechanistic, particle-based tissue simulations as digital twins in a real-to-sim-to-real framework, we reveal how treatment-induced changes in mechanical crowding shape a cascade of resistance expansion, spatial competitive escape, and consequent therapy failure. We then link these underlying physical mechanisms to population-level observables in an abstracted mathematical model for reinforcement-learning-based therapy optimization and a distilled treatment-decision-heuristic, which we test experimentally. Together, our results identify mechanical crowding and escape as governing principles of resistance-mediated therapy failure in solid tumours and provide a basis for mechanistically informed, evolution-based treatment strategies.", "authors": "Kayser, J.; Eiche, M.; Fischer, E. F.; Smith, A.-S.; Milas, M.; Citak, T.; Aif, S.", "date": "2026-10-09", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5586, "score_semantic": 0.5586, "score_lexical": 0.7322, "matched": ["tumor evolution", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.10.06.756936", "title": "Loss of the Y chromosome drives basal identity and metastatic potential via epigenetic reprogramming in pancreatic cancer", "abstract": "Loss of the Y chromosome (LOY) has been largely unexplored in pancreatic ductal adenocarcinoma (PDAC), and no mechanistic framework previously explained its role in tumor biology. We identify LOY as a recurrent, functionally consequential alteration affecting ~50% of male PDAC patients across two independent cohorts, with strong enrichment in advanced disease and, critically, in the basal subtype, establishing LOY as a clinically actionable biomarker. Comprehensive genomic profiling positions LOY as a distinct genetic event associated with TP53 mutations, implicating it in aggressive tumor evolution. Integrative analyses across bulk tumors, single-cell datasets and CRISPR-engineered PDAC models converge on epithelial-to-mesenchymal transition (EMT) as the dominant LOY-driven program. Y-chromosome deletion alone induces EMT transcriptional states, mesenchymal morphology and enhanced metastatic ability. Mechanistically, LOY disrupts epigenetic regulation through loss of Y-linked chromatin modifiers, reshaping DNA methylation at EMT- and basal-defining loci and reducing chemotherapy sensitivity. These findings establish LOY as a causal genetic driver of PDAC progression and a clinically accessible biomarker with direct therapeutic relevance.", "authors": "Dorsch, M.; Beaudry, F. E. G.; Baginska, A. K.; Meyer, N.; Petzold, A.; Zhao, P.; Otero-Carrasco, B.; Aliar, K.; Urban, S.; Zummack, J.; Jung, J.; Hölken, J. M.; Duan, N.; Godfrey, L.; Chen, M.-j. M.; Schlüter, K.; Ganesan, K.; Over, F.; Kono, T.; Schildhaus, H.-U.; Steiger, K.; Schwarz, R.; Hessmann, E.; Schneider, G.; Siveke, J. T.; Neoptolemos, J. P.; Peccerella, T.; Llamazares-Prada, M.; Schramm, A.; Plass, C.; Rambow, F.; Notta, F.; Grünwald, B. T.; Grüner, B. M.", "date": "2026-10-07", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5524, "score_semantic": 0.5524, "score_lexical": 0.8013, "matched": ["tumor evolution", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.10.04.756617", "title": "A long-term organotypic slice culture model of patient high-grade glioma preserving tumor heterogeneity and architecture, and specificity of CAR T cell targeting", "abstract": "ABSTRACT Background: High grade glioma (HGG), encompassing IDH-wildtype glioblastoma (CNS WHO grade 4), diffuse midline glioma (CNS WHO grade 4), oligodendroglioma (IDH-mutant and 1p/19q-codeleted) CNS WHO grade 3, together with IDH-mutant astrocytoma of CNS grade 3 and grade 4, represents the most lethal group of adult diffuse gliomas. Despite significant efforts, obtaining improvements in patient survival has been limited, in part, by difficulties in comprehensive ex vivo modeling of the complexities of HGG. Although organotypic slice cultures and other platforms have shown promise, existing models often fail to capture the intrinsic cellular heterogeneity, microenvironment, and architecture of HGG, restricting investigations into their fundamental biology as well as design of novel therapeutics. Methods: We developed a patient-derived HGG organotypic slice culture (GOSC) platform demonstrating long-term preservation of intrinsic tumor characteristics. Vibratome-sectioned slices were cultured in defined medium under conditions approximating those in situ: reduced oxygen (4%), low glucose (2.5 mM), and no added growth factors. The characteristics of GOSCs after 28 days in culture, including expression of immunotherapy targets, were compared to parental tumors using histological staining, immunofluorescence, multiplexed PhenoCycler (CODEX) imaging, bulk RNA-seq expression profiling, and CAR T cell killing assays. Results: GOSCs preserved the histopathology, cell heterogeneity, tumor microenvironment, and tissue architecture of their parental tumors throughout at least 28 days in culture. Importantly, GOSCs retained parental patterns of immunotherapy target expression, and CAR T cells co-cultured with GOSCs demonstrated target-specific killing consistent with parental tumors. Conclusions: This ex vivo GOSC platform offers long-term preservation of the cellular and structural properties of parental HGG tumors, thereby providing a robust tool for extended preclinical studies, and facilitating development and evaluation of advanced tumor-targeting strategies.", "authors": "Wang, S.; Ouyang, C.; Zook, H. N.; D'Apuzzo, M.; Ku, H. T.; Wu, X.; Baker, A. S.; Hao, Y.; Brewster, B.; Berens, M.; Badie, B.; Brown, C. E.; Barish, M. E.", "date": "2026-10-06", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5401, "score_semantic": 0.5401, "score_lexical": 0.6413, "matched": ["histopathology"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.10.07.757464", "title": "scPRIME-seq uncovers synchronized multimodal molecular collapse facilitated by pre-neoplastic epigenetic burden in prostate cancer", "abstract": "Tumorigenesis involves alterations across the genome, epigenome and transcriptome, yet how these layers interact to drive malignant transformation remains unclear, largely due to the lack of scalable multimodal single-cell approaches. Here, we developed scPRIME-seq, a high-throughput platform for simultaneous single-cell profiling of transcriptome, genome and DNA methylome, and applied it to 436,908 cells from 29 prostate cancers and 15 benign tissues. This multimodal atlas resolved dynamic changes across 30 cell types and a unified tumorigenic trajectory. Integrated analysis revealed a cell-state transition tipping point, where the onset of aneuploidy is temporally coupled with global methylomic alterations and transcriptomic rewiring. Early focal epigenetic alterations, including TMEM106A promoter hypermethylation and the emergence of hypomethylated domains, were present in founder aneuploid clones and benign tissues, indicating a pre-neoplastic origin of epigenetic burden. These pre-neoplastic alterations coincide with transcriptomic changes that affect epithelial interactions with stromal and immune compartments, promoting a putative tumor-permissive microenvironment. scPRIME-seq provides a high-throughput multimodal framework for identifying conserved, cell-intrinsic molecular programs underlying tumorigenesis.", "authors": "Li, S.; Liu, Z.; Xie, Y.; Ma, X.; Tan, M.; Wang, X.; Ye, H.; Wu, D.; Huang, S.; Li, Z.", "date": "2026-10-09", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5368, "score_semantic": 0.5368, "score_lexical": 0.753, "matched": ["aneuploidy", "cancer"]}, {"id": "https://doi.org/10.1016/j.molcel.2026.09.017", "title": "A genome-scale adaptation map identifies the FANCM-RMI1/2 complex as an opposing modulator of cell fitness upon BRCA1 or BRCA2 loss.", "abstract": "Cancer cells lacking BRCA1 or BRCA2 must adapt to proliferate despite pervasive genomic instability. To delineate BRCA1- and BRCA2-specific adaptation landscapes, we developed an isogenic screening platform enabling acute depletion of either protein. Genetic interaction profiling revealed hundreds of genes with shared, distinct, or opposing effects in the two BRCA-deficient states. We identified FANCM as essential in BRCA1-deficient cells. Conversely, FANCM is toxic in BRCA2-deficient cells, where it promotes replication fork degradation through RMI1/2 recruitment and sensitizes cells to PARP inhibition. FANCM loss restored fork integrity and alleviated genomic instability and proliferation defects without restoring homologous recombination or suppressing single-stranded DNA (ssDNA) gaps. Finally, we report a FANCM variant that disrupts RMI1/2 binding in a BRCA2m breast cancer patient that is associated with PARP-inhibitor resistance. These findings define fundamentally distinct adaptive routes to BRCA1 and BRCA2 loss and establish FANCM-RMI1/2 as a determinant of mutation-specific vulnerabilities and therapeutic responses.", "authors": "Dossin F, Attia M, Montero Zúñiga F, González-Acosta D, Brough R, Song FF, Krastev DB, Raghunandan M, Pettitt SJ, Boré A, Vaysse A, Margueron R, Lopes M, Tutt ANJ, Lord CJ, Deriano L", "date": "2026-Oct-06", "source": "PubMed", "journal": "Molecular cell", "if": 14.5, "score": 0.5279, "score_semantic": 0.5279, "score_lexical": 1.0, "matched": ["genomic instability", "cancer"]}, {"id": "http://arxiv.org/abs/2610.12574v1", "title": "Scaling Multi-Teacher Distillation for Digital Pathology", "abstract": "Multi-teacher distillation allows transferring knowledge from multiple \"teacher\" networks to a single \"student\" network. This method is promising in fields such as digital pathology, where many powerful foundation models were proposed recently. However, as we show in this paper, the standard multi-teacher distillation approach reacts poorly to an increase in the number of teachers used to train a student encoder. We demonstrate that learning teacher-specific representations is a key to scaling in MTD. Importantly, different design choices, such as learnable teacher tokens, a tailored attention scheme, additional mixture-of-experts layers and a contrastive loss, are proposed to better learn such teacher-specific representations. We show that our method better scales with respect to the number of considered teachers, allowing us to train compact student encoders, up to 10x more efficient than larger teacher foundation models, while matching their performance and even outperforming them on a large set of tile-level and slide-level tasks. We conduct a thorough empirical validation, evaluating more than 10 foundation models on 39 tasks spanning tile and slide levels. As a result, we release a new collection of strong and efficient foundation models, named OMNI, trained from the knowledge of 10 state-of-the-art foundation models. We finally conduct an analysis of the learned teacher-specific representations, highlighting their complementarity and explaining why they can be easily aggregated at downstream time.", "authors": "Sofiène Boutaj, Pierre Marza, Varun Belagali, Dimitris Samaras, Maria Vakalopoulou, Stergios Christodoulidis", "date": "2026-10-08", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.5175, "score_semantic": 0.5175, "score_lexical": 1.0, "matched": ["digital pathology"]}, {"id": "https://doi.org/10.1158/0008-5472.CAN-25-5027", "title": "The HDAC8-U2AF1 Axis Dysregulates DNA Damage-Responsive RNA Splicing and Creates Targetable Vulnerabilities in Acute Myeloid Leukemia.", "abstract": "Despite recent treatment advances using targeted therapies, acute myeloid leukemia (AML) remains a highly lethal disease. Mechanism-based biomarker-informed therapies could expand therapeutic options and enable rational combination strategies. Here, we demonstrated that HDAC8 impairs DNA repair and confers therapeutic vulnerabilities in AML. Analysis of AML patient datasets revealed that HDAC8 is overexpressed in more than half of cases and is associated with dysregulated DNA damage response (DDR) gene expression. Elevated HDAC8 expression induced DNA damage phenotypes and compromised homologous recombination (HR)-mediated repair. Mechanistically, HDAC8 regulated acetylation of the splicing factor U2AF1, which blocked DNA repair by regulating RNA splicing. In response to DNA damage, the acetyltransferase TIP60 acetylated U2AF1 at lysines 23 and 175, modifications required for the interaction of U2AF1 with BRCA1 and BCLAF1 within a DDR-associated spliceosomal complex. HDAC8 promoted the removal of these acetyl groups, disrupting U2AF1-BRCA1-BCLAF1 complex formation and altering DDR-associated RNA splicing. Consequently, HDAC8 hyperactivity drove widespread RNA splicing dysregulation, defective HR repair, and increased sensitivity to both splicing modulators and PARP inhibitors. In preclinical models, including patient-derived xenografts, the splicing modulator H3B-8800 and the PARP inhibitor talazoparib reduced leukemia burden and leukemia stem cell activity, with enhanced efficacy observed in combination. In inv(16)(p13q22) AML, the CBFβ::SMMHC fusion protein exploited the HDAC8-U2AF1 axis to promote genomic instability. These findings identify the HDAC8-U2AF1 axis as a mechanistic driver of DDR dysfunction and genomic instability and uncover actionable, biomarker-informed therapeutic vulnerabilities in HDAC8-high AML.", "authors": "Zhang L, Fu YH, Hua WK, Chen YC, Nguyen LXT, He X, Guo W, Zhu Y, Tseng CY, Chen Z, Dong H, Zhang L, Zhang B, Stark JM, Li L, Marcucci G, Kuo YH", "date": "2026-Oct-08", "source": "PubMed", "journal": "Cancer research", "if": 11.2, "score": 0.5124, "score_semantic": 0.5124, "score_lexical": 0.891, "matched": ["genomic instability"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.10.06.757201", "title": "The impact of sex and ancestry on the molecular landscape of pancreatic adenocarcinoma", "abstract": "Background: Pancreatic ductal adenocarcinoma (PDAC) is projected to become the second leading cause of cancer-related mortality, with an increasing incidence and dismal 10% survival at 5 years despite best available care. PDAC is characterized by low tumour cellularity, recurrent driver mutation alterations, and substantial inter and intra-tumoural heterogeneity. The influence of individual genetic features such as sex and ancestry on tumour heterogeneity remains poorly understood. Methods: We assembled a cohort of PDAC across five datasets for a total of 7,527 tumours. Measures of genomic instability were assessed across sex and ancestry on a global level (SNV density and percent genome altered by copy number events), and at a gene level for recurrent events. KRAS variant frequencies, ploidy and mRNA abundance were also evaluated. Ancestry was assigned using ADMIXTURE from germline genotypes where available, and patient reported otherwise. Results: We observed ancestry-specific mutation patterns in global point mutation density, with higher SNV burden in African PDAC tumours and lower SNV burden in Asian PDAC tumours as compared to European tumours. We also identified an ancestry bias in the driver gene, GNAS, in which driver SNVs in GNAS was detected more frequently in those of Asian ancestry, and less frequently in those of African ancestry. No sex- or ancestry-associations were found for KRAS, but individual KRAS variants showed a trend towards ancestry-related variation. Conclusions: These findings demonstrate that ancestry contributes to the genomic heterogeneity of PDAC, shaping both global and gene-specific mutation patterns. This work underscores the importance of including diverse ancestries in PDAC molecular profiling efforts which may inform the development of tailored molecular diagnostics and targeted therapies.", "authors": "Chen, C. Y.; Arbet, J. Y.; Zhu, C.; Oh, J.; Boutros, P. C.", "date": "2026-10-08", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5073, "score_semantic": 0.5073, "score_lexical": 0.602, "matched": ["genomic instability", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.10.07.26364687", "title": "Hiporfin (HpD) for fluorescence-guided resection of recurrent glioblastoma: diagnostic accuracy and feasibility of an integrated photodynamic strategy", "abstract": "Background. Hematoporphyrin derivative (HpD, Hiporfin) is used for photodynamic therapy (PDT) of solid tumors but had never been evaluated for fluorescence guided resection (FGR) in glioma. We assessed Hiporfin fluorescence accuracy against histopathology in recurrent glioblastoma (rGBM) and the feasibility of adding cavity PDT to FGR. Methods. In this prospective single arm series, adults with rGBM received a single preoperative intravenous Hiporfin dose of 5 mg/kg before FGR under blue light excitation and 630 nm cavity PDT. Intraoperative fluorescence assessment was the index test and histopathology the reference standard. Specimen level diagnostic accuracy was pooled with bivariate random-effects modeling. Results. Of 63 specimens, 35 were true positive, 7 false positive, 8 false negative and 13 true negative. Pooled sensitivity was 0.751 (95% confidence interval 0.600 to 0.858) and specificity 0.606 (0.407 to 0.775); the crude positive predictive value was 0.833 (0.694 to 0.917) and the negative predictive value 0.619 (0.409 to 0.792). All seven false positive specimens were peritumoral tissue and the eight false negatives were non fluorescent tumor. FGR combined with cavity PDT was completed in all six patients without new neurological deficits. Conclusions. Hiporfin fluorescence identified rGBM with moderate accuracy: fluorescent regions were likely tumor, while non fluorescent tissue often still contained tumor. The main source of error was peritumoral tissue of the treated cavity, and not the drug or the optics. Hiporfin is a new fluorescence agent for glioma. One drug provides both fluorescence guidance during resection and immediate cavity PDT.", "authors": "He, Z.; Zhang, G.; Wang, C.; Wu, L.; Hu, W.; Duan, H.; Chen, Y.; Lu, J.; Yuan, Z.; Zhang, X.; Mou, Y.", "date": "2026-10-09", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.5049, "score_semantic": 0.5049, "score_lexical": 0.9828, "matched": ["histopathology"]}, {"id": "http://arxiv.org/abs/2610.05987v1", "title": "Label-Free Coreset Selection with Foundation Models for Efficient Annotation in Computational Pathology", "abstract": "Computational pathology has the potential to improve clinical outcomes through a demonstrated increase in diagnostic and prognostic accuracy. However, the development and validation of deep learning algorithms still require annotated data, a costly procedure involving expert pathologists who already face critical workforce shortages. Existing coreset selection methods to optimize annotation efforts currently all rely on hyperparameters tuned on natural-image benchmarks that do not transfer to histopathology and are cumbersome to use in clinical practice. In this study, we present GCcore, a novel label-free coreset selection method that embeds every image of a dataset with any pathology foundation model and greedily selects the samples that collectively maximize the global coverage of the embedding space. The proposed method provides a lower-bound guarantee on the global coverage of the returned coreset for any coreset size, while being completely hyperparameter-free and deterministic. We demonstrate GCcore's superior performance over 14 baselines including state-of-the-art methods across 10 tasks and datasets spanning whole slide image classification, tile classification, and tissue segmentation, where it ranks first on six and within the top three on nine, while also demonstrating how existing methods can shift by up to five rank positions depending on their hyperparameter settings. Code is publicly available at https://github.com/OncoAI-ULBHUB/GCcore.", "authors": "Tuo Yin, Jennifer Dhont", "date": "2026-10-05", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.5038, "score_semantic": 0.5038, "score_lexical": 0.7413, "matched": ["histopathology"]}, {"id": "https://doi.org/10.1158/0008-5472.CAN-26-0389", "title": "Aberrant Accumulation of Cyclin D1 Rewires Glutamine Metabolism and Generates a Metabolic Vulnerability in Squamous Cell Carcinoma.", "abstract": "Excessive cyclin D1 accumulation is a frequent oncogenic event in head and neck squamous cell carcinoma (HNSCC) and esophageal squamous cell carcinoma (ESCC). Although classically associated with enhanced proliferation and genomic instability, we revealed that cyclin D1 dysregulation induces metabolic rewiring that leads to unexpected metabolic dependencies. Sustained nuclear retention of cyclin D1 drove metabolic reprogramming through activation of CDK4/6 and downregulation of mitochondrial isocitrate dehydrogenase 3 (IDH3), reducing α-ketoglutarate and NADH production. This metabolic alteration increased glutamine dependence and elevated autophagic flux, and co-targeting autophagy and glutamine metabolism suppressed the growth of squamous cell carcinoma models in vitro and in vivo. Together, these findings highlight a therapeutic strategy for HNSCC and ESCC that leverages metabolic reprogramming induced by dysregulated cyclin D1/CDK4 activity, with potential applicability to patients with tumors refractory to conventional therapies.", "authors": "Zhang S, Phillips-Mason PJ, Mucha B, Farago M, Zhang G, Martin C, Klein-Szanto AJ, Nakagawa H, Rustgi AK, Wong KK, Henick BS, Diehl JA", "date": "2026-Oct-05", "source": "PubMed", "journal": "Cancer research", "if": 11.2, "score": 0.4962, "score_semantic": 0.4962, "score_lexical": 0.7743, "matched": ["genomic instability"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.10.02.756347", "title": "Genomic classification and immune profiling define mucosal melanoma", "abstract": "Mucosal melanoma is a rare, lethal melanoma subtype with distinct genetics and limited benefit from immunotherapy. To define features associated with mucosal melanoma clinical outcomes, we assembled a large, multimodally profiled cohort spanning primary and metastatic disease. Compared with cutaneous melanoma, primary mucosal melanoma showed greater genomic heterogeneity, ploidy and aneuploidy, and a more dedifferentiated, proliferative transcriptional state. Analysis of genomic sequencing of 339 patients with mucosal melanoma identified four mutually exclusive genomic subtypes: CDK4/MDM2/CCND1, SF3B1-mutated, TP53/ATRX, and mucosal melanoma Triple WT, associated with distinct anatomic sites but similar outcomes. In the tumor microenvironment, we observed reduced T cell infiltration and increased CD163+ tumor-associated macrophages in mucosal melanoma relative to cutaneous melanoma. In matched longitudinal samples, CD163+ tumor-associated macrophages increased with disease progression and immunotherapy resistance. CD163+ tumor-associated macrophages engaged non-regulatory T cells through GAL9-TIM-3 interactions, nominating TIM-3 blockade as a therapeutic strategy for mucosal melanoma. These findings define the distinct aggressive biology of mucosal melanoma and highlight potential therapeutic targets and mechanisms of immune resistance.", "authors": "Shi, Y.; Sharma, P.; Lin, J.-r.; Dedeilia, A.; Taratino, G.; Pelletier, R.; Lopez, M. L.; Aygun, N.; Manos, M. P.; Lawless, A. R.; Cohen, S.; Lu, Y. D.; Roelofs, M. K.; Pant, S. M.; Chen, J.; Fisher, D. E.; Beroukhim, R.; Lian, C. G.; Buchbinder, E. I.; Sorger, P. K.; Insco, M.; Liu, D.; Boland, G.", "date": "2026-10-06", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4813, "score_semantic": 0.4813, "score_lexical": 0.7636, "matched": ["aneuploidy"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.10.06.757108", "title": "Single-Cell Sequencing in Pediatric Acute Leukemia: A Systematic Review of Biologic Insights and Translational Potential", "abstract": "Background: Relapse remains the principal cause of treatment failure in pediatric acute leukemia. Clinically validated minimal residual disease (MRD) assays - multiparameter flow cytometry, immunoglobulin/T-cell-receptor rearrangement sequencing, and targeted next-generation sequencing panels -- are highly sensitive but read out predefined features and do not reconstruct clonal architecture or link a cell's genotype to its functional state. We systematically reviewed what single-cell sequencing has revealed about clonal evolution, chemoresistance, the immune microenvironment, and post-therapeutic immune dynamics in this disease. Methods: This review followed PRISMA 2020. PubMed/MEDLINE, the Cochrane Library, and Google Scholar were searched to September 2026 for primary studies applying single-cell DNA, RNA, chromatin-accessibility, surface-protein, or immune-repertoire sequencing to pediatric acute leukemia samples or pediatric-derived models. Risk of bias in non-randomized studies was assessed with ROBINS-I. Because designs, platforms, and outcomes were heterogeneous, findings were synthesized narratively by biologic theme without meta-analysis, following the SWiM guideline. Results: Of 63 records identified, 10 studies were included (published 2016-2026; 6-159 patients or samples per study; up to ~700,000 cells profiled). Single-cell DNA sequencing traced minor NOTCH1-mutant diagnostic subclones into PTEN- or TP53-mutant relapse clones that bulk sequencing missed. Rare dormant, label-retaining cells and developmental-state-dependent drug sensitivity defined chemoresistant compartments. Remodeling of the bone marrow immune microenvironment identified patients with adverse outcome among those classified as MRD-low, and pre-infusion CAR T-cell type 2 functionality and post-transplant cytotoxic memory CD8+ T-cell subsets were associated with durable remission. Of the seven studies assessed with ROBINS-I, four were at moderate and three at serious overall risk of bias, driven chiefly by small, selected cohorts. Conclusions: Single-cell sequencing yields mechanistic insight that complements, rather than replaces, clinically validated MRD assays, and nominates candidate biomarkers for risk stratification, treatment selection, cell-therapy manufacturing, and post-transplant monitoring. The evidence remains preliminary; adequately powered, prospective, and harmonized studies are required before clinical adoption.", "authors": "Martelli, J.; Martelli, J.", "date": "2026-10-07", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.476, "score_semantic": 0.476, "score_lexical": 0.6036, "matched": ["clonal evolution"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.10.07.26364402", "title": "Large Language Models for Structured Information Extraction from German Histopathology Reports - Hepatocellular Carcinoma", "abstract": "Background: Clinical registries and institutional quality control (QC) in pathology heavily depend on complex histopathological data. However, critical tumor characteristics are mostly locked in unstructured free-text reports. We hypothesize that locally deployed, resource-efficient language models operating within a secure institutional network can reliably extract relevant variables from German reports of hepatocellular carcinoma (HCC), thereby enabling automated data curation without transferring sensitive patient data. Methods: We developed a local, privacy-preserving open-weight Large Language Model (LLM) pipeline consisting of two consecutive stages: Stage 1 utilizes a lightweight gatekeeper model to isolate the target cohort of confirmed Hepatocellular Carcinoma cases from a screening pool of N = 2,864 reports. Stage 2 deploys a high-capacity model to extract 15 predefined histopathological variables, including tumor-node-metastasis staging, histological grading, vascular invasion, and selected immunohistochemical features into structured JSON format. For both Stages, pipeline performance was evaluated using Accuracy, Macro F1-scores, and Cohen's kappa compared to expert-curated reference annotations. Results: The top-performing Stage 1 gatekeeper isolated the target patient cohort with zero classification errors, effectively reaching complete agreement with the reference standard (ground truth) and correcting inaccurate administrative metadata. For Stage 2 feature extraction, current-generation models demonstrated robust structural reliability, reducing the burden of manual post-processing. The 31B model configuration (Gemma 4) virtually eliminated objective factual errors, achieving near-perfect agreement with the reference standard (Macro F1 > 0.99). Conclusion: Local two-stage pipelines offer a highly accurate, resource-efficient, and secure solution for clinical text processing. This framework serves as a privacy-preserving engine for institutional quality control and the scalable curation of pathology registries.", "authors": "Koch, N.; Hartmann, N.; Maennel, A.; Baretton, G.; Aust, D.; Hoenscheid, P.", "date": "2026-10-08", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.4589, "score_semantic": 0.4589, "score_lexical": 0.6703, "matched": ["histopathology"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.10.05.756661", "title": "Mutation-biased adaptation: The Yampolsky-Stoltzfus model revisited", "abstract": "The Yampolsky-Stoltzfus (YS) model provided the first formal demonstration that a bias in the introduction of new mutations can shape the direction of adaptive evolution, even when mutation rates are small relative to selection coefficients. Despite its foundational role, the model has been characterized almost entirely by simulation and closed-form solutions for its central quantity, the probability PA that a mutationally favored but less-fit genotype fixes ahead of a rarer, fitter alternative, have been available only in the limiting regimes of vanishing mutation supply and infinite population size. Here we derive closed-form approximations for PA across the intermediate regime of finite population size and appreciable mutation supply that lies between these two limits. Under strong selection between the competing mutants, we combine an establishment-probability argument with clonal interference theory to obtain an explicit expression for PA that accounts for both the ongoing input of the mutationally favored mutation and the frequency-dependent establishment probability of its competitor. Under weak selection between competing mutants, we derive a complementary expression based on the fixation of a mixed population under Kimura's classical formula. Both expressions agree closely with direct simulation of the underlying Wright-Fisher process, recover the known limiting cases, and remain consistent with one another over a substantial intermediate range of parameters. These results are expected to provide a basis for assessing how the strength of mutation bias affects adaptation in empirical data.", "authors": "Park, S.-C.; Krug, J.", "date": "2026-10-07", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4571, "score_semantic": 0.4571, "score_lexical": 0.7164, "matched": ["clonal evolution"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.10.01.756008", "title": "Overexpressing FLP Recombinase Can Cause Synaptic Trafficking Defects in C. elegans", "abstract": "Site-specific recombinases, such as Cre recombinase (Cre) and FLP recombinase (FLPase), are popular tools that enable precise spatiotemporal control over fluorescent reporter genes. However, studies show that increased Cre expression can lead to cytotoxic phenotypes including DNA damage, cell cycle arrest, cell death, and aneuploidy. In contrast, there is little-to-no known cytotoxicity associated with FLPase. FLPase is considered to be the safer, if less efficient, recombinase. To compensate for decreased efficiency, researchers will often increase expression of the FLPase to ensure a complete gene edit. Despite previous evidence that FLPase is nontoxic at high doses, we report that high expression of FLPase from multi-copy extrachromosomal arrays can disrupt synaptic protein trafficking in C. elegans. We discovered several off-target effects of high FLPase expression including mislocalization of the pre-synaptic marker FLPon::mScarlet::SYD-2 and decreased synaptic abundance, transport, and expression of the ionotropic glutamate receptor subunit GLR-1. Neither overexpression of an inactive FLPase, low activity FLPase, nor mCherry under the same promoter elicited these effects. However, single-copy expression of the FLPase construct reliably tags FLPon::mScarlet::SYD-2 and does not lead to these off-target effects. This work supports growing awareness that tyrosine recombinases can become cytotoxic at high doses.", "authors": "Lenninger, Z. A.; Hoerndli, F. J.", "date": "2026-10-06", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4396, "score_semantic": 0.4396, "score_lexical": 0.7133, "matched": ["aneuploidy"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.10.05.26364184", "title": "Generalizing Amyloid β Pathology from Postmortem Human Brains with Vision Foundation Models for Lesion Quantification", "abstract": "BackgroundTraditional neuropathological assessment of Alzheimers disease (AD) relies on manual, semiquantitative scoring of amyloid-beta (A{beta}) pathology. This approach is essential for diagnosis and staging but reduces a continuous and spatially heterogeneous process to ordinal categories and does not capture lesion level variation in plaque and vascular A{beta}. Amyloid PET enables longitudinal in vivo assessment but it has a limited dynamic range and lacks the sub-millimeter spatial resolution to resolve microscopic plaque morphologies or vascular compartments.  MethodsWe developed ViTamyloid, a generalizable modular computational pathology pipeline for high throughput segmentation and classification of A{beta} pathology in digital histological slides of postmortem human brain tissue. In Stage 1, a pathologist supervised framework combining an EfficientNet B4 encoder with a U-Net decoder and a complementary Faster R CNN generated binary segmentation masks and separated confluent lesion candidates. In Stage 2, a frozen high resolution UNI2 h computational pathology foundation model paired with a trainable ViT Adapter classified candidates into five categories: classic cored plaques (CCP), coarse grained plaques (CGP), capillary cerebral amyloid angiopathy (CAA Type 1), parenchymal or leptomeningeal CAA (CAA Type 2), and Diffuse or other A{beta} positive pathology. We evaluated donor disjoint classification performance, tested generalizability across independent datasets with different antibodies, scanners, resolutions, and image quality, and deployed the pipeline across 1,630 whole slide images from two brain banks.  ResultsThe ViTamyloid achieved a donor disjoint macro F1 of 0.903. AUPRC and AUROC were 0.964 and 0.994 for CCP, 0.947 and 0.990 for CGP, 0.970 and 0.990 for CAA Type 1, and 0.974 and 0.996 for CAA Type 2. The adapted classifier outperformed frozen UNI2 h features alone, which achieved a macro F1 of 0.795. Across independent reference datasets, ViTamy-loid showed higher performance than the published pipelines Amyloid-YOLO and PlaqueBox, with nominally significant differences in 26 of 32 paired comparisons.  ConclusionViTamyloid provides a scalable framework for converting A{beta} immunohistochemistry into continuous, lesion resolved measurements of plaque and vascular pathology. By preserving lesion identity, morphology, and spatial information, the framework can support studies of AD heterogeneity, clini-copathologic relationships, biomarker concordance, and treatment response.", "authors": "Chen, Y.; Boon, B. D. C.; Engelberg-Cook, E.; Zhu, L.; Rothberg, D.; Rozemuller, A.; Grinberg, L. T.; Ushizima, D.", "date": "2026-10-07", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.429, "score_semantic": 0.429, "score_lexical": 0.564, "matched": ["digital pathology"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.10.07.26364964", "title": "Longitudinal multi-omics profiling of tofacitinib response identifies a pre-existing Janus kinase-tractable inflammatory state in ulcerative colitis", "abstract": "BO_SCPLOWACKGROUNDC_SCPLOWO_SCPCAP C_SCPCAP& OO_SCPLOWBJECTIVEC_SCPLOWTofacitinib, a Janus kinase (JAK) inhibitor, is approved for ulcerative colitis (UC). We investigated baseline and longitudinal transcriptomics and proteomics in intestinal biopsies, peripheral blood, and serum from UC patients starting tofacitinib to characterize treatment-associated effects and identify which molecular compartment harbors the most predictive response-associated biomarkers.  MO_SCPLOWETHODSC_SCPLOWIn this prospective, open-label study, patients with moderately to severely active UC started tofacitinib 10 mg BID for eight weeks. Clinical, biochemical, endoscopic, and histological data were collected at baseline and week 8. The primary outcome, histo-endoscopic mucosal improvement (HEMI), was defined as endoscopic Mayo subscore [&le;]1 with histologic remission (Robarts Histopathology Index [&le;]3, no mucosal neutrophils). Mucosal biopsies and peripheral blood were collected at baseline and week 8 for bulk RNA-sequencing (RNA-seq); biopsies and serum underwent proteomic profiling using Olink Explore 384 (Cardiometabolic, Inflammation, Neurology, Oncology panels).  RO_SCPLOWESULTSC_SCPLOWIn total, 127 paired multi-omic samples were collected longitudinally from 40 UC patients: 15 (38%) achieved HEMI at week 8 (responders), 13 (32.5%) were late responders, and 12 (30%) were non-responders. Pretreatment mucosal biopsies from future responders showed elevated interferon, IL-6-family, IL-2/common-{gamma}-chain, and T-cell-receptor signaling gene expression, which declined on treatment only in responders. A responder-specific JAK-STAT-dependent mechanism spanned interferon, cytokine-receptor, T-cell-receptor, and NF-{kappa}B signaling, with concordant gene- and protein-level reductions. Compared with a public infliximab dataset, JAK-STAT/interferon downregulation was shared and response-independent, while non-canonical NF-{kappa}B downregulation was tofacitinib-specific. In blood, shared pathway labels reflected distinct genes from mucosal effectors.  CO_SCPLOWONCLUSIONC_SCPLOWResponse to tofacitinib depends on a JAK-tractable mucosal pathway absent in non-responders, suggesting a pretreatment biomarker for predicting treatment response.  What is already known on this topicPrior studies have individually interrogated transcriptomic and/or epigenomic signatures of tofacitinib response as a single modality.  What this study addsOur study provides simultaneous profiling of both the transcriptome and proteome across paired mucosal and systemic compartments in patients, comparing responders with non-responders at baseline and over time. Our data support a model where tofacitinib response in UC depends on a JAK-dependent pro-inflammatory phenotype that the drug can dismantle, in contrast to non-responders representing distinct, JAK-independent pathways.  How this study might affect research, practice or policyThis study provides a foundation for treatment response studies in UC towards the development and validation of predictive biomarkers in colonic mucosa and blood, which could ultimately result in more personalized treatment strategies.", "authors": "Fung, I. C.; de Jong, D. C.; Liu, K.; Li Yim, A. Y.; van Gennep, S.; Ramkisoen, R. K.; Clasquin, E.; de Jong, J.; Gecse, K. B.; Lowenberg, M.; Mookhoek, A.; de Jonge, W. J.; D'Haens, G. R.", "date": "2026-10-08", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.4054, "score_semantic": 0.4054, "score_lexical": 0.5222, "matched": ["histopathology"]}], "reports": [{"date": "2026-10-12", "label": "Oct 12, 2026", "n": 29}, {"date": "2026-10-05", "label": "Oct 05, 2026", "n": 32}, {"date": "2026-09-28", "label": "Sep 28, 2026", "n": 32}, {"date": "2026-09-21", "label": "Sep 21, 2026", "n": 24}, {"date": "2026-09-14", "label": "Sep 14, 2026", "n": 26}, {"date": "2026-09-07", "label": "Sep 07, 2026", "n": 34}, {"date": "2026-08-31", "label": "Aug 31, 2026", "n": 19}, {"date": "2026-08-24", "label": "Aug 24, 2026", "n": 24}, {"date": "2026-08-17", "label": "Aug 17, 2026", "n": 18}, {"date": "2026-08-10", "label": "Aug 10, 2026", "n": 34}, {"date": "2026-08-03", "label": "Aug 03, 2026", "n": 17}, {"date": "2026-07-27", "label": "Jul 27, 2026", "n": 24}, {"date": "2026-07-20", "label": "Jul 20, 2026", "n": 26}, {"date": "2026-06-26", "label": "Jun 26, 2026", "n": 14}, {"date": "2026-06-19", "label": "Jun 19, 2026", "n": 38}], "prefix": "", "home": "../papers.html"}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const papers = DATA.papers;
  const SHORT = 280;
  // Slider floor: the pipeline threshold, or lower if older data scored below it
  const FLOOR = Math.floor(Math.min(DATA.threshold, ...papers.map(p => p.score)) * 100) / 100;

  // ── Persistent per-browser state (stars / read), keyed by paper URL ──
  const store = {
    get(k, fallback) {
      try { const v = localStorage.getItem('papertrail:' + k); return v ? JSON.parse(v) : fallback; }
      catch { return fallback; }
    },
    set(k, v) {
      try { localStorage.setItem('papertrail:' + k, JSON.stringify(v)); } catch {}
    },
  };
  const starred = new Map(Object.entries(store.get('starred', {})));  // id -> paper snapshot
  const read    = new Set(store.get('read', []));
  const saveStars = () => store.set('starred', Object.fromEntries(starred));
  const saveRead  = () => store.set('read', [...read]);

  const prefs = store.get('prefs', {});
  const state = {
    q: '',
    view: 'all',
    sort: prefs.sort || 'score',
    min: FLOOR,
    sources: new Set(),
    keyword: null,
    expanded: new Set(),
    scope: 'week',        // 'week' = this report, 'all' = every archived week
    limit: 100,           // cards rendered before "Show more"
  };
  const PAGE = 100;

  // ── All-weeks index: loaded on demand from reports/search-index.js ──
  let ALL = null, loadingAll = false;
  function loadAll() {
    if (ALL || loadingAll) return;
    loadingAll = true;
    const s = document.createElement('script');
    s.src = (DATA.prefix || '') + 'search-index.js';
    s.onload = () => { ALL = window.PAPERTRAIL_INDEX || []; loadingAll = false; render(); };
    s.onerror = () => {
      loadingAll = false; state.scope = 'week'; render();
      $('count').textContent = 'Could not load the all-weeks index (reports/search-index.js).';
    };
    document.head.appendChild(s);
  }
  const pool = () => state.scope === 'all' && ALL ? ALL : papers;

  // ── Helpers ──
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const scoreVar = s => s >= 0.5 ? 'var(--high)' : s >= 0.35 ? 'var(--mid)' : 'var(--low)';
  const isPreprint = p => !p.journal || p.journal === 'preprint';
  const url = p => (p.id && !p.id.startsWith('http')) ? 'https://doi.org/' + p.id : p.id;
  // Dates come as "2026-09-02", "2026-Sep-02" (PubMed) or just "2026-Sep"
  const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const dateKey = d => {
    const m = /^(\d{4})(?:-(\w+))?(?:-(\d+))?/.exec(d || '');
    if (!m) return 0;
    const mon = m[2] ? (/^\d+$/.test(m[2]) ? +m[2] - 1 : MONTHS.indexOf(m[2].slice(0, 3).toLowerCase())) : 0;
    return Date.UTC(+m[1], Math.max(mon, 0), m[3] ? +m[3] : 1);
  };

  // Keyword highlighting: whole-token matches, longest first
  const kwRe = DATA.keywords.length
    ? new RegExp('\\b(' + [...DATA.keywords].sort((a, b) => b.length - a.length).map(reEsc).join('|') + ')\\b', 'gi')
    : null;
  function highlight(text) {
    const parts = [];
    const res = [kwRe];
    const q = state.q.trim();
    if (q.length >= 2) res.push(new RegExp('(' + q.split(/\s+/).map(reEsc).join('|') + ')', 'gi'));
    // Collect ranges from all regexes on raw text, then merge and escape
    const ranges = [];
    for (const re of res) {
      if (!re) continue;
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(text))) { if (!m[0]) { re.lastIndex++; continue; } ranges.push([m.index, m.index + m[0].length]); }
    }
    if (!ranges.length) return esc(text);
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [ranges[0].slice()];
    for (const r of ranges.slice(1)) {
      const last = merged[merged.length - 1];
      if (r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push(r.slice());
    }
    let i = 0;
    for (const [a, b] of merged) { parts.push(esc(text.slice(i, a)), '<mark>', esc(text.slice(a, b)), '</mark>'); i = b; }
    parts.push(esc(text.slice(i)));
    return parts.join('');
  }

  const hayCache = new WeakMap();
  const hay = p => {
    let h = hayCache.get(p);
    if (h === undefined) {
      h = [p.title, p.abstract, p.authors, p.journal, p.source].join(' ').toLowerCase();
      hayCache.set(p, h);
    }
    return h;
  };

  // ── Filtering ──
  function filtered() {
    const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    let list = state.view === 'starred'
      ? [...starred.values()]
      : pool();
    list = list.filter(p => {
      if (state.view !== 'starred' && p.score < state.min) return false;
      if (state.view === 'unread' && read.has(p.id)) return false;
      if (state.sources.size && !state.sources.has(p.source)) return false;
      if (state.keyword && !(p.matched || []).includes(state.keyword)) return false;
      if (terms.length) {
        const h = hay(p);
        if (!terms.every(t => h.includes(t))) return false;
      }
      return true;
    });
    const by = {
      score: (a, b) => b.score - a.score,
      date:  (a, b) => dateKey(b.date) - dateKey(a.date) || b.score - a.score,
      if:    (a, b) => (b.if ?? -1) - (a.if ?? -1) || b.score - a.score,
    }[state.sort];
    return [...list].sort(by);
  }

  // ── Rendering ──
  const ICON_STAR = '<svg viewBox="0 0 24 24" fill="FILL" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  // Link to the report(s) a paper appeared in, when not the one being viewed
  const LABELS = Object.fromEntries((DATA.reports || []).map(r => [r.date, r.label]));
  function weekTag(p) {
    const weeks = (p.weeks || []).filter(w => w !== DATA.date || state.scope === 'all');
    if (!weeks.length || (state.scope !== 'all' && state.view !== 'starred')) return '';
    const [w, ...rest] = weeks;
    const label = w === DATA.date ? 'This week' : 'Week of ' + (LABELS[w] || w);
    return `<a class="week-tag" href="${esc((DATA.prefix || '') + w + '.html')}" title="${esc(weeks.map(x => LABELS[x] || x).join(', '))}">${esc(label)}${rest.length ? ` +${rest.length}` : ''}</a>`;
  }

  function card(p) {
    const s = p.score ?? 0;
    const abs = p.abstract || '';
    const long = abs.length > SHORT;
    const open = state.expanded.has(p.id);
    const shown = long && !open ? abs.slice(0, SHORT) + '…' : abs;
    const ifStr = p.if != null ? ` · IF ${Number(p.if).toFixed(1)}` : '';
    const authors = p.authors || '';
    const isStar = starred.has(p.id), isRead = read.has(p.id);
    const u = url(p);
    return `
      <article class="card${isRead ? ' is-read' : ''}" style="--score-color:${scoreVar(s)}" data-id="${esc(p.id)}">
        <div class="card-top">
          <a class="title" href="${esc(u)}" target="_blank" rel="noopener">${highlight(p.title || '')}</a>
          <div class="score-block" title="semantic ${p.score_semantic ?? '–'} · lexical ${p.score_lexical ?? '–'}">
            <div class="score-pill">${s.toFixed(2)}</div>
            <div class="score-bar-track"><div class="score-bar-fill" style="width:${Math.min(s * 100, 100)}%"></div></div>
          </div>
        </div>
        <div class="card-meta">
          <span class="badge${isPreprint(p) ? ' preprint' : ''}">${esc(p.source)}</span>
          ${!isPreprint(p) ? `<span>${esc(p.journal)}${ifStr}</span>` : ''}
          <span>${esc(p.date)}</span>
          <span title="${esc(authors)}">${esc(authors.length > 60 ? authors.slice(0, 60) + '…' : authors)}</span>
          ${weekTag(p)}
        </div>
        <div class="abstract">${highlight(shown)}${long ? `<button class="toggle-btn" data-act="toggle">${open ? 'Show less' : 'Show more'}</button>` : ''}</div>
        <div class="card-foot">
          <div class="matched">${(p.matched || []).map(k => `<button class="kw" data-kw="${esc(k)}" title="Filter by this keyword">${esc(k)}</button>`).join('')}</div>
          <button class="act${isStar ? ' on' : ''}" data-act="star" aria-pressed="${isStar}">${ICON_STAR.replace('FILL', isStar ? 'currentColor' : 'none')}${isStar ? 'Starred' : 'Star'}</button>
          <button class="act${isRead ? ' read-on' : ''}" data-act="read" aria-pressed="${isRead}">${ICON_CHECK}${isRead ? 'Read' : 'Mark read'}</button>
          <a class="doi-link" href="${esc(u)}" target="_blank" rel="noopener">Open ↗</a>
        </div>
      </article>`;
  }

  const $ = id => document.getElementById(id);

  function renderChips() {
    const counts = {};
    const src = state.view === 'starred' ? [...starred.values()] : pool();
    src.forEach(p => { counts[p.source] = (counts[p.source] || 0) + 1; });
    $('sources').innerHTML = Object.keys(counts).sort().map(src =>
      `<button class="chip" data-src="${esc(src)}" aria-pressed="${state.sources.has(src)}">${esc(src)}<span class="n">${counts[src]}</span></button>`
    ).join('');
    const kwCounts = {};
    src.forEach(p => (p.matched || []).forEach(k => { kwCounts[k] = (kwCounts[k] || 0) + 1; }));
    $('keywords').innerHTML = DATA.keywords.map(k =>
      `<button class="chip" data-kw="${esc(k)}" aria-pressed="${state.keyword === k}">${esc(k)}<span class="n">${kwCounts[k] || 0}</span></button>`
    ).join('');
  }

  // Filter changes start from the first page again
  const update = () => { state.limit = PAGE; render(); };

  function render() {
    const list = filtered();
    const papersEl = $('papers');
    if (state.scope === 'all' && !ALL) {
      papersEl.innerHTML = '<div class="empty">Loading all weeks…</div>';
    } else if (list.length) {
      const rest = list.length - state.limit;
      papersEl.innerHTML = list.slice(0, state.limit).map(card).join('') +
        (rest > 0 ? `<button class="more-btn" data-act="more">Show ${Math.min(rest, PAGE)} more (${rest} left)</button>` : '');
    } else {
      papersEl.innerHTML = `<div class="empty">${state.view === 'starred' && !starred.size
        ? 'No starred papers yet — star papers to build a reading list. It is saved in this browser.'
        : 'No papers match these filters.'}</div>`;
    }
    const base = state.view === 'starred' ? starred.size : pool().length;
    const what = state.view === 'starred' ? 'starred papers'
      : state.scope === 'all' ? `papers across ${(DATA.reports || []).length} weeks` : 'papers';
    $('count').textContent = `Showing ${list.length} of ${base} ${what}`;
    $('star-n').textContent = starred.size ? `(${starred.size})` : '';
    $('export').hidden = state.view !== 'starred' || !starred.size;
    const dirty = state.q || state.sources.size || state.keyword || state.min !== FLOOR;
    $('reset').hidden = !dirty;
    document.querySelectorAll('#view button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === state.view));
    document.querySelectorAll('#scope button').forEach(b => b.setAttribute('aria-pressed', b.dataset.scope === state.scope));
    $('scope').hidden = (DATA.reports || []).length < 2;
    renderChips();
  }

  // ── Header / footer ──
  $('meta').textContent =
    `${papers.length} of ${DATA.total} relevant papers · Past ${DATA.days} days · Generated ${DATA.generated}`;
  $('footer').textContent = `Generated by PaperTrail · Sources: ${DATA.sources.join(', ')}`;
  if (DATA.imported) {
    $('meta').insertAdjacentHTML('afterend',
      '<div class="imported-note">Recovered from an older report: author lists are shortened.</div>');
  }

  // ── Week navigation (reports are listed newest first) ──
  const REPORTS = DATA.reports || [];
  const here = REPORTS.findIndex(r => r.date === DATA.date);
  const href = r => (DATA.prefix || '') + r.date + '.html';
  if (REPORTS.length > 1 && here !== -1) {
    $('weeks').hidden = false;
    $('week').innerHTML = REPORTS.map((r, i) =>
      `<option value="${i}"${i === here ? ' selected' : ''}>${esc(r.label)} · ${r.n} papers${i === 0 ? ' · latest' : ''}</option>`
    ).join('');
    $('week').addEventListener('change', e => { location.href = href(REPORTS[+e.target.value]); });
    const link = (el, r) => r ? (el.href = href(r)) : el.setAttribute('aria-disabled', 'true');
    link($('prev'), REPORTS[here + 1]);
    link($('next'), REPORTS[here - 1]);
    if (here === 0) $('latest').hidden = true; else $('latest').href = DATA.home;
  }

  // ── Controls ──
  const min = $('min');
  min.min = FLOOR;
  min.value = state.min;
  $('min-val').textContent = state.min.toFixed(2);
  $('sort').value = state.sort;

  let t;
  $('q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; update(); }, 120); });
  min.addEventListener('input', e => { state.min = +e.target.value; $('min-val').textContent = state.min.toFixed(2); update(); });
  $('sort').addEventListener('change', e => { state.sort = e.target.value; store.set('prefs', { ...prefs, sort: state.sort }); update(); });
  $('view').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.view = b.dataset.view; update();
  });
  $('scope').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.scope = b.dataset.scope;
    if (state.scope === 'all') loadAll();
    update();
  });
  $('sources').addEventListener('click', e => {
    const b = e.target.closest('[data-src]'); if (!b) return;
    const s = b.dataset.src;
    state.sources.has(s) ? state.sources.delete(s) : state.sources.add(s);
    update();
  });
  const toggleKw = k => { state.keyword = state.keyword === k ? null : k; update(); };
  $('keywords').addEventListener('click', e => { const b = e.target.closest('[data-kw]'); if (b) toggleKw(b.dataset.kw); });
  $('reset').addEventListener('click', () => {
    state.q = ''; $('q').value = '';
    state.sources.clear(); state.keyword = null;
    state.min = FLOOR; min.value = state.min; $('min-val').textContent = state.min.toFixed(2);
    update();
  });
  $('export').addEventListener('click', () => {
    const lines = [...starred.values()].sort((a, b) => b.score - a.score).map(p =>
      `- [${p.title}](${url(p)})  \n  ${p.authors ? p.authors.split(/[,;]/)[0].trim() + ' et al. · ' : ''}${isPreprint(p) ? p.source : p.journal} · ${p.date}`);
    const blob = new Blob([`# PaperTrail — starred papers\n\n${lines.join('\n')}\n`], { type: 'text/markdown' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'papertrail-starred.md' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $('papers').addEventListener('click', e => {
    const kw = e.target.closest('.matched [data-kw]');
    if (kw) { toggleKw(kw.dataset.kw); return; }
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    if (btn.dataset.act === 'more') { state.limit += PAGE; render(); return; }
    const id = btn.closest('.card').dataset.id;
    const p = pool().find(x => x.id === id) || papers.find(x => x.id === id) || starred.get(id);
    const act = btn.dataset.act;
    if (act === 'toggle') { state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); }
    if (act === 'star')   { starred.has(id) ? starred.delete(id) : starred.set(id, { ...p, weeks: p.weeks || [DATA.date] }); saveStars(); }
    if (act === 'read')   { read.has(id) ? read.delete(id) : read.add(id); saveRead(); }
    render();
  });

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
    if (e.key === 'Escape' && document.activeElement === $('q')) { $('q').blur(); }
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (!typing && e.key === '[' && $('prev').href) location.href = $('prev').href;
    if (!typing && e.key === ']' && $('next').href) location.href = $('next').href;
  });

  render();
})();
</script>
</body>
</html>
