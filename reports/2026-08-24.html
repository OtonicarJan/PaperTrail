<!DOCTYPE html>
<html lang="en">
<head>

<title>PaperTrail — August 24, 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #F7F7F5;
    --surface:   #FFFFFF;
    --text:      #1A1A2E;
    --body:      #374151;
    --muted:     #6B7280;
    --accent:    #2D6A4F;
    --accent-bg: #E3F0E9;
    --border:    #E5E7EB;
    --high:      #2D6A4F;
    --mid:       #D97706;
    --low:       #DC2626;
    --badge-bg:  #EEF2FF;
    --badge-fg:  #4338CA;
    --pre-bg:    #FEF3C7;
    --pre-fg:    #92400E;
    --mark:      #FDE68A;
    --star:      #D97706;
    --shadow:    rgba(0,0,0,0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #14161B;
      --surface:   #1C1F26;
      --text:      #ECEDEF;
      --body:      #C9CCD3;
      --muted:     #9097A3;
      --accent:    #6FC69A;
      --accent-bg: #1F3A2D;
      --border:    #2D313A;
      --high:      #6FC69A;
      --mid:       #F0A93B;
      --low:       #F07171;
      --badge-bg:  #262B45;
      --badge-fg:  #A5B4FC;
      --pre-bg:    #3A2F14;
      --pre-fg:    #F5C969;
      --mark:      #5C4A12;
      --star:      #F0A93B;
      --shadow:    rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg:        #14161B;
    --surface:   #1C1F26;
    --text:      #ECEDEF;
    --body:      #C9CCD3;
    --muted:     #9097A3;
    --accent:    #6FC69A;
    --accent-bg: #1F3A2D;
    --border:    #2D313A;
    --high:      #6FC69A;
    --mid:       #F0A93B;
    --low:       #F07171;
    --badge-bg:  #262B45;
    --badge-fg:  #A5B4FC;
    --pre-bg:    #3A2F14;
    --pre-fg:    #F5C969;
    --mark:      #5C4A12;
    --star:      #F0A93B;
    --shadow:    rgba(0,0,0,0.35);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 2rem 1rem 4rem;
  }

  .page { max-width: 780px; margin: 0 auto; }
  button, input, select { font: inherit; color: inherit; }

  /* ── Header ── */
  header { margin-bottom: 1.25rem; }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .logo span { color: var(--text); }
  .head-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.6rem 1rem; }
  .weeks { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; }
  .weeks select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.3rem 0.5rem; font-size: 0.82rem; max-width: 62vw;
  }
  .wk-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); text-decoration: none; font-size: 1.1rem; line-height: 1;
  }
  .wk-btn:hover { border-color: var(--accent); color: var(--accent); }
  .wk-btn[aria-disabled="true"] { opacity: 0.35; pointer-events: none; }
  .weeks .linkish { text-decoration: none; white-space: nowrap; }
  .imported-note { color: var(--muted); font-size: 0.78rem; margin-top: 0.25rem; }
  .meta { margin-top: 0.4rem; color: var(--muted); font-size: 0.85rem; }

  /* ── Controls ── */
  .controls {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 0.75rem 0 0.9rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 0.6rem;
  }
  .search {
    width: 100%;
    padding: 0.55rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    font-size: 0.9rem;
  }
  .search-row { display: flex; gap: 0.5rem; align-items: stretch; }
  .search-row .search { flex: 1; min-width: 0; }
  .search-row .seg button { padding: 0 0.75rem; white-space: nowrap; }
  .week-tag {
    font-size: 0.72rem; font-weight: 500; color: var(--accent);
    text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  .week-tag:hover { border-bottom-style: solid; }
  .more-btn {
    align-self: center; margin-top: 0.25rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.45rem 1.1rem; font-size: 0.85rem; cursor: pointer; color: var(--accent);
  }
  .more-btn:hover { border-color: var(--accent); }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; font-size: 0.82rem; color: var(--muted); }
  .row label { display: inline-flex; align-items: center; gap: 0.4rem; }
  .row select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.2rem 0.4rem; font-size: 0.82rem;
  }
  .row input[type=range] { accent-color: var(--accent); width: 110px; }
  .row input[type=checkbox] { accent-color: var(--accent); }
  .min-val { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 500; min-width: 2.2em; }

  .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .chip {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 0.74rem; font-weight: 500;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .chip .n { opacity: 0.7; margin-left: 0.25rem; font-variant-numeric: tabular-nums; }

  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: var(--surface); border: none; padding: 0.2rem 0.65rem;
    font-size: 0.8rem; cursor: pointer; color: var(--muted);
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }

  .status { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--muted); }
  .linkish { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.8rem; font-weight: 500; }
  .linkish:hover { text-decoration: underline; }

  /* ── Cards ── */
  .papers { display: flex; flex-direction: column; gap: 1rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--score-color, var(--border));
    border-radius: 0 8px 8px 0;
    padding: 1.25rem 1.5rem 1rem;
    transition: box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .card:hover { box-shadow: 0 4px 16px var(--shadow); }
  .card.is-read { opacity: 0.55; }
  .card.is-read:hover { opacity: 1; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 0.5rem;
  }

  .title {
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .title:hover { color: var(--accent); }

  /* Score pill + bar */
  .score-block { flex-shrink: 0; text-align: right; min-width: 48px; }
  .score-pill {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--score-color);
    font-variant-numeric: tabular-nums;
  }
  .score-bar-track {
    width: 48px; height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 4px;
  }
  .score-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--score-color);
  }

  .card-meta {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.6rem;
    display: flex; flex-wrap: wrap; gap: 0.3rem 0.75rem;
    align-items: center;
  }
  .badge {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.1rem 0.45rem;
    border-radius: 4px;
    background: var(--badge-bg);
    color: var(--badge-fg);
  }
  .badge.preprint { background: var(--pre-bg); color: var(--pre-fg); }

  .abstract {
    font-size: 0.875rem;
    color: var(--body);
    line-height: 1.65;
    overflow-wrap: anywhere;
  }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .toggle-btn {
    background: none; border: none; cursor: pointer;
    color: var(--accent); font-size: 0.8rem; font-weight: 500;
    padding: 0; margin-top: 0.3rem; display: block;
  }
  .toggle-btn:hover { text-decoration: underline; }

  .card-foot {
    margin-top: 0.7rem;
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.9rem;
    font-size: 0.78rem;
  }
  .matched { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-right: auto; }
  .matched .kw {
    background: var(--accent-bg); color: var(--accent);
    font-size: 0.7rem; font-weight: 500;
    padding: 0.05rem 0.5rem; border-radius: 999px;
    border: none; cursor: pointer;
  }
  .act {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 0.78rem; padding: 0.1rem 0;
    display: inline-flex; align-items: center; gap: 0.25rem;
  }
  .act:hover { color: var(--accent); }
  .act.on { color: var(--star); }
  .act.read-on { color: var(--accent); }
  .act svg { width: 14px; height: 14px; }
  .doi-link { color: var(--muted); text-decoration: none; }
  .doi-link:hover { color: var(--accent); }

  .empty {
    text-align: center; color: var(--muted); font-size: 0.9rem;
    padding: 3rem 1rem; border: 1px dashed var(--border); border-radius: 8px;
  }

  /* ── Footer ── */
  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
  }

  @media (max-width: 560px) {
    .search-row { flex-direction: column; }
    .search-row .seg button { flex: 1; padding: 0.3rem 0.5rem; }
    body { padding: 1.25rem 1rem 3rem; }
    .card { padding: 1rem 1rem 0.85rem; }
    .controls { position: static; }
  }
</style>
</head>
<body>
<div class="page">

<header>
  <div class="head-row">
    <div class="logo">Paper<span>Trail</span></div>
    <nav class="weeks" id="weeks" aria-label="Weekly reports" hidden>
      <a class="wk-btn" id="prev" title="Previous week  ( [ )" aria-label="Previous week">‹</a>
      <select id="week" aria-label="Choose week"></select>
      <a class="wk-btn" id="next" title="Next week  ( ] )" aria-label="Next week">›</a>
      <a class="linkish" id="latest">Latest →</a>
    </nav>
  </div>
  <div class="meta" id="meta"></div>
</header>

<div class="controls">
  <div class="search-row">
    <input class="search" id="q" type="search" placeholder="Search papers, authors, journals…" autocomplete="off">
    <div class="seg" id="scope" role="group" aria-label="Search scope">
      <button data-scope="week" aria-pressed="true">This week</button>
      <button data-scope="all">All weeks</button>
    </div>
  </div>
  <div class="row">
    <div class="seg" id="view" role="group" aria-label="View">
      <button data-view="all" aria-pressed="true">All</button>
      <button data-view="unread">Unread</button>
      <button data-view="starred">Starred <span id="star-n"></span></button>
    </div>
    <label>Sort
      <select id="sort">
        <option value="score">Relevance</option>
        <option value="date">Newest</option>
        <option value="if">Impact factor</option>
      </select>
    </label>
    <label>Min score
      <input id="min" type="range" min="0" max="1" step="0.01">
      <span class="min-val" id="min-val"></span>
    </label>
  </div>
  <div class="chips" id="sources" aria-label="Sources"></div>
  <div class="chips" id="keywords" aria-label="Keywords"></div>
  <div class="status">
    <span id="count" aria-live="polite"></span>
    <span>
      <button class="linkish" id="export" hidden>Export starred</button>
      <button class="linkish" id="reset" hidden>Clear filters</button>
    </span>
  </div>
</div>

<div class="papers" id="papers"></div>

<footer id="footer"></footer>

</div>

n or myeloid and NK reprogramming, which could inform targeted combination therapeutic strategies to improve outcomes. Overall, we provide a high-dimensional multi-modal resource dataset that enables cross-platform integration, links stages of T cell clonal expansion with enabling or suppressive RCC immune cell communication networks and nominates rational strategies for combinatorial precision immunotherapy.  (Funded by University Health Network, Toronto; REMEDY ClinicalTrials.gov number, NCT04005183.)", "authors": "Pfeil, J. Q.; Hui, S.; Stueckmann, D.; Zhang, X.; Martin, L.; Komisarenko, M.; Meens, J.; Gorman, J. L.; Murphy, J. M.; Mak, M. L.; Chevrier, S.; Sivapatham, S.; Spears, M.; Liu, Z. A.; Deniffel, D.; Haider, M. A.; Jonsson, P.; Davis, F. P.; Penaranda, C.; Prendeville, S.; Crome, S. Q.; Ailles, L.; Bodenmiller, B.; Stransky, N.; Smolen, G.; Bader, G. D.; Finelli, A.; Jackson, H. W.; Lawson, K. A.", "date": "2026-08-20", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6493, "score_semantic": 0.6493, "score_lexical": 0.5133, "matched": ["genomics"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.08.17.26360531", "title": "Diagnostic accuracy of image-guided fine needle aspiration cytology in diagnosis of lung tumors", "abstract": "BackgroundLung cancer remains the leading cause of cancer related mortality globally. It is the second most prevalent cancer among women worldwide and ranks third among females in Nepal. Contributing factors include smoking, tobacco use, air pollution, and delayed diagnosis. Image-guided fine needle aspiration cytology(FNAC) and biopsy are widely used, rapid and diagnostic techniques for evaluating lung lesions. As FNAC is minimally invasive procedure with less complications as compared to biopsy, the goal of this study is to examine the histocytologic makeup of lung lesions and link the results.  Materials and MethodsThis cross-sectional observational study included 65 patients irrespective of age and sex presenting with lung masses at Chitwan Medical College and Teaching Hospital during the period of eighteen months starting from April 2023 to September 2024. After clinical and radiologic evaluation, all cases underwent image-guided FNAC and biopsy. Only specimens with unequivocal malignant features were classified as positive. Histopathology served as the diagnostic reference standard.  ResultsFNAC diagnosed 90.8% as malignant and 9.2% as benign. Biopsy confirmed malignancy in 92.3% of the cases. Taking histopathology as the gold standard, FNAC demonstrated a sensitivity of 98.33%, specificity of 100%, positive predictive value(PPV) of 100%, and negative predictive value (NPV) of 83.33%. Concordance between FNAC and histopathological subtyping was 98.46%. Adenocarcinoma was the most common subtype, followed by squamous cell carcinoma and small cell carcinoma. Smoking was the most common contributing factor associated with malignancy.  Conclusion and implicationsImage-guided FNAC is an excellent diagnostic accuracy tool which possess higher level of concordance with biopsy in evaluating lung masses. It should be considered as the frontline diagnostic tool, especially in resource limited settings.", "authors": "Bhandari, B.; Tiwari, M.; Adhikari, S.; Khanal, A.; Chhetri, N. B.; Pandey, S.", "date": "2026-08-21", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.6282, "score_semantic": 0.6282, "score_lexical": 1.0, "matched": ["histopathology", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.04.21.719788", "title": "Divergent malignant evolution converges on shared immunosuppressive ecosystems through tumor-intrinsic TMED2-ADAR1-dependent complement signalling in multifocal hepatocellular carcinoma", "abstract": "Background Multifocal hepatocellular carcinoma (HCC) comprises spatially separated tumor foci with distinct evolutionary trajectories, posing a major therapeutic challenge. Whether divergent lesions retain shared immune-evasion mechanisms beyond lesion-specific heterogeneity and offer cross-focal therapeutic opportunities remains unknown. Objective To resolve malignant and microenvironmental heterogeneity across tumor foci and identify conserved immunosuppressive programs underlying multifocal HCC progression. Design Matched tumour foci and peritumoural tissues from patients with multifocal HCC underwent integrated single-cell and spatial multi-omics profiling, including scFAST-seq (n=15), scATAC-seq (n=12), and Stereo-seq (n=14). In-house RNA-seq (n=13), public scRNA-seq (HRA001748) and RNA-seq datasets (TCGA-LIHC, OEP000321) were used for validation. Multiplex immunohistochemistry (n=96) and functional assays validated key findings. Results Multifocal HCC exhibited extensive inter-focal heterogeneity in malignant genomic, transcriptional, epigenetic, and evolutionary states, accompanied by diverse immune and stromal landscapes. Despite this divergence, spatially separated tumor foci converged on shared malignant states marked by elevated TMED2 expression and conserved immunosuppressive ecosystems characterized by regulatory T-cell (Treg) and SPP1+/SPRED1+ macrophage enrichment, impaired cytotoxic CD8+ T-cell immunity, and recurrent stromal-vascular remodeling. Mechanistically, malignant hepatocytes engaged SPP1+/SPRED1+ macrophages through C3/C5 complement signaling across divergent tumor foci, while macrophages and Tregs contributed to CD8+ T-cell dysfunction through CD274-PDCD1, CD80/CD86-CTLA4/CD28, and MHC-I-CD8 interactions. A tumor-intrinsic TMED2-ADAR1-dependent A-to-I RNA editing program promoted C3/C5 complement expression and secretion, linking malignant heterogeneity to conserved tumor-immune signaling. Conclusions Despite divergent malignant evolution, multifocal HCC converges on shared immunosuppressive ecosystems. The TMED2-ADAR1-C3/C5 complement axis represents a conserved tumor-immune vulnerability that may enable therapeutic strategies targeting common immune-evasion mechanisms across heterogeneous tumor foci.", "authors": "Wu, C.; Si, K.; Mao, S.; Jiang, Z.; Li, D.; Zhu, H.; Sun, N.; Liang, W.; Zhang, W.", "date": "2026-08-19", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6264, "score_semantic": 0.6264, "score_lexical": 0.837, "matched": ["tumor evolution"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.08.20.746089", "title": "Large oncosomes reprogram bone marrow mesenchymal stem cells to establish a pre-metastatic niche", "abstract": "Metastatic progression depends on the systemic remodeling of distant tissues before tumor cell arrival, yet the cancer-derived signals that orchestrate this process remain poorly understood. Large oncosomes (LOs) are atypically large (>1 um), tumor-derived extracellular vesicles shed by invasive cancer cells. Here, we demonstrate that LOs function as systemic mediators of pre-metastatic niche formation by activating innate immune sensing in bone marrow mesenchymal stem cells (BM-MSCs). Systemic administration of prostate- and breast cancer-derived LOs to immunocompetent tumor-bearing mice did not affect primary tumor growth but increased metastatic burden. LOs induced a robust, dose-dependent interferon-driven inflammatory program, characterized by interferon-stimulated genes and neutrophil chemokines. Mechanistically, this response was driven by LO-associated nucleic acids activating convergent cytosolic DNA- and RNA-sensing pathways in recipient stromal cells. LO-conditioned BM-MSCs promoted the accumulation and polarization of neutrophils toward an immunosuppressive, polymorphonuclear myeloid-derived suppressor cell (PMN-MDSC) phenotype. In vivo, genetic suppression of LO shedding in tumor cells reduced PMN-MDSC accumulation in the bone marrow, which was reverted by systemic LO administration. Together, these findings establish LOs as specialized carriers of immunomodulatory signals that reprogram the bone marrow microenvironment to support metastatic colonization, identifying a previously unrecognized mechanism linking tumor vesiculation to immune remodeling at distant sites.", "authors": "Silva, T. F.; Concato-Lopes, V. M.; Bedier, F.; Newman, L.; Kitka, D.; Brown, J.; Victor, B.; Kim, M.; Vagner, T.; Grasso, C.; Sheyn, D.; You, S.; Freeman, M. R.; Sutterwala, F. S.; Goodridge, H. S.; Jefferies, C.; de Candia, P.; Guarnerio, J.; Di Vizio, D.", "date": "2026-08-21", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6248, "score_semantic": 0.6248, "score_lexical": 0.7784, "matched": ["cancer"]}, {"id": "https://www.biorxiv.org/content/10.1101/2022.12.22.521159", "title": "Mutation-induced phenotypic plasticity drives formation of a pro-metastatic tumour-intrinsic niche", "abstract": "Colorectal cancer (CRC) progression is characterised by a remarkable increase in plasticity and cellular heterogeneity. The ability of cells to shift states and adopt mixed lineage potential exacerbates during metastasis and associates with poor patient survival. How these atypical differentiated states emerge and drive cancer progression however has remained unclear. Here, we investigate this issue for BRAF-mutant CRC that commonly arise via the serrated pathway and are linked to poor prognosis via incompletely understood progression steps. Using patient-derived organoids, gene editing and murine tumour models, we show that mutations in RNF43, a regulator of WNT receptor abundance, endow BRAF-mutant CRC with metastatic capacity by driving a non-dividing tumour-intrinsic niche cell (TINC) state that provides growth factor self-sufficiency to the cancer tissue. TINCs are enriched in RNF43-mutant, mucinous and metastatic samples of human CRC, and ablation of TINCs lead to re-acquired external growth factor dependency during CRC organoid outgrowth. Together, our findings uncover a mechanism by which tumours leverage cellular plasticity to mediate self-organised stem- and niche-cell interactions. Our results argue that formation of a tumour-intrinsic niche is a prerequisite for BRAF-mutant CRC seeding to distant organs and that interference with niche formation may help avoid metastatic relapse.", "authors": "Bugter, J. M.; El Bouazzaoui, L.; Kucukkose, E.; Mills, M. L.; Hong, Y.; Sprangers, J.; Jordens, I.; Kokkinidi, D.; Plugge, S.; Venhuizen, A.; Bosman, S.; Hageman, J.; Fenderico, N.; Gilroy, K.; Montiel Gonzalez, D.; van Boxtel, R.; Suijkerbuijk, S. J. E.; Tejpar, S.; Campbell, A. D.; Sansom, O. J.; Snippert, H. J. G.; Kranenburg, O.; Maurice, M. M.", "date": "2026-08-20", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.623, "score_semantic": 0.623, "score_lexical": 0.7845, "matched": ["cancer"]}, {"id": "https://www.biorxiv.org/content/10.1101/2025.03.18.643959", "title": "Pan-cancer transcriptional regulatory network analysis reveals key drivers and epigenetic modulators in tumorigenesis", "abstract": "Cancer remains a leading cause of mortality worldwide, largely due to the complexity of its transcriptional and epigenetic dysregulation. However, integrating multi-omics data to construct context-specific transcriptional regulatory networks (TRNs) and dissecting their pan-cancer relevance remain challenging. Here, we developed a framework integrating gene expression, chromatin accessibility, and DNA methylation data to reconstruct TRNs across 16 cancer types from The Cancer Genome Atlas. Using the PECA model, we identified TF-RE-TG (transcription factor-regulatory element - target gene) regulatory relationships and refined networks using protein-protein interaction or methylation-aware filtering. Our analysis revealed cancer-specific and pan-cancer dysregulated TFs and TGs. Notably, hub TFs like TBP and SP2 orchestrated pan-cancer modules linked to DNA repair. Survival analysis identified prognostic TGs (e.g., TAS2R14, ANLN), while enhancer and methylation analyses highlighted epigenetic-related regulatory axes (e.g., NFIB-RPS6KB2, MYB-BTK) in tumorigenesis. Our study provides a comprehensive resource of cancer TRNs, unveiling conserved regulatory mechanisms and epigenetic vulnerabilities, with implications for precision oncology.", "authors": "Yin, Y.; Zhang, J.", "date": "2026-08-18", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6186, "score_semantic": 0.6186, "score_lexical": 1.0, "matched": ["cancer"]}, {"id": "https://doi.org/10.1016/j.devcel.2026.07.018", "title": "Tumors exploit interclonal Hedgehog-Wnt crosstalk to drive tumor-promoting cell competition.", "abstract": "Intratumoral heterogeneity fuels cancer progression and therapy resistance, yet the cooperative mechanisms between distinct subclones remain poorly defined. Here, we uncover a tumor-promoting form of cell competition wherein malignant clones hijack interclonal Hedgehog (Hh) and Wnt signaling to convert competitive pressure into a pro-tumorigenic force. In Drosophila, we find that Pp1-87B depleted, RAS-mutant \"loser\" cells undergo Hh-mediated apoptosis while secreting Wingless (Wg). This paracrine Wg signal hyperactivate β-catenin in neighboring RAS \"winner\" clones, reprogramming them into invasive super-competitors. This mechanism is conserved in human pancreatic ductal adenocarcinoma (PDAC), where PPP1CA loss in KRAS-mutant cells induces analogous Hh-Wnt synergy, accelerating tumor growth in mouse xenograft models and correlating with clonal selection in patient specimens. Our study elucidates a paradoxical role for cell competition in intratumoral heterogeneity, where distinct tumor clones across species exploit conserved developmental signaling pathways to fuel malignancy. These findings establish interclonal communication as a critical driver of tumor ecosystem dynamics and identify Hh-Wnt crosstalk as a promising therapeutic vulnerability in heterogeneous cancers.", "authors": "Kong D, Lin P, Guo Y, Lin K, Zhao S, Yang S, Wang X, Zhu G, Xie L, Tatekawa S, Zheng J, Xu W, He L, Ishii H, Jin B, Cheng K, Xie Q, Ma X", "date": "2026-Sep-09", "source": "PubMed", "journal": "Developmental cell", "if": 11.8, "score": 0.617, "score_semantic": 0.617, "score_lexical": 0.5231, "matched": ["cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.08.18.745434", "title": "Evolutionary implications of phenotype switching for growth and survival of tumors in stochastic environments.", "abstract": "Tumors evolve under constantly changing microenvironmental conditions, and a key major mechanism by which cancer cells adapt to fluctuating environments is stochastic phenotypic switch via epithelial-mesenchymal plasticity (EMP). Here we demonstrate the existence of EMP in human breast epithelial cell lines and assess the fitness of E and M cells in environments that fluctuate between favorable and harsh conditions. We then develop a theoretical framework for analysis of tumor evolution with E-M stochastic phenotypic switch that integrates the behaviors of E and M cells. We characterize the outcomes of tumor evolution via three characteristic times describing i) tumor growth, ii) phenotypic adaptation and iii) fluctuations of the environment. We identify a tradeoff between tumor growth and survival, with different phenotype switching rates maximizing each of these objectives. An anticancer therapeutic strategy is proposed based on tumor survival analysis, revealing that blocking mesenchymal to epithelial transition, rather than epithelial to mesenchymal transition, is critical under fluctuating conditions. Thus, this study elucidates fundamental evolutionary mechanisms of tumor phenotypic adaptation in fluctuating environments with potentially important clinical implications.", "authors": "Babajanyan, S.; Wolf, Y. I.; Canevarolo, R. R.; Sudalagunta, P. R.; Silva, A. S.; Koonin, E.; Persi, E.", "date": "2026-08-22", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5856, "score_semantic": 0.5856, "score_lexical": 0.9735, "matched": ["tumor evolution", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.01.12.699071", "title": "Ultra-deep duplex sequencing reveals unique features of somatic evolution in the normal tissues of a family with Li-Fraumeni syndrome", "abstract": "Li-Fraumeni Syndrome (LFS) is caused by germline pathogenic variants in TP53 which predispose carriers to early onset cancer across multiple tissues. While genomically profiling those cancers has revealed factors contributing to their formation, little is understood about how LFS impacts clonal evolution in healthy tissues preceding cancer. Here, we use ultra-deep duplex sequencing (mean [~]15,000x depth) to investigate somatic mutation and selection in a family carrying the germline TP53 p.R181H pathogenic variant and a cohort of non-carrier controls. In blood samples, the germline variant is associated with more mutations in a panel designed to capture genomewide mutagenesis, and with reduced positive selection on somatic TP53 mutations, despite confounding by chemotherapy treatment in one individual. DNMT3A and TET2 mutations appear positively selected and GATA2 mutations negatively selected across the cohort, independent of the p.R181H status. Extensive multi-tissue sampling of 22 non-cancerous and 6 cancerous samples was also performed at autopsy in one individual with LFS who succumbed to esophageal cancer. Cross-tissue analysis reveals excess mutations in sun-exposed skin, esophagus and chronically-inflamed stomach tissue, and concordant mutations in the p.R248 hotspot of TP53 across most (18/28) tissue samples. Most somatic TP53 mutations in LFS that can be assessed for phase arose on the chromosomal copy lacking the p.R181H variant. Our study reveals how the germline p.R181H variant reshapes baseline somatic mutation and selection in normal tissues and highlights the importance of understanding early somatic evolution in LFS prior to cancer development and treatment.", "authors": "Colegrove, H. L.; Dubard-Gault, M. E.; Marshall, H.; Kohrn, B. F.; Smith, T. H.; Norgaard, Z. K.; Lo, F. Y.; Schmidt, E. K.; Higgins, J. E.; Valentine, C. C.; Marshall, D. A.; Clark, J. I.; Konnick, E. Q.; Salk, J. J.; Horwitz, M. S.; Rahbari, R.; Feder, A. F.; Risques, R. A.", "date": "2026-08-20", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5823, "score_semantic": 0.5823, "score_lexical": 0.8136, "matched": ["clonal evolution", "cancer"]}, {"id": "https://doi.org/10.1038/s41596-026-01426-x", "title": "Centralized processing of frozen tumor tissues for global cancer genomics.", "abstract": "Here we present the pathology workflow of the Mutographs project, a 7-year, multicancer genomics initiative led by the Sanger Institute and funded by Cancer Research UK. Mutographs aims to elucidate global differences in cancer incidence through whole-genome sequencing and mutational signature analysis of selected cancers with unexplained variation of incidence rate worldwide. The Protocol was developed by the International Agency for Research on Cancer, where pathology assessment and paired tumor-blood DNA extraction were performed. We provide details for handling frozen cancer tissues for multistep pathology evaluation and quality control, tumor-enrichment methods (such as macrodissecion and laser-capture microdissection) for certain tumor types, and manual and automated DNA extraction. This Protocol has achieved an overall success rate of 88% in providing high-quality DNA for whole-genome sequencing, aiding in the decision to exclude low-quality or noneligible tissues. This Protocol provides a reproducible, fully integrated pathology-molecular pipeline in challenging conditions to ensure high-quality DNA and reliable data interpretation at an unprecedented multinational scale and could be considered a model for high-quality tissue processing in international genomics initiatives. It is based on routine practice of pathology and requires practical experience of processing frozen tissues and morphological assessment of frozen tissues by digital pathology.", "authors": "Abedi-Ardekani B, Nikmanesh A, Sotoudeh M, Gaborieau V, Azmoudeh-Ardalan F, Saffar H, Serra S, Carreira C, Chopard P, Ferlicot S, Scoazec JY, Lallemand C, Colney E, Guillot S, Ghasemi-Kebria F, de Carvalho AC, Ferreiro-Iglesias A, Perdomo S, Brennan P, Salto-Tellez M, Roshandel G", "date": "2026-Aug-17", "source": "PubMed", "journal": "Nature protocols", "if": 13.1, "score": 0.57, "score_semantic": 0.57, "score_lexical": 0.9669, "matched": ["digital pathology", "genomics", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.08.18.745357", "title": "Spatial vascular/BTB remodeling and malignant-state plasticity in glioblastoma", "abstract": "Background: Glioblastoma (GBM) contains spatially heterogeneous malignant and vascular states, but blood-tumor barrier (BTB) remodeling is often described as a binary functional phenotype. We asked whether anatomically distinct GBM compartments contain separable vascular programs that coexist with malignant-state plasticity. Methods: We performed donor-aware cross-sectional analyses of 38 histopathology-annotated spatial transcriptomic sections from 6 donors and a separately analyzed endothelial single-nucleus layer from the same GBM-Space atlas. Complementary external datasets tested patient-paired regional remodeling, anatomical replication, cross-technology source localization, and malignant-state architecture. Results: THSD1-FLT4 Recognition increased from leading edge to infiltrative tumor (median adjusted effect +0.02875; 4/4 donors positive). Priming increased across this boundary (+0.14814; 3/4) but decreased from infiltrative to cellular tumor (-0.16409; 0/4), whereas Gate remodeling increased from infiltrative to cellular tumor (+0.21296; 4/4). Remodeled endothelium showed higher PLVAP detection (+0.26409; 12/12 donors) and PLVAP pseudobulk expression (+1.61784 log1pCPM; 11/12), with lower MFSD2A pseudobulk expression (-0.71448; 10/12 negative). External cohorts supported regional vascular/BTB remodeling, while GSE131928 supported broad malignant-state architecture and an exploratory within-tumor pseudotemporal continuum. Conclusions: GBM contains spatially partitioned vascular/BTB-associated programs alongside malignant-state plasticity. Recognition-Priming-Gate is a cross-sectional discovery framework, not a validated temporal cascade, and the data do not establish BTB permeability, causal tumor-vascular signaling, or therapeutic-delivery benefit.", "authors": "Zheng, L.; Gan, L.", "date": "2026-08-22", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5601, "score_semantic": 0.5601, "score_lexical": 0.7466, "matched": ["histopathology"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.08.11.744176", "title": "In situ Discovery of Immune Repertoire Reveals Antitumor Immunity and Therapeutic Antibodies", "abstract": "Spatial transcriptomics offers a glimpse into the immunology of tissues. However, limitations in spatial transcriptomics preclude the detection of highly diverse, low-abundance, and previously unknown sequences, including immune repertoires and microbiota. Here, we introduce Archimap, a spatial transcriptomic platform that simultaneously profiles spatial transcriptomes, immune repertoires, and microbiota from formalin-fixed paraffin-embedded (FFPE) tissues. Using Archimap, we profile the spatial localization of TCRs, BCRs, and the microbiota landscape in archived clinical tissues at single-cell resolution. Through comprehensive benchmarking, we validate Archimaps performance and fidelity. Archimap in situ assembles the immune complex and reconstructs the clonal evolution of antibodies. Together, Archimap shows the power of in situ discovery of functional immune repertoires for their antitumor immunity.", "authors": "Zhang, H.; Wang, P.; Zhao, Y.; Yang, L.; Xue, T.; Liu, L.; Zhao, Y.; Zhang, Z.; Ma, J.; Zeng, B.; Zhang, P.; Wang, C.; Pan, D.; Gao, Z.; Liu, Z.; Zeng, Z.", "date": "2026-08-19", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5519, "score_semantic": 0.5519, "score_lexical": 0.6625, "matched": ["clonal evolution"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.08.13.743895", "title": "Prevalence of Colorectal Cancer Molecular Profiles Is Not Captured by a Single Age Threshold", "abstract": "Early- and average-onset colorectal cancer (CRC) are separated at age 50, but whether this defines a biological threshold remains unclear. To clarify this, we identified molecular profiles in nine harmonised cBioPortal CRC cohorts (4,609 patients) by fitting Bernoulli mixture models to 31 repair-state, genomic-burden and gene-alteration features, excluding age, sex and tumour site, and compared their prevalence using <50/[&ge;]50 and decade-resolved groups. Four profiles captured conventional/CIN-like (P1), intermediate MSS (P2), KRAS/PI3K/APC-rich (P3) and hypermutated/MSI-high (P4) states along a left-to-right anatomical gradient. Although molecular identities remained stable, profile prevalence followed non-linear P1/P4 and opposing linear P2/P3 age trajectories. Profile prevalence patterns did not follow age distance: profile composition at 30-39 differed from 50-59 but not clearly from 40-49 or 60-69. The age-50 threshold captured only 17.8% of decade-resolved deviance, whereas the optimal age-70 cut-off retained only 51.3%. Validation in 2,235 non-overlapping MSK-IMPACT patients (2,134 age-evaluable) reproduced molecular-feature patterns (r=0.96-1.00), age trajectories (r=0.90) and limited binary-threshold performance: age 50 and the optimal age-75 cut-off retained 6.2% and 49.4%, respectively. Thus, age reorganises the prevalence of shared CRC states rather than defining a biological threshold at age 50.", "authors": "Bermudez-Guzman, L.; Ramos-Esquivel, A.; Alpizar-Alpizar, W.", "date": "2026-08-18", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5518, "score_semantic": 0.5518, "score_lexical": 0.6608, "matched": ["CIN", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.07.29.741620", "title": "Minimally invasive monitoring of clonal evolution through integrated single cell and ctDNA analysis", "abstract": "Circulating cell-free DNA (cfDNA) offers a minimally invasive lens into tumor evolution. However, the accurate quantification of clonal composition from cfDNA remains challenging. Existing methods for clone tracking using liquid biopsies are constrained by issues such as their reliance on bulk tissue references, incomplete representations of clonal architecture or limited breadth of mutation panels. To address these limitations, we developed cfClone, a Bayesian framework that integrates single-cell whole-genome sequencing (scWGS) derived clonal structures with cfDNA whole-genome sequencing (cfDNA-WGS) data to enable high-resolution tissue-informed clonal tracking. By jointly modeling local copy-number alterations and haplotype-specific signals via Bayesian model selection and Markov chain Monte Carlo (MCMC) sampling, the algorithm yields uncertainty-aware estimates of clonal prevalence and tumour fraction (TF). Applied to longitudinal clinical cohorts, cfClone can be used to reconstruct evolutionary trajectories and uncovers clonal selection driving therapeutic resistance, including the de novo detection of emergent clonal populations. We demonstrate that cfClone achieves accurate TF estimates and circulating tumor DNA (ctDNA) detection in malignancies with varying degrees of copy-number variant (CNV) burden using semi-synthetic data. We then compare to the state of the art scWGS informed panel based approach, and demonstrate cfClone provides comparable accuracy while allowing for the tracking of more clones and detection of novel clones. Finally, we show how cfClone can be used to quantitatively track clonal dynamics in response to treatment in high grade serous ovarian cancer.  Github link: https://github.com/Roth-Lab/cfclone", "authors": "Kabeer, F.; Lepur, M.; Lynch, B. J.; Hurtado, E.; Zaikova, E.; Senz, J.; Au, V.; Baril, C.; Ma, D.; Nicholson, S.; LUMES Consortium,  ; Ha, G.; McAlpine, J. N.; Aparicio, S.; Huntsman, D. G.; Bouchard-Cote, A.; Drew, Y.; Roth, A. J. L.", "date": "2026-08-19", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5264, "score_semantic": 0.5264, "score_lexical": 0.8897, "matched": ["tumor evolution", "clonal evolution", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.08.03.741871", "title": "Resolving the immune response across clonal cancer evolution in situ with Atera whole transcriptome profiling", "abstract": "Single-cell spatial transcriptomics is now central to studying tumors in their native tissue context. Here we present the first comprehensive, independent evaluation of Atera, a new spatial whole-transcriptome platform, compared with Xenium in human ductal carcinoma in situ (DCIS). We show that Atera enables granular cell-state annotation and resolves rare cell populations, experimentally validated by multiplex immunofluorescence (IF). We further show that its transcriptome-wide coverage enables inference of copy-number alterations at single-cell resolution, allowing us to reconstruct the clonal evolution of DCIS. We orthogonally confirm the inferred copy-number alterations by whole-genome sequencing of 16 microdissected tumor regions from consecutive tissue sections. Finally, by mapping the immune microenvironment onto this clonal architecture, we demonstrate the feasibility of tracking the changes in immune response along the clonal tumor evolution in situ. Together, our results establish Atera as a validated platform for tracking clonal evolution and immune adaptation in clinical samples.", "authors": "Wu, S.; Mahajan, M.; van der Linde, R. M.; Zhu, C.; West, R. B.; van IJzendoorn, D.; Matusiak, M.", "date": "2026-08-21", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4834, "score_semantic": 0.4834, "score_lexical": 1.0, "matched": ["tumor evolution", "clonal evolution", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.03.27.714785", "title": "Rise-and-fall dynamics reveal a molecular and cellular vulnerability axis in prion-like α-synuclein propagation", "abstract": "The spread of misfolded proteins through neuronal circuits is a defining feature of neurodegenerative disease, yet the dynamics underlying this process remain poorly understood. Most studies rely on sparsely sampled datasets that capture spatial patterns of pathology but not their temporal evolution. Here, we analyze longitudinal histopathology measurements of -synuclein pathology across hundreds of brain regions in a mouse model of Parkinsons disease. Network-based dynamical modeling shows that regional pathology does not simply accumulate but instead follows rise-and-fall trajectories across the brain. The inferred parameter landscape reveals a one-dimensional vulnerability axis along which regions with stronger rise-and-fall dynamics have elevated energy metabolism and greater monoaminergic neuronal composition. This vulnerability axis replicates in an independent histopathological dataset, indicating that its dominant transcriptomic structure is preserved. Together, these results suggest that regional vulnerability collapses onto a low-dimensional molecular and cellular axis defined by rise-and-fall dynamics.", "authors": "Alexandersen, C. G.; Brynildsen, J. K.; Prigent, A.; Tamborrino, M.; Mantziou, A.; Kurgat, K.; Henderson, M. X.; Bassett, D. S.", "date": "2026-08-19", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4813, "score_semantic": 0.4813, "score_lexical": 0.8675, "matched": ["histopathology"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.08.21.746140", "title": "Leptin receptor deficiency suppresses gastric tumorigenesis by limiting stromal activation and tumor microenvironment development.", "abstract": "Leptin receptor (LEPR) signaling has been implicated in multiple malignancies; however, its role in gastric tumors remains poorly defined. We previously demonstrated that mice with gastrointestinal epithelial cell-specific deletion of suppressor of cytokine signaling 3 (SOCS3 cKO), a negative feedback regulator of LEPR signaling, develop gastric tumors due to aberrant leptin production and LEPR activation. Here, we demonstrate that concurrent deletion of both Socs3 and Lepr (double knockout; DKO) under the same promoter substantially suppresses gastric tumorigenesis and markedly prolonged survival. Whereas SOCS3 cKO mice exhibited early stromal activation, increased TGF-{beta}1 production, accumulation of cancer-associated fibroblasts (CAFs) and collagen deposition, these tumor-promoting alterations were substantially attenuated in DKO mice. Additionally, DKO mice showed reduced inflammatory cytokine and chemokine signaling, decreased the accumulation of Gr-1+CD11b+ myeloid-derived suppressor cells, and reduced LEPR and TGF-{beta} signaling. Analysis of The Cancer Genome Atlas stomach adenocarcinoma cohort revealed high LEPR expression in the chromosomal instability and genomically stable subtypes, correlating with poor prognosis. Moreover, LEPR expression was mutually exclusive with CLDN18 and ERBB2, two major therapeutic biomarkers, and positively correlated with a CAF-related transcriptional signature. Our findings identify LEPR signaling in epithelial cells as a key driver of gastric tumorigenesis through promotion of stromal activation and tumor microenvironment development. They further highlight LEPR as a promising therapeutic target for patients with gastric cancer who are unlikely to benefit from current ERBB2/HER2- or CLDN18-directed therapies.", "authors": "Inagaki-Ohara, K.; Motooka, D.; Yamanaka, I.; Nakayama, T.; Abudureyimu, S.; Tezuka, H.; Sakurai, E.; Ushida, K.; Kato, T.; Nagao, S.; Minokoshi, Y.; Yoshimura, A.; Enomoto, A.; Asai, N.", "date": "2026-08-21", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4691, "score_semantic": 0.4691, "score_lexical": 0.76, "matched": ["chromosomal instability", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.08.19.745694", "title": "LSm4 biomolecular condensates drive XRN2-mediated RNA decay at DNA double-strand breaks to facilitate repair", "abstract": "Maintenance of genome integrity requires accurate repair of DNA double-strand breaks (DSBs), particularly within transcriptionally active regions. Persistent R-loops at DSBs can impede homologous recombination (HR) repair. While factors that resolve R-loops at DSB sites are known, the mechanisms ensuring timely degradation of nascent RNA to prevent pathological R-loop accumulation remain elusive. Here, we identified a critical role for the RNA-binding protein LSm4 in orchestrating localized RNA decay at DSBs to facilitate repair. We demonstrated that among LSm1-8 subunits, only LSm4 undergoes liquid-liquid phase separation (LLPS) and forms biomolecular condensates (BCs) specifically at DSBs in transcriptionally active chromatin. These damage-induced LSm4 BCs function as hubs that promote nuclear RNA decapping and recruit the 5'[-&gt;]3' exonuclease XRN2 to degrade nascent transcripts proximal to DSBs. Accordingly, LSm4-XRN2 axis suppresses R-loop hyperaccumulation, thereby enabling efficient RAD51 filament assembly and intact HR repair. Consequently, loss of LSm4 increases translocations and leads to genomic instability. Collectively, our findings define a new regulatory layer in which LSm4 BCs spatially license RNA degradation, preventing R-loop accumulation at DSB microenvironment to facilitate error-free repair.", "authors": "Darawshe, M. M.; Bishara, L. A.; Abu-Zhayia, E. R.; Barisaac, A. S.; Machour, F. E.; Elmor, C.; Ayoub, N.", "date": "2026-08-20", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4407, "score_semantic": 0.4407, "score_lexical": 0.8421, "matched": ["genomic instability"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.08.19.745832", "title": "High regeneration-associated stress defines a distinct HCC subgroup with therapeutically exploitable vulnerabilities", "abstract": "Background: To date, no precision oncology approach has been established for HCC. Despite the diverse underlying causes, HCC development exhibits a uniform pathophysiology characterised by chronic hyper-proliferation, resulting from hepatocyte apoptosis and compensatory liver regeneration. This chronic hyper-proliferative pressure, termed regeneration stress, drives genomic instability during HCC onset, yet its therapeutic potential remains poorly explored. This study aimed to identify targetable vulnerabilities tied to regeneration stress and establish clinically applicable markers for treatment stratification. Methods: Weighted gene co-expression network analysis (WGCNA) was applied on external bulk RNA-seq datasets to define a LIVer REgeneration Stress Signature (LIVRESS). The signature was functionally validated using HCC patient-derived organoids (HCC-Org), and vulnerabilities were mapped using mid-throughput drug screening, single-molecule and single-cell assays, and multi-omic integration. Results: High LIVRESS scores, characterised by enrichment in replication, mitotic and DNA damage repair pathways, identified a subset of HCC patients with aggressive disease and poorer survival across aetiologies. HCC-Org with high LIVRESS scores displayed exquisite sensitivity to multiple inhibitors of the checkpoint kinase ATR. Although HCC-Org models exhibited a baseline reduction in replication fork speed, sensitivity to ATR inhibitor (ATRi) was decoupled from replication fork dynamics and rather linked to intrinsic mitotic instability. ATR inhibition triggers mitotic failure and apoptosis in LIVRESSHigh HCC-Org. This killing effect was significantly potentiated by combining ATRi with PARPi or WEE1i. Multi-omic integration identified KPNA2 as a surrogate biomarker of ATRi sensitivity. Conclusion: Our findings demonstrate that a subset of HCC-Org, characterised by high liver regeneration-associated stress, is vulnerable to ATRi-based therapies. By focusing on a comprehensive regenerative stress model, we establish a framework to stratify HCC patients and implement biomarker-driven, ATR-based therapies for HCC patients with advanced disease. Impact and implications: Regeneration stress is a key factor that drives genomic instability in HCC, providing a basis for the LIVRESS to identify patients dependent on ATR-mediated checkpoints. These findings reveal a conceptual shift for researchers and trialists: ATRi efficacy is decoupled from replication fork dynamics and instead leverages mitotic fragility. Practically, the LIVRESS and its IHC surrogate marker (KPNA2) offer a scalable roadmap for physicians to improve patient stratification in ATRi-based precision oncology trials. While requiring prospective validation, these results pave the way toward biomarker-driven therapies for advanced HCC.", "authors": "Desboeufs, N.; Leary, P.; Zhao, C.; Kollar, S.; Chan, L. K.; Planas-Paz, L.; Fitsche, A.; Schmidt, A.; Prutek, F.; Baumann, K. R.; Schneebeli, S.; Dettwiler, S.; Dona, F.; Akpinar, R.; Terracciano, L. M.; Piscuoglio, S.; Di Tommaso, L.; Wild, K.; Summermatter, L.; Kobe, A.; Puippe, G. D.; Leblond, A.-L.; Endhardt, K.; Ng, C. K. Y.; Nuciforo, S.; Heim, M. H.; Fritsch, R.; Pauli, C.; Kremer, A. E.; Lopes, M.; Weber, A.", "date": "2026-08-20", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4174, "score_semantic": 0.4174, "score_lexical": 0.9294, "matched": ["genomic instability"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.08.13.743931", "title": "Simulation-guided non-thermal low-intensity ultrasound reprograms the tumor immune microenvironment and engages systemic antitumor immunity in a syngeneic orthotopic mouse model of breast cancer", "abstract": "IntroductionTherapeutic ultrasound has been extensively studied in ablative and sonodynamic contexts, leaving the intrinsic bioactivity of continuous non-thermal low-intensity ultrasound (LIU) largely uncharacterized.  ObjectivesTo characterize the tumor biological and immunomodulatory effects of non-thermal continuous LIU in complementary in vitro and in vivo breast cancer models, underpinned by a standardized exposure platform characterized through finite element simulations and experimental validation.  MethodsAcoustic and thermal fields were characterized and optimized using in silico simulations and validated against hydrophone and temperature measurements to ensure homogeneous, non-thermal exposure (1MHz, 1W/cm2, 100% duty cycle). 4T07 murine mammary carcinoma spheroids received 20min LIU treatment, and metabolic activity, apoptosis, and intracellular stress-associated markers were assessed. In a syngeneic orthotopic 4T07 mammary carcinoma model in BALB/c mice, up to six LIU treatment cycles were administered; tumor growth, survival, histopathology, immunohistochemistry, bulk tumor RNA sequencing, spleen volume and plasma cytokine profiles were assessed.  ResultsIn vitro and intratumoral temperatures remained within the physiological range ([&le;]39{degrees}C) throughout exposure. In spheroids, LIU reduced ATP content by more than 40% and significantly increased apoptotic, Hsp70 and Hsp90 cell fractions. In vivo, cyclic LIU slowed tumor growth, increased intratumoral necrosis, and significantly prolonged time to humane endpoint compared to untreated controls. LIU promoted early intratumoral myeloid cell infiltration and shifted the tumor transcriptome (2,573 differentially expressed genes), with enrichment in gene sets associated with immunogenic cell death, pattern-recognition, inflammatory, and innate and adaptive immune programs and downregulation of pro-tumorigenic pathways. LIU enriched the transcriptional signatures of M1 macrophage polarization and, notably, B-cell compartment engagement, which has not previously been reported for standalone continuous mechanical ultrasound. LIU significantly attenuated tumor-associated splenomegaly and elevated plasma IL-1, TNF-, and IL-10.  ConclusionThese results establish a reproducible preclinical platform and provide a hypothesis-generating mechanistic basis for evaluating LIU as an adjunct to immune checkpoint blockade.    O_FIG O_LINKSMALLFIG WIDTH=200 HEIGHT=124 SRC=\"FIGDIR/small/743931v1_ufig1.gif\" ALT=\"Figure 1\"> View larger version (49K): org.highwire.dtl.DTLVardef@31d366org.highwire.dtl.DTLVardef@12df6aborg.highwire.dtl.DTLVardef@9d91adorg.highwire.dtl.DTLVardef@c72b8a_HPS_FORMAT_FIGEXP  M_FIG C_FIG", "authors": "Hooshmandabbasi, R.; Kazemian, A.; Singha, R.; Vielma Blanco, M.; Nikkhah Bahrami, N.; Hauser, T.; Weyland, M. S.; Guscetti, F.; Wahl, D.; Fehr, D.; Bonmarin, M.; Scheidegger, S.; Maake, C.", "date": "2026-08-18", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4147, "score_semantic": 0.4147, "score_lexical": 0.6036, "matched": ["histopathology", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.08.12.744404", "title": "From Routine Pathology to Precision Oncology: Automated FFPE Tissue Processing for Large-Scale Molecular Studies", "abstract": "Melanoma incidence continues to rise globally, with formalin-fixed paraffin-embedded (FFPE) tissue archives representing an invaluable resource for large-scale retrospective proteomic studies. However, inconsistent deparaffinization remains a critical pre-analytical bottleneck limiting protein yield, reproducibility, and downstream data quality. In this study, we developed and validated a fully automated FFPE deparaffinization workflow using the Fluent(R) 780 liquid handling workstation (Tecan (C)) and evaluated its performance against a conventional manual protocol in a cohort of 54 patients with primary cutaneous melanoma, predominantly at early AJCC 8th edition stage I-II. The automated workflow achieved superior protein identification (6,146 {+/-} 860 vs. 4,941 {+/-} 1,091 proteins; p < 0.0001) with lower technical variability, while maintaining highly comparable global proteomic profiles as confirmed by principal component analysis and hierarchical clustering. A total of 8,305 proteins (96.1%) were identified by both methods, supporting the reproducibility and equivalence of the automated approach. Patients were stratified by the presence (N=21) or absence (N=33) of histological regression in the primary tumor. Proteomic comparison revealed 97 upregulated and 226 downregulated proteins in regressing melanomas, with pathway enrichment analysis demonstrating elevated mitochondrial and translational activity alongside reduced innate immune and complement pathway activation in the regression group. No statistically significant differences in overall, disease-free, or progression-free survival were observed between groups, consistent with the early-stage composition of the cohort. Digital pathology validated tissue morphology preservation across processing conditions. These findings support the integration of automated FFPE processing with proteomic and digital pathology workflows as a scalable platform for precision melanoma research.  TOC Figure  O_FIG O_LINKSMALLFIG WIDTH=200 HEIGHT=133 SRC=\"FIGDIR/small/744404v1_ufig1.gif\" ALT=\"Figure 1\"> View larger version (49K): org.highwire.dtl.DTLVardef@1a3ea5dorg.highwire.dtl.DTLVardef@6fb8edorg.highwire.dtl.DTLVardef@d60a4dorg.highwire.dtl.DTLVardef@3e47b6_HPS_FORMAT_FIGEXP  M_FIG C_FIG", "authors": "Guedes, J.; Sliwa-Gonzalez, A.; Szadai, L.; Geiger, P.; Woldmar, N.; Reyes, M. A.; Bastida, R. A.; Coto, D. L. F.; Oskolas, H.; Marko-Varga, M.; Schultz, L.; Appelqvist, R.; Wieslander, E.; Malm, J.; Marko-Varga, G.; Gil, J.", "date": "2026-08-17", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4043, "score_semantic": 0.4043, "score_lexical": 1.0, "matched": ["digital pathology"]}], "reports": [{"date": "2026-10-05", "label": "Oct 05, 2026", "n": 32}, {"date": "2026-09-28", "label": "Sep 28, 2026", "n": 32}, {"date": "2026-09-21", "label": "Sep 21, 2026", "n": 24}, {"date": "2026-09-14", "label": "Sep 14, 2026", "n": 26}, {"date": "2026-09-07", "label": "Sep 07, 2026", "n": 34}, {"date": "2026-08-31", "label": "Aug 31, 2026", "n": 19}, {"date": "2026-08-24", "label": "Aug 24, 2026", "n": 24}, {"date": "2026-08-17", "label": "Aug 17, 2026", "n": 18}, {"date": "2026-08-10", "label": "Aug 10, 2026", "n": 34}, {"date": "2026-08-03", "label": "Aug 03, 2026", "n": 17}, {"date": "2026-07-27", "label": "Jul 27, 2026", "n": 24}, {"date": "2026-07-20", "label": "Jul 20, 2026", "n": 26}, {"date": "2026-06-26", "label": "Jun 26, 2026", "n": 14}, {"date": "2026-06-19", "label": "Jun 19, 2026", "n": 38}], "prefix": "", "home": "../papers.html"}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const papers = DATA.papers;
  const SHORT = 280;
  // Slider floor: the pipeline threshold, or lower if older data scored below it
  const FLOOR = Math.floor(Math.min(DATA.threshold, ...papers.map(p => p.score)) * 100) / 100;

  // ── Persistent per-browser state (stars / read), keyed by paper URL ──
  const store = {
    get(k, fallback) {
      try { const v = localStorage.getItem('papertrail:' + k); return v ? JSON.parse(v) : fallback; }
      catch { return fallback; }
    },
    set(k, v) {
      try { localStorage.setItem('papertrail:' + k, JSON.stringify(v)); } catch {}
    },
  };
  const starred = new Map(Object.entries(store.get('starred', {})));  // id -> paper snapshot
  const read    = new Set(store.get('read', []));
  const saveStars = () => store.set('starred', Object.fromEntries(starred));
  const saveRead  = () => store.set('read', [...read]);

  const prefs = store.get('prefs', {});
  const state = {
    q: '',
    view: 'all',
    sort: prefs.sort || 'score',
    min: FLOOR,
    sources: new Set(),
    keyword: null,
    expanded: new Set(),
    scope: 'week',        // 'week' = this report, 'all' = every archived week
    limit: 100,           // cards rendered before "Show more"
  };
  const PAGE = 100;

  // ── All-weeks index: loaded on demand from reports/search-index.js ──
  let ALL = null, loadingAll = false;
  function loadAll() {
    if (ALL || loadingAll) return;
    loadingAll = true;
    const s = document.createElement('script');
    s.src = (DATA.prefix || '') + 'search-index.js';
    s.onload = () => { ALL = window.PAPERTRAIL_INDEX || []; loadingAll = false; render(); };
    s.onerror = () => {
      loadingAll = false; state.scope = 'week'; render();
      $('count').textContent = 'Could not load the all-weeks index (reports/search-index.js).';
    };
    document.head.appendChild(s);
  }
  const pool = () => state.scope === 'all' && ALL ? ALL : papers;

  // ── Helpers ──
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const scoreVar = s => s >= 0.5 ? 'var(--high)' : s >= 0.35 ? 'var(--mid)' : 'var(--low)';
  const isPreprint = p => !p.journal || p.journal === 'preprint';
  const url = p => (p.id && !p.id.startsWith('http')) ? 'https://doi.org/' + p.id : p.id;
  // Dates come as "2026-09-02", "2026-Sep-02" (PubMed) or just "2026-Sep"
  const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const dateKey = d => {
    const m = /^(\d{4})(?:-(\w+))?(?:-(\d+))?/.exec(d || '');
    if (!m) return 0;
    const mon = m[2] ? (/^\d+$/.test(m[2]) ? +m[2] - 1 : MONTHS.indexOf(m[2].slice(0, 3).toLowerCase())) : 0;
    return Date.UTC(+m[1], Math.max(mon, 0), m[3] ? +m[3] : 1);
  };

  // Keyword highlighting: whole-token matches, longest first
  const kwRe = DATA.keywords.length
    ? new RegExp('\\b(' + [...DATA.keywords].sort((a, b) => b.length - a.length).map(reEsc).join('|') + ')\\b', 'gi')
    : null;
  function highlight(text) {
    const parts = [];
    const res = [kwRe];
    const q = state.q.trim();
    if (q.length >= 2) res.push(new RegExp('(' + q.split(/\s+/).map(reEsc).join('|') + ')', 'gi'));
    // Collect ranges from all regexes on raw text, then merge and escape
    const ranges = [];
    for (const re of res) {
      if (!re) continue;
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(text))) { if (!m[0]) { re.lastIndex++; continue; } ranges.push([m.index, m.index + m[0].length]); }
    }
    if (!ranges.length) return esc(text);
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [ranges[0].slice()];
    for (const r of ranges.slice(1)) {
      const last = merged[merged.length - 1];
      if (r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push(r.slice());
    }
    let i = 0;
    for (const [a, b] of merged) { parts.push(esc(text.slice(i, a)), '<mark>', esc(text.slice(a, b)), '</mark>'); i = b; }
    parts.push(esc(text.slice(i)));
    return parts.join('');
  }

  const hayCache = new WeakMap();
  const hay = p => {
    let h = hayCache.get(p);
    if (h === undefined) {
      h = [p.title, p.abstract, p.authors, p.journal, p.source].join(' ').toLowerCase();
      hayCache.set(p, h);
    }
    return h;
  };

  // ── Filtering ──
  function filtered() {
    const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    let list = state.view === 'starred'
      ? [...starred.values()]
      : pool();
    list = list.filter(p => {
      if (state.view !== 'starred' && p.score < state.min) return false;
      if (state.view === 'unread' && read.has(p.id)) return false;
      if (state.sources.size && !state.sources.has(p.source)) return false;
      if (state.keyword && !(p.matched || []).includes(state.keyword)) return false;
      if (terms.length) {
        const h = hay(p);
        if (!terms.every(t => h.includes(t))) return false;
      }
      return true;
    });
    const by = {
      score: (a, b) => b.score - a.score,
      date:  (a, b) => dateKey(b.date) - dateKey(a.date) || b.score - a.score,
      if:    (a, b) => (b.if ?? -1) - (a.if ?? -1) || b.score - a.score,
    }[state.sort];
    return [...list].sort(by);
  }

  // ── Rendering ──
  const ICON_STAR = '<svg viewBox="0 0 24 24" fill="FILL" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  // Link to the report(s) a paper appeared in, when not the one being viewed
  const LABELS = Object.fromEntries((DATA.reports || []).map(r => [r.date, r.label]));
  function weekTag(p) {
    const weeks = (p.weeks || []).filter(w => w !== DATA.date || state.scope === 'all');
    if (!weeks.length || (state.scope !== 'all' && state.view !== 'starred')) return '';
    const [w, ...rest] = weeks;
    const label = w === DATA.date ? 'This week' : 'Week of ' + (LABELS[w] || w);
    return `<a class="week-tag" href="${esc((DATA.prefix || '') + w + '.html')}" title="${esc(weeks.map(x => LABELS[x] || x).join(', '))}">${esc(label)}${rest.length ? ` +${rest.length}` : ''}</a>`;
  }

  function card(p) {
    const s = p.score ?? 0;
    const abs = p.abstract || '';
    const long = abs.length > SHORT;
    const open = state.expanded.has(p.id);
    const shown = long && !open ? abs.slice(0, SHORT) + '…' : abs;
    const ifStr = p.if != null ? ` · IF ${Number(p.if).toFixed(1)}` : '';
    const authors = p.authors || '';
    const isStar = starred.has(p.id), isRead = read.has(p.id);
    const u = url(p);
    return `
      <article class="card${isRead ? ' is-read' : ''}" style="--score-color:${scoreVar(s)}" data-id="${esc(p.id)}">
        <div class="card-top">
          <a class="title" href="${esc(u)}" target="_blank" rel="noopener">${highlight(p.title || '')}</a>
          <div class="score-block" title="semantic ${p.score_semantic ?? '–'} · lexical ${p.score_lexical ?? '–'}">
            <div class="score-pill">${s.toFixed(2)}</div>
            <div class="score-bar-track"><div class="score-bar-fill" style="width:${Math.min(s * 100, 100)}%"></div></div>
          </div>
        </div>
        <div class="card-meta">
          <span class="badge${isPreprint(p) ? ' preprint' : ''}">${esc(p.source)}</span>
          ${!isPreprint(p) ? `<span>${esc(p.journal)}${ifStr}</span>` : ''}
          <span>${esc(p.date)}</span>
          <span title="${esc(authors)}">${esc(authors.length > 60 ? authors.slice(0, 60) + '…' : authors)}</span>
          ${weekTag(p)}
        </div>
        <div class="abstract">${highlight(shown)}${long ? `<button class="toggle-btn" data-act="toggle">${open ? 'Show less' : 'Show more'}</button>` : ''}</div>
        <div class="card-foot">
          <div class="matched">${(p.matched || []).map(k => `<button class="kw" data-kw="${esc(k)}" title="Filter by this keyword">${esc(k)}</button>`).join('')}</div>
          <button class="act${isStar ? ' on' : ''}" data-act="star" aria-pressed="${isStar}">${ICON_STAR.replace('FILL', isStar ? 'currentColor' : 'none')}${isStar ? 'Starred' : 'Star'}</button>
          <button class="act${isRead ? ' read-on' : ''}" data-act="read" aria-pressed="${isRead}">${ICON_CHECK}${isRead ? 'Read' : 'Mark read'}</button>
          <a class="doi-link" href="${esc(u)}" target="_blank" rel="noopener">Open ↗</a>
        </div>
      </article>`;
  }

  const $ = id => document.getElementById(id);

  function renderChips() {
    const counts = {};
    const src = state.view === 'starred' ? [...starred.values()] : pool();
    src.forEach(p => { counts[p.source] = (counts[p.source] || 0) + 1; });
    $('sources').innerHTML = Object.keys(counts).sort().map(src =>
      `<button class="chip" data-src="${esc(src)}" aria-pressed="${state.sources.has(src)}">${esc(src)}<span class="n">${counts[src]}</span></button>`
    ).join('');
    const kwCounts = {};
    src.forEach(p => (p.matched || []).forEach(k => { kwCounts[k] = (kwCounts[k] || 0) + 1; }));
    $('keywords').innerHTML = DATA.keywords.map(k =>
      `<button class="chip" data-kw="${esc(k)}" aria-pressed="${state.keyword === k}">${esc(k)}<span class="n">${kwCounts[k] || 0}</span></button>`
    ).join('');
  }

  // Filter changes start from the first page again
  const update = () => { state.limit = PAGE; render(); };

  function render() {
    const list = filtered();
    const papersEl = $('papers');
    if (state.scope === 'all' && !ALL) {
      papersEl.innerHTML = '<div class="empty">Loading all weeks…</div>';
    } else if (list.length) {
      const rest = list.length - state.limit;
      papersEl.innerHTML = list.slice(0, state.limit).map(card).join('') +
        (rest > 0 ? `<button class="more-btn" data-act="more">Show ${Math.min(rest, PAGE)} more (${rest} left)</button>` : '');
    } else {
      papersEl.innerHTML = `<div class="empty">${state.view === 'starred' && !starred.size
        ? 'No starred papers yet — star papers to build a reading list. It is saved in this browser.'
        : 'No papers match these filters.'}</div>`;
    }
    const base = state.view === 'starred' ? starred.size : pool().length;
    const what = state.view === 'starred' ? 'starred papers'
      : state.scope === 'all' ? `papers across ${(DATA.reports || []).length} weeks` : 'papers';
    $('count').textContent = `Showing ${list.length} of ${base} ${what}`;
    $('star-n').textContent = starred.size ? `(${starred.size})` : '';
    $('export').hidden = state.view !== 'starred' || !starred.size;
    const dirty = state.q || state.sources.size || state.keyword || state.min !== FLOOR;
    $('reset').hidden = !dirty;
    document.querySelectorAll('#view button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === state.view));
    document.querySelectorAll('#scope button').forEach(b => b.setAttribute('aria-pressed', b.dataset.scope === state.scope));
    $('scope').hidden = (DATA.reports || []).length < 2;
    renderChips();
  }

  // ── Header / footer ──
  $('meta').textContent =
    `${papers.length} of ${DATA.total} relevant papers · Past ${DATA.days} days · Generated ${DATA.generated}`;
  $('footer').textContent = `Generated by PaperTrail · Sources: ${DATA.sources.join(', ')}`;
  if (DATA.imported) {
    $('meta').insertAdjacentHTML('afterend',
      '<div class="imported-note">Recovered from an older report: author lists are shortened.</div>');
  }

  // ── Week navigation (reports are listed newest first) ──
  const REPORTS = DATA.reports || [];
  const here = REPORTS.findIndex(r => r.date === DATA.date);
  const href = r => (DATA.prefix || '') + r.date + '.html';
  if (REPORTS.length > 1 && here !== -1) {
    $('weeks').hidden = false;
    $('week').innerHTML = REPORTS.map((r, i) =>
      `<option value="${i}"${i === here ? ' selected' : ''}>${esc(r.label)} · ${r.n} papers${i === 0 ? ' · latest' : ''}</option>`
    ).join('');
    $('week').addEventListener('change', e => { location.href = href(REPORTS[+e.target.value]); });
    const link = (el, r) => r ? (el.href = href(r)) : el.setAttribute('aria-disabled', 'true');
    link($('prev'), REPORTS[here + 1]);
    link($('next'), REPORTS[here - 1]);
    if (here === 0) $('latest').hidden = true; else $('latest').href = DATA.home;
  }

  // ── Controls ──
  const min = $('min');
  min.min = FLOOR;
  min.value = state.min;
  $('min-val').textContent = state.min.toFixed(2);
  $('sort').value = state.sort;

  let t;
  $('q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; update(); }, 120); });
  min.addEventListener('input', e => { state.min = +e.target.value; $('min-val').textContent = state.min.toFixed(2); update(); });
  $('sort').addEventListener('change', e => { state.sort = e.target.value; store.set('prefs', { ...prefs, sort: state.sort }); update(); });
  $('view').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.view = b.dataset.view; update();
  });
  $('scope').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.scope = b.dataset.scope;
    if (state.scope === 'all') loadAll();
    update();
  });
  $('sources').addEventListener('click', e => {
    const b = e.target.closest('[data-src]'); if (!b) return;
    const s = b.dataset.src;
    state.sources.has(s) ? state.sources.delete(s) : state.sources.add(s);
    update();
  });
  const toggleKw = k => { state.keyword = state.keyword === k ? null : k; update(); };
  $('keywords').addEventListener('click', e => { const b = e.target.closest('[data-kw]'); if (b) toggleKw(b.dataset.kw); });
  $('reset').addEventListener('click', () => {
    state.q = ''; $('q').value = '';
    state.sources.clear(); state.keyword = null;
    state.min = FLOOR; min.value = state.min; $('min-val').textContent = state.min.toFixed(2);
    update();
  });
  $('export').addEventListener('click', () => {
    const lines = [...starred.values()].sort((a, b) => b.score - a.score).map(p =>
      `- [${p.title}](${url(p)})  \n  ${p.authors ? p.authors.split(/[,;]/)[0].trim() + ' et al. · ' : ''}${isPreprint(p) ? p.source : p.journal} · ${p.date}`);
    const blob = new Blob([`# PaperTrail — starred papers\n\n${lines.join('\n')}\n`], { type: 'text/markdown' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'papertrail-starred.md' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $('papers').addEventListener('click', e => {
    const kw = e.target.closest('.matched [data-kw]');
    if (kw) { toggleKw(kw.dataset.kw); return; }
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    if (btn.dataset.act === 'more') { state.limit += PAGE; render(); return; }
    const id = btn.closest('.card').dataset.id;
    const p = pool().find(x => x.id === id) || papers.find(x => x.id === id) || starred.get(id);
    const act = btn.dataset.act;
    if (act === 'toggle') { state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); }
    if (act === 'star')   { starred.has(id) ? starred.delete(id) : starred.set(id, { ...p, weeks: p.weeks || [DATA.date] }); saveStars(); }
    if (act === 'read')   { read.has(id) ? read.delete(id) : read.add(id); saveRead(); }
    render();
  });

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
    if (e.key === 'Escape' && document.activeElement === $('q')) { $('q').blur(); }
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (!typing && e.key === '[' && $('prev').href) location.href = $('prev').href;
    if (!typing && e.key === ']' && $('next').href) location.href = $('next').href;
  });

  render();
})();
</script>
</body>
</html>
