<head>

<title>PaperTrail — September 07, 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #F7F7F5;
    --surface:   #FFFFFF;
    --text:      #1A1A2E;
    --body:      #374151;
    --muted:     #6B7280;
    --accent:    #2D6A4F;
    --accent-bg: #E3F0E9;
    --border:    #E5E7EB;
    --high:      #2D6A4F;
    --mid:       #D97706;
    --low:       #DC2626;
    --badge-bg:  #EEF2FF;
    --badge-fg:  #4338CA;
    --pre-bg:    #FEF3C7;
    --pre-fg:    #92400E;
    --mark:      #FDE68A;
    --star:      #D97706;
    --shadow:    rgba(0,0,0,0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #14161B;
      --surface:   #1C1F26;
      --text:      #ECEDEF;
      --body:      #C9CCD3;
      --muted:     #9097A3;
      --accent:    #6FC69A;
      --accent-bg: #1F3A2D;
      --border:    #2D313A;
      --high:      #6FC69A;
      --mid:       #F0A93B;
      --low:       #F07171;
      --badge-bg:  #262B45;
      --badge-fg:  #A5B4FC;
      --pre-bg:    #3A2F14;
      --pre-fg:    #F5C969;
      --mark:      #5C4A12;
      --star:      #F0A93B;
      --shadow:    rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg:        #14161B;
    --surface:   #1C1F26;
    --text:      #ECEDEF;
    --body:      #C9CCD3;
    --muted:     #9097A3;
    --accent:    #6FC69A;
    --accent-bg: #1F3A2D;
    --border:    #2D313A;
    --high:      #6FC69A;
    --mid:       #F0A93B;
    --low:       #F07171;
    --badge-bg:  #262B45;
    --badge-fg:  #A5B4FC;
    --pre-bg:    #3A2F14;
    --pre-fg:    #F5C969;
    --mark:      #5C4A12;
    --star:      #F0A93B;
    --shadow:    rgba(0,0,0,0.35);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 2rem 1rem 4rem;
  }

  .page { max-width: 780px; margin: 0 auto; }
  button, input, select { font: inherit; color: inherit; }

  /* ── Header ── */
  header { margin-bottom: 1.25rem; }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .logo span { color: var(--text); }
  .head-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.6rem 1rem; }
  .weeks { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; }
  .weeks select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.3rem 0.5rem; font-size: 0.82rem; max-width: 62vw;
  }
  .wk-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); text-decoration: none; font-size: 1.1rem; line-height: 1;
  }
  .wk-btn:hover { border-color: var(--accent); color: var(--accent); }
  .wk-btn[aria-disabled="true"] { opacity: 0.35; pointer-events: none; }
  .weeks .linkish { text-decoration: none; white-space: nowrap; }
  .imported-note { color: var(--muted); font-size: 0.78rem; margin-top: 0.25rem; }
  .meta { margin-top: 0.4rem; color: var(--muted); font-size: 0.85rem; }

  /* ── Controls ── */
  .controls {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 0.75rem 0 0.9rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 0.6rem;
  }
  .search {
    width: 100%;
    padding: 0.55rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    font-size: 0.9rem;
  }
  .search-row { display: flex; gap: 0.5rem; align-items: stretch; }
  .search-row .search { flex: 1; min-width: 0; }
  .search-row .seg button { padding: 0 0.75rem; white-space: nowrap; }
  .week-tag {
    font-size: 0.72rem; font-weight: 500; color: var(--accent);
    text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  .week-tag:hover { border-bottom-style: solid; }
  .more-btn {
    align-self: center; margin-top: 0.25rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.45rem 1.1rem; font-size: 0.85rem; cursor: pointer; color: var(--accent);
  }
  .more-btn:hover { border-color: var(--accent); }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; font-size: 0.82rem; color: var(--muted); }
  .row label { display: inline-flex; align-items: center; gap: 0.4rem; }
  .row select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.2rem 0.4rem; font-size: 0.82rem;
  }
  .row input[type=range] { accent-color: var(--accent); width: 110px; }
  .row input[type=checkbox] { accent-color: var(--accent); }
  .min-val { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 500; min-width: 2.2em; }

  .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .chip {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 0.74rem; font-weight: 500;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .chip .n { opacity: 0.7; margin-left: 0.25rem; font-variant-numeric: tabular-nums; }

  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: var(--surface); border: none; padding: 0.2rem 0.65rem;
    font-size: 0.8rem; cursor: pointer; color: var(--muted);
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }

  .status { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--muted); }
  .linkish { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.8rem; font-weight: 500; }
  .linkish:hover { text-decoration: underline; }

  /* ── Cards ── */
  .papers { display: flex; flex-direction: column; gap: 1rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--score-color, var(--border));
    border-radius: 0 8px 8px 0;
    padding: 1.25rem 1.5rem 1rem;
    transition: box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .card:hover { box-shadow: 0 4px 16px var(--shadow); }
  .card.is-read { opacity: 0.55; }
  .card.is-read:hover { opacity: 1; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 0.5rem;
  }

  .title {
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .title:hover { color: var(--accent); }

  /* Score pill + bar */
  .score-block { flex-shrink: 0; text-align: right; min-width: 48px; }
  .score-pill {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--score-color);
    font-variant-numeric: tabular-nums;
  }
  .score-bar-track {
    width: 48px; height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 4px;
  }
  .score-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--score-color);
  }

  .card-meta {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.6rem;
    display: flex; flex-wrap: wrap; gap: 0.3rem 0.75rem;
    align-items: center;
  }
  .badge {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.1rem 0.45rem;
    border-radius: 4px;
    background: var(--badge-bg);
    color: var(--badge-fg);
  }
  .badge.preprint { background: var(--pre-bg); color: var(--pre-fg); }

  .abstract {
    font-size: 0.875rem;
    color: var(--body);
    line-height: 1.65;
    overflow-wrap: anywhere;
  }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .toggle-btn {
    background: none; border: none; cursor: pointer;
    color: var(--accent); font-size: 0.8rem; font-weight: 500;
    padding: 0; margin-top: 0.3rem; display: block;
  }
  .toggle-btn:hover { text-decoration: underline; }

  .card-foot {
    margin-top: 0.7rem;
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.9rem;
    font-size: 0.78rem;
  }
  .matched { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-right: auto; }
  .matched .kw {
    background: var(--accent-bg); color: var(--accent);
    font-size: 0.7rem; font-weight: 500;
    padding: 0.05rem 0.5rem; border-radius: 999px;
    border: none; cursor: pointer;
  }
  .act {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 0.78rem; padding: 0.1rem 0;
    display: inline-flex; align-items: center; gap: 0.25rem;
  }
  .act:hover { color: var(--accent); }
  .act.on { color: var(--star); }
  .act.read-on { color: var(--accent); }
  .act svg { width: 14px; height: 14px; }
  .doi-link { color: var(--muted); text-decoration: none; }
  .doi-link:hover { color: var(--accent); }

  .empty {
    text-align: center; color: var(--muted); font-size: 0.9rem;
    padding: 3rem 1rem; border: 1px dashed var(--border); border-radius: 8px;
  }

  /* ── Footer ── */
  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
  }

  @media (max-width: 560px) {
    .search-row { flex-direction: column; }
    .search-row .seg button { flex: 1; padding: 0.3rem 0.5rem; }
    body { padding: 1.25rem 1rem 3rem; }
    .card { padding: 1rem 1rem 0.85rem; }
    .controls { position: static; }
  }
</style>
</head>
<body>
<div class="page">

<header>
  <div class="head-row">
    <div class="logo">Paper<span>Trail</span></div>
    <nav class="weeks" id="weeks" aria-label="Weekly reports" hidden>
      <a class="wk-btn" id="prev" title="Previous week  ( [ )" aria-label="Previous week">‹</a>
      <select id="week" aria-label="Choose week"></select>
      <a class="wk-btn" id="next" title="Next week  ( ] )" aria-label="Next week">›</a>
      <a class="linkish" id="latest">Latest →</a>
    </nav>
  </div>
  <div class="meta" id="meta"></div>
</header>

<div class="controls">
  <div class="search-row">
    <input class="search" id="q" type="search" placeholder="Search papers, authors, journals…" autocomplete="off">
    <div class="seg" id="scope" role="group" aria-label="Search scope">
      <button data-scope="week" aria-pressed="true">This week</button>
      <button data-scope="all">All weeks</button>
    </div>
  </div>
  <div class="row">
    <div class="seg" id="view" role="group" aria-label="View">
      <button data-view="all" aria-pressed="true">All</button>
      <button data-view="unread">Unread</button>
      <button data-view="starred">Starred <span id="star-n"></span></button>
    </div>
    <label>Sort
      <select id="sort">
        <option value="score">Relevance</option>
        <option value="date">Newest</option>
        <option value="if">Impact factor</option>
      </select>
    </label>
    <label>Min score
      <input id="min" type="range" min="0" max="1" step="0.01">
      <span class="min-val" id="min-val"></span>
    </label>
  </div>
  <div class="chips" id="sources" aria-label="Sources"></div>
  <div class="chips" id="keywords" aria-label="Keywords"></div>
  <div class="status">
    <span id="count" aria-live="polite"></span>
    <span>
      <button class="linkish" id="export" hidden>Export starred</button>
      <button class="linkish" id="reset" hidden>Clear filters</button>
    </span>
  </div>
</div>

<div class="papers" id="papers"></div>

<footer id="footer"></footer>

i A, Estill JC, Kunju LP, Yang C, Robinson DR, Chinnaiyan AM", "date": "2026-Sep-01", "source": "PubMed", "journal": "Cancer discovery", "if": 29.7, "score": 0.6939, "score_semantic": 0.6939, "score_lexical": 0.7082, "matched": ["genomic instability", "cancer"]}, {"id": "https://doi.org/10.1016/j.ccell.2026.07.013", "title": "Tumor evolution shapes metastatic competence in colorectal cancer.", "abstract": "In this issue of Cancer Cell, Manca et al. investigate the genomic evolution and metastatic tropism of over 7,000 colorectal cancers. Integrating primary tumor location, genomic alterations, and clinical variables, they reveal how distinct patterns of tumor evolution shape metastatic competence and impact organ tropism, offering a framework to refine surveillance.", "authors": "Verhagen MP, Vermeulen L", "date": "2026-Sep-14", "source": "PubMed", "journal": "Cancer cell", "if": 38.6, "score": 0.6466, "score_semantic": 0.6466, "score_lexical": 1.0, "matched": ["tumor evolution", "cancer"]}, {"id": "https://doi.org/10.1016/j.ccell.2026.08.007", "title": "Tumor immune microenvironment remodeling predicts response to checkpoint inhibitor therapy.", "abstract": "Immune checkpoint inhibitors (ICIs) have transformed cancer therapy, yet the basis of variable patient responses remains unclear. We assemble a longitudinal single-cell RNA sequencing atlas of 441 samples from 241 patients across ten cancer entities to map treatment-associated remodeling of the tumor immune microenvironment (TIME). With a hierarchical reference-guided deep-phenotyping framework, we define 77 immune and stromal subtypes and resolve four conserved TIME subtypes. Approximately 40% of tumors shift between states during therapy, and the transition is more predictive of outcome than the baseline state. Favorable transitions toward inflamed or B cell-enriched subtype track with improved response and survival, while persistence in or shifts toward myeloid dominance indicate resistance. We derive a 59-gene signature that predicted response and survival for 1,383 baseline tumors across 19 independent cohorts. These findings establish immunotype transitions as a central determinant of ICI efficacy, offering new avenues for response prediction and rational immunotherapy design.", "authors": "Lin Z, Chandra M, Srinivas N, Ugurel S, Becker JC, Aran D", "date": "2026-Sep-14", "source": "PubMed", "journal": "Cancer cell", "if": 38.6, "score": 0.6369, "score_semantic": 0.6369, "score_lexical": 0.7171, "matched": ["cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.02.748933", "title": "Nuclear Cathepsin L Remodels the Replication Machinery to Create a Therapeutic Vulnerability in Ovarian Cancer", "abstract": "Abstract Therapeutic resistance in ovarian cancer is frequently driven by persistent replication stress, yet the molecular mechanisms that convert replication stress into a therapeutically exploitable vulnerability remain incompletely understood. Here, we identify drug-induced nuclear cathepsin L (nCTSL) as a previously unrecognized regulator of replication stress and DNA repair. Clofarabine (CLF) combined with the ATR inhibitor AZD6738, or the CHK1 inhibitor prexasertib promoted nuclear accumulation of CTSL, where it remodeled the replication machinery through degradation of CCNE1, MCM3, MCM6, and geminin, accompanied by loss of RAD51 and 53BP1 and increased {gamma}H2AX and phospho-RPA2. DNA fiber analysis demonstrated marked inhibition of replication fork progression following CLF-based combinations, whereas CTSL depletion accelerated fork progression and abolished therapy-induced replication stress. Reconstitution with the nuclear M1F CTSL isoform restored replication restraint, confirming a direct role for nuclear CTSL in regulating replication dynamics. GFP-based DNA repair reporter assays further revealed that CLF-based combinations suppress DNA repair competence in a CTSL-dependent manner, indicating that nuclear CTSL couples replication stress amplification with functional inhibition of repair pathways. Functionally, CLF-based combinations selectively targeted transformed fallopian tube secretory epithelial cells while sparing non-transformed counterparts, demonstrated broad activity in patient-derived ovarian cancer ascites spheroids, and significantly inhibited tumor growth and prolonged survival in vivo. Collectively, our findings identify nuclear CTSL as a mechanistic driver of replication stress that remodels the replication machinery, impairs DNA repair, and creates a therapeutically exploitable vulnerability in ovarian cancer. We propose that nuclear CTSL promotes a transition from replication competence to replication catastrophe, thereby establishing a conceptual framework for biomarker-guided therapeutic strategies targeting CTSL-dependent replication stress.", "authors": "Thirusangu, P.; Jin, L.; Rao, S.; Balakrishnan, K.; Hou, X.; VanBlaricom, J. L.; Lee, S.-H.; Oberg, A. L.; Weroha, J.; Kaufmann, S. H.; Bakkum-Gamez, J. N.; Shridhar, V.", "date": "2026-09-03", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6218, "score_semantic": 0.6218, "score_lexical": 0.7893, "matched": ["cancer"]}, {"id": "https://doi.org/10.1158/2159-8290.CD-26-1266", "title": "Malignant Transition in Three Dimensions.", "abstract": "Breast and prostate cancers share notable similarities in their progression to invasive disease, providing a unique opportunity to uncover common mechanisms of malignant transition. By integrating volumetric reconstruction with multimodal spatial profiling, Storrs and colleagues revealed the precancer-to-cancer transition as a continuous three-dimensional process and identified shared molecular programs associated with invasion. See related article by Storrs et al., p. 1819.", "authors": "Jing Z, Li M", "date": "2026-Sep-01", "source": "PubMed", "journal": "Cancer discovery", "if": 29.7, "score": 0.6206, "score_semantic": 0.6206, "score_lexical": 0.6627, "matched": ["cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.02.749005", "title": "Multi-hit STAG2 mutations define a high-risk subset of MDS and reveal convergent evolutionary targeting of cohesin", "abstract": "STAG2 is the most frequently mutated cohesin gene in myeloid neoplasms, yet the significance of multiple mutations within this X-linked tumor suppressor remains unknown. We analyzed a cohort of 1,967 adult patients with myeloid neoplasms and identified 233 cases (12%) harboring STAG2 mutations, including 38 cases (16%) with multiple STAG2 hits. Patients with multi-hit STAG2 mutations exhibited increased multilineage dysplasia compared with single-hit cases and experienced inferior overall survival, an effect driven primarily by patients with myelodysplastic syndromes (MDS). To investigate the molecular basis of recurrent STAG2 acquisition, we performed long-read sequencing in representative cases with phaseable STAG2 mutations. In the informative case examined, distinct truncating STAG2 mutations did not co-occur on the same DNA molecule, supporting independent acquisition rather than stepwise allelic inactivation. Cohort-level variant allele frequency patterns were consistent with recurrent evolutionary targeting of STAG2 across related clonal populations. Together, these findings support a model in which multi-hit STAG2 mutations arise through convergent evolution and define a biologically distinct, adverse-risk subset of MDS.", "authors": "Udoh, E.-o. B.; Chen, Y.; D'Addona, M.; Stewart, E.; Deng, R.; de Almeida Sartori, F.; Unlu, S.; Brady, Z.; Zhu, R.; Cheng, X.; Scoca, V.; Xu, J. J.; Doulatov, S.; Theil, K.; Bosler, D.; Visconte, V.; Maciejewski, J. P.; Viny, A. D.", "date": "2026-09-03", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6199, "score_semantic": 0.6199, "score_lexical": 0.951, "matched": ["tumor evolution", "clonal evolution"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.08.27.26361341", "title": "Genome Profiling of Actionable Cancer Targets (NYU LG-PACT) for Clinical Patient Molecular Diagnostics and Treatment", "abstract": "Next-generation sequencing (NGS) for the detection of somatic variants has become the method of choice in a variety of molecular oncology fields and in the clinic. Its use ranges from sequencing entire tumor genomes and transcriptomes to targeted clinical diagnostic gene panels. The NYU Langone Genome PACT (Profiling of Actionable Cancer Targets, LG-PACT) assay is a qualitative in vitro diagnostic test that uses targeted next generation sequencing (NGS) of formalin-fixed paraffin-embedded (FFPE) tumor tissue matched with normal specimens from patients to detect gene alterations in a targeted panel covering 606 genes and the TERT promoter. Indications for testing are cancer (solid tumors and hematological malignancies) where a mutational profile from multiple genes would be informative for disease stratification, prognosis, or treatment options including targeted therapies and eligibility for clinical trials. The test is intended to provide information on somatic mutations including point mutations, small insertions/deletions (indels), and copy number aberrations for diagnostic and treatment decisions. LG-PACT is a United States Food and Drug Administration (FDA) cleared diagnostic test (510K: K202304). The clinical interpretation of sequencing data of molecular tumor markers from NGS encompasses automated variant calling tools with human interpretation. This final mostly manual review of data step is intensive, involving highly trained scientists, encompassing literature review, interpretation and clinical tier classification by pathologists, who then provide a complete molecular diagnostic report to the treating oncologists. We provide analysis of 1339 clinical genomic profiles from 31 different cancers and their subtypes, comprising of central nervous system (CNS) 792 (59%) cases (incl. meningioma, glioma and glioblastoma), with 267 (20%) cases predominantly of lung, pancreatic and colorectal and 280 of others (21%). Here, we present the technical challenges of validating an NGS oncological diagnostic targeted assay for clinical grade accuracy and sensitivity for patient care. We show how copy number alterations provide a more comprehensive description of the tumors genomic profile. We then outline the utility of targeted panel sequencing based on certified pathologist selection of reportable variants for our current patient cohort. Where analysis of variant detection has led to 49.4% (661/1339) of our clinical tumor samples containing mutations in known therapy targeted genes, 35.6% (477/1339) with mutation detected in other genes, and 15% (201/1339) cases being negative.", "authors": "Yang, Y.; Vasudevaraja, V.; Serrano, J.; Mohamed, H.; Kelly, S.; Jour, G.; Gindin, T.; Park, K.; Jones, D.; Feng, X.; Pinnell, J.; Mclennan, S.; Tin, M. Y.; Tsirigos, A.; Snuderl, M.; Wrzeszczynski, K. O.", "date": "2026-09-01", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.6104, "score_semantic": 0.6104, "score_lexical": 0.6551, "matched": ["cancer"]}, {"id": "https://doi.org/10.1016/j.molcel.2026.08.003", "title": "Hypertranscription caused by p53 deficiency triggers nucleotide insufficiency that induces replication stress and genomic instability.", "abstract": "p53 plays a central role in the DNA damage response, inducing repair, cell-cycle arrest or apoptosis. Its loss is associated with replication stress and genomic instability. While several underlying mechanisms were suggested, the primary triggers of catastrophic genomic events like chromothripsis, a known driver of tumorigenesis linked with p53 loss, are still unclear. Using p53-depleted epithelial cells and fibroblasts, as well as patient-derived fibroblasts with germline p53 variants that spontaneously undergo chromothripsis, we found that p53 loss causes hypertranscription and increased nucleotide consumption. The resulting nucleotide shortage induces replication stress, causing telomere dysfunction, micronuclei formation, and chromothripsis. These effects were rescued by nucleoside supplementation or normalization of transcription levels, demonstrating a causal link between transcriptional activity, nucleotide availability, and genome stability. Emerging chromothriptic clones displayed restored DNA replication, telomere stabilization, and extrachromosomal DNA, suggesting key features that support clonal selection. We identify nucleotide pool homeostasis as a critical p53 function that suppresses replication stress, prevents chromothripsis, and protects against early tumorigenesis.", "authors": "Zaatra W, Philippos G, Smirnov P, Milo S, Otoničar J, Chan M, Harel M, Devens F, Goldberg T, Eliassaf A, Grimes K, Irony-Tur Sinai M, Sigismondo G, Laue K, Ben-David U, Geiger T, Korbel JO, Krijgsveld J, Shalev O, Kerem B, Ernst A", "date": "2026-Sep-03", "source": "PubMed", "journal": "Molecular cell", "if": 14.5, "score": 0.6081, "score_semantic": 0.6081, "score_lexical": 0.8505, "matched": ["genomic instability"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.02.748840", "title": "Membrane voltage and connexin expression work together to enhance tumor growth and metastasis in cancer", "abstract": "There is strong evidence of tumors manipulating their resting membrane potential (Vmem). While most fully-differentiated cells have a Vmem of roughly -70mV, tumor cells are generally depolarized, with Vmem {approx}-30mV, which more closely resembles the Vmem of stem cells. This is often believed to serve the purpose of accelerating the cell cycle and hence advantaging tumor proliferation. But when the tumor becomes invasive, its cells sometimes revert to a hyperpolarized Vmem with no obvious reason why. Separately, it is well accepted that solid tumors that are not yet invasive greatly underexpress connexins relative to healthy tissue; connexins, for our purpose, form gap junctions (GJs), small connecting tubes between nearby cells. Tumors that are invasive, by contrast, overexpress connexins. There is very little explanation for the paradox that connexins are first underexpressed and then overexpressed. However, it has long been known that Vmem electrically gates GJs; specifically, that homotypic GJs conduct best when the two cells they connect have a similar Vmem. Our in-silico model results explain this phenomenon, showing that when considered together, tumors' electrical and connexin-expression behaviors form a unified and effective strategy to control communication between the tumor and its healthy neighbor cells. This has implications for the emerging field of cancer bioelectrics, potentially leading to more precisely-targeted therapies.", "authors": "Grodstein, J.; Mathews, J.; Levin, M.", "date": "2026-09-03", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6022, "score_semantic": 0.6022, "score_lexical": 0.6574, "matched": ["cancer"]}, {"id": "https://doi.org/10.1016/j.ccell.2026.06.016", "title": "TIME in motion: How response takes shape.", "abstract": "Biomarkers for immune checkpoint inhibitors have largely treated the tumor immune microenvironment as a fixed property. In this issue of Cancer Cell, Lin et al. assemble a longitudinal pan-cancer single-cell atlas and show that the direction of immune-state remodeling during therapy is more informative than baseline composition.", "authors": "Chin WL, Lesterhuis WJ", "date": "2026-Sep-14", "source": "PubMed", "journal": "Cancer cell", "if": 38.6, "score": 0.6004, "score_semantic": 0.6004, "score_lexical": 0.846, "matched": ["cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.08.31.748241", "title": "Morphologic intratumoral heterogeneity from routine whole-slide histopathology is prognostic for survival in primary central nervous system lymphoma: development in the LOC Network and international external validation", "abstract": "Background: Clinical scores incompletely capture outcomes in primary central nervous system lymphoma (PCNSL). We quantified morphologic heterogeneity in pretreatment hematoxylin and eosin (H\\&E) whole slides. Patients and methods: Three independent cohorts of immunocompetent, HIV- and EBV-negative patients treated recently were analyzed: LOC 2023 (122 slides), phase III BLOCAGE-01 (245 slides; NCT02313389), and external Barcelona (BCN; 41 slides). UNI embeddings, prototype learning, spatial metrics, and elastic-net Cox regression defined ITH-C. Results: Models achieved bootstrap-corrected concordance of 0.797--0.834. Age-, sex-, and KPS-adjusted ITH-C HRs were 1.29 (95\\% CI 1.01--1.64), 1.27 (1.07--1.51), and 2.13 (1.35--3.37), respectively. Adding ITH-C increased MSKCC C-index from 0.671 to 0.717, 0.560 to 0.593, and 0.588 to 0.706. Spatial transcriptomics linked ITH-C to immune programs. Conclusions: Routine H\\&E encodes prognostic spatial heterogeneity in PCNSL. ITH-C complements clinical scores, supporting prospective risk stratification.", "authors": "Rincon de la Rosa, L.; Barillot, N.; Hernandez-Verdin, I.; Velasco, R.; Mathon, B.; Eimer, S.; Vignes, J. R.; Rousseau, A.; Paillassa, J.; Ahle, G.; Lerintiu, F.; Uro-Coste, E.; Oberic, L.; Tabouret, E.; Appay, R.; Gauchotte, G.; Taillandier, L.; Marolleau, J.-P.; Adam, C.; Ursu, R.; Cuzzubbo, S.; Schmitt, A.; Nichelli, L.; Pons-Escoda, A.; Charlotte, F.; Davi, F.; Le Garff-Tavernier, M.; Choquet, S.; Soussain, C.; Vidal, N.; Gonzalez-Barca, E.; Climent, F.; Lopez, P.; Drieux, F.; Veresezan, E.-L.; Heming, M.; Meyer zu Hörste, G.; Grauer, O.; Jardin, F.; Mokhtari, K.; Houillier, C.; Hoang-Xua", "date": "2026-09-03", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5919, "score_semantic": 0.5919, "score_lexical": 0.9492, "matched": ["histopathology"]}, {"id": "https://doi.org/10.1038/s41375-026-03048-4", "title": "Patterns of clonal hematopoiesis in aplastic anemia under immunosuppressive therapy.", "abstract": "Aplastic anemia (AA) is an immune-mediated bone marrow failure disorder with 15-20% risk of clonal evolution. We analyzed 371 patients with AA receiving immunosuppressive therapy (IST). All patients underwent PNH testing and 357 evaluable for cytogenetic analysis. Two hundred and thirty-seven received serial targeted sequencing. Clonal characteristics were compared before and after IST across age, disease severity, and hematological response. Among the 237 patients, somatic mutations were detected in 53 patients (22%) at baseline and 97 (41%) after IST. Distinct patterns of mutational dynamics were observed under IST, with newly acquired mutations defined as Pattern 2 being most common. High-risk mutations such as ASXL1 expanded persistently, whereas favorable clones like BCOR and PIGA often contracted or remained stable. Older age was associated with heavier mutational burden, and disease severity was associated with greater increase in mutations. Cytogenetic abnormalities were observed in 18 of 357 patients (5%) and rose to 37 (10%) post-treatment. PNH clones were present in 20% of patients at baseline and remained relatively stable during follow-up, 15 patients progressed to PNH syndrome. Six patients evolved to myeloid neoplasms, including myelodysplastic syndromes and chronic myelomonocytic leukemia. These findings highlight the importance of long-term molecular surveillance (ClinicalTrials.gov number, NCT04645199).", "authors": "Tian L, Zhang L, Li R, Wang W, Li W, Pan H, Gao Z, Zhao J, Luo Y, Fang L, Shi J", "date": "2026-Sep-03", "source": "PubMed", "journal": "Leukemia", "if": 12.8, "score": 0.5903, "score_semantic": 0.5903, "score_lexical": 0.9066, "matched": ["clonal evolution"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.08.31.748358", "title": "Spatial Mapping of the Lung Cancer Ecosystem Reveals Distinct Patterns of Intratumoral and Internodular Heterogeneity", "abstract": "The spatial organization of malignant and non-malignant cells within the tumor microenvironment (TME) critically influences tumor evolution and therapeutic response. However, the architecture of micro-niches remains incompletely understood. Leveraging Xenium-based spatial transcriptomics, we comprehensively mapped the spatial ecosystem of an orthotopic murine lung cancer model, identifying distinct spatial domains that form unique, organized cellular neighborhoods. These domains cluster into three major communities: (1) non-tumoral regions that recapitulate canonical normal lung structures; (2) a heterogeneous peri-tumoral region composed of spatial domains characterized by mesenchymal remodeling, active immune checkpoint signaling, and immunosuppressive myeloid populations; and (3) intra-tumoral regions that reveal marked tumor nodule heterogeneity, with unique tumor-specific domains exhibiting hallmark cancer pathways. Furthermore, our analytic approach was applicable to human lung cancer tissue. Notably, spatial domain analysis allowed us to resolve tumor nodules into multiple biologically distinct subtypes, defined by domain composition, hallmark cancer programs, and intercellular communication patterns within the TME.", "authors": "Baek, B.-S.; Kim, K.-H.; Kim, S.-j.; Eccles, J. D.; Kim, M.; You, S.; Ascoli, C.; Park, G. Y.", "date": "2026-09-01", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5784, "score_semantic": 0.5784, "score_lexical": 0.9062, "matched": ["tumor evolution", "cancer"]}, {"id": "https://doi.org/10.1016/j.ccell.2026.08.004", "title": "Integrated clinicogenomic analysis reveals the evolution and metastatic tropisms of advanced colorectal cancer.", "abstract": "We performed an integrated clinical and genomic analysis of over 7,000 consecutively sequenced colorectal cancer (CRC) samples to comprehensively characterize genetic drivers and metastatic tropisms of CRC. We find that genomic evolutionary changes, such as clonal mutations and oncogenic mutant allelic imbalance, selectively enhance the impact of recurrent oncogenic alterations. We identify the relative timing of organ-specific metastasis, showing sequential metastatic progression in microsatellite stable CRC with brain and adrenal metastases as late events; metastatic sites that cluster together, such as lung, bone, and brain metastases; and genomic events that enhance or decrease risk for each metastatic site, with WNT pathway activation as overall protective while RAS pathway activation increased risk for spread to all metastatic sites. Our data suggest that despite the heterogeneity in CRC, genomic evolution increases the impact of recurrent alterations, and integrating information about tumor primary location and genomics can be used to predict organ-specific metastasis risk.", "authors": "Manca P, Walch H, Xu J, Small N, Kris A, Seffar E, Richards A, Xue T, Price A, Donoghue MTA, Fong C, Waters M, Jee J, Deshmukh SK, Sledge GW, Malla M, Cercek A, Saltz L, Segal NH, Stadler ZK, Nusrat M, Foote MB, Desai A, Chalasani S, Rao D, Connell L, Do RKG, Ganesh K, Weiser MR, Berger MF, Solit DB, Shia J, Vakiani E, Garcia-Aguilar J, Schultz N, Sanchez-Vega F, Chatila WK, Yaeger R", "date": "2026-Sep-14", "source": "PubMed", "journal": "Cancer cell", "if": 38.6, "score": 0.576, "score_semantic": 0.576, "score_lexical": 1.0, "matched": ["tumor evolution", "clonal evolution", "genomics", "cancer"]}, {"id": "https://doi.org/10.1038/s41418-026-01857-9", "title": "Renal cell carcinoma: molecular understanding and therapeutic development.", "abstract": "Renal cell carcinoma (RCC) is a highly heterogeneous malignancy characterized by diverse molecular alterations and dynamic evolutionary trajectories. Advances in genomics and molecular profiling have shifted RCC management from morphology-based classification toward molecularly informed diagnosis and therapy. In this review, we integrate recent multi-omics and clinical advances to define the evolving biological and therapeutic landscape of RCC. We highlight how the 2022 WHO classification incorporates molecular features to refine pathological subtyping and summarize key driver genetic alterations underlying major RCC entities. We then discuss insights derived from multi-region sequencing studies, including TRACERx Renal, which demonstrate how intratumoral heterogeneity, branched evolution, and clonal selection shape disease progression and therapeutic resistance. We further examine subtype-specific metabolic programs, with particular emphasis on dysregulation of the AMPK-mTORC1 signaling axis and distinct metabolic dependencies across clear cell and non-clear-cell RCC. We additionally highlight cell death regulation and differentiation plasticity as integrative themes that connect molecular pathogenesis to therapeutic vulnerability, with sarcomatoid and rhabdoid dedifferentiation as a key example. Finally, we review the evolution of systemic therapies, from VEGF-targeted tyrosine kinase inhibitors to immune checkpoint-based combinations, and outline emerging strategies, including HIF-2α inhibition, PD-1/VEGF bispecific antibodies, and subtype-specific metabolic and epigenetic dependencies. Collectively, this review provides an integrated framework linking molecular evolution, metabolic reprogramming, and therapeutic development, with the goal of advancing biomarker-driven precision management in RCC.", "authors": "Hou T, Hua X, Ni W, Yan P, Inuzuka H, Wei W", "date": "2026-Sep-02", "source": "PubMed", "journal": "Cell death and differentiation", "if": 13.7, "score": 0.5735, "score_semantic": 0.5735, "score_lexical": 0.8646, "matched": ["clonal evolution", "genomics"]}, {"id": "https://doi.org/10.1158/0008-5472.CAN-26-2187", "title": "Varying Cancer Drug Doses to Balance Tumor Control and Resistance Evolution.", "abstract": "The effectiveness of any cancer therapy depends on its dose and its treatment schedule. A potential third dimension of regimen design is whether intentional fluctuations in administered dose might improve treatment outcomes. In this issue, West and colleagues demonstrate that dose fluctuations can alter both tumor drug response and the evolution of drug resistance, in ways related to the shapes of dose-response functions. In mouse xenograft models of ALK-fusion non-small cell lung cancer treated with the ALK inhibitor alectinib, steady dosing produced the best immediate tumor response, but fluctuations in dose were better at delaying the evolution of drug resistance. Treatment schedules that switched between even and uneven dosing navigated this tradeoff, achieving comparable tumor control with steady dosing while better preserving drug sensitivity. By showing how dose-response measurements can guide when doses should remain steady or fluctuate, this work expands how cancer treatment schedules might be optimized. See related article by West et al., p. 4434.", "authors": "Pomeroy AE, Palmer AC", "date": "2026-Sep-02", "source": "PubMed", "journal": "Cancer research", "if": 11.2, "score": 0.5716, "score_semantic": 0.5716, "score_lexical": 0.8825, "matched": ["tumor evolution", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.08.24.26361235", "title": "Cohort profile: KaroLiver, a population-based cohort of patients receiving curative liver-directed treatment for colorectal liver metastases at a Swedish tertiary centre", "abstract": "PurposeThe Karolinska Liver Metastases (KaroLiver) cohort was established to investigate associations between clinical characteristics and histopathological features in patients treated with curative intent for colorectal cancer liver metastases (CRLM). The cohort combines whole-slide digital histopathology images with detailed oncological, surgical, radiological and survival data, enabling comprehensive analyses of treatment trajectories, clinical outcomes and metastatic tumour biology.  ParticipantsKaroLiver is a retrospective observational cohort comprising all consecutive patients who received curative-intent, liver-directed treatment for CRLM at Karolinska University Hospital in Stockholm, Sweden. The hospital is the primary regional referral centre for HPB surgery, serving the population of approximately 2.5 million people in the Stockholm-Gotland healthcare region. Patient enrolment is continuously updated in accordance with amended ethical approvals and evolving scientific questions. The cohort currently comprises 811 patients who underwent 1204 liver interventions between February 2012 and January 2022. Detailed clinical, oncological, surgical, pathological, molecular, recurrence and survival data are collected.  Findings to dateMedian overall survival (OS) in the current cohort is 51.0 months (95% CI 46.2-57.1 months), and median recurrence-free survival (RFS) is 10.4 months (95% CI 9.2-11.9 months). The five-year OS rate is 44.9% (95% CI 41.2-48.8%). Studies using the cohort have so far identified a liver injury-derived stromal capsule in a subset of metastases, associated with improved survival. The cohort has also enabled the identification of histopathological markers of tumour biology, sex-based differences in treatment and survival, and associations between post-hepatectomy liver failure and oncological outcomes.  Future plansCurrent research priorities include advanced histology-based prognostic scoring, sex differences in recurrence and retreatment, tumour biology and outcomes in early-onset versus average-onset CRLM, as well as CT- and MRI-based radiomics, all integrated within KaroLivers histopathological framework. Data sharing is supported, given that regulatory requirements are met. Retrospective accrual and outcome updates will continue for current and future studies, subject to the required approvals.  Strengths and limitations of this study{square} Selection bias in KaroLiver is minimised through consecutive, population-based accrual of all patients receiving curative-intent liver-directed treatment for CRLM at a high-volume Swedish tertiary centre. {square}Granular data on recurrence, including site, timing, and intent of retreatment, enable detailed analyses of disease trajectories beyond the index hepatectomy. {square}KaroLiver is linked to CT and MRI examinations from diagnosis through recurrence; combined with detailed histopathological and molecular pathology data, this provides a platform for translational research, based on specific, defined research questions. {square}The observational design limits causal inference, and changes in treatment strategies and follow-up protocols over the study period may introduce temporal confounding that must be accounted for in analyses. {square}Molecular data, including RAS/RAF mutation status and mismatch repair status, are incomplete, reflecting real-world clinical practice and the gradual adoption of tumour profiling over the study period.", "authors": "Gerling, M.; Moro, C. F.; Limbecker, C.; Viljamaa, A.; Harrizi, S.; Hamidi, Y.; Hailer, A.-K.; Sterner, J.; Sparrelid, E.; Bozoky, L.; Tidholm Qvist, E.; Baumgartner, R.; Salmonson Schaad, M.; Bozoky, B.; Geyer, N.; Engstrand, J.", "date": "2026-08-31", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.5708, "score_semantic": 0.5708, "score_lexical": 0.661, "matched": ["digital pathology", "histopathology", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.08.31.748215", "title": "Initial tumor composition shapes resistance evolution and treatment outcomes in non-small cell lung cancer", "abstract": "Drug resistance is a leading cause of treatment failure in non-small cell lung cancer (NSCLC), yet how resistance evolves during treatment and whether its fitness consequences depend on tumor composition remains poorly understood. Using a game-theoretic mathematical model fitted to longitudinal in-vitro data from alectinib-sensitive and alectinib-resistant H3122 NSCLC cells grown under different treatment and microenvironmental conditions, we found that the fitness effect of evolving resistance depended critically on the initial proportion of resistant cells in the tumor. When resistant cells were initially rare, resistance evolved faster and increasing resistance was associated with a growth advantage. When resistant cells were initially frequent, increasing resistance was associated with a fitness cost. In both cases, increasing resistance eroded treatment efficacy. In the gain-of-resistance regime, stabilization therapy could maintain a stable tumor equilibrium only if resistant cells were excluded. Maximum tolerated dosing was not always optimal for maximizing time to progression; intermediate doses performed better when they kept the initial tumor growth rate close to zero. These results suggest that evolutionary therapy for NSCLC should account not only for the abundance of resistant cells, but also for how resistance is evolving and what fitness consequences it currently carries in individual patients.", "authors": "Satouri, M.; Brown, J. S.; Rezaei, J.; Stankova, K.; Cavill, R.", "date": "2026-09-01", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5636, "score_semantic": 0.5636, "score_lexical": 0.6668, "matched": ["tumor evolution", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.1101/2025.11.04.25339472", "title": "Clonal Evolution of Pediatric Acute Myeloid Leukemia and Its Contribution to Disease Relapse", "abstract": "Relapse remains the leading cause of mortality in pediatric acute myeloid leukemia (pAML), yet the genetic changes contributing to relapse remain incompletely defined. We performed whole-genome and targeted-capture sequencing of 41 pediatric AML cases with paired relapse samples. Mutational burden increased at relapse, whereas therapy-related mutational signatures were rarely observed and only occasionally associated with pathogenic mutations. Although recurrently enriched mutations at relapse included those in FLT3, WT1, and TP53, relapse-fated subclones were frequently marked only by non-pathogenic or non-coding variants. Longitudinal deep sequencing ([~]5000X) coupled with paired serial monitoring by WGS ([~]100X) in eight patients showed rapid depletion of major clones after induction therapy, whereas subclones often displayed variable chemosensitivity. Relapse-specific mutations emerged only late, suggesting that selection of pre-existing clones is the predominant mechanism of relapse. Together, our data indicate that pAML relapse arises through the selection of pre-existing clones with diverse trajectories.", "authors": "Umeda, M.; Kolekar, P.; Huskey, A. L.; Suryaprakash, S.; Ma, J.; Li, H.; Westover, T.; Walsh, M. P.; Song, G.; Liu, Y.; Tran, Q.; Balagopal, V.; Wang, L.; Brady, S. W.; Pounds, S.; Mead, P. E.; Karol, S. E.; Inaba, H.; Rubnitz, J. E.; Ribeiro, R.; Ma, X.; Klco, J. M.", "date": "2026-09-04", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.5565, "score_semantic": 0.5565, "score_lexical": 1.0, "matched": ["clonal evolution"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.07.31.742155", "title": "Cohesin promotes genomic stability by suppressing unequal sister chromatid exchange", "abstract": "The protein complex cohesin plays critical roles in genomic stability by tethering together sister chromatids at their pericentric regions and along their arms from S phase until anaphase. Cohesin-mediated pericentric cohesion prevents aneuploidy by ensuring bipolar attachment of sister kinetochores. Arm cohesion prevents loss of heterozygosity by biasing DNA repair via recombination between sister chromatids rather than between homologs. Here, we investigate in yeast whether cohesin also enhances genomic stability by suppressing unequal sister chromatid exchange (USCE) between repetitive sequences. In wild-type cells, the USCE rate between repeats 4kb apart (proximal) was 15X higher than repeats 68kb apart (distal). The USCE between distal repeats but not proximal repeats increased 4 to 7-fold in mutants with altered cohesin subunits or auxiliary factors. The level of increased distal USCE corresponded with reduced arm cohesion, reduced density of cohesion arm sites, and higher sister loci mobility. Our results suggest that high density of arm cohesion sites confines repair of DNA damage to local sequences. When the density of cohesion sites decreases, sister chromatid sequences are less confined, thereby enhancing distal repeat interactions and USCE. Another set of mutations disrupted both DNA replication and cohesin loading at the replication fork during S phase. Remarkably, distal USCE in these mutants increased approximately 100-fold and was 6-fold more likely than proximal USCE. This preferential hyperdistal USCE can be explained by an aberrant sister-chromatid structure that is normally prevented by proper coupling of cohesin function and replication.", "authors": "Guacci, V.; Minchell, N. E.; Sung, T.; Venev, S. V.; Dekker, J.; Koshland, D.", "date": "2026-09-01", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5296, "score_semantic": 0.5296, "score_lexical": 0.8138, "matched": ["aneuploidy"]}, {"id": "https://doi.org/10.1038/s41467-026-76308-7", "title": "LINE-1 insertion intermediates recombine with one another or with DNA breaks to form genome rearrangements.", "abstract": "LINE-1 (L1) retrotransposition is common in human cancers and rearrangements at insertion sites can contribute to cancer-driving oncogene amplifications and promote genome instability. However, the mechanisms underlying rearrangements of L1 retrotransposition intermediates are poorly understood. To address this gap, we developed GFP-based recombination reporter assays to study the formation of L1 retrotransposition-mediated rearrangements. Using these reporters combined with long-read sequencing, we find that L1 retrotransposition cDNA intermediates can recombine with distal DNA breaks to generate chromosomal rearrangements. We also find that two independent L1 insertion cDNA intermediates on distinct genomic loci can recombine with each other to generate chromosomal rearrangements. Both types of rearrangements depend on L1-encoded ORF2p endonuclease and reverse transcriptase activities. Using these reporters, we discover that L1 retrotransposition-mediated rearrangements are robustly induced when the recombining sequences share extensive homology and that their formation requires the homologous recombination factor BRCA1. In contrast, we find L1 retrotransposition-mediated rearrangements are suppressed by the mismatch repair factor MSH2 when the recombining sequences contain mismatches. Given the repetitive nature of our genome, these findings highlight the risk of L1 insertion intermediates becoming substrates for aberrant recombination and promoting genome instability.", "authors": "Mendez-Dorantes C, Kalinowski JC, Burn A, Schofield P, Law CT, Isik E, Burns KH", "date": "2026-Aug-01", "source": "PubMed", "journal": "Nature communications", "if": 14.7, "score": 0.5267, "score_semantic": 0.5267, "score_lexical": 0.9908, "matched": ["chromosomal instability", "genomic instability", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.06.21.733614", "title": "A Visually Interpretable Histopathology-Based Immune Model Predicts T-effector Biology and Response to Immune checkpoint inhibition in Clear Cell Renal Cell Carcinoma Clinical Trial and Contemporary Real-World Datasets", "abstract": "Immune checkpoint inhibitors (ICI) are central to the treatment of metastatic clear cell renal cell carcinoma (ccRCC), yet only a subset of patients derive durable benefit, and clinically deployable predictive biomarkers remain an unmet need. RNA-based T-effector signatures capture cytotoxic immune biology and have been associated with ICI response in clinical trial cohorts; however, their clinical implementation is limited by the marked spatial heterogeneity of ccRCC, as well as cost, long turnaround time, sample quality requirements, and limited accessibility. Here, we developed a visually interpretable deep learning (DL) model that predicts a T-cell-enriched immune score directly from hematoxylin and eosin (H&E)-stained whole-slide images. To overcome the inability of H&E morphology alone to distinguish lymphocyte subsets, we trained the model using multimodal spatial supervision from CD8, PAX8, and ERG IHC, which respectively identified cytotoxic T-cell-rich regions, tumor cells, and endothelial cells, thereby constraining immune predictions to relevant tumor microenvironmental niches. The resulting H&E DL Immune score was validated by pathologist review, comparison with held-out CD8 IHC annotations, and independent datasets. The H&E DL Immune score correlated with T-effector RNA scores across independent institutional and IMmotion150 clinical trial cohorts (spearman correlations of 0.726; p=5.90x10-15 and 0.706; p=4.04x10-19). As a proof of principle, the score was used to characterize associations with key biological features across large cohorts, including sarcomatoid differentiation, BAP1 and PBRM1 mutation status, and additional transcriptomic signatures. In IMmotion150 clinical trial cohort, a median-dichotomized H&E DL Immune score, similar to RNA-based T-effector score, was significantly associated with clinical benefit from atezulumab therapy. In contemporary institutional cohorts of patients treated with frontline ipilimumab plus nivolumab or in initial 3 lines of nivolumab monotherapy, patients in the top quartile of H&E DL Immune score had significantly longer progression-free survival. Collectively, these findings support a scalable and interpretable H&E-based biomarker that captures T-effector biology and can help identify patients with ccRCC more likely to benefit from ICIs.", "authors": "Perny, A.; Jarmale, V.; Jasti, J.; Zhong, H.; Christie, A. L.; Miyata, J.; Nielsen, A. W.; Kontoyiannis, P.; Rakheja, D.; Modrusan, Z.; Huseni, M.; Kadel, W.; Brugarolas, J.; Kapur, P.; Rajaram, S.", "date": "2026-09-01", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5217, "score_semantic": 0.5217, "score_lexical": 0.7024, "matched": ["histopathology"]}, {"id": "https://doi.org/10.1038/s44318-026-00891-0", "title": "KDM6A loss enhances oxidative phosphorylation uncovering tissue-level convergent evolution.", "abstract": "The tumor suppressor KDM6A/UTX, a histone demethylase and a 2-oxoglutarate-dependent dioxygenase, is frequently lost in many cancer types. We show that KDM6A loss pervasively activates oxidative phosphorylation in several solid tumors, generating a pseudo-hyperoxic environment, opposite from the pseudo-hypoxia observed in VHL-mutated renal carcinomas. Mechanistically, KDM6A sustains the expression of the coil-coil domain gene CCDC3, which inhibits CREB1-driven transcription of the mitochondrial regulator PPARGC1A. In the hematological cancer multiple myeloma where KDM6A is frequently deleted, its loss similarly promotes oxidative phosphorylation, but via an alternative mechanism: the increased transfer of mitochondria from stromal to myeloma cells via tunneling nanotubes, triggered by the loss of the mTORC1 inhibitor TRAF3IP3. Beyond cancer, KDM6A regulates oxidative phosphorylation also during development and in adult tissues, engaging either the CCDC3-CREB1 or the TRAF3IP3-mTORC1 pathways. These mutually exclusive associations suggest a tissue-level convergent evolution, positioning KDM6A as a central modulator of mitochondrial activity through context-specific partners.", "authors": "Cartalemi AA, Rosano D, Ferrari C, Crupi G, Cassina L, Gatti G, Corigliano F, Punzi S, Villanti I, Dupéré-Richer D, D'Ercole C, Ruggieri V, Miluzio A, Bruno T, Garcia Manteiga JM, Giansanti V, Bennett RL, Cittaro D, Madaro L, Boletta A, Pievani T, Biffo S, Fanciulli M, Ciboddo M, Licht J, Tonon G", "date": "2026-Sep-04", "source": "PubMed", "journal": "The EMBO journal", "if": null, "score": 0.5196, "score_semantic": 0.5196, "score_lexical": 0.8077, "matched": ["tumor evolution", "cancer"]}, {"id": "https://doi.org/10.1038/s41467-026-76143-w", "title": "Hypoxia-induced metastatic heterogeneity in pancreatic cancer.", "abstract": "In solid tumors, hypoxia is a key driver of metastasis by promoting cellular plasticity and chromosomal instability (CIN). Despite this, the mechanisms by which malignant cells concurrently co-opt these elements of hypoxic adaptation to promote metastasis remains unclear. Here we report that hypoxia promotes metastasis by suppressing the JmjC-containing histone lysine demethylase KDM8. Kdm8 targeting in a Kras;Trp53-driven mouse model of pancreatic ductal adenocarcinoma induces a profound loss of the epithelial morphology and widespread metastatic disease. Mechanistically, Kdm8 suppression in normoxia recapitulates major aspects of the global epigenetic changes, transcriptomic rewiring, and mitotic spindle defects induced by hypoxia. Of note, disruption of Kdm8's demethylase function phenocopies the effects of Kdm8 loss, whereas expression of hypermorphic Kdm8 variants that are resistant to hypoxic suppression reduces metastasis beyond the levels achieved by the wildtype counterpart. Through the suppression of Kdm8 demethylase activity, hypoxia unleashes a potent metastatic program by simultaneously advancing cellular plasticity and CIN.", "authors": "Gunasekaran PM, Wang Q, Guseva P, Chang YC, Chauhan R, Kley A, Xu M, Lee G, Marshall G, Ghosh Roy S, Masoudpoor Y, Li O, Roberts A, Walton KW, Franciosa L, Bhat S, Zachariah E, Patel K, Zhou Z, Cao J, Chen W, Ni JZ, Gu SG, Montagna C, Chiou SH", "date": "2026-Jul-30", "source": "PubMed", "journal": "Nature communications", "if": 14.7, "score": 0.507, "score_semantic": 0.507, "score_lexical": 1.0, "matched": ["chromosomal instability", "CIN", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.08.31.748188", "title": "Non-invasive forecasting of skin cancer evolution through longitudinal hair sampling", "abstract": "The ability to longitudinally track clonal evolution non-invasively would transform cancer interception strategies, long before late-stage disease when most cancer genomes are analysed. Here, we demonstrate that repeated hair sampling from the same individual followed by exome sequencing enables tracking of somatic evolution in vivo over several months after chemically induced skin carcinogenesis. We found that hair follicles accumulate a higher mutation burden than spatially-matched skin and harbour mutations that spread into surrounding epidermis and persist throughout tumour progression. DNA-damaged follicles enter sustained quiescence that delays replication and repair, creating a reservoir for long-lived mutations. During premalignant progression, carcinogen-associated mutations become enriched as follicular clones expand into adjacent skin. Mutation tracking identified genes that may govern tumour predisposition and initiation, many of which are mutated at high incidence in human cutaneous squamous cell carcinoma cohorts. Hair follicles therefore provide a non-invasive readout to forecast the early development of skin cancer, enabling patient risk stratification.", "authors": "Frye, M.; Del Prete, S.; Avi-Guy, Y.; Xu, F.; Weser, S.; Bekavac, M.; Koch, M.-L.; Coraggio, F.; Coimbra, R. T. F.; Popis, M. C.; Heit-Mondrzyk, A.; Goncalves, A.; Behm, M.; Odom, D. T.", "date": "2026-09-01", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4966, "score_semantic": 0.4966, "score_lexical": 0.9898, "matched": ["clonal evolution", "cancer"]}, {"id": "https://doi.org/10.1158/0008-5472.CAN-25-5315", "title": "Single-Cell Analysis Guides Organoid CRISPR Screening to Reveal NF1 as a Gatekeeper of Cervical Squamous Malignant Transformation.", "abstract": "Cervical cancer progresses from high-grade squamous intraepithelial lesions driven by persistent HPV infection. Identifying the gatekeepers restraining malignant transformation could reveal strategies to prevent and treat cervical cancer. Here, we integrated single-cell transcriptomics, CRISPR-Cas9 screening, and organoid modeling to dissect this process. Single-cell analysis of patient samples revealed progressive activation of RAS and proliferation programs along epithelial differentiation paths. A focused CRISPR screen in HPV-positive pre-tumoroids identified NF1 as the top suppressor of malignant transition. NF1 loss accelerated carcinogenesis in organoids, compressing a 5~10-year process into 3~6 months, recapitulating basal cell expansion, dedifferentiation, and tumorigenicity. Mechanistically, NF1 loss enhanced RAS-MAPK and PI3K-AKT signaling, promoted proliferative programs, and remodeled chromatin accessibility at AP-1/E2F motifs. Conversely, NF1 restoration in cancer organoids induced apoptosis and suppressed malignant maintenance. AI-guided modeling was used to design a minimal NF1-mimetic peptide that engaged RAS-GTP to inhibit RAS signaling, reduce tumor burden in HPV16-driven mouse models, and restore local immune permissiveness without systemic activation. Together, these findings establish NF1 as a critical constraint on HPV-associated epithelial evolution and provide a time-compressed organoid model of cervical carcinogenesis, offering proof-of-concept for therapeutic RAS pathway interception via NF1 restoration.", "authors": "Hu B, Chen L, Wang R, Zhou Z, Zhang G, Ruan J, Xi L, Zhang Y, Li Q, Liao B, Li L, Gao C, Ma D, Li M, Liao S", "date": "2026-Sep-03", "source": "PubMed", "journal": "Cancer research", "if": 11.2, "score": 0.4691, "score_semantic": 0.4691, "score_lexical": 0.7629, "matched": ["tumor evolution", "cancer"]}, {"id": "https://doi.org/10.1038/s43587-026-01200-4", "title": "Mapping structural aging across human tissues reveals tissue-specific trajectories and coordinated deterioration.", "abstract": "Organ structure, including the organization of cells, vasculature and extracellular matrix, underpins its function, yet how structure changes with age remains mostly unknown. Here we developed PathStAR, a framework that quantifies tissue structural aging from routine histopathology images, without being trained to predict chronological age. Applying PathStAR to 25,306 post-mortem biopsies from 40 tissues in 970 donors aged 21-70 years revealed that organ structural aging progresses via distinct, nonlinear temporal trajectories: vascular tissue structural aging accelerates early, uterus and vagina structural aging accelerates late (around menopause) and certain tissues including digestive and male reproductive organs show biphasic accelerations. We show that accelerations of structural aging are characterized across organs by increased inflammation alongside reduced energy production, repair and quality control. Cross-organ analysis reveals coordinated deterioration within individuals, including digestive and male reproductive tissues, linked by sex hormones. Together, our analysis provides a systematic map of structural aging across the human body.", "authors": "Yadav A, Alvarez K, Chechenina A, Yip KY, Ruppin E, Colas A, Yano Maher JC, Gomez-Lobo V, Kumsta C, Sinha S", "date": "2026-Sep", "source": "PubMed", "journal": "Nature aging", "if": 17.0, "score": 0.4544, "score_semantic": 0.4544, "score_lexical": 1.0, "matched": ["histopathology"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.08.27.26356343", "title": "Automated hippocampal sclerosis detection, using AID-HS, shows robust performance across multi-centre paired 7T and 3T MRI", "abstract": "BackgroundHippocampal sclerosis (HS) is a common cause of drug-resistant focal epilepsy (DRFE) and amenable to neurosurgical treatment. Detection relies on MRI but can be challenging. 7 Tesla (T) ultra-high field MRI and automated MRI post-processing tools have independently been shown to improve radiological diagnosis of HS. However, combining these approaches remains underexplored. This study evaluated whether AID-HS, a tool for HS detection developed using 3T MRI, generalises to 7T MRI data.  MethodsWe collated a dataset of paired 3T and 7T T1-weighted MRI from four epilepsy centres, including 23 patients with HS, 39 healthy controls, and 23 individuals with focal cortical dysplasia as disease controls. Histopathology served as the gold standard for defining HS where available (n=7), otherwise radiological findings (n=16). AID-HS was applied to images acquired at both field strengths, and sensitivity and specificity for detection and lateralisation of HS were compared. Additionally, agreement of hippocampal features across 3T and 7T was evaluated.  ResultsWe found no evidence of a difference in performance of AID-HS between 3T and 7T. Sensitivity for detection of unilateral HS was 63% (12/19) at 3T and 68% (13/19) at 7T (McNemars exact test p=1.0). Specificity in controls was 97% (60/62) at 3T and 100% (62/62) at 7T (p=0.5). Bilateral HS was correctly flagged in 3 of 4 cases using feature-based criteria, with high specificity in controls. Quantitative hippocampal features showed moderate to good agreement across field strengths (ICC 0.70 to 0.98), with small differences observed for volume and thickness estimates.  ConclusionAID-HS provides robust detection and lateralisation of HS across multiple 7T MRI centres, highlighting its potential to enhance lesion detection. Future work is needed to investigate whether models trained on 7T data can leverage the improved image quality for further gains in HS detection performance.", "authors": "Kronlage, C.; Ripart, M.; Piper, R. J.; Tisdall, M. M.; Carmichael, D. W.; Baldeweg, T.; Duncan, J. S.; O'Muircheartaigh, J.; Eriksson, M. H.; Casella, C.; Bridgen, P.; Bauer, T.; Bouschery, S. R.; Lange, A.; Pracht, E. D.; Stocker, T.; Surges, R.; Ruber, T.; Klodowski, K.; Rodgers, C. T.; Cope, T. E.; Wagstyl, K.; Adler, S.", "date": "2026-08-31", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.45, "score_semantic": 0.45, "score_lexical": 0.7524, "matched": ["histopathology"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.02.748952", "title": "Integrative single cell analysis of CD8+ T-cells across early and advanced oral cancers reveals signatures of anti-tumour activity", "abstract": "Tumour-targeting CD8 T cells drive responses to every major form of cancer immunotherapy. Identifying them, however, remains an unsolved problem in solid tumours. The antigens they recognize are rarely defined and almost never shared between patients. We profiled 51,459 CD8+ T cells by paired single-cell RNA and T-cell receptor sequencing across 28 samples from 17 HPV-negative oral cancers spanning primary tumours, draining lymph nodes, metastases, and pembrolizumab-treated recurrences. We found that clonotypes that were expanded and shared across anatomical sites and timepoints were enriched within tumours and progressively selected over disease evolution and checkpoint blockade. Designating these shared-expanded clones as putative tumour-targeting cells, we trained a machine learning classifier that identifies them from transcriptome data alone. This 108-feature random forest signature recapitulated programmes of tumour reactivity and generalized to an integrated atlas of 89,318 CD8+ T cells from independent cohorts, showing progressive enrichment from normal to malignant tissue, and localized to tumour-proximal niches in spatial transcriptomics. By demonstrating that clonal behaviour across space and time encodes tumour reactivity in the transcriptome, this work establishes a generalizable framework for mapping tumour-engaged immunity without knowledge of the underlying antigen.", "authors": "Li, C. H.; Quah, H. S.; Arcinas, C.; Alagappan, L.; Suteja, L.; Bhuvaneswari, H.; Leong, H. S.; Chong, F. T.; Toh, D.; Wong, S.; Biswas, S. K.; Chan, C.; Iyer, N. G.", "date": "2026-09-03", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4258, "score_semantic": 0.4258, "score_lexical": 0.9032, "matched": ["clonal evolution", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.1101/2025.04.17.649287", "title": "BTRR complex deficiency is a driver for genomic instability in Bloom syndrome", "abstract": "Biallelic loss-of-function (LoF) variants in the BTRR complex members BLM, TOP3A, RMI1, and RMI2 cause Bloom syndrome (BSyn). The BTRR complex mainly acts on DNA replication and DNA repair processes, and dysfunction of this complex underlies the increased genomic instability and cancer predisposition associated with the BSyn phenotype. Here, we report CRISPR/Cas9-based genome-edited isogenic induced pluripotent stem cell (iPSC) models with compound heterozygous LoF variants in BLM, TOP3A, and RMI1. The cellular phenotype of all three BTRR-deficient iPSC lines included chromosome segregation defects, increased sister chromatid exchange rates, and impaired DNA single-strand template repair. Using single-cell whole genome sequencing, we showed that BTRR complex deficiency causes increased genome copy number alterations (CNAs) and, therefore, is a driver for genomic instability. CNA load was further induced by applying replication stress, and we observed that BTRRKO iPSCs acquired fewer de novo CNA events compared to wild-type cells, suggesting a possible selection loss against cells with high levels of DNA damage. Importantly, stress-induced and non-stress-induced CNAs in single-cell genomes were not stochastically distributed throughout the genome, but instead enriched at fragile sites. This finding might offer an opportunity for the development of novel NGS-based approaches to measure rates of genomic instability in disease conditions.", "authors": "Gönenc, I. I.; Wolff, A.; Busley, A. V.; Wieland, A.; Tijhuis, A.; Müller, C.; Wardenaar, R.; Argyriou, L.; Kaulfuss, S.; Räschle, M.; Spierings, D. C. J.; Foijer, F.; Bastians, H.; Blackford, A. N.; Yigit, G.; Zibat, A.; Cyganek, L.; Wollnik, B.", "date": "2026-08-31", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4196, "score_semantic": 0.4196, "score_lexical": 1.0, "matched": ["genomic instability", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.1101/2025.06.24.661118", "title": "Allelic coverage analyses reveal a high proportion and uneven chromosomal distribution of SNPs associated with polymorphic duplications in the oyster Ostrea edulis", "abstract": "Oysters are known for their high genetic diversity, potentially high genetic load, and structurally complex genomes. The European flat oyster, Ostrea edulis, is no exception. Here, we combined a reference-free analysis of pairs of k-mers differing by a single nucleotide (hereafter: het-mers) with a reference-based analysis of allelic coverage using high-coverage short-read sequencing data (70-160X) from five individuals. Up to one-third of SNPs called as heterozygous within an individual exhibited allelic coverage fractions departing from the expected 0.5 ratio. Despite no evidence of recent whole-genome duplication, 40% of het-mers displayed coverage profiles consistent with duplicated genomic segments. We classified AAB het-mers as CN3 and AAAB or AABB het-mers as CN4, corresponding to nucleotide variants located within segments present in three and four copies, respectively, and interpreted as heterozygous and homozygous duplications. These CN3 and CN4 het-mers were typically observed in only a subset of individuals and mostly switched among CN3, CN4, or absence from the het-mer catalog, providing evidence for pervasive paralogous variants associated with rampant polymorphic duplications of genomic segments that vary in copy number among individuals. Reference-based analysis of sequencing depth and allelic coverage fraction similarly showed that SNPs with deviant allelic coverage are frequently associated with duplicated genomic segments segregating within populations, predominantly at low frequencies. Despite their different principles and potential biases, both approaches converged on a minimum estimate of 15% of nucleotide variants being associated with polymorphic duplications. Duplication-associated SNPs occurred in coding and non-coding regions to a similar extent, but their distribution was heterogeneous across chromosomes, with the highest densities on three of the ten chromosomes. These three chromosomes are non-metacentric and particularly prone to chromosome loss in oysters, which are known for their high incidence of somatic aneuploidy. This pattern supports two non-exclusive hypotheses: an architecture-driven model in which chromosome properties prone to structural instability promote both duplications and somatic aneuploidy, and a compensation-driven model in which duplications evolve to buffer dosage imbalance in aneuploid cells. Finally, we discuss how extensive polymorphic duplication may bias population genomic analyses in O. edulis and other ostreids.", "authors": "Colston-Nepali, L.; Lapegue, S.; Bierne, N.", "date": "2026-09-01", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4004, "score_semantic": 0.4004, "score_lexical": 1.0, "matched": ["chromosomal instability", "aneuploidy", "genomic instability"]}], "reports": [{"date": "2026-09-28", "label": "Sep 28, 2026", "n": 32}, {"date": "2026-09-21", "label": "Sep 21, 2026", "n": 24}, {"date": "2026-09-14", "label": "Sep 14, 2026", "n": 26}, {"date": "2026-09-07", "label": "Sep 07, 2026", "n": 34}, {"date": "2026-08-31", "label": "Aug 31, 2026", "n": 19}, {"date": "2026-08-24", "label": "Aug 24, 2026", "n": 24}, {"date": "2026-08-17", "label": "Aug 17, 2026", "n": 18}, {"date": "2026-08-10", "label": "Aug 10, 2026", "n": 34}, {"date": "2026-08-03", "label": "Aug 03, 2026", "n": 17}, {"date": "2026-07-27", "label": "Jul 27, 2026", "n": 24}, {"date": "2026-07-20", "label": "Jul 20, 2026", "n": 26}, {"date": "2026-06-26", "label": "Jun 26, 2026", "n": 14}, {"date": "2026-06-19", "label": "Jun 19, 2026", "n": 38}], "prefix": "", "home": "../papers.html"}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const papers = DATA.papers;
  const SHORT = 280;
  // Slider floor: the pipeline threshold, or lower if older data scored below it
  const FLOOR = Math.floor(Math.min(DATA.threshold, ...papers.map(p => p.score)) * 100) / 100;

  // ── Persistent per-browser state (stars / read), keyed by paper URL ──
  const store = {
    get(k, fallback) {
      try { const v = localStorage.getItem('papertrail:' + k); return v ? JSON.parse(v) : fallback; }
      catch { return fallback; }
    },
    set(k, v) {
      try { localStorage.setItem('papertrail:' + k, JSON.stringify(v)); } catch {}
