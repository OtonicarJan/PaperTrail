 TP53 status (median Type1 fraction 0.854 (mutant) versus 0.422, specimen level; P = 0.013 adjusted for chromosome 20q and aneuploidy). With only five samples discordant, TP53 status and promoter usage could not be separated (P = 0.97). The morphology gene score followed TP53 status in 88 GSE294511 organoids and TCGA-COAD/READ, identifying mucinous carcinoma; gastric-metaplasia genes followed TP53 status, not P2, in both cohorts but not discovery organoids. The p53 target module of the P2 signature followed P2 beyond TP53 status in both organoid cohorts, whereas the independent 12-gene p53 activity score did so in GSE294511 (P = 0.012) but not discovery organoids (P = 0.094). P2 dominant samples, including two TP53-mutant ones, were p53-active, and nutlin induced P2 only in p53 proficient cells. In TCGA, P2_index was higher in wild-type tumors but did not follow p53 activity beyond total MDM2. In wild-type cell lines P2 followed MDM2 dependency beyond total MDM2, and in wild type GSE294511 organoids idasanutlin sensitivity, though not beyond total MDM2. Conclusions: In CRC organoids, morphology followed TP53 status, with no detectable contribution of MDM2 promoter usage, as did gastric-metaplastic programs in an independent biobank and tumors. In organoids, P2 usage reflected p53 activity, beyond genotype mainly in the biobank and two TP53-mutant P2-dominant specimens; whether it improves on MDM2 expression for MDM2-inhibitor selection requires testing.", "authors": "Tsukui, T.; Shin, K.; Tsuda, K.; Yao, R.", "date": "2026-10-22", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5045, "score_semantic": 0.5045, "score_lexical": 1.0, "matched": ["chromosomal instability", "aneuploidy", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.10.22.26366203", "title": "Predicting HPV/p16 Status and Molecular Subtypes from Histopathology Slides using Deep Learning in Vulvar Squamous Cell Carcinoma", "abstract": "Vulvar squamous cell carcinoma (VSCC) comprises three prognostically distinct molecular subtypes: human papillomavirus (HPV)-associated, HPV-independent/p53-wildtype, and HPV-independent/p53-abnormal. Classification requires p16/p53 immunohistochemistry, which consumes tissue and is often incomplete in retrospective cohorts. We investigated whether deep learning could predict HPV/p16 status and molecular subtypes directly from routine hematoxylin and eosin-stained whole-slide images. Using features extracted with H-optimus-1, we developed two attention-based multiple-instance learning models: HERA, predicting HPV/p16 status, and HERMES, predicting the three molecular subtypes. Models were developed on 644 patients from three Dutch VSCC cohorts and tested on 286 patients from two independent cohorts. In independent testing, HERA achieved an area under the curve (AUC) of 0.84 (95% CI 0.75-0.91), with specificity 0.93, negative predictive value 0.94, and sensitivity 0.68. HERA-predicted groups reproduced the prognostic separation of HPV testing (log-rank p<0.001). HERMES achieved a macro-average AUC of 0.70 (0.66-0.75), with good discrimination for HPV-associated (0.80) but limited separation of HPV-independent/p53-abnormal (AUC 0.68) and HPV-independent/p53-wildtype (AUC 0.63). HERMES-predicted classes reproduced the prognostic hierarchy, with 5-year recurrence rates of 14.0% (HPV-associated), 31.1% (HPV-independent/p53-wildtype) and 43.3% (HPV-independent/p53-abnormal) (p=0.0051). Highly attended tiles showed basaloid cells and koilocytotic-like atypia in HPV-associated tumors, keratinizing nests with desmoplastic stroma in HPV-independent/p53-abnormal tumors, and well-differentiated keratinocytes with spongiosis in HPV-independent/p53-wildtype tumors. HERA could assign HPV/p16 status to large retrospective VSCC cohorts lacking ancillary testing, without consuming tissue, enabling HPV-stratified outcome analyses. Before such use, external validation of its discrimination and calibration across scanners and populations is required. HERMES suggests that molecular subtype information is encoded in hematoxylin and eosin-stained slides, but requires improved distinction between the HPV-independent subtypes.", "authors": "van den Berg, N.; van der Kolk, W.; Landsbergen, K.; Kortekaas, K.; Nooij, L.; van Velzen, A. F.; te Grootenhuis, N.; the AIRMEC Consortium,  ; Horeweg, N.; van Doorn, L.; Oonk, M.; Bart, J.; Bosse, T.", "date": "2026-10-24", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.4983, "score_semantic": 0.4983, "score_lexical": 0.4696, "matched": ["histopathology"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.10.18.753004", "title": "Streamline CNV - A Handy Nextflow Pipeline for Chromosomal Copy Number Variation Analysis", "abstract": "Background Aneuploidy, characterized by imbalanced chromosomal copy number variation (CNV), occurs in both normal somatic tissues and a wide range of diseases. Low pass whole genome sequencing (LP-WGS) to detect CNVs in cells and tissues has been widely used in all biological research. Existing informatics tools for detecting CNV often require computational expertise, often posing challenges for wet-lab biologists. To address this need, we developed Streamline CNV (SLCNV) - a user-friendly and flexible copy number analysis pipeline that allows researchers to perform many copy number-related analyses steps with a single, straightforward command. Results Streamline CNV is based on Nextflow and is packaged in a Docker image that can be executed using Singularity, making it portable and reproducible across different user environments. The pipeline automatically processes input data, performs sequencing quality control to filter problematic samples, outputs mapping statistics, CNV calling, and generates outputs including intuitive CNV plots, segmentation files (with statistics), annotation of genes on altered chromosomes, evaluation of proportion of chromosomal regions that are non-euploid. Based on user preferences, it can cluster samples solely based on CNV patterns, map the genomic location and density of genes of interest along chromosomes, and visually highlight regions with evident CNVs. In addition, it allows users to select and order chromosomes for display in plots, define sample label color palettes, and choose whether to include sample labels in the clustering visualizations. It also allows users to specify the amount of computing resources to allocate to the pipeline, such as CPU, memory, and runtime. Streamline CNV can be customizable and upgradable. It works with any species and genome assembly and efficiently supports both single-cell and bulk sequencing data with improved performance coding. Jobs can be distributed across cores of a basic Unix workstation, multiple nodes in a high-performance computing cluster using the Slurm scheduler, or cloud environments, as needed. Conclusions We demonstrated the tool using an in-house sequencing dataset of human and mouse cell lines. Our results showed that the Streamline CNV pipeline effectively detected copy number patterns and generated informative summaries. It annotated the findings by identifying affected genes within the copy-number segments and at the break-end regions. It also reported the proportions of altered chromosomal regions impacted by copy number changes for each sample. The clustering plot demonstrated the relationships between samples based on their copy number profiles. Gene density plots aid in interpreting how genes from distinct pathways are associated with CNV pattern alterations. This tool enables researchers, regardless of bioinformatics expertise, to perform comprehensive CNV analyses across a wide range of scenarios. It also facilitates the interpretation of the copy number results and makes it possible for transforming raw CNV data into further exploration of meaningful biological insights.", "authors": "Ma, D.; Soberanes, A.; Kim, F. S.; Shirke, A.; Su, X. A.", "date": "2026-10-23", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4838, "score_semantic": 0.4838, "score_lexical": 0.9036, "matched": ["aneuploidy"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.10.20.760544", "title": "Glycoconjugates tune the viscoelastic signature of mammary tumor progression", "abstract": "Breast cancer progression involves extensive remodeling of the tumor extracellular matrix (ECM), resulting in changes in mechanical properties. Tumors are viscoelastic, exhibiting both an initial elastic response to loading and a time-dependent viscous response. While it is well established that tumor elasticity or stiffness is elevated, changes in tissue viscoelasticity during breast cancer progression remain poorly characterized. Here, using a mouse model that recapitulates stages of human breast cancer progression (mouse mammary tumor virus-polyoma middle T antigen, MMTV-PyMT), we show that tumors from both early and late disease time points were significantly more viscoelastic than normal mammary glands. Spatial microindentation revealed that while local stiffness and viscoelasticity are strongly coupled in soft regions of normal tissue, this relationship weakens in late carcinoma. Compared to normal glands, carcinoma tissues also exhibited marked upregulation of glycosaminoglycans (GAGs) and glycoproteins. Selective enzymatic degradation of sulfated GAGs, mucins, or O/N-linked glycans reduced viscoelasticity without altering stiffness, establishing glycoconjugates as major contributors to tumor viscoelasticity. In vitro, increasing matrix viscoelasticity drove non-transformed mammary epithelial cells (MCF10A) toward a malignant phenotype through focal adhesion kinase mechanosignaling. Our work establishes increased viscoelasticity as a defining mechanical feature of breast cancer progression, driven in part by the accumulation of glycoconjugates. These findings provide a fuller picture of tumor mechanical evolution and a benchmark for recapitulating matrix viscoelasticity in engineered models of breast cancer.", "authors": "Sharma, A.; Baude, J. A.; Papez, M.; Gionet-Gonzales, M.; Stowers, R. S.", "date": "2026-10-21", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4658, "score_semantic": 0.4658, "score_lexical": 0.8653, "matched": ["tumor evolution", "cancer"]}, {"id": "https://doi.org/10.1038/s41467-026-77745-0", "title": "Spatiotemporal metabolic networks in a preclinical model of pancreatic cancer and associated cachexia.", "abstract": "Cachexia or body wasting is a significant contributing factor to the morbidity and mortality of pancreatic cancer. Despite an unmet need, its metabolic underpinnings remain poorly understood. Here, we characterize a mouse model that recaptures the longitudinal progression of human cachexia during pancreatic cancer development. We profile the metabolomes of pre-, early- and late-stage cancer-associated cachexia in male and female pancreas, its interstitial fluid (IF), plasma, liver, adipose tissue and skeletal muscle. We find that each tissue has a unique metabolome and trajectory across stages and reveal a marked lipid enrichment in the tumor IF. Using mathematical modeling, we identify metabolites participating in cross-tissue networks and in vivo validate a lactate-glucose conversion. We find systemic metabolic changes prior to weight loss and use feature selection algorithms to identify early detection markers. Our study provides a resource for system-wide metabolic evolution of pancreatic cancer and associated cachexia, highlighting the potential for timely diagnostics and interventions.", "authors": "Majem B, Lee MS, Shin KC, Naqvi I, Dennis C, Dailey L, Jeanfavre S, Mino-Kenudson M, Xavier JB, Clish CB, Mathur D, Kalaany NY", "date": "2026-Sep-18", "source": "PubMed", "journal": "Nature communications", "if": 14.7, "score": 0.4624, "score_semantic": 0.4624, "score_lexical": 0.908, "matched": ["tumor evolution", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.10.19.26365881", "title": "Leapfrogging cancer diagnostics with AI: a mixed-methods assessment of implementation determinants in low- and middle-income countries", "abstract": "IntroductionCancer incidence is rising rapidly in low- and middle-income countries (LMICs), where diagnostic pathology capacity is constrained. AI applied to routine histopathology could strengthen diagnostic capacity and offer leapfrogging potential by embedding AI into diagnostic systems as they are built up. However, without empirically identifying implementation determinants in LMIC cancer-diagnostic settings, AI solutions risk being poorly aligned with local constraints, limiting impact or exacerbating existing disparities.  MethodsWe conducted an exploratory mixed-methods pilot study across three phases: 1) a structured survey characterising the diagnostic and technical landscape and AI priorities; 2) focus group discussions (FGDs) to inductively identify implementation determinants and 3) a second survey quantifying FGD-derived themes. Twelve physicians were purposively recruited (10 from LMIC, 2 from high-income countries for reference) and findings integrated through narrative triangulation.  ResultsThere was substantial heterogeneity in diagnostic and AI infrastructure that did not track consistently with country income classification. H&E staining was universally available, immunohistochemistry capacity was rudimentary at 7 of 10 sites and molecular testing absent or minimal at 6 of 10 sites. Whole-slide-imaging scanners were available at 8 of 10 sites, while graphical processing units, required for efficient AI inference, were available at only 4 of 10 sites. The participants would prioritise use of AI for cancer screening, cancer diagnosis, and biomarker prediction from H&E slides. Six implementation determinants were identified: AI literacy, governance frameworks, funding, evidence generation, clinical deployment, and collaboration. Financial constraints emerged as the dominant barrier across all determinants, and collaboration as an important enabling mechanism.  ConclusionAI implementation readiness in LMIC cancer-diagnostic settings is highly heterogeneous and cannot be inferred from income classification, underscoring the need for institution-level assessment. Realising the leapfrogging potential of AI in this context requires coordinated progress across all determinants, with sustainable financing, and collaboration enabling the remaining determinants.  Key messagesO_ST_ABSWhat is already known on this topic?C_ST_ABSCancer incidence is rising rapidly in LMICs, where diagnostic capacity and molecular testing capabilities are severely constrained. AI could alleviate gaps, yet evidence on implementation determinants for integrating AI into cancer diagnostics in these settings remains limited.  What this study adds?AI implementation readiness varies substantially within LMIC settings and does not track with country income classification. Readiness is shaped by six implementation determinants: AI literacy, governance frameworks, funding, evidence generation, clinical deployment, and collaboration, with financial constraints as the dominant cross-cutting barrier.  How this study might affect research, practice or policy?These findings support institution-level feasibility assessment over income-classification proxies and highlight the need for sustainable financing and collaboration as foundational prerequisites for AI implementation in cancer diagnostics in LMICs.", "authors": "Schoenpflug, L. A.; van den Berg, N. J.; Chhut, S. V.; Leung, E. Y. L.; Looi, L.-M.; Lukande, R.; Meja, S. J.; Parra-Medina, R.; Pathak, T. B.; Pyuza, J. J.; Razack, R.; Tawiah, A.; Waithaka, M. W.; Zoroquiain, P.; Barkey Wolf, J.; Jundt, G.; Lafarge, M. W.; Bosse, T.; Koelzer, V. H.; Horeweg, N.", "date": "2026-10-20", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.444, "score_semantic": 0.444, "score_lexical": 0.8288, "matched": ["histopathology", "cancer"]}, {"id": "https://doi.org/10.1126/sciadv.aef6029", "title": "Loss of KAT5-dependent H2A.Z acetylation provokes chromosomal instability in recurrent pregnancy loss.", "abstract": "Placenta defects are one of the major causes of miscarriages, yet the underlying mechanisms remain poorly understood. We demonstrate that trophoblast-specific depletion of the acetyltransferase Kat5, or introduction of acetylation-defective mutants Kat5-Q377E G380E and Kat5-Y47A, induces severe chromosomal instability (CIN) during trophoblast cells division, leading to embryonic lethality. Moreover, mutation of a key lysine acetyltransferase 5 (KAT5) substrate, H2A.Z, via the introduction of H2az1-K5R K8R K12R K14R (which prevents H2A.Z acetylation), phenocopies the effects of KAT5 loss. Integrated RNA sequencing and CUT&Tag in mouse trophoblast stem cells reveal that KAT5, through H2A.Z acetylation, regulates transcription of key mitotic genes (Aurka, Aurkb, and Cenpa). We extend our finding to human trophoblast stem cells, demonstrating a conserved role for KAT5 in preventing CIN. Clinical analysis of placental villi from recurrent pregnancy loss patients with copy number variations revealed reduced expression of KAT5 and acetylated H2A.Z. This study demonstrates that the conserved KAT5-H2A.Z acetylation pathway safeguards chromosomal stability in trophoblast cells, supporting placenta development and successful pregnancy.", "authors": "Bi S, Chen Y, Zhang L, Zhang J, Wang Y, Huang B, Li S, Huang L, Wang Y, Wang H, Meng R, Tu Z, Du L, Wang H, Wang Z, Chen D, Zhang S, Wang F", "date": "2026-Oct-23", "source": "PubMed", "journal": "Science advances", "if": 13.6, "score": 0.4417, "score_semantic": 0.4417, "score_lexical": 1.0, "matched": ["chromosomal instability", "CIN"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.10.21.760667", "title": "Cytoplasmic localization of 5hmC reveals RNA hydroxymethylation in breast cancer", "abstract": "DNA methylation (5-methylcytosine, 5mC) is a major repressive epigenetic mark that can be iteratively oxidized by ten-eleven-translocation (TET) enzymes to 5-hydroxymethylcytosine (5hmC); beyond DNA, modifications of RNA can also affect transcript stability and processing, yet RNA hydroxymethylation remains unexplored in breast cancer (BC). Here, we identify a quantifiable cytoplasmic 5hmC signal in BC cell lines and, more prominently, in human BC tissue, using immunoassays and digital pathology, and confirm with an adapted, RNase-sensitive, RNA-specific ELISA that this signal reflects hydroxymethylation of total RNA and mRNA. Cytoplasmic 5hmC was significantly enriched in triple-negative (ER-/PR-/HER2-) and grade 3 tumors, and correlated with increased cytoplasmic TET2/TET3 in tissue and TET3 upregulation in TCGA. As a leading candidate mechanism, TET3 expression was associated with RNA-processing/spliceosomal transcripts, and TET3 knockdown in three TNBC cell lines reduced a subset of these targets, independently supported across 70 DepMap breast cancer lines.", "authors": "Wen, J.; Del Bel Belluz, L.; Ottaviani, S.; Poyia, F.; Yu, H.; Sachdev, S.; El Eid, L.; Garner, K.; Mistry, K.; Hayes, E.; Moderau, N.; Chandrasinghe, P. C.; Stebbing, J.; Cereser, B.", "date": "2026-10-21", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4345, "score_semantic": 0.4345, "score_lexical": 0.8132, "matched": ["digital pathology", "cancer"]}, {"id": "http://arxiv.org/abs/2610.26586v1", "title": "Scaling Vision Foundation Models for Toxicologic Pathology", "abstract": "Here, we present TOX-FM, a family of non-clinical PFMs trained on large-scale diverse histopathology datasets of over one million whole slide images consisting of over 60 organs across six animal species from over 14,000 toxicology studies across six decades. We introduce a comprehensive benchmark of 18 non-clinical downstream tasks, incorporate an established benchmark of 9 clinical downstream tasks, and evaluate TOX-FM against state-of-the-art clinical PFMs across both non-clinical and clinical domains. Notably, we explore open questions surrounding domain-specific training and cross-domain generalization, offering insights into the opportunities and challenges of applying PFMs in the non-clinical domain.", "authors": "Jessica Loo, Theodoros Pissas, Byunghak Kang, Vincent A. Ella, Xiaoyan Zhang, Kevin Sweeney, Walter Georgescu, Prateek Katiyar, Julie Boisclair, Holger Hoefling", "date": "2026-10-19", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.4302, "score_semantic": 0.4302, "score_lexical": 0.7248, "matched": ["histopathology"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.10.21.760707", "title": "Circulating extracellular vesicles display immunotherapeutic targets and complement circulating tumor DNA in high-risk neuroblastoma", "abstract": "Extracellular vesicles (EVs) offer a minimally invasive window into tumor biology through surface molecules reflecting their cellular origin. Here, we investigated whether neuroblastoma-derived EVs retain tumor-associated surface markers and provide complementary information to established biomarkers in children with neuroblastoma. EVs from neuroblastoma cell lines were characterized using orthogonal biochemical, morphological and biophysical approaches, followed by analysis of GD2, L1CAM and NCAM1 surface expression. EV-associated markers were subsequently evaluated in blood plasma-derived EVs from children with neuroblastoma and pediatric controls and compared with clinical and circulating cell-free DNA (cfDNA) parameters. Neuroblastoma EVs displayed GD2, L1CAM and NCAM1 in patterns reflecting donor-cell surface expression, supported by a positive correlation between cellular and EV marker abundance (Spearman {rho}=0.74, P<0.0001). Genetic disruption of GD2 biosynthesis resulted in corresponding loss of EV-associated GD2, further supporting its cellular origin. In plasma, GD2-, L1CAM- and NCAM1-positive EVs were enriched in patients with high-risk neuroblastoma and correlated with LDH level, soft tissue disease burden (GD2, L1CAM) and cfDNA concentration (GD2, NCAM1). Longitudinal analyses demonstrated dynamic and partially discordant changes in EV- and cfDNA-markers. These findings identify tumor-associated EV surface phenotypes as complementary circulating biomarkers and support their further evaluation for minimally invasive monitoring of neuroblastoma evolution.", "authors": "Auber, M.; Nejaime, A.; Chang, H.-D.; Maier, R.; Mizrak, R.; Bachurski, D.; Hallek, M.; Yousefnia, J. V.; Andersch, L.; Kuehnen, P.; Lodrini, M.; Jens, M.; Pogge von Strandmann, E.; Kuenkele, A.; Preusser, C.; Deubzer, H. E.", "date": "2026-10-22", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4299, "score_semantic": 0.4299, "score_lexical": 0.6825, "matched": ["tumor evolution"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.10.13.758550", "title": "ClonoDeconv: reference-based α - β paired recurrent clonotype proportion estimation from bulk-TCR sequencing", "abstract": "T cell receptor (TCR) sequencing is crucial when studying antigen-specific T cell responses and clonal dynamics. A key objective of TCR repertoire analysis is to identify recurring clonotypes across timepoints or different disease states, providing insight into the evolution of immune response. Bulk-TCR sequencing enables high-throughput profiling of TCR  and {beta} sequences but lacks pairing information, while single cell TCR sequencing (scTCR-seq) retains pairing information but is limited by sensitivity, throughput, and costs. We present ClonoDeconv, a computational framework to deconvolute paired TCR {beta} ; clonotype frequency from bulk TCR sequencing experiments using a paired scTCR-seq reference. ClonoDeconv robustly estimated shared clonotype abundances from 5' RACE bulk-TCR datasets using a scTCR-seq reference from the same donor. Applied to longitudinal samples, ClonoDeonv successfully captured the expansion and contraction of rare virus-specific clones across timepoints. Taken together, ClonoDeconv provides a cost-effective and scalable approach for studying the longitudinal T-cell clonal dynamics.", "authors": "Zhou, Y.; Antoun, E.; Pereira Pinho, M.; Zheng, J.; Wu, Y.; Adigbli, G.; Issa, F.; Peng, Y.; Knight, J.; Dong, T.", "date": "2026-10-19", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4268, "score_semantic": 0.4268, "score_lexical": 0.9131, "matched": ["clonal evolution"]}, {"id": "http://arxiv.org/abs/2610.32478v1", "title": "PathJev: Decision-Native Vision-Language Modelling for Histopathology", "abstract": "Vision-language models used for decisions in histopathology rarely return calibrated probabilities over the candidates a user cares about. Decision-native models write a question and a candidate set chosen at run time into the input and return a normalised distribution from a small decision head in one forward pass. We build PathJev-P, a decision-native model for histopathology: MedGemma-1.5-4B with LoRA adapters and a decision head, trained on 40,000 patch states from three public collections whose expert labels are turned into typed questions with organ-specific candidate sets and a \"none of these\" option. In a comparison over 3 seeds with an analysis plan fixed before testing, on test sets without documented overlap with the training data of the backbone, PathJev-P is more accurate than a generative model trained with the same backbone, data and selection rule, the zero-shot pathology model CONCH and a general medical decision model (balanced accuracy 0.541 against 0.492, 0.345 and 0.213); its advantage over the generative model comes from two organs absent from training. The calibration advantage depends on how the generative model's probabilities are read out. With the summed candidate log-likelihood used in previous work, PathJev-P has the lower calibration error (ECE 0.204 against 0.279); with a length-normalised read-out of the same generative model, examined post hoc, the two have similar mean calibration error (0.201) and the generative model is better calibrated on the unseen organs, where PathJev-P remains over-confident. A supervised linear probe on a pathology foundation model is better calibrated in every setting. In a qualitative whole-slide demonstration, PathJev-P labels unsupervised tissue clusters with abstention and separates carcinoma from other tissue while running the model on a fraction of the tiles.", "authors": "Cristian Tommasino, Antonio M. Rinaldi", "date": "2026-10-23", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.4179, "score_semantic": 0.4179, "score_lexical": 0.8641, "matched": ["histopathology"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.10.21.26366165", "title": "A digital biomarker of white-matter routing from diffusion MRI as an early biomarker of Alzheimer's disease", "abstract": "Alzheimer's disease is diagnosed after a decade-long phase in which pathology accumulates; current markers show that pathology is present, but not how far it has advanced. Because white-matter structure is altered early, we computed two graph-theoretic indices of periventricular white-matter routing from diffusion MRI in 1,706 OASIS-3 sessions: the Route Concordance Index (RCI), a population-calibrated path-concordance score over 316 routes, and a global conductance from the connectome's graph Laplacian. RCI was reduced before clinical conversion and declined monotonically across a five-stage trajectory (cross-validated AUC = 0.817 for stable-CN vs. pre-AD; comparable to hippocampal volume and exceeding entorhinal thickness, global conductance, and DTI-ALPS), with degradation concentrated in fronto-striatal circuits. A classifier combining these routing features with demographic, structural-MRI and cognitive covariates detected conversion to MCI or AD up to four years before diagnosis (AUC = 0.831; 0.918 within one year; modest positive predictive value). Findings replicated in ADNI (n = 609; conductance AUC = 0.805; RCI = 0.797 under frozen external validation) and tracked CSF amyloid-beta 42 in the expected direction. Computed from a standard diffusion MRI sequence, RCI is comparable to established structural and demographic biomarkers on preclinical discrimination while, unlike them, declining cleanly and monotonically across the disease trajectory, supporting prospective validation for risk stratification.", "authors": "Schlachetzki, J. C. M.; Ghodrat, M.", "date": "2026-10-24", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.4112, "score_semantic": 0.4112, "score_lexical": 0.5653, "matched": ["digital pathology"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.10.17.26365423", "title": "Claims-based reconstruction of the pancreatic cancer care pathway links centralization of care to survival", "abstract": "BackgroundThe organization of pancreatic cancer care may be associated with survival. Using health administrative claims data, we reconstructed the pathway from diagnosis to first-line therapy and examined associations of multidisciplinary team review and treatment at specialized centers with overall survival.  MethodsLongitudinal historical cohort study using anonymized health administrative claims data from six Czech health insurance funds, covering approximately 17% of patients diagnosed with pancreatic cancer nationally between 2018 and 2020. Adults with an incident ICD-10 C25 record confirmed by imaging and histopathology were followed from the index date (the date of the first qualifying imaging or histopathological examination) until death, censoring, or 31 December 2021. Overall survival was analyzed using Kaplan-Meier methods and Cox regression adjusted for age and first-line therapy type.  ResultsOf 1,255 patients, 920 (73.3%) received first-line therapy and 266 (21.2%) died untreated. Among treated patients, 436 (47.4%) underwent multidisciplinary team review, 335 (36.4%) underwent surgery, and 667 (72.5%) were treated at a complex oncological center. Surgery was associated with longer overall survival than chemotherapy (age-adjusted hazard ratio [HR] 0.32, P < 0.001). Treatment at a complex oncological center was associated with longer overall survival (adjusted HR 0.77, 95% confidence interval [CI] 0.64-0.92, P = 0.004; crude median 532 versus 394 days). Multidisciplinary team review was not significantly associated with overall survival (adjusted HR 0.86, 95% CI 0.73-1.01, P = 0.073).  ConclusionsTreatment at a complex oncological center was associated with longer survival, while fewer than half of patients had a recorded multidisciplinary team review. How care is organized, not only which therapy is delivered, is associated with outcome. The observational design and absence of key clinical covariates limit causal interpretation.", "authors": "Laubr, D.; Tichopad, A.; Rybar, M.; Bielcikova, Z.; Lovecek, M.; Rozanek, M.; Donin, G.", "date": "2026-10-20", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.4093, "score_semantic": 0.4093, "score_lexical": 0.7049, "matched": ["histopathology", "cancer"]}], "reports": [{"date": "2026-10-26", "label": "Oct 26, 2026", "n": 47}, {"date": "2026-10-19", "label": "Oct 19, 2026", "n": 40}, {"date": "2026-10-12", "label": "Oct 12, 2026", "n": 29}, {"date": "2026-10-05", "label": "Oct 05, 2026", "n": 32}, {"date": "2026-09-28", "label": "Sep 28, 2026", "n": 32}, {"date": "2026-09-21", "label": "Sep 21, 2026", "n": 24}, {"date": "2026-09-14", "label": "Sep 14, 2026", "n": 26}, {"date": "2026-09-07", "label": "Sep 07, 2026", "n": 34}, {"date": "2026-08-31", "label": "Aug 31, 2026", "n": 19}, {"date": "2026-08-24", "label": "Aug 24, 2026", "n": 24}, {"date": "2026-08-17", "label": "Aug 17, 2026", "n": 18}, {"date": "2026-08-10", "label": "Aug 10, 2026", "n": 34}, {"date": "2026-08-03", "label": "Aug 03, 2026", "n": 17}, {"date": "2026-07-27", "label": "Jul 27, 2026", "n": 24}, {"date": "2026-07-20", "label": "Jul 20, 2026", "n": 26}, {"date": "2026-06-26", "label": "Jun 26, 2026", "n": 14}, {"date": "2026-06-19", "label": "Jun 19, 2026", "n": 38}], "prefix": "", "home": "../papers.html"}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const papers = DATA.papers;
  const SHORT = 280;
  // Slider floor: the pipeline threshold, or lower if older data scored below it
  const FLOOR = Math.floor(Math.min(DATA.threshold, ...papers.map(p => p.score)) * 100) / 100;

  // ── Persistent per-browser state (stars / read), keyed by paper URL ──
  const store = {
    get(k, fallback) {
      try { const v = localStorage.getItem('papertrail:' + k); return v ? JSON.parse(v) : fallback; }
      catch { return fallback; }
    },
    set(k, v) {
      try { localStorage.setItem('papertrail:' + k, JSON.stringify(v)); } catch {}
    },
  };
  const starred = new Map(Object.entries(store.get('starred', {})));  // id -> paper snapshot
  const read    = new Set(store.get('read', []));
  const saveStars = () => store.set('starred', Object.fromEntries(starred));
  const saveRead  = () => store.set('read', [...read]);

  const prefs = store.get('prefs', {});
  const state = {
    q: '',
    view: 'all',
    sort: prefs.sort || 'score',
    min: FLOOR,
    sources: new Set(),
    keyword: null,
    expanded: new Set(),
    scope: 'week',        // 'week' = this report, 'all' = every archived week
    limit: 100,           // cards rendered before "Show more"
  };
  const PAGE = 100;

  // ── All-weeks index: loaded on demand from reports/search-index.js ──
  let ALL = null, loadingAll = false;
  function loadAll() {
    if (ALL || loadingAll) return;
    loadingAll = true;
    const s = document.createElement('script');
    s.src = (DATA.prefix || '') + 'search-index.js';
    s.onload = () => { ALL = window.PAPERTRAIL_INDEX || []; loadingAll = false; render(); };
    s.onerror = () => {
      loadingAll = false; state.scope = 'week'; render();
      $('count').textContent = 'Could not load the all-weeks index (reports/search-index.js).';
    };
    document.head.appendChild(s);
  }
  const pool = () => state.scope === 'all' && ALL ? ALL : papers;

  // ── Helpers ──
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const scoreVar = s => s >= 0.5 ? 'var(--high)' : s >= 0.35 ? 'var(--mid)' : 'var(--low)';
  const isPreprint = p => !p.journal || p.journal === 'preprint';
  const url = p => (p.id && !p.id.startsWith('http')) ? 'https://doi.org/' + p.id : p.id;
  // Dates come as "2026-09-02", "2026-Sep-02" (PubMed) or just "2026-Sep"
  const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const dateKey = d => {
    const m = /^(\d{4})(?:-(\w+))?(?:-(\d+))?/.exec(d || '');
    if (!m) return 0;
    const mon = m[2] ? (/^\d+$/.test(m[2]) ? +m[2] - 1 : MONTHS.indexOf(m[2].slice(0, 3).toLowerCase())) : 0;
    return Date.UTC(+m[1], Math.max(mon, 0), m[3] ? +m[3] : 1);
  };

  // Keyword highlighting: whole-token matches, longest first
  const kwRe = DATA.keywords.length
    ? new RegExp('\\b(' + [...DATA.keywords].sort((a, b) => b.length - a.length).map(reEsc).join('|') + ')\\b', 'gi')
    : null;
  function highlight(text) {
    const parts = [];
    const res = [kwRe];
    const q = state.q.trim();
    if (q.length >= 2) res.push(new RegExp('(' + q.split(/\s+/).map(reEsc).join('|') + ')', 'gi'));
    // Collect ranges from all regexes on raw text, then merge and escape
    const ranges = [];
    for (const re of res) {
      if (!re) continue;
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(text))) { if (!m[0]) { re.lastIndex++; continue; } ranges.push([m.index, m.index + m[0].length]); }
    }
    if (!ranges.length) return esc(text);
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [ranges[0].slice()];
    for (const r of ranges.slice(1)) {
      const last = merged[merged.length - 1];
      if (r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push(r.slice());
    }
    let i = 0;
    for (const [a, b] of merged) { parts.push(esc(text.slice(i, a)), '<mark>', esc(text.slice(a, b)), '</mark>'); i = b; }
    parts.push(esc(text.slice(i)));
    return parts.join('');
  }

  const hayCache = new WeakMap();
  const hay = p => {
    let h = hayCache.get(p);
    if (h === undefined) {
      h = [p.title, p.abstract, p.authors, p.journal, p.source].join(' ').toLowerCase();
      hayCache.set(p, h);
    }
    return h;
  };

  // ── Filtering ──
  function filtered() {
    const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    let list = state.view === 'starred'
      ? [...starred.values()]
      : pool();
    list = list.filter(p => {
      if (state.view !== 'starred' && p.score < state.min) return false;
      if (state.view === 'unread' && read.has(p.id)) return false;
      if (state.sources.size && !state.sources.has(p.source)) return false;
      if (state.keyword && !(p.matched || []).includes(state.keyword)) return false;
      if (terms.length) {
        const h = hay(p);
        if (!terms.every(t => h.includes(t))) return false;
      }
      return true;
    });
    const by = {
      score: (a, b) => b.score - a.score,
      date:  (a, b) => dateKey(b.date) - dateKey(a.date) || b.score - a.score,
      if:    (a, b) => (b.if ?? -1) - (a.if ?? -1) || b.score - a.score,
    }[state.sort];
    return [...list].sort(by);
  }

  // ── Rendering ──
  const ICON_STAR = '<svg viewBox="0 0 24 24" fill="FILL" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  // Link to the report(s) a paper appeared in, when not the one being viewed
  const LABELS = Object.fromEntries((DATA.reports || []).map(r => [r.date, r.label]));
  function weekTag(p) {
    const weeks = (p.weeks || []).filter(w => w !== DATA.date || state.scope === 'all');
    if (!weeks.length || (state.scope !== 'all' && state.view !== 'starred')) return '';
    const [w, ...rest] = weeks;
    const label = w === DATA.date ? 'This week' : 'Week of ' + (LABELS[w] || w);
    return `<a class="week-tag" href="${esc((DATA.prefix || '') + w + '.html')}" title="${esc(weeks.map(x => LABELS[x] || x).join(', '))}">${esc(label)}${rest.length ? ` +${rest.length}` : ''}</a>`;
  }

  function card(p) {
    const s = p.score ?? 0;
    const abs = p.abstract || '';
    const long = abs.length > SHORT;
    const open = state.expanded.has(p.id);
    const shown = long && !open ? abs.slice(0, SHORT) + '…' : abs;
    const ifStr = p.if != null ? ` · IF ${Number(p.if).toFixed(1)}` : '';
    const authors = p.authors || '';
    const isStar = starred.has(p.id), isRead = read.has(p.id);
    const u = url(p);
    return `
      <article class="card${isRead ? ' is-read' : ''}" style="--score-color:${scoreVar(s)}" data-id="${esc(p.id)}">
        <div class="card-top">
          <a class="title" href="${esc(u)}" target="_blank" rel="noopener">${highlight(p.title || '')}</a>
          <div class="score-block" title="semantic ${p.score_semantic ?? '–'} · lexical ${p.score_lexical ?? '–'}">
            <div class="score-pill">${s.toFixed(2)}</div>
            <div class="score-bar-track"><div class="score-bar-fill" style="width:${Math.min(s * 100, 100)}%"></div></div>
          </div>
        </div>
        <div class="card-meta">
          <span class="badge${isPreprint(p) ? ' preprint' : ''}">${esc(p.source)}</span>
          ${!isPreprint(p) ? `<span>${esc(p.journal)}${ifStr}</span>` : ''}
          <span>${esc(p.date)}</span>
          <span title="${esc(authors)}">${esc(authors.length > 60 ? authors.slice(0, 60) + '…' : authors)}</span>
          ${weekTag(p)}
        </div>
        <div class="abstract">${highlight(shown)}${long ? `<button class="toggle-btn" data-act="toggle">${open ? 'Show less' : 'Show more'}</button>` : ''}</div>
        <div class="card-foot">
          <div class="matched">${(p.matched || []).map(k => `<button class="kw" data-kw="${esc(k)}" title="Filter by this keyword">${esc(k)}</button>`).join('')}</div>
          <button class="act${isStar ? ' on' : ''}" data-act="star" aria-pressed="${isStar}">${ICON_STAR.replace('FILL', isStar ? 'currentColor' : 'none')}${isStar ? 'Starred' : 'Star'}</button>
          <button class="act${isRead ? ' read-on' : ''}" data-act="read" aria-pressed="${isRead}">${ICON_CHECK}${isRead ? 'Read' : 'Mark read'}</button>
          <a class="doi-link" href="${esc(u)}" target="_blank" rel="noopener">Open ↗</a>
        </div>
      </article>`;
  }

  const $ = id => document.getElementById(id);

  function renderChips() {
    const counts = {};
    const src = state.view === 'starred' ? [...starred.values()] : pool();
    src.forEach(p => { counts[p.source] = (counts[p.source] || 0) + 1; });
    $('sources').innerHTML = Object.keys(counts).sort().map(src =>
      `<button class="chip" data-src="${esc(src)}" aria-pressed="${state.sources.has(src)}">${esc(src)}<span class="n">${counts[src]}</span></button>`
    ).join('');
    const kwCounts = {};
    src.forEach(p => (p.matched || []).forEach(k => { kwCounts[k] = (kwCounts[k] || 0) + 1; }));
    $('keywords').innerHTML = DATA.keywords.map(k =>
      `<button class="chip" data-kw="${esc(k)}" aria-pressed="${state.keyword === k}">${esc(k)}<span class="n">${kwCounts[k] || 0}</span></button>`
    ).join('');
  }

  // Filter changes start from the first page again
  const update = () => { state.limit = PAGE; render(); };

  function render() {
    const list = filtered();
    const papersEl = $('papers');
    if (state.scope === 'all' && !ALL) {
      papersEl.innerHTML = '<div class="empty">Loading all weeks…</div>';
    } else if (list.length) {
      const rest = list.length - state.limit;
      papersEl.innerHTML = list.slice(0, state.limit).map(card).join('') +
        (rest > 0 ? `<button class="more-btn" data-act="more">Show ${Math.min(rest, PAGE)} more (${rest} left)</button>` : '');
    } else {
      papersEl.innerHTML = `<div class="empty">${state.view === 'starred' && !starred.size
        ? 'No starred papers yet — star papers to build a reading list. It is saved in this browser.'
        : 'No papers match these filters.'}</div>`;
    }
    const base = state.view === 'starred' ? starred.size : pool().length;
    const what = state.view === 'starred' ? 'starred papers'
      : state.scope === 'all' ? `papers across ${(DATA.reports || []).length} weeks` : 'papers';
    $('count').textContent = `Showing ${list.length} of ${base} ${what}`;
    $('star-n').textContent = starred.size ? `(${starred.size})` : '';
    $('export').hidden = state.view !== 'starred' || !starred.size;
    const dirty = state.q || state.sources.size || state.keyword || state.min !== FLOOR;
    $('reset').hidden = !dirty;
    document.querySelectorAll('#view button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === state.view));
    document.querySelectorAll('#scope button').forEach(b => b.setAttribute('aria-pressed', b.dataset.scope === state.scope));
    $('scope').hidden = (DATA.reports || []).length < 2;
    renderChips();
  }

  // ── Header / footer ──
  $('meta').textContent =
    `${papers.length} of ${DATA.total} relevant papers · Past ${DATA.days} days · Generated ${DATA.generated}`;
  $('footer').textContent = `Generated by PaperTrail · Sources: ${DATA.sources.join(', ')}`;
  if (DATA.imported) {
    $('meta').insertAdjacentHTML('afterend',
      '<div class="imported-note">Recovered from an older report: author lists are shortened.</div>');
  }

  // ── Week navigation (reports are listed newest first) ──
  const REPORTS = DATA.reports || [];
  const here = REPORTS.findIndex(r => r.date === DATA.date);
  const href = r => (DATA.prefix || '') + r.date + '.html';
  if (REPORTS.length > 1 && here !== -1) {
    $('weeks').hidden = false;
    $('week').innerHTML = REPORTS.map((r, i) =>
      `<option value="${i}"${i === here ? ' selected' : ''}>${esc(r.label)} · ${r.n} papers${i === 0 ? ' · latest' : ''}</option>`
    ).join('');
    $('week').addEventListener('change', e => { location.href = href(REPORTS[+e.target.value]); });
    const link = (el, r) => r ? (el.href = href(r)) : el.setAttribute('aria-disabled', 'true');
    link($('prev'), REPORTS[here + 1]);
    link($('next'), REPORTS[here - 1]);
    if (here === 0) $('latest').hidden = true; else $('latest').href = DATA.home;
  }

  // ── Controls ──
  const min = $('min');
  min.min = FLOOR;
  min.value = state.min;
  $('min-val').textContent = state.min.toFixed(2);
  $('sort').value = state.sort;

  let t;
  $('q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; update(); }, 120); });
  min.addEventListener('input', e => { state.min = +e.target.value; $('min-val').textContent = state.min.toFixed(2); update(); });
  $('sort').addEventListener('change', e => { state.sort = e.target.value; store.set('prefs', { ...prefs, sort: state.sort }); update(); });
  $('view').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.view = b.dataset.view; update();
  });
  $('scope').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.scope = b.dataset.scope;
    if (state.scope === 'all') loadAll();
    update();
  });
  $('sources').addEventListener('click', e => {
    const b = e.target.closest('[data-src]'); if (!b) return;
    const s = b.dataset.src;
    state.sources.has(s) ? state.sources.delete(s) : state.sources.add(s);
    update();
  });
  const toggleKw = k => { state.keyword = state.keyword === k ? null : k; update(); };
  $('keywords').addEventListener('click', e => { const b = e.target.closest('[data-kw]'); if (b) toggleKw(b.dataset.kw); });
  $('reset').addEventListener('click', () => {
    state.q = ''; $('q').value = '';
    state.sources.clear(); state.keyword = null;
    state.min = FLOOR; min.value = state.min; $('min-val').textContent = state.min.toFixed(2);
    update();
  });
  $('export').addEventListener('click', () => {
    const lines = [...starred.values()].sort((a, b) => b.score - a.score).map(p =>
      `- [${p.title}](${url(p)})  \n  ${p.authors ? p.authors.split(/[,;]/)[0].trim() + ' et al. · ' : ''}${isPreprint(p) ? p.source : p.journal} · ${p.date}`);
    const blob = new Blob([`# PaperTrail — starred papers\n\n${lines.join('\n')}\n`], { type: 'text/markdown' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'papertrail-starred.md' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $('papers').addEventListener('click', e => {
    const kw = e.target.closest('.matched [data-kw]');
    if (kw) { toggleKw(kw.dataset.kw); return; }
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    if (btn.dataset.act === 'more') { state.limit += PAGE; render(); return; }
    const id = btn.closest('.card').dataset.id;
    const p = pool().find(x => x.id === id) || papers.find(x => x.id === id) || starred.get(id);
    const act = btn.dataset.act;
    if (act === 'toggle') { state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); }
    if (act === 'star')   { starred.has(id) ? starred.delete(id) : starred.set(id, { ...p, weeks: p.weeks || [DATA.date] }); saveStars(); }
    if (act === 'read')   { read.has(id) ? read.delete(id) : read.add(id); saveRead(); }
    render();
  });

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
    if (e.key === 'Escape' && document.activeElement === $('q')) { $('q').blur(); }
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (!typing && e.key === '[' && $('prev').href) location.href = $('prev').href;
    if (!typing && e.key === ']' && $('next').href) location.href = $('next').href;
  });

  render();
})();
</script>
</body>
</html>
