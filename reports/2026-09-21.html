<title>PaperTrail — September 21, 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #F7F7F5;
    --surface:   #FFFFFF;
    --text:      #1A1A2E;
    --body:      #374151;
    --muted:     #6B7280;
    --accent:    #2D6A4F;
    --accent-bg: #E3F0E9;
    --border:    #E5E7EB;
    --high:      #2D6A4F;
    --mid:       #D97706;
    --low:       #DC2626;
    --badge-bg:  #EEF2FF;
    --badge-fg:  #4338CA;
    --pre-bg:    #FEF3C7;
    --pre-fg:    #92400E;
    --mark:      #FDE68A;
    --star:      #D97706;
    --shadow:    rgba(0,0,0,0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #14161B;
      --surface:   #1C1F26;
      --text:      #ECEDEF;
      --body:      #C9CCD3;
      --muted:     #9097A3;
      --accent:    #6FC69A;
      --accent-bg: #1F3A2D;
      --border:    #2D313A;
      --high:      #6FC69A;
      --mid:       #F0A93B;
      --low:       #F07171;
      --badge-bg:  #262B45;
      --badge-fg:  #A5B4FC;
      --pre-bg:    #3A2F14;
      --pre-fg:    #F5C969;
      --mark:      #5C4A12;
      --star:      #F0A93B;
      --shadow:    rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg:        #14161B;
    --surface:   #1C1F26;
    --text:      #ECEDEF;
    --body:      #C9CCD3;
    --muted:     #9097A3;
    --accent:    #6FC69A;
    --accent-bg: #1F3A2D;
    --border:    #2D313A;
    --high:      #6FC69A;
    --mid:       #F0A93B;
    --low:       #F07171;
    --badge-bg:  #262B45;
    --badge-fg:  #A5B4FC;
    --pre-bg:    #3A2F14;
    --pre-fg:    #F5C969;
    --mark:      #5C4A12;
    --star:      #F0A93B;
    --shadow:    rgba(0,0,0,0.35);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 2rem 1rem 4rem;
  }

  .page { max-width: 780px; margin: 0 auto; }
  button, input, select { font: inherit; color: inherit; }

  /* ── Header ── */
  header { margin-bottom: 1.25rem; }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .logo span { color: var(--text); }
  .head-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.6rem 1rem; }
  .weeks { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; }
  .weeks select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.3rem 0.5rem; font-size: 0.82rem; max-width: 62vw;
  }
  .wk-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); text-decoration: none; font-size: 1.1rem; line-height: 1;
  }
  .wk-btn:hover { border-color: var(--accent); color: var(--accent); }
  .wk-btn[aria-disabled="true"] { opacity: 0.35; pointer-events: none; }
  .weeks .linkish { text-decoration: none; white-space: nowrap; }
  .imported-note { color: var(--muted); font-size: 0.78rem; margin-top: 0.25rem; }
  .meta { margin-top: 0.4rem; color: var(--muted); font-size: 0.85rem; }

  /* ── Controls ── */
  .controls {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 0.75rem 0 0.9rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 0.6rem;
  }
  .search {
    width: 100%;
    padding: 0.55rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    font-size: 0.9rem;
  }
  .search-row { display: flex; gap: 0.5rem; align-items: stretch; }
  .search-row .search { flex: 1; min-width: 0; }
  .search-row .seg button { padding: 0 0.75rem; white-space: nowrap; }
  .week-tag {
    font-size: 0.72rem; font-weight: 500; color: var(--accent);
    text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  .week-tag:hover { border-bottom-style: solid; }
  .more-btn {
    align-self: center; margin-top: 0.25rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.45rem 1.1rem; font-size: 0.85rem; cursor: pointer; color: var(--accent);
  }
  .more-btn:hover { border-color: var(--accent); }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; font-size: 0.82rem; color: var(--muted); }
  .row label { display: inline-flex; align-items: center; gap: 0.4rem; }
  .row select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.2rem 0.4rem; font-size: 0.82rem;
  }
  .row input[type=range] { accent-color: var(--accent); width: 110px; }
  .row input[type=checkbox] { accent-color: var(--accent); }
  .min-val { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 500; min-width: 2.2em; }

  .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .chip {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 0.74rem; font-weight: 500;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .chip .n { opacity: 0.7; margin-left: 0.25rem; font-variant-numeric: tabular-nums; }

  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: var(--surface); border: none; padding: 0.2rem 0.65rem;
    font-size: 0.8rem; cursor: pointer; color: var(--muted);
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }

  .status { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--muted); }
  .linkish { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.8rem; font-weight: 500; }
  .linkish:hover { text-decoration: underline; }

  /* ── Cards ── */
  .papers { display: flex; flex-direction: column; gap: 1rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--score-color, var(--border));
    border-radius: 0 8px 8px 0;
    padding: 1.25rem 1.5rem 1rem;
    transition: box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .card:hover { box-shadow: 0 4px 16px var(--shadow); }
  .card.is-read { opacity: 0.55; }
  .card.is-read:hover { opacity: 1; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 0.5rem;
  }

  .title {
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .title:hover { color: var(--accent); }

  /* Score pill + bar */
  .score-block { flex-shrink: 0; text-align: right; min-width: 48px; }
  .score-pill {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--score-color);
    font-variant-numeric: tabular-nums;
  }
  .score-bar-track {
    width: 48px; height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 4px;
  }
  .score-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--score-color);
  }

  .card-meta {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.6rem;
    display: flex; flex-wrap: wrap; gap: 0.3rem 0.75rem;
    align-items: center;
  }
  .badge {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.1rem 0.45rem;
    border-radius: 4px;
    background: var(--badge-bg);
    color: var(--badge-fg);
  }
  .badge.preprint { background: var(--pre-bg); color: var(--pre-fg); }

  .abstract {
    font-size: 0.875rem;
    color: var(--body);
    line-height: 1.65;
    overflow-wrap: anywhere;
  }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .toggle-btn {
    background: none; border: none; cursor: pointer;
    color: var(--accent); font-size: 0.8rem; font-weight: 500;
    padding: 0; margin-top: 0.3rem; display: block;
  }
  .toggle-btn:hover { text-decoration: underline; }

  .card-foot {
    margin-top: 0.7rem;
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.9rem;
    font-size: 0.78rem;
  }
  .matched { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-right: auto; }
  .matched .kw {
    background: var(--accent-bg); color: var(--accent);
    font-size: 0.7rem; font-weight: 500;
    padding: 0.05rem 0.5rem; border-radius: 999px;
    border: none; cursor: pointer;
  }
  .act {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 0.78rem; padding: 0.1rem 0;
    display: inline-flex; align-items: center; gap: 0.25rem;
  }
  .act:hover { color: var(--accent); }
  .act.on { color: var(--star); }
  .act.read-on { color: var(--accent); }
  .act svg { width: 14px; height: 14px; }
  .doi-link { color: var(--muted); text-decoration: none; }
  .doi-link:hover { color: var(--accent); }

  .empty {
    text-align: center; color: var(--muted); font-size: 0.9rem;
    padding: 3rem 1rem; border: 1px dashed var(--border); border-radius: 8px;
  }

  /* ── Footer ── */
  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
  }

  @media (max-width: 560px) {
    .search-row { flex-direction: column; }
    .search-row .seg button { flex: 1; padding: 0.3rem 0.5rem; }
    body { padding: 1.25rem 1rem 3rem; }
    .card { padding: 1rem 1rem 0.85rem; }
    .controls { position: static; }
  }
</style>
</head>
<body>
<div class="page">

<header>
  <div class="head-row">
    <div class="logo">Paper<span>Trail</span></div>
    <nav class="weeks" id="weeks" aria-label="Weekly reports" hidden>
      <a class="wk-btn" id="prev" title="Previous week  ( [ )" aria-label="Previous week">‹</a>
      <select id="week" aria-label="Choose week"></select>
      <a class="wk-btn" id="next" title="Next week  ( ] )" aria-label="Next week">›</a>
      <a class="linkish" id="latest">Latest →</a>
    </nav>
  </div>
  <div class="meta" id="meta"></div>
</header>

<div class="controls">
  <div class="search-row">
    <input class="search" id="q" type="search" placeholder="Search papers, authors, journals…" autocomplete="off">
    <div class="seg" id="scope" role="group" aria-label="Search scope">
      <button data-scope="week" aria-pressed="true">This week</button>
      <button data-scope="all">All weeks</button>
    </div>
  </div>
  <div class="row">
    <div class="seg" id="view" role="group" aria-label="View">
      <button data-view="all" aria-pressed="true">All</button>
      <button data-view="unread">Unread</button>
      <button data-view="starred">Starred <span id="star-n"></span></button>
    </div>
    <label>Sort
      <select id="sort">
        <option value="score">Relevance</option>
        <option value="date">Newest</option>
        <option value="if">Impact factor</option>
      </select>
    </label>
    <label>Min score
      <input id="min" type="range" min="0" max="1" step="0.01">
      <span class="min-val" id="min-val"></span>
    </label>
  </div>
  <div class="chips" id="sources" aria-label="Sources"></div>
  <div class="chips" id="keywords" aria-label="Keywords"></div>
  <div class="status">
    <span id="count" aria-live="polite"></span>
    <span>
      <button class="linkish" id="export" hidden>Export starred</button>
      <button class="linkish" id="reset" hidden>Clear filters</button>
    </span>
  </div>
</div>

<div class="papers" id="papers"></div>

<footer id="footer"></footer>

</div>

Nadal R, Hawley JE, Yezefski TA, Psutka SP, Gore JL, Lin DW, Nelson PS, Cheng HH, Schweizer MT, Fong L, Lee JK, Yu EY, Corey E, Morrissey C, Grivas P, Montgomery RB, Wright JL, Haffner MC, Vakar-Lopez F, Mian OY, Lam HM, Hsieh AC, Ha G", "date": "2026-Sep-16", "source": "PubMed", "journal": "Nature", "if": 50.5, "score": 0.6361, "score_semantic": 0.6361, "score_lexical": 0.8087, "matched": ["cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.09.15.26363151", "title": "Cancer type-specific profiling of chromatin regulator mutations identifies recurrent and co-occurring gene sets associated with improved survival following immune checkpoint therapy", "abstract": "Mutations in chromatin regulator (CR) genes are frequent across human cancers and have been associated with increased tumor mutational burden (TMB) and improved response to immune checkpoint inhibitor (ICI) treatment. Here, using discovery and independent validation cohorts, we resolved these associations at the level of individual cancer types and investigated whether shared CR mutation patterns emerge across colorectal cancer, melanoma, renal cell carcinoma, head and neck squamous cell carcinoma, non-small cell lung cancer, bladder cancer, esophagogastric cancer, pancreatic adenocarcinoma, prostate cancer, and breast cancer. For each cancer type, we identified a distinct set of pro-survival CR genes, whose mutations were associated with improved survival following ICI treatment. We further identified a subset of recurrent CRs that were associated with improved ICI outcomes across many cancer types, although the magnitude of the association varied between cancers. Co-occurrence of mutations in two or more CRs was associated with further improvement in survival, while several individual CR genes showed particularly robust associations with favorable ICI outcomes. Across cancer types, CR-altered groups consistently displayed higher TMB than their corresponding CR-unaltered groups. Transcriptomics-based deconvolution further revealed cancer-type-specific differences in the tumor microenvironment associated with CR mutations. Together, these findings demonstrate both cancer-specific and recurrent patterns of CR mutations associated with improved outcomes following ICI treatment and further establish a relationship between CR alterations, increased TMB, and ICI response.", "authors": "Bukovec, D.; Gjorgjievska, M.; Kocevska, S.; Nikolova, M.; Mirkovikj, L.; Kungulovski, I.; Mitrev, Z.; Kungulovski, G.", "date": "2026-09-16", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.6136, "score_semantic": 0.6136, "score_lexical": 0.9669, "matched": ["cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.14.751472", "title": "Clustered structural variant hotspots enable oncogenic addiction and plasticity in osteosarcoma", "abstract": "The genomic landscape of osteosarcoma, the most common bone cancer worldwide, is among the most structurally complex of all human malignancies. The identification of recurrent and functionally consequential patterns has thus remained a challenge. Across 236 whole-genome sequencing osteosarcoma samples, we uncovered five genomic hotspots of clustered structural variation collectively altered in 58% of tumors. Four were associated with amplification of oncogenes ( MYC , CCND3 , CCNE1 , CDK4) , while the fifth mapped largely upstream of TP53 . Hotspot events showed coordinated patterns of co-occurrence and mutual exclusivity with each other and with tumor suppressor alterations, suggesting genomic context-specific selection. We found localized transcriptional dysregulation at hotspot event loci, and single cells harboring these events converged on a neural crest-like program, linking these structural alterations to a less differentiated cell state. These events were also detectable non-invasively through liquid biopsies and displayed ongoing structural evolution throughout disease progression, a finding with potential clinical utility. Our results provide novel insight into how complex rearrangements shape oncogenesis in osteosarcoma, with broader relevance to other cancers characterized by complex genomes.", "authors": "Raman, S.; Kaltenbacher, T.; Merrell, D.; Prasad, K.; Tannaka, Y.; Weiss, J.; Iannetta, E.; Butaney, B.; Jorswieck, E.; Salem, A.; Lazo De La Vega, L.; Ceca, E.; Wong, J. M. W.; Forrest, S. J.; Klega, K.; Tanhaemami, M.; Ricker, C. A.; Wang, J.; Diehl, D. M.; Johnson, J.; Cibulskis, C.; Schlueter-Kuck, K.; Alley, L. Q.; Collins, N. B.; Zhang, C.-Z.; Shulman, D. S.; Crompton, B. D.; Janeway, K. A.; Getz, G.; Gillani, R.", "date": "2026-09-18", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6109, "score_semantic": 0.6109, "score_lexical": 0.6708, "matched": ["tumor evolution", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.16.752131", "title": "Resource limitation rewires chromosome instability and ploidy evolution across in vitro and in vivo cancer models", "abstract": "Whole-genome doubling (WGD) and elevated ploidy are pervasive features of cancer that shape chromosomal instability (CIN), therapeutic response, and metastatic fitness. Yet ploidy is strikingly context dependent: many tumors remain near diploid in vivo despite the frequent emergence of highly polyploid states in vitro. Here, we estimate ploidy dependent chromosome missegregation tolerance using a mathematical model calibrated to growth and chromosome number data from matched near diploid and near tetraploid breast cancer cultures and xenografts. The model architecture reflects a tug of war between two opposing selective forces acting on ploidy--resource limitation that caps high ploidy by imposing energetic and biosynthetic costs, and CIN that can favor higher ploidy by buffering the fitness impact of chromosome gains and losses. The fitted model reproduced chromosome losses in 4N cultures and WGD followed by chromosome losses in 2N cultures. In vivo, the strongest determinants of ploidy shifted from stress associated death at low oxygen to baseline missegregation at higher oxygen. Joint calibration to both in vivo and in vitro contexts assigned tumors lower proliferation, an approximately tenfold higher stress-associated death scale, and an 11-16 fold larger maximal stress induced missegregation increment than cultures. Simulating populations across combinations of constant oxygen levels and missegregation settings showed that ploidy increased with oxygen under conditions supporting population growth. In both culture and tumors, mean ploidy above tetraploidy was associated with population decline. Together, the framework predicts when resource constraints favor chromosome loss and when missegregation tolerance permits high ploidy expansion, providing testable expectations for how CIN perturbations reshape ploidy evolution in different resource environments.", "authors": "Li, T.; Beck, R.; Tagal, V.; Yu, X.; Andor, N.", "date": "2026-09-18", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6065, "score_semantic": 0.6065, "score_lexical": 1.0, "matched": ["chromosomal instability", "CIN", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.09.10.26362759", "title": "Genomic alterations in histologically clear low grade dysplasia resection margins forecast advanced neoplasia in ulcerative colitis", "abstract": "BackgroundEndoscopic resection is used for the management of dysplasia in ulcerative colitis (UC), but a subset of patients develop subsequent advanced neoplasia (AN), i.e., high-grade dysplasia and/or colorectal cancer, despite apparently complete resection with histologically clear margins. Current risk stratification relies predominantly on histopathological and procedural features, which does not capture underlying genomic field cancerization of morphologically normal mucosa.  ObjectiveTo determine whether genomic alterations within histologically non-dysplastic resection margins are associated with subsequent neoplastic progression following endoscopic resection of UC-associated dysplasia.  DesignWe analysed a retrospective cohort of 51 UC patients, who underwent endoscopic resection of dysplastic lesions at a tertiary referral centre, with a median follow-up of 1947 days. 11 of these had local progression. We performed low-coverage whole genome sequencing (lcWGS) of 56 dysplastic lesions and 91 adjacent histologically non-dysplastic margins. Somatic copy number alteration (CNA) burden and phylogenetic analysis were correlated with progression to AN.  ResultsHistologically non-dysplastic margins from lesions that subsequently progressed to AN demonstrated significantly higher CNA burden compared with non-progressors. In multivariate analysis high margin CNA burden was independently associated with local progression, whereas histologically clear resection margins and en bloc excisions were not.  ConclusionHistological clearance does not necessarily indicate clearance of the cancerised field in UC-associated dysplasia. Genomic detection of field cancerisation within histologically non-dysplastic resection margins identifies patients at increased risk of subsequent neoplasia and provides a potential biomarker for biologically informed post-resection surveillance.  What is already known on this topicO_LIEndoscopic resection is increasingly used for colitis-associated dysplasia, but some patients subsequently develop advanced neoplasia despite histologically complete resections with clear margins. C_LIO_LICurrent risk stratification post-resection relies on histopathological and procedural features, which likely do not capture the cancerised field. C_LI  What this study addsO_LIHistomorphologically non-dysplastic margins can harbour genomic alterations that are shared with the dysplastic lesion, indicating a cancerised field. C_LIO_LIA high burden of copy number alterations in resection margins independently predicts subsequent progression to advanced neoplasia, beyond conventional measures of resection completeness. C_LI  How this study might affect research, practice or policyO_LIBeyond histopathology, genomic assessment of resection margins is low-cost, fast and reproducible and may enable biologically informed risk stratification following endoscopic resection of colitis-associated dysplasia. C_LI", "authors": "Fisher, J.; Bräutigam, K.; Grant, H. E.; Mossner, M.; Sakr, C.; Al Bakir, I.; Saunders, B.; Suzuki, N.; Wilson, A.; Baker, A.-M.; Hart, A.; Graham, T. A.", "date": "2026-09-16", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.5842, "score_semantic": 0.5842, "score_lexical": 0.5053, "matched": ["histopathology", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.15.751777", "title": "Melanoma evolution in the lymph node shapes systemic outcomes", "abstract": "Lymph node (LN) metastasis predicts poor patient outcomes, but the mechanistic drivers that shape metastatic fitness, immune evasion, and clinical impact remain elusive. While preclinical models indicate that active tumor adaptation is necessary for LN metastasis, observations of clonal heterogeneity in human tumors has supported a stochastic model of passive and continuous seeding. Reconciling LN metastasis as a passive or active process is essential to understanding if LN metastasis is simply a marker of disease progression or a clinically informative therapeutic target. Here, we report evidence that LNs are active niches that facilitate ongoing melanoma evolution to progressively subvert immune surveillance and enable progression. To construct a spatial trajectory of LN metastasis, we examined paired primary melanomas and metastatic sentinel LNs through integrated genomic, phenotypic, and immunologic analyses. In contrast to a model of continuous seeding, we observe that early dissemination from the primary tumor is followed by extensive intra-nodal diversification, indicating that metastatic outgrowth requires ongoing adaptation within the LN. As clones evolve in the LN, they re-differentiate towards a melanocytic state and reprogram the microenvironment for immune exclusion. In further evolved clones, loss of inflammatory interferon signaling and induction of p53 and mitochondrial stress are associated with decreased overall survival. Collectively, these results implicate the LN as a critical battleground for melanoma progression, where tumor evolution drives adaptation and immune escape to biologically link regional metastasis to patient survival.", "authors": "Ventre, K. S.; Muijlwijk, T.; Stagnitta, R.; Qiu, S.; Chen, Z.; Illa Bochaca, I.; Moshiri, A. S.; Davoli, T.; Osman, I.; Yanai, I.; Schober, M.; Lund, A. W.", "date": "2026-09-17", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5841, "score_semantic": 0.5841, "score_lexical": 1.0, "matched": ["tumor evolution", "clonal evolution"]}, {"id": "https://www.biorxiv.org/content/10.1101/2024.03.12.584638", "title": "CDK4 or CDK6 upregulation induces DNA replication stress and genomic instability to cause EGFR targeted therapy resistance in lung cancer", "abstract": "Epidermal growth factor receptor (EGFR) mutant lung adenocarcinomas (LUAD) harbor a complex landscape of genetic co-alterations and potential oncogenic interactions. Among them are recurrent amplifications of the cell cycle regulatory genes CDK4 and CDK6, which have been clinically implicated in resistance to EGFR tyrosine kinase inhibitors (TKIs). However, the mechanisms by which CDK4/6 upregulation promotes therapy resistance remain poorly defined. Here, we demonstrate that CDK4 or CDK6 overexpression limits EGFR inhibitor-induced proliferative arrest, promoting continued cell cycle progression. This is accompanied by elevated replication stress, increased TPX2 expression, DNA damage leading to ATM activation, and ultimately genomic instability. Integrative transcriptomic and copy number analyses of EGFR-mutant LUAD tumors from both patients and preclinical models revealed that CDK4 or CDK6 amplification is associated with the upregulation of genes linked to tumor progression, including AGR2, ASNS, and STEAP1. CDK4 amplification was also highly correlated with gene expression changes associated with epithelial-to-mesenchymal transition (EMT) in a single-cell RNA sequencing dataset from patient biopsies. In preclinical models, co-treatment with CDK4/6 and EGFR inhibitors restored proliferative arrest, induced tumor cell apoptosis, and reduced replication stress, DNA damage, and genomic instability. Our findings uncover a mechanistic basis for EGFR inhibitor resistance of CDK4 and CDK6 amplified EGFR-mutant LUAD. They also provide a rationale for the biomarker-driven clinical development of combination EGFR and CDK4/6-targeted therapies for the treatment of a subset of EGFR-mutant LUAD patients.", "authors": "Gini, B.; Gui, P.; Wu, W.; Kerr, D. L.; Tan, L.; Barbosa, D.; Olivas, V.; Allegakoen, P.; Gomez, C.; Halliday, P.; Elmes, S.; Steri, V.; Chakrabarti, T.; Bivona, T. G.; Blakely, C. M.", "date": "2026-09-17", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5782, "score_semantic": 0.5782, "score_lexical": 1.0, "matched": ["genomic instability", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.09.10.26362768", "title": "Effective tumor kinetics inferred from single routine H&E biopsies enable counterfactual virtual radiotherapy trials", "abstract": "Routine H&E-histopathology captures spatial snapshots of tumor ecosystems, yet computational pathology largely treats them as textures without explicit links to underlying kinetics. We show that patient-specific parameters of a mechanistic reaction-diffusion model can be inferred from a single biopsy. Cell-nucleus point patterns are fitted jointly to the analytical two-point correlation function and power spectral density, recovering patient-specific mechanistic proliferation and diffusion rates across eleven multicenter cohorts. Derived dispersion length and front velocity define mechanistic phenotypes stratifying progression-free and overall survival and adding information independent of routine covariates. We illustrate counterfactual radiotherapy simulations in glioblastoma and show that a virtual clinical trial deescalating histology-calibrated faster-growing tumors to hypofractionation while dose-intensifying slower-growing tumors adds 96.7 days of restricted mean progression-free in silico survival over standard of care (permutation p < 0.001 against random allocation to the same arms). This provides a low-barrier transition from routine histopathology to mechanistically interpretable model-based forward simulations.", "authors": "Schlicke, P.; Ercan, C.; Ranjbar, S.; Seldomridge, A. N.; Aggarwal, S.; Mehta, A.; Sainz, T. P.; Zahid, M. U.; Fang, P.; Hofmann, V. A.; Pasetto, S.; Cisneros Napravnik, T.; Puebla-Osorio, N.; Kuttler, C.; Klopp, A.; Colbert, L.; Holder, A. M.; Weiser, R.; Lin, S. H.; Torres-Cabala, C. A.; Vega, F.; Yuan, Y.; Enderling, H.", "date": "2026-09-16", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.5731, "score_semantic": 0.5731, "score_lexical": 1.0, "matched": ["histopathology"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.10.750571", "title": "An integrated genome-wide resource reveals distinct replication environments of DNA breakage in human cancer cell lines", "abstract": "Replication stress is a major source of genome instability in cancer, yet the genomic features that determine where DNA double-strand breaks (DSBs) arise remain incompletely defined. Here, we establish an integrated genome-wide resource of DSBs, DNA replication, replication timing, transcription, and R-loops in two widely used cancer cell lines, U2-OS and HeLa, under steady-state conditions and following prolonged low-dose DNA polymerase inhibition. We combine these datasets with systematic statistical testing and comparative analytical approaches to define the replication environments associated with genome fragility. Endogenous DSBs preferentially accumulated at origin-rich initiation zones, where R-loops were enriched, whereas prolonged DNA polymerase inhibition redirected DSB formation toward origin-poor, late-replicating regions. Among the replication features examined, replication initiation zones and late-replicating areas were most sensitive to prolonged replication stress. R-loops were specifically enriched at initiation zones but depleted from late-replicating regions and recurrent DNA break clusters (RDCs), demonstrating that their association with genome fragility is context dependent. Replication stress further induced RDCs within long, actively transcribed genes, while their locations only partially overlapped with common fragile sites. Functional analyses identified MUS81 as a major regulator of RDC formation. MUS81 loss increased RDCs, whereas restoration of its catalytic activity suppressed them, indicating that MUS81 resolves replication intermediates before they persist into late-replicating fragile regions. Together, this resource and analytical framework provide a systematic basis for dissecting how replication architecture, transcription, and DNA processing shape genome fragility in cancer cells.", "authors": "Wei, P.-C.; Ding, B.; Ing, A.; Wang, L.-C.; Corazzi, L.; Giaisi, M.; Marini, V.; Krejci, L.; Shatleh, D.; Aqeilan, R.", "date": "2026-09-15", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5699, "score_semantic": 0.5699, "score_lexical": 0.7786, "matched": ["genomic instability", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.12.751186", "title": "Spatially resolved multimodal hallmarks of response to neoadjuvant immunotherapies in the melanoma ecosystem in 2D and 3D", "abstract": "Neoadjuvant immunotherapy has transformed cancer treatment, yet the spatial molecular architecture governing response and resistance across distinct immune checkpoint blockade (ICB) regimens remains poorly defined. We assembled the largest neoadjuvant ICB (NICB) spatial multi-omics cohort to date, profiling over 112 million cells at single-cell resolution across three melanoma ICB regimens using MERFISH spatial transcriptomics, multiplexed immunofluorescence, and scRNA-sequencing. These analyses revealed the full multicellular spatial architecture of the NICB tumor microenvironment, including mature TLS with germinal centers, TCF7+ stem-like T cells, myeloid cells organized into spatially distinct cellular neighborhoods with unique intercellular signaling circuits, and CCL19/CCL21-expressing fibroblasts as a previously unrecognized stromal scaffold sustaining these immune hubs. We developed three purpose-built computational tools that together enabled comprehensive quantification of this microenvironment for the first time: SCIRA for whole-slide single-cell receptor-ligand quantification, GCSCAN for molecularly grounded TLS and germinal center structural delineation, and PathNet-TLS for automated TLS detection on H&E images. Applying these tools across the cohort, we defined the immune and stromal composition and cellular neighborhood organization distinguishing responders from non-responders. We also quantified cell-cell interactions and regimen-specific immune architectures, including a markedly stronger mature TLS/germinal center response with IPI-NIVO than NIVO-RELA. Importantly, GCSCAN-quantified TLS and germinal center density each stratified disease-free survival, with responders that lack germinal centers having an elevated risk of relapse. Open-top light-sheet imaging and CODA-based 3D reconstruction further uncovered interconnected germinal center-TLS tunnels invisible to standard 2D histopathology. These findings establish a discovery-to-tool paradigm linking single-cell tumor microenvironment interrogation to clinically deployable computational pathology for biomarker-driven NICB assessment across cancer types.", "authors": "Liu, Z.; Song, X.; Chen, W.-S.; Dhingra, S.; He, J.; He, L.; Chen, C.; Balasi, J. A.; Sayegh, Z.; Moran Segura, C. M.; Lopez-Blanco, N.; Alleyne, A.; Nguyen, J. V.; Johnson, J. O.; Marchion, D.; Yoder, S. J.; Messina, J. L.; Sondak, V. K.; Markowitz, J.; Reder, N. P.; Hwu, P.; Mule, J. J.; Chuang, J. H.; Chen, P.-L.", "date": "2026-09-18", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.569, "score_semantic": 0.569, "score_lexical": 0.5876, "matched": ["histopathology", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.09.750413", "title": "HrasG12V induces follicular thyroid cancer with attenuated MAPK activation and increased latency compared to KrasG12D", "abstract": "RAS mutations are found in nearly 50% of follicular thyroid cancers (FTCs), frequently accompanied by secondary mutations in the P13K/AKT pathway as tumors advance to more poorly differentiated states. To examine the role that oncogenic Hras plays in thyroid tumor initiation and progression, we developed murine models with thyroid-specific expression of HrasG12V combined with heterozygous or homozygous loss of Pten. Loss of Pten cooperated with HrasG12V in a dose-dependent manner to induce the development of follicular thyroid carcinoma and poorly-differentiated thyroid carcinoma. Histopathology of HrasG12V/PtenHom tumors closely resembled those from the established KrasG12D/PtenHom model, but tumor onset was significantly delayed in HrasG12V/PtenHom mice. At three weeks of age, downregulation of MAPK pathway inhibitors was observed in KrasG12D/PtenHom thyroids, accompanied by increased MAPK pathway activation compared to HrasG12V/PtenHom mice. Furthermore, amplification of oncogenic Ras was found in HrasG12V tumors and cell lines, while allelic balance was maintained in KrasG12D models. These studies demonstrate clear phenotypic differences between mutant Hras and Kras in the thyroid and suggest that delayed MAPK activation may mediate the increased tumor latency observed in the HrasG12V/PtenHom model.", "authors": "Bambach, N. E.; Labella, K.; Jolly, L. A.; Cruz, D. I.; Massol, N.; Di Cristofano, A.; Franco, A. T.", "date": "2026-09-15", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5278, "score_semantic": 0.5278, "score_lexical": 0.6966, "matched": ["histopathology", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.14.751470", "title": "MetScore and classical-basal subtype intersect to define chemotherapy response and tumor microenvironment architecture in pancreatic ductal adenocarcinoma", "abstract": "Background Transcriptomic heterogeneity in pancreatic ductal adenocarcinoma (PDAC) is conventionally modeled along a single classical-basal axis, but this framework incompletely explains clinical behavior. We hypothesized that MetScore, a single-sample measure of metastatic colonization potential, defines a complementary axis. Objective To determine how MetScore and classical-basal identity jointly shape PDAC biology and clinical outcomes. Design We integrated RNA sequencing, DNA sequencing, clinical, and digital pathology data from 512 tumor biopsies from 510 patients in the Pancreatic Cancer Action Network Know Your Tumor real-world cohort. We assessed associations with biopsy site, survival, chemotherapy response, and tumor microenvironment composition; validated metastatic discrimination in an independent cohort; and examined cancer cell-intrinsic drug sensitivity in vitro. Results MetScore distinguished metastatic from primary biopsies, a finding validated externally. High MetScore and basal identity were independently associated with inferior survival. High MetScore and classical identity were each associated with preferential response to 5-fluorouracil (5-FU)-based rather than gemcitabine-based therapy, with the strongest enrichment for 5-FU responses among classical/MetScore-high patients. In vitro drug-sensitivity experiments did not recapitulate the clinical treatment-response pattern, motivating investigation of cancer cell-extrinsic factors. Transcriptomic deconvolution and histopathologic machine learning-based cell annotation demonstrated that high-MetScore and basal states converged on macrophage/monocyte enrichment but diverged in their associations with cancer-associated fibroblasts. Conclusion Integrating MetScore with classical-basal identity establishes a two-axis framework that better explains metastatic behavior, prognosis, treatment response, and microenvironmental composition than the conventional one-axis model and provides a clinically testable strategy for transcriptome-guided patient stratification.", "authors": "Preston, R. E.; Huang, H.; Hall, M. A.; Grewal, U. S.; Abdilleh, K.; Doss, S.; Moffitt, R.; Alese, O. B.; Lesinski, G. B.; Handler, J. S.", "date": "2026-09-17", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5194, "score_semantic": 0.5194, "score_lexical": 0.9714, "matched": ["digital pathology", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.09.16.26363199", "title": "Intense TP53 pathway selection drives clonal evolution from bone marrow failure to leukemia in ERCC6L2 disease", "abstract": "ERCC6L2 disease (ED) is an inherited bone marrow failure (BMF) syndrome that progresses almost exclusively to erythroid, TP53-mutated myeloid malignancy, but the somatic evolution underlying the progression in patients is unknown. We characterized the genetic landscape of 29 ED patients with longitudinal sampling, integrating whole-genome and single-cell RNA sequencing, and compared the findings with Shwachman-Diamond syndrome (SDS), another TP53 mutation-prone disease, to define somatic evolution across disease stages. ED was defined by early, intense, and recurrent selection of TP53-mutant clones: TP53 mutations were more frequent, more often multiple, and showed steeper age-related expansion than in SDS; all TP53-negative ED patients were children. The burden of multiple TP53 mutations exceeded that of sporadic TP53-mutated myeloid neoplasia and was evident before malignancy. Missense mutations dominated the BMF phase, whereas non-missense mutations were seen in patients with malignancy, consistent with biallelic second hits, marking a stage-dependent shift in p53 inactivation. Beyond TP53, the landscape was strikingly restricted, with PPM1D as the only recurrent driver gene. Notably, despite the DNA-repair function of ERCC6L2, no ED-specific mutational signature emerged; but instead reflected age-associated processes. Malignant progression was accompanied by a complex karyotype, recurrent chromosome 5, 7, and 12p losses enriched in erythroid progenitors, and kataegis, consistent with branched, erythroid-predominant clonal evolution. Our findings establish ED as a paradigm of preleukemic dependency on p53-pathway attenuation. As progression is driven predominantly by p53 and captured longitudinally from the earliest clones, ED offers a model of how TP53-mutated leukemia arises and evolves, with relevance beyond a rare syndrome.", "authors": "Douglas, S. P. M.; Kaaja, I.; Ikonen, I. I.; Langohr, L.; Koski, J.; Hakkarainen, M.; Katainen, L.; Barbany, G.; Hellstrom-Lindberg, E.; Jahnukainen, K.; Kakko, S.; Siitonen, T.; Niinimaki, R.; Pitkanen, E.; Wartiovaara-Kautto, U.; Kilpivaara, O.", "date": "2026-09-17", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.5119, "score_semantic": 0.5119, "score_lexical": 1.0, "matched": ["clonal evolution"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.14.751487", "title": "Dynamics of circulating tumor cell subsets defined by PSMA and EpCAM predict survival in metastatic castration-resistant prostate cancer patients treated with 177Lu-PSMA-617", "abstract": "Background: 177Lu-PSMA-617 radioligand treatment represents a major advancement in the management of metastatic castration-resistant prostate cancer (mCRPC), but key questions remain about tumor-cell dynamics and evolution in patients who have received this drug. Here, we used a circulating tumor cell (CTC) capture assay to assess the prognostic capacity of CTC subset dynamics following 177Lu-PSMA-617 treatment in a cohort of mCRPC patients. Methods: Using an AI-empowered holographic imaging platform combined with in-flow protein marker analysis, we prospectively analyzed serial CTC samples from patients receiving 177Lu-PSMA-617 therapy at pre-treatment and on-treatment time points (n=39 of 100 enrolled patients). PSMA and EpCAM proteins in CTCs were determined by immunofluorescence staining. Proportions and absolute counts of CTC subsets delineated by PSMA and EpCAM proteins were assessed in PSA50 responders (n=19) and non-responders (n=20). Within-patient changes in CTC subsets were compared using Wilcoxon signed-rank tests with Benjamini-Hochberg correction. Associations of CTC subset abundance and dynamics with overall survival were assessed using Kaplan-Meier estimates with log-rank tests and univariable Cox proportional hazards models. Results: PSMA and EpCAM stratified CTCs into subsets, some of which were associated with survival outcomes following 177Lu-PSMA-617. We observed an increase in the proportion of PSMA-/EpCAM+ CTCs following 177Lu-PSMA-617, with a larger increase occurring in PSA50 responders (6.2% to 18.7%; p=0.041) than non-responders (7.9% to 15.4%; p=0.023). This corresponded to a decrease in the proportion of PSMA+/EpCAM- CTCs, whereas the proportion of PSMA+/EpCAM+ CTCs did not decline. On-treatment counts of >5 CTCs, relative to [&le;]5 CTCs, were associated with shorter overall survival in the PSMA+/EpCAM+ (HR 3.56, 95%CI 1.32-9.60, p=0.012) and PSMA+/EpCAM- (HR 7.50, 95%CI 0.96-52.99, p=0.054) subsets. Finally, on-treatment declines in PSMA+/EpCAM+ (HR 0.74, p=0.49) and PSMA+/EpCAM- (HR 0.61, p=0.215) CTC subsets were not significantly associated with overall survival relative to sustained high levels of these cells. Conclusions: In mCRPC patients receiving 177Lu-PSMA-617, dynamic changes in CTC subsets delineated by PSMA and EpCAM expression may have prognostic value, justifying additional evaluation.", "authors": "Lee, M. J.; Yu, L.; Zorko, N.; Dehm, S.; Hwang, J. H.; Drake, J. M.; Antonarakis, E. S.; Arafa, A. T.", "date": "2026-09-16", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5106, "score_semantic": 0.5106, "score_lexical": 0.5158, "matched": ["tumor evolution", "cancer"]}, {"id": "https://doi.org/10.1038/s41467-026-77225-5", "title": "CpG hypermethylation and WNT/AP-1 cooperativity define the epigenetic landscape and a clinical subgroup of high-risk pediatric adrenocortical carcinoma.", "abstract": "Pediatric adrenocortical tumors are rare, clinically heterogeneous neoplasms with unpredictable outcomes and limited treatment options. Through integrated multi-omic analysis of 214 pediatric adrenocortical tumors combining DNA methylation profiling, transcriptomics, chromatin accessibility, and spatial deconvolution, we identify four distinct risk groups. A high-risk subgroup is characterized by CpG island hypermethylation, chromosomal instability, and dismal survival. These tumors exhibit transcriptional co-activation of WNT signalling and activator protein-1 transcriptional programs and display balanced admixture of zona glomerulosa and zona fasciculata/reticularis-like cells. Spatial analysis reveals zona glomerulosa cells as WNT signaling hubs driving intercellular crosstalk. Mechanistically, the histone deacetylase inhibitor entinostat reverses promoter methylation, silences activator protein-1 activity, and induces apoptotic reprogramming in tumor models. These findings establish a molecular framework for risk stratification and identify actionable therapeutic vulnerabilities, providing an essential resource for studying this molecularly uncharted pediatric malignancy.", "authors": "Fincke VE, Loßner M, Kunstreich M, Reitsam NG, Sax I, Mucha M, Dorn F, Helmschrott LC, Hernandez Ramirez MD, Dintner S, Okonechnikov K, Sill M, Oehme I, Peterziel H, Blanco-Carmona E, Sipos E, Wudy S, Slavetinsky C, Fuchs J, Märkl B, Jüttner E, Vokuhl C, Frühwald MC, Redlich A, Pfister S, Schlesner M, Claus R, Kuhlen M, Johann PD", "date": "2026-Sep-14", "source": "PubMed", "journal": "Nature communications", "if": 14.7, "score": 0.5059, "score_semantic": 0.5059, "score_lexical": 1.0, "matched": ["chromosomal instability"]}, {"id": "https://doi.org/10.1016/j.immuni.2026.08.011", "title": "Cancers modulate processing and presentation of p53 neoantigens to evade T cell detection.", "abstract": "TP53 mutations occur early in malignant transformation as truncal events in tumor evolution and are therefore generally present in all descendant tumor cells, creating an immunological vulnerability. Here, we examined the immunogenicity and antigenicity of p53 neoantigens emerging from these truncal mutations. Comprehensive immunopeptidomics revealed that hotspot mutations in human tumors preferentially localize to p53 regions resistant to antigen processing, thereby avoiding display altogether. Moreover, for neoantigens presentable by HLA-A∗02:01 or HLA-B∗07:02 and structurally divergent from corresponding wild-type p53 peptide-HLA complexes, clinical tumors commonly lacked the relevant presenting HLA allele. Tumor cells further resisted T cell killing through increased activity of the aminopeptidase ERAP1, preventing display of high-affinity HLA-A∗02:01 complexes containing an immunogenic p53I195F-derived 11-mer, or by expressing low-affinity HLA-A∗02:01 complexes containing a p53R175H-derived 9-mer with poor antigenicity despite high-quality human TCRs. These findings define mechanisms by which tumors restrict targetable truncal neoantigen display and suggest immunopeptidome shift strategies to circumvent immune escape.", "authors": "Haratani K, Reinhold B, Duke-Cohan JS, Fahey CG, Tan K, Mallis RJ, Gusev A, Kehl KL, Luo J, Karmazyn A, Holliday EL, Masi DJ, Zienkiewicz KJ, Hennessey CJ, Blasco RB, Thai TC, Gibbons GM, Kivlehan S, Lizotte P, Paweletz CP, Aguirre AJ, Ligon KL, Chiarle R, Lang MJ, Barbie DA, Reinherz EL", "date": "2026-Sep-17", "source": "PubMed", "journal": "Immunity", "if": 25.5, "score": 0.5031, "score_semantic": 0.5031, "score_lexical": 0.6735, "matched": ["tumor evolution"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.17.752236", "title": "NEMP1 organizes the meiotic telomere LINC interface to control chromosome movement and telomere integrity", "abstract": "Nuclear Envelope Membrane Protein 1 (NEMP1) is highly expressed in oocytes and required for fertility, yet its meiotic function remains poorly understood. Here, we identify NEMP1 as a critical organizer of meiotic telomere-nuclear envelope coupling and chromosome dynamics. Loss of NEMP1 causes telomere aggregation, loss of shelterin protection, telomere shortening, persistent DNA damage, aberrant non-homologous end joining, and chromosome end-to-end fusion, ultimately leading to aneuploidy in mouse oocyte. NEMP1 is required during early fetal meiotic prophase I for telomere-nuclear envelope attachment, bouquet formation, homolog pairing, and synapsis. Live cell imaging revealed robust rapid prophase movements in wild-type meiocytes, which were nearly abolished by NEMP1 loss and restored by NEMP1-GFP re-expression. Mechanistically, NEMP1 associates with telomeric DNA and the SUN1-KASH5 LINC machinery, and SUN1-GFP restores chromosome movement in Nemp1-deficient meiocytes. Together, these findings establish NEMP1 as a nuclear-envelope organizer linking telomere protection, chromosome dynamics, and genome integrity during mammalian oogenesis.", "authors": "Zhang, H.; Zhang, L.; Pangas, S.; Jurisicova, A.; McNeill, H.", "date": "2026-09-18", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4943, "score_semantic": 0.4943, "score_lexical": 0.9898, "matched": ["aneuploidy"]}, {"id": "https://w 0.6808, "matched": ["histopathology", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.15.751867", "title": "Multilayer-assembled microfluidic chip with Tesla-valve channels: Combined biochemical gradient and mechanical stiffness interface for 3D SKOV3 cell culture", "abstract": "Biochemical gradients and mechanical microenvironments synergistically regulate tumor cell proliferation, migration, and phenotypic evolution, which are critical for recapitulating in vitro tumor physiological microenvironments. In this work, a multilayer-assembled microfluidic chip integrated with Tesla-valve flow channels was developed for 3D SKOV3 cell culture under combined biochemical gradients and mechanical stiffness interfaces. The reconfigurable multilayer PMMA structure enables flexible construction of diverse concentration gradient fields, while the embedded Tesla-valve geometry effectively stabilizes fluid flow, reduces flow velocity fluctuation, and generates smoother, more stable biochemical gradients compared with conventional curved channel designs. Multiphysics simulations were performed to systematically verify the flow field distribution and gradient formation performance of the optimized channel structure. Furthermore, by constructing heterogeneous hydrogel microenvironments consisting of rigid Pluronic F127 and soft dextran hydrogel inside microfluidic chambers, stable mechanical stiffness interfaces were successfully fabricated. Combined with TGF {beta}1 biochemical stimulation, the platform was applied to explore the durotactic migration and morphological changes of 3D-cultured SKOV3 cells at stiffness interfaces. Fluorescence staining results demonstrated that mechanical boundary conditions significantly affected cell migration behavior and cell aggregation phenotypes under consistent biochemical induction. With the advantages of low cost, simple assembly, good biocompatibility, and controllable dual physicochemical microenvironments, this multilayer microfluidic platform provides a reliable and efficient strategy for in vitro tumor microenvironment simulation and tumor cell mechanobiology research.", "authors": "Zhu, X.; Qian, W.; Cheng, H.", "date": "2026-09-17", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4769, "score_semantic": 0.4769, "score_lexical": 0.6068, "matched": ["tumor evolution"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.03.09.710440", "title": "Physicochemical balancing facilitates fast cyclic immunolabeling in centimeter-scale FFPE tissues", "abstract": "Archived formalin-fixed, paraffin-embedded (FFPE) tissues, including brain-bank specimens, are valuable resources for disease research, but rapid cyclic immunolabeling of intact specimens remains challenging. Here, we present FIDELITY, an epoxy-free workflow that balances optical transparency, immunostaining performance, and tissue integrity for multi-cycle protein profiling in centimeter-thick FFPE specimens. Neural network-guided optimization identified an SDS-glycine formulation that integrates delipidation and epitope retrieval while preserving tissue stiffness, replacing prolonged epoxy reinforcement and subsequent high-temperature antigen retrieval with a single aqueous pretreatment. Application to human Alzheimer's disease specimens enabled volumetric imaging and quantitative analysis while retaining compatibility with conventional histopathology. Its compatibility with active electrophoretic staining further supported rapid labeling and five rounds of immunolabeling in a whole FFPE mouse brain. Two-round labeling of a human glioma specimen further demonstrated the applicability of the cyclic workflow to human pathological tissue. Together, FIDELITY provides a practical platform for large-volume, multiplexed protein profiling of intact FFPE specimens.", "authors": "Lin, Y.-H.; Huang, C.-Y.; Chen, Y.-H.; Chen, Y.-H.; Ko, P.-L.; Hsu, H.-H.; Tung, Y.-C.; Chen, Y.-F.; Chen, H.-C.; Chiang, A.-S.; Ho, C.-M.; Yao, D.-J.; Fiock, K. L.; Wang, K.-C.; Lin, C.-H.; Hu, S.-H.; Chen, B.-C.; Chu, L.-A.", "date": "2026-09-17", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4363, "score_semantic": 0.4363, "score_lexical": 0.7409, "matched": ["histopathology"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.05.13.724813", "title": "Genome-wide mapping of Cas9-induced sister chromatid exchange across single and over 200 genomic targets", "abstract": "CRISPR/Cas9-induced DNA double-strand breaks (DSBs) are widely used for genome engineering, yet their capacity to provoke sister chromatid exchange (SCE) and associated genome instability remains incompletely understood, in part because exchanges between identical sister chromatids leave no sequence change and are invisible to conventional whole-genome sequencing. Using sci-L3-Strand-seq, a scalable single-cell template-strand sequencing platform for genome-wide SCE mapping, we quantified strand-switch events following targeted Cas9 cleavage. Cas9 targeting of a unique genomic locus led to strong local enrichment of SCE at the break site, reaching up to 41% in the same cell cycle and 17% in the subsequent division, indicating that DSB repair frequently engages non-local inter-sister repair. Extending the assay to 237 repetitive Alu targets using one Alu-specific sgRNA revealed mild and marginally statistically significant enrichment of on-target SCE across wild-type Cas9 and nickase variants (D10A and H840A). However, restricting analysis to a subset of cells with elevated SCE burden (>8 SCEs per cell) uncovered significant enrichment at programmed cut sites, suggesting that recombination at repetitive loci is conditionally engaged in highly recombinogenic cells. Reciprocal daughter-cell pair analysis further revealed large-scale structural alterations on chromosomes with induced SCEs and at SCE junctions, indicating that Cas9-induced SCEs do not universally reflect error-free homologous recombination. Disruption of DNA repair genes at the cut site, including LIG3, LIG4, XRCC1, and XRCC4, did not measurably alter SCE frequency per cell, consistent with delayed functional loss following editing and, in the case of essential genes such as LIG3, selection against disruptive alleles. Together, these findings demonstrate that Cas9-induced DSBs are potent local triggers of SCE at unique loci, while at repetitive regions SCE is more context-dependent and can be associated with structural alterations, highlighting the influence of lesion type and genomic context on recombination outcomes during genome editing.", "authors": "Chovanec, P.; He, S.; Yin, Y.", "date": "2026-09-17", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4259, "score_semantic": 0.4259, "score_lexical": 0.5324, "matched": ["genomic instability"]}], "reports": [{"date": "2026-10-05", "label": "Oct 05, 2026", "n": 32}, {"date": "2026-09-28", "label": "Sep 28, 2026", "n": 32}, {"date": "2026-09-21", "label": "Sep 21, 2026", "n": 24}, {"date": "2026-09-14", "label": "Sep 14, 2026", "n": 26}, {"date": "2026-09-07", "label": "Sep 07, 2026", "n": 34}, {"date": "2026-08-31", "label": "Aug 31, 2026", "n": 19}, {"date": "2026-08-24", "label": "Aug 24, 2026", "n": 24}, {"date": "2026-08-17", "label": "Aug 17, 2026", "n": 18}, {"date": "2026-08-10", "label": "Aug 10, 2026", "n": 34}, {"date": "2026-08-03", "label": "Aug 03, 2026", "n": 17}, {"date": "2026-07-27", "label": "Jul 27, 2026", "n": 24}, {"date": "2026-07-20", "label": "Jul 20, 2026", "n": 26}, {"date": "2026-06-26", "label": "Jun 26, 2026", "n": 14}, {"date": "2026-06-19", "label": "Jun 19, 2026", "n": 38}], "prefix": "", "home": "../papers.html"}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const papers = DATA.papers;
  const SHORT = 280;
  // Slider floor: the pipeline threshold, or lower if older data scored below it
  const FLOOR = Math.floor(Math.min(DATA.threshold, ...papers.map(p => p.score)) * 100) / 100;

  // ── Persistent per-browser state (stars / read), keyed by paper URL ──
  const store = {
    get(k, fallback) {
      try { const v = localStorage.getItem('papertrail:' + k); return v ? JSON.parse(v) : fallback; }
      catch { return fallback; }
    },
    set(k, v) {
      try { localStorage.setItem('papertrail:' + k, JSON.stringify(v)); } catch {}
    },
  };
  const starred = new Map(Object.entries(store.get('starred', {})));  // id -> paper snapshot
  const read    = new Set(store.get('read', []));
  const saveStars = () => store.set('starred', Object.fromEntries(starred));
  const saveRead  = () => store.set('read', [...read]);

  const prefs = store.get('prefs', {});
  const state = {
    q: '',
    view: 'all',
    sort: prefs.sort || 'score',
    min: FLOOR,
    sources: new Set(),
    keyword: null,
    expanded: new Set(),
    scope: 'week',        // 'week' = this report, 'all' = every archived week
    limit: 100,           // cards rendered before "Show more"
  };
  const PAGE = 100;

  // ── All-weeks index: loaded on demand from reports/search-index.js ──
  let ALL = null, loadingAll = false;
  function loadAll() {
    if (ALL || loadingAll) return;
    loadingAll = true;
    const s = document.createElement('script');
    s.src = (DATA.prefix || '') + 'search-index.js';
    s.onload = () => { ALL = window.PAPERTRAIL_INDEX || []; loadingAll = false; render(); };
    s.onerror = () => {
      loadingAll = false; state.scope = 'week'; render();
      $('count').textContent = 'Could not load the all-weeks index (reports/search-index.js).';
    };
    document.head.appendChild(s);
  }
  const pool = () => state.scope === 'all' && ALL ? ALL : papers;

  // ── Helpers ──
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const scoreVar = s => s >= 0.5 ? 'var(--high)' : s >= 0.35 ? 'var(--mid)' : 'var(--low)';
  const isPreprint = p => !p.journal || p.journal === 'preprint';
  const url = p => (p.id && !p.id.startsWith('http')) ? 'https://doi.org/' + p.id : p.id;
  // Dates come as "2026-09-02", "2026-Sep-02" (PubMed) or just "2026-Sep"
  const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const dateKey = d => {
    const m = /^(\d{4})(?:-(\w+))?(?:-(\d+))?/.exec(d || '');
    if (!m) return 0;
    const mon = m[2] ? (/^\d+$/.test(m[2]) ? +m[2] - 1 : MONTHS.indexOf(m[2].slice(0, 3).toLowerCase())) : 0;
    return Date.UTC(+m[1], Math.max(mon, 0), m[3] ? +m[3] : 1);
  };

  // Keyword highlighting: whole-token matches, longest first
  const kwRe = DATA.keywords.length
    ? new RegExp('\\b(' + [...DATA.keywords].sort((a, b) => b.length - a.length).map(reEsc).join('|') + ')\\b', 'gi')
    : null;
  function highlight(text) {
    const parts = [];
    const res = [kwRe];
    const q = state.q.trim();
    if (q.length >= 2) res.push(new RegExp('(' + q.split(/\s+/).map(reEsc).join('|') + ')', 'gi'));
    // Collect ranges from all regexes on raw text, then merge and escape
    const ranges = [];
    for (const re of res) {
      if (!re) continue;
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(text))) { if (!m[0]) { re.lastIndex++; continue; } ranges.push([m.index, m.index + m[0].length]); }
    }
    if (!ranges.length) return esc(text);
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [ranges[0].slice()];
    for (const r of ranges.slice(1)) {
      const last = merged[merged.length - 1];
      if (r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push(r.slice());
    }
    let i = 0;
    for (const [a, b] of merged) { parts.push(esc(text.slice(i, a)), '<mark>', esc(text.slice(a, b)), '</mark>'); i = b; }
    parts.push(esc(text.slice(i)));
    return parts.join('');
  }

  const hayCache = new WeakMap();
  const hay = p => {
    let h = hayCache.get(p);
    if (h === undefined) {
      h = [p.title, p.abstract, p.authors, p.journal, p.source].join(' ').toLowerCase();
      hayCache.set(p, h);
    }
    return h;
  };

  // ── Filtering ──
  function filtered() {
    const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    let list = state.view === 'starred'
      ? [...starred.values()]
      : pool();
    list = list.filter(p => {
      if (state.view !== 'starred' && p.score < state.min) return false;
      if (state.view === 'unread' && read.has(p.id)) return false;
      if (state.sources.size && !state.sources.has(p.source)) return false;
      if (state.keyword && !(p.matched || []).includes(state.keyword)) return false;
      if (terms.length) {
        const h = hay(p);
        if (!terms.every(t => h.includes(t))) return false;
      }
      return true;
    });
    const by = {
      score: (a, b) => b.score - a.score,
      date:  (a, b) => dateKey(b.date) - dateKey(a.date) || b.score - a.score,
      if:    (a, b) => (b.if ?? -1) - (a.if ?? -1) || b.score - a.score,
    }[state.sort];
    return [...list].sort(by);
  }

  // ── Rendering ──
  const ICON_STAR = '<svg viewBox="0 0 24 24" fill="FILL" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  // Link to the report(s) a paper appeared in, when not the one being viewed
  const LABELS = Object.fromEntries((DATA.reports || []).map(r => [r.date, r.label]));
  function weekTag(p) {
    const weeks = (p.weeks || []).filter(w => w !== DATA.date || state.scope === 'all');
    if (!weeks.length || (state.scope !== 'all' && state.view !== 'starred')) return '';
    const [w, ...rest] = weeks;
    const label = w === DATA.date ? 'This week' : 'Week of ' + (LABELS[w] || w);
    return `<a class="week-tag" href="${esc((DATA.prefix || '') + w + '.html')}" title="${esc(weeks.map(x => LABELS[x] || x).join(', '))}">${esc(label)}${rest.length ? ` +${rest.length}` : ''}</a>`;
  }

  function card(p) {
    const s = p.score ?? 0;
    const abs = p.abstract || '';
    const long = abs.length > SHORT;
    const open = state.expanded.has(p.id);
    const shown = long && !open ? abs.slice(0, SHORT) + '…' : abs;
    const ifStr = p.if != null ? ` · IF ${Number(p.if).toFixed(1)}` : '';
    const authors = p.authors || '';
    const isStar = starred.has(p.id), isRead = read.has(p.id);
    const u = url(p);
    return `
      <article class="card${isRead ? ' is-read' : ''}" style="--score-color:${scoreVar(s)}" data-id="${esc(p.id)}">
        <div class="card-top">
          <a class="title" href="${esc(u)}" target="_blank" rel="noopener">${highlight(p.title || '')}</a>
          <div class="score-block" title="semantic ${p.score_semantic ?? '–'} · lexical ${p.score_lexical ?? '–'}">
            <div class="score-pill">${s.toFixed(2)}</div>
            <div class="score-bar-track"><div class="score-bar-fill" style="width:${Math.min(s * 100, 100)}%"></div></div>
          </div>
        </div>
        <div class="card-meta">
          <span class="badge${isPreprint(p) ? ' preprint' : ''}">${esc(p.source)}</span>
          ${!isPreprint(p) ? `<span>${esc(p.journal)}${ifStr}</span>` : ''}
          <span>${esc(p.date)}</span>
          <span title="${esc(authors)}">${esc(authors.length > 60 ? authors.slice(0, 60) + '…' : authors)}</span>
          ${weekTag(p)}
        </div>
        <div class="abstract">${highlight(shown)}${long ? `<button class="toggle-btn" data-act="toggle">${open ? 'Show less' : 'Show more'}</button>` : ''}</div>
        <div class="card-foot">
          <div class="matched">${(p.matched || []).map(k => `<button class="kw" data-kw="${esc(k)}" title="Filter by this keyword">${esc(k)}</button>`).join('')}</div>
          <button class="act${isStar ? ' on' : ''}" data-act="star" aria-pressed="${isStar}">${ICON_STAR.replace('FILL', isStar ? 'currentColor' : 'none')}${isStar ? 'Starred' : 'Star'}</button>
          <button class="act${isRead ? ' read-on' : ''}" data-act="read" aria-pressed="${isRead}">${ICON_CHECK}${isRead ? 'Read' : 'Mark read'}</button>
          <a class="doi-link" href="${esc(u)}" target="_blank" rel="noopener">Open ↗</a>
        </div>
      </article>`;
  }

  const $ = id => document.getElementById(id);

  function renderChips() {
    const counts = {};
    const src = state.view === 'starred' ? [...starred.values()] : pool();
    src.forEach(p => { counts[p.source] = (counts[p.source] || 0) + 1; });
    $('sources').innerHTML = Object.keys(counts).sort().map(src =>
      `<button class="chip" data-src="${esc(src)}" aria-pressed="${state.sources.has(src)}">${esc(src)}<span class="n">${counts[src]}</span></button>`
    ).join('');
    const kwCounts = {};
    src.forEach(p => (p.matched || []).forEach(k => { kwCounts[k] = (kwCounts[k] || 0) + 1; }));
    $('keywords').innerHTML = DATA.keywords.map(k =>
      `<button class="chip" data-kw="${esc(k)}" aria-pressed="${state.keyword === k}">${esc(k)}<span class="n">${kwCounts[k] || 0}</span></button>`
    ).join('');
  }

  // Filter changes start from the first page again
  const update = () => { state.limit = PAGE; render(); };

  function render() {
    const list = filtered();
    const papersEl = $('papers');
    if (state.scope === 'all' && !ALL) {
      papersEl.innerHTML = '<div class="empty">Loading all weeks…</div>';
    } else if (list.length) {
      const rest = list.length - state.limit;
      papersEl.innerHTML = list.slice(0, state.limit).map(card).join('') +
        (rest > 0 ? `<button class="more-btn" data-act="more">Show ${Math.min(rest, PAGE)} more (${rest} left)</button>` : '');
    } else {
      papersEl.innerHTML = `<div class="empty">${state.view === 'starred' && !starred.size
        ? 'No starred papers yet — star papers to build a reading list. It is saved in this browser.'
        : 'No papers match these filters.'}</div>`;
    }
    const base = state.view === 'starred' ? starred.size : pool().length;
    const what = state.view === 'starred' ? 'starred papers'
      : state.scope === 'all' ? `papers across ${(DATA.reports || []).length} weeks` : 'papers';
    $('count').textContent = `Showing ${list.length} of ${base} ${what}`;
    $('star-n').textContent = starred.size ? `(${starred.size})` : '';
    $('export').hidden = state.view !== 'starred' || !starred.size;
    const dirty = state.q || state.sources.size || state.keyword || state.min !== FLOOR;
    $('reset').hidden = !dirty;
    document.querySelectorAll('#view button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === state.view));
    document.querySelectorAll('#scope button').forEach(b => b.setAttribute('aria-pressed', b.dataset.scope === state.scope));
    $('scope').hidden = (DATA.reports || []).length < 2;
    renderChips();
  }

  // ── Header / footer ──
  $('meta').textContent =
    `${papers.length} of ${DATA.total} relevant papers · Past ${DATA.days} days · Generated ${DATA.generated}`;
  $('footer').textContent = `Generated by PaperTrail · Sources: ${DATA.sources.join(', ')}`;
  if (DATA.imported) {
    $('meta').insertAdjacentHTML('afterend',
      '<div class="imported-note">Recovered from an older report: author lists are shortened.</div>');
  }

  // ── Week navigation (reports are listed newest first) ──
  const REPORTS = DATA.reports || [];
  const here = REPORTS.findIndex(r => r.date === DATA.date);
  const href = r => (DATA.prefix || '') + r.date + '.html';
  if (REPORTS.length > 1 && here !== -1) {
    $('weeks').hidden = false;
    $('week').innerHTML = REPORTS.map((r, i) =>
      `<option value="${i}"${i === here ? ' selected' : ''}>${esc(r.label)} · ${r.n} papers${i === 0 ? ' · latest' : ''}</option>`
    ).join('');
    $('week').addEventListener('change', e => { location.href = href(REPORTS[+e.target.value]); });
    const link = (el, r) => r ? (el.href = href(r)) : el.setAttribute('aria-disabled', 'true');
    link($('prev'), REPORTS[here + 1]);
    link($('next'), REPORTS[here - 1]);
    if (here === 0) $('latest').hidden = true; else $('latest').href = DATA.home;
  }

  // ── Controls ──
  const min = $('min');
  min.min = FLOOR;
  min.value = state.min;
  $('min-val').textContent = state.min.toFixed(2);
  $('sort').value = state.sort;

  let t;
  $('q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; update(); }, 120); });
  min.addEventListener('input', e => { state.min = +e.target.value; $('min-val').textContent = state.min.toFixed(2); update(); });
  $('sort').addEventListener('change', e => { state.sort = e.target.value; store.set('prefs', { ...prefs, sort: state.sort }); update(); });
  $('view').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.view = b.dataset.view; update();
  });
  $('scope').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.scope = b.dataset.scope;
    if (state.scope === 'all') loadAll();
    update();
  });
  $('sources').addEventListener('click', e => {
    const b = e.target.closest('[data-src]'); if (!b) return;
    const s = b.dataset.src;
    state.sources.has(s) ? state.sources.delete(s) : state.sources.add(s);
    update();
  });
  const toggleKw = k => { state.keyword = state.keyword === k ? null : k; update(); };
  $('keywords').addEventListener('click', e => { const b = e.target.closest('[data-kw]'); if (b) toggleKw(b.dataset.kw); });
  $('reset').addEventListener('click', () => {
    state.q = ''; $('q').value = '';
    state.sources.clear(); state.keyword = null;
    state.min = FLOOR; min.value = state.min; $('min-val').textContent = state.min.toFixed(2);
    update();
  });
  $('export').addEventListener('click', () => {
    const lines = [...starred.values()].sort((a, b) => b.score - a.score).map(p =>
      `- [${p.title}](${url(p)})  \n  ${p.authors ? p.authors.split(/[,;]/)[0].trim() + ' et al. · ' : ''}${isPreprint(p) ? p.source : p.journal} · ${p.date}`);
    const blob = new Blob([`# PaperTrail — starred papers\n\n${lines.join('\n')}\n`], { type: 'text/markdown' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'papertrail-starred.md' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $('papers').addEventListener('click', e => {
    const kw = e.target.closest('.matched [data-kw]');
    if (kw) { toggleKw(kw.dataset.kw); return; }
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    if (btn.dataset.act === 'more') { state.limit += PAGE; render(); return; }
    const id = btn.closest('.card').dataset.id;
    const p = pool().find(x => x.id === id) || papers.find(x => x.id === id) || starred.get(id);
    const act = btn.dataset.act;
    if (act === 'toggle') { state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); }
    if (act === 'star')   { starred.has(id) ? starred.delete(id) : starred.set(id, { ...p, weeks: p.weeks || [DATA.date] }); saveStars(); }
    if (act === 'read')   { read.has(id) ? read.delete(id) : read.add(id); saveRead(); }
    render();
  });

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
    if (e.key === 'Escape' && document.activeElement === $('q')) { $('q').blur(); }
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (!typing && e.key === '[' && $('prev').href) location.href = $('prev').href;
    if (!typing && e.key === ']' && $('next').href) location.href = $('next').href;
  });

  render();
})();
</script>
</body>
</html>
