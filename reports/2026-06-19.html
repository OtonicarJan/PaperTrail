<title>PaperTrail — June 19, 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #F7F7F5;
    --surface:   #FFFFFF;
    --text:      #1A1A2E;
    --body:      #374151;
    --muted:     #6B7280;
    --accent:    #2D6A4F;
    --accent-bg: #E3F0E9;
    --border:    #E5E7EB;
    --high:      #2D6A4F;
    --mid:       #D97706;
    --low:       #DC2626;
    --badge-bg:  #EEF2FF;
    --badge-fg:  #4338CA;
    --pre-bg:    #FEF3C7;
    --pre-fg:    #92400E;
    --mark:      #FDE68A;
    --star:      #D97706;
    --shadow:    rgba(0,0,0,0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #14161B;
      --surface:   #1C1F26;
      --text:      #ECEDEF;
      --body:      #C9CCD3;
      --muted:     #9097A3;
      --accent:    #6FC69A;
      --accent-bg: #1F3A2D;
      --border:    #2D313A;
      --high:      #6FC69A;
      --mid:       #F0A93B;
      --low:       #F07171;
      --badge-bg:  #262B45;
      --badge-fg:  #A5B4FC;
      --pre-bg:    #3A2F14;
      --pre-fg:    #F5C969;
      --mark:      #5C4A12;
      --star:      #F0A93B;
      --shadow:    rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg:        #14161B;
    --surface:   #1C1F26;
    --text:      #ECEDEF;
    --body:      #C9CCD3;
    --muted:     #9097A3;
    --accent:    #6FC69A;
    --accent-bg: #1F3A2D;
    --border:    #2D313A;
    --high:      #6FC69A;
    --mid:       #F0A93B;
    --low:       #F07171;
    --badge-bg:  #262B45;
    --badge-fg:  #A5B4FC;
    --pre-bg:    #3A2F14;
    --pre-fg:    #F5C969;
    --mark:      #5C4A12;
    --star:      #F0A93B;
    --shadow:    rgba(0,0,0,0.35);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 2rem 1rem 4rem;
  }

  .page { max-width: 780px; margin: 0 auto; }
  button, input, select { font: inherit; color: inherit; }

  /* ── Header ── */
  header { margin-bottom: 1.25rem; }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .logo span { color: var(--text); }
  .head-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.6rem 1rem; }
  .weeks { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; }
  .weeks select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.3rem 0.5rem; font-size: 0.82rem; max-width: 62vw;
  }
  .wk-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); text-decoration: none; font-size: 1.1rem; line-height: 1;
  }
  .wk-btn:hover { border-color: var(--accent); color: var(--accent); }
  .wk-btn[aria-disabled="true"] { opacity: 0.35; pointer-events: none; }
  .weeks .linkish { text-decoration: none; white-space: nowrap; }
  .imported-note { color: var(--muted); font-size: 0.78rem; margin-top: 0.25rem; }
  .meta { margin-top: 0.4rem; color: var(--muted); font-size: 0.85rem; }

  /* ── Controls ── */
  .controls {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 0.75rem 0 0.9rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 0.6rem;
  }
  .search {
    width: 100%;
    padding: 0.55rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    font-size: 0.9rem;
  }
  .search-row { display: flex; gap: 0.5rem; align-items: stretch; }
  .search-row .search { flex: 1; min-width: 0; }
  .search-row .seg button { padding: 0 0.75rem; white-space: nowrap; }
  .week-tag {
    font-size: 0.72rem; font-weight: 500; color: var(--accent);
    text-decoration: none; border-bottom: 1px dotted currentColor;
  }
  .week-tag:hover { border-bottom-style: solid; }
  .more-btn {
    align-self: center; margin-top: 0.25rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.45rem 1.1rem; font-size: 0.85rem; cursor: pointer; color: var(--accent);
  }
  .more-btn:hover { border-color: var(--accent); }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; font-size: 0.82rem; color: var(--muted); }
  .row label { display: inline-flex; align-items: center; gap: 0.4rem; }
  .row select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.2rem 0.4rem; font-size: 0.82rem;
  }
  .row input[type=range] { accent-color: var(--accent); width: 110px; }
  .row input[type=checkbox] { accent-color: var(--accent); }
  .min-val { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 500; min-width: 2.2em; }

  .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .chip {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 0.74rem; font-weight: 500;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .chip .n { opacity: 0.7; margin-left: 0.25rem; font-variant-numeric: tabular-nums; }

  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: var(--surface); border: none; padding: 0.2rem 0.65rem;
    font-size: 0.8rem; cursor: pointer; color: var(--muted);
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }

  .status { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--muted); }
  .linkish { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.8rem; font-weight: 500; }
  .linkish:hover { text-decoration: underline; }

  /* ── Cards ── */
  .papers { display: flex; flex-direction: column; gap: 1rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--score-color, var(--border));
    border-radius: 0 8px 8px 0;
    padding: 1.25rem 1.5rem 1rem;
    transition: box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .card:hover { box-shadow: 0 4px 16px var(--shadow); }
  .card.is-read { opacity: 0.55; }
  .card.is-read:hover { opacity: 1; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 0.5rem;
  }

  .title {
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .title:hover { color: var(--accent); }

  /* Score pill + bar */
  .score-block { flex-shrink: 0; text-align: right; min-width: 48px; }
  .score-pill {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--score-color);
    font-variant-numeric: tabular-nums;
  }
  .score-bar-track {
    width: 48px; height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 4px;
  }
  .score-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--score-color);
  }

  .card-meta {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.6rem;
    display: flex; flex-wrap: wrap; gap: 0.3rem 0.75rem;
    align-items: center;
  }
  .badge {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.1rem 0.45rem;
    border-radius: 4px;
    background: var(--badge-bg);
    color: var(--badge-fg);
  }
  .badge.preprint { background: var(--pre-bg); color: var(--pre-fg); }

  .abstract {
    font-size: 0.875rem;
    color: var(--body);
    line-height: 1.65;
    overflow-wrap: anywhere;
  }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .toggle-btn {
    background: none; border: none; cursor: pointer;
    color: var(--accent); font-size: 0.8rem; font-weight: 500;
    padding: 0; margin-top: 0.3rem; display: block;
  }
  .toggle-btn:hover { text-decoration: underline; }

  .card-foot {
    margin-top: 0.7rem;
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.9rem;
    font-size: 0.78rem;
  }
  .matched { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-right: auto; }
  .matched .kw {
    background: var(--accent-bg); color: var(--accent);
    font-size: 0.7rem; font-weight: 500;
    padding: 0.05rem 0.5rem; border-radius: 999px;
    border: none; cursor: pointer;
  }
  .act {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 0.78rem; padding: 0.1rem 0;
    display: inline-flex; align-items: center; gap: 0.25rem;
  }
  .act:hover { color: var(--accent); }
  .act.on { color: var(--star); }
  .act.read-on { color: var(--accent); }
  .act svg { width: 14px; height: 14px; }
  .doi-link { color: var(--muted); text-decoration: none; }
  .doi-link:hover { color: var(--accent); }

  .empty {
    text-align: center; color: var(--muted); font-size: 0.9rem;
    padding: 3rem 1rem; border: 1px dashed var(--border); border-radius: 8px;
  }

  /* ── Footer ── */
  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
  }

  @media (max-width: 560px) {
    .search-row { flex-direction: column; }
    .search-row .seg button { flex: 1; padding: 0.3rem 0.5rem; }
    body { padding: 1.25rem 1rem 3rem; }
    .card { padding: 1rem 1rem 0.85rem; }
    .controls { position: static; }
  }
</style>
</head>
<body>
<div class="page">

<header>
  <div class="head-row">
    <div class="logo">Paper<span>Trail</span></div>
    <nav class="weeks" id="weeks" aria-label="Weekly reports" hidden>
      <a class="wk-btn" id="prev" title="Previous week  ( [ )" aria-label="Previous week">‹</a>
      <select id="week" aria-label="Choose week"></select>
      <a class="wk-btn" id="next" title="Next week  ( ] )" aria-label="Next week">›</a>
      <a class="linkish" id="latest">Latest →</a>
    </nav>
  </div>
  <div class="meta" id="meta"></div>
</header>

<div class="controls">
  <div class="search-row">
    <input class="search" id="q" type="search" placeholder="Search papers, authors, journals…" autocomplete="off">
    <div class="seg" id="scope" role="group" aria-label="Search scope">
      <button data-scope="week" aria-pressed="true">This week</button>
      <button data-scope="all">All weeks</button>
    </div>
  </div>
  <div class="row">
    <div class="seg" id="view" role="group" aria-label="View">
      <button data-view="all" aria-pressed="true">All</button>
      <button data-view="unread">Unread</button>
      <button data-view="starred">Starred <span id="star-n"></span></button>
    </div>
    <label>Sort
      <select id="sort">
        <option value="score">Relevance</option>
        <option value="date">Newest</option>
        <option value="if">Impact factor</option>
      </select>
    </label>
    <label>Min score
      <input id="min" type="range" min="0" max="1" step="0.01">
      <span class="min-val" id="min-val"></span>
    </label>
  </div>
  <div class="chips" id="sources" aria-label="Sources"></div>
  <div class="chips" id="keywords" aria-label="Keywords"></div>
  <div class="status">
    <span id="count" aria-live="polite"></span>
    <span>
      <button class="linkish" id="export" hidden>Export starred</button>
      <button class="linkish" id="reset" hidden>Clear filters</button>
    </span>
  </div>
</div>

<div class="papers" id="papers"></div>

<footer id="footer"></footer>

</div>

analytical tasks, performance deteriorated in low-purity, highly subclonal and structurally complex tumours, while spatial sampling bias and hypermutation generated spurious evolutionary signals that confounded tumour interpretation across multiple inference layers. Evolutionary simulations further distinguished lineage-restricted genetic bottlenecks from multi-lineage resistance dynamics associated with tumour plasticity. Tumour purity consistently exerted a stronger effect on inference accuracy than sequencing depth. Together, our results establish evolutionary ground truth as a prerequisite for reproducible benchmarking and biologically interpretable analysis of cancer whole-genome sequencing data.", "authors": "Valeriani, L.; Gandolfi, G.; Buscaroli, E.; Davydzenka, K.; …", "date": "2026-06-11", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6664, "score_semantic": 0.6664, "score_lexical": 1.0, "matched": ["clonal evolution", "chromosomal instability", "genomic instability", "cancer"]}, {"id": "https://doi.org/10.64898/2026.06.02.729734", "title": "Multivariate integration of histological images and gene expression data: a comparative review", "abstract": "Integrating histological images with gene expression data offers a promising approach for linking tissue morphologies to molecular signatures and improving disease subtyping. However, such integration remains challenging due to the high dimensionality of these datasets, cross-modal heterogeneity, and limited interpretability. Multivariate methods such as Sparse Canonical Correlation Analysis (Sparse CCA), Joint Nonnegative Matrix Factorisation (Joint NMF), and Angle-based Joint and Individual Variation Explained (AJIVE), have been used to address these challenges by reducing dimensionality while identifying features associated with latent factors, thereby enhancing biological interpretability. Despite increasing application in imaging-omics research, systematic comparisons of their methodological properties remain limited. Consequently, users often lack guidance on how to appropriately select these methods in practice, and these approaches are frequently treated as interchangeable despite differing modelling assumptions. Here, we use paired H&E images and gene expression data from breast cancer as a representative case study to examine the methodological characteristics, interpretability, and complementary properties of these integration approaches. Our results show that each method captures distinct yet complementary aspects of the underlying information. Although the biological findings are derived from the TCGA-BRCA datasets, the methodological insights identified here extend more broadly to imaging-omics integration studies. Overall, this comparative review highlights the strengths and limitations of each approach and outlines considerations for future methodological development.", "authors": "Ma, C.; Mao, J.; Le Cao, K.-A.", "date": "2026-06-06", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6548, "score_semantic": 0.6548, "score_lexical": 0.448, "matched": ["cancer"]}, {"id": "https://doi.org/10.64898/2026.01.15.699695", "title": "Reconstructing clone-resolved transcriptional programs from bulk tumor sequencing", "abstract": "Tumor clones acquire distinct transcriptional programs as they evolve, but bulk RNA-seq averages over clonal mixtures and obscures the lineage-specific biology that DNA-sequencing reveals. We present PICTographPlus, the first method to infer clone-resolved transcriptional programs by integrating bulk DNA-derived clonal phylogenies and proportions with bulk RNA-seq alone, without single-cell data. Benchmarked against experimentally measured ground truth, scDNA/scRNA co-profiled cells from a wellDR-seq cancer dataset, across 320 pseudo-bulk replicates spanning four tumor purities and four sample counts and evaluated under seven regularization models, PICTographPlus recovers clone-level expression at mean Pearson r [&ge;] 0.92 and localizes pathway gains and losses to correct evolutionary branches (median F1 0.31-0.40, well above a no-deconvolution baseline). Applied to multi-region NSCLC, pancreatic precursor lesions, and rapid-autopsy PDAC, it localizes metabolic reprogramming, precursor-to-invasive transitions, and organ-adapted metastatic states to specific clonal branches. PICTographPlus turns standard bulk assays into clone-resolved transcriptional maps, enabling retrospective analyses where single-cell profiling is impractical.", "authors": "Lai, J.; Yang, Y.; Noller, K.; Liu, Y.; Balan, A.; Nagendra,…", "date": "2026-06-05", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6447, "score_semantic": 0.6447, "score_lexical": 0.493, "matched": ["cancer"]}, {"id": "https://doi.org/10.1158/2159-8290.CD-25-0964", "title": "A pan-cancer single-cell analysis of intratumoral copy number diversity and evolution.", "abstract": "Aneuploidy is a hallmark of human tumors. While patient-level copy number alteration (CNA) differences have been investigated extensively in large cohorts, their intratumoral heterogeneity remains understudied. Here, we conducted a pan-cancer analysis of 94 human tumors at single cell resolution, representing seven cancer types: bladder, breast, colon, glioblastoma, kidney, lung, and ovarian. Single-cell copy number profiling was used to analyze 62,646 aneuploid cells, in addition to bulk exome sequencing of most patients and single-nucleus RNA-seq of 6 samples. In many cancer types, increased subclonal diversity was associated with higher CNA burden, whole genome doubling, TP53 mutations, and increased geographic diversity. Cancer cells from each patient shared a set of truncal CNAs, suggesting evolution from a single ancestral cell. Many tumors accumulated CNAs in bursts of evolution, suggesting that punctuated evolution is common in diverse cancer types. This study greatly improves our knowledge of intratumoral chromosome diversity across human cancers.", "authors": "Ye H, McDonald TO, Elghaish R, Sei E, Conterno Minussi D, Hu…", "date": "2026-Jun-08", "source": "PubMed", "journal": "Cancer discovery", "if": 29.7, "score": 0.6426, "score_semantic": 0.6426, "score_lexical": 0.9423, "matched": ["aneuploidy", "cancer"]}, {"id": "https://doi.org/10.1038/s41467-026-73546-7", "title": "MYOD1 mutation drives cancer stem cell pathways and therapy-resistance in spindle cell/sclerosing rhabdomyosarcoma.", "abstract": "Tumor growth and relapse are often driven by cancer stem cells, but self-renewal mechanisms and genetic mutations that elevate their number are not fully understood. Here, we show that recurrent L122R mutation (Leucine to Argine change at amino acid 122) in the DNA-binding site of the Myogenic Differentiation 1 (MYOD1) transcription factor increases cancer stem cell frequency in aggressive Spindle cell/sclerosing rhabdomyosarcoma. MYOD1L122R also makes tumors resistant to chemotherapy and radiation. Epigenetic analysis reveals that MYOD1L122R binds MYC-like DNA recognition motifs to activate stem cell programs, while retaining some wild-type function to regulate muscle pathways that drive transformation. Mechanistically, MYOD1L122R transcriptionally activates Receptor tyrosine kinase-like Orphan Receptor 2 (ROR2) to turn on the non-canonical Wingless/Integrated (WNT) planar cell polarity pathway to increase both cancer stemness and therapy resistance. Targeting ROR2 with antibody-drug conjugates kills MYOD1L122R-mutated tumor cells, offering therapeutic opportunities. These findings provide insights into how MYOD1L122R rewires rhabdomyosarcoma to a stem-like state and defines a unique class of oncogenic transcription factors found in aggressive cancers.", "authors": "Wei Y, Corchete Sánchez LA, Mathavarajah S, Antelo D, Wang S…", "date": "2026-Jun-03", "source": "PubMed", "journal": "Nature communications", "if": 14.7, "score": 0.6319, "score_semantic": 0.6319, "score_lexical": 0.8493, "matched": ["cancer"]}, {"id": "https://doi.org/10.64898/2026.06.05.729844", "title": "Aberrant DNA methylation is co-regulated across the genome in leukemia and other types of cancer", "abstract": "Epigenetic dysregulation is a defining feature of cancer, but it remains poorly understood how this is coordinated across the genome. In this study we focusd on DNA methylation (DNAm) in acute myeloid leukemia (AML). Despite highly heterogeneous and largely patient-specific patterns, we identified co-regulated clusters of CpGs that could be assembled into reproducible epigenetic networks. Multilinear regression models accurately predicted the patient-specific DNAm deviations, even for CpGs located on different chromosomes. The alterations were mirrored on homologous chromosomes and there was no clear association with epigenetic driver mutations. Furthermore, we found very similar co-regulation patterns in acute lymphoblastic leukemia (ALL); with AML-derived models successfully predicting the ALL-associated DNAm changes. Notably, the top 1000 AML-associated CpGs showed also pronounced aberrations in DNAm levels across 46 other cancer types, whereas this was hardly observed across multiple non-malignant cell types. Co-regulation analysis realed very similar patterns in non-malignant blood and pan-cancer analysis, albeit the DNAm levels remained overall consistent in the controls. Collectively, our findings demonstrate that the complex, patient-specific DNAm landscapes observed in leukemia are not random. Instead, they are orchestrated within expanded epigenetic networks, which also exist in non-maligant cells, highlighting a higher-order regulatory layer in cancer epigenomics.", "authors": "Varona Baranda, M.; Liesenfelder, S.; Kraft, F.; Kuo, C.-C.;…", "date": "2026-06-09", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6305, "score_semantic": 0.6305, "score_lexical": 0.87, "matched": ["cancer"]}, {"id": "https://doi.org/10.1186/s12943-026-02707-5", "title": "Histone modifications across cancers: mechanisms, therapy and clinical translation.", "abstract": "Cancer continues to be a major cause of death across the globe, and epigenetic dysregulation, including histone modifications, has been recognized as a major hallmark of cancer development, heterogeneity, and drug resistance. This review seeks to offer an overview of histone modifications in cancer, including the more studied histone modifications such as acetylation and methylation, as well as the less explored histone modifications such as phosphorylation, ubiquitination, and glycosylation. It also examines the role of histone modifications in the dysregulation of the three categories of enzymes: the writers, the erasers, and the readers, in the development of cancer, including solid tumors and hematological malignancies. This review also further explores the complex crosstalk between histone modifications, DNA methylation, non-coding RNA, and metabolic reprogramming, focusing on the complex epigenetic networks that maintain oncogenic states and confer plasticity to cancer. In terms of the development of new therapeutic agents, recent advances in epigenetic drugs such as HDAC inhibitors, EZH2 inhibitors, and BET inhibitors are also reviewed, as are new therapeutic avenues such as PROTACs, dual inhibitors, and natural epigenetic modulators. It also emphasizes the fact that the expression of histone modifying enzymes is a key change underlying oncogenic transcriptional states in all cancers. Some of the new aspects of epigenetics revealed in the review include the context-dependent role of H3K27me3 and H2BK120ub modifications, the therapeutic potential of epigenetic targets such as EZH2 and BRD4, and the therapeutic potential of combining epigenetic therapy with chemotherapy and immunotherapy.", "authors": "Lu P, Chan YT, Kwok CF, Li Q, Jiang Z, Xu L, Feng Z, Yuan H,…", "date": "2026-Jun-04", "source": "PubMed", "journal": "Molecular cancer", "if": 27.7, "score": 0.6244, "score_semantic": 0.6244, "score_lexical": 0.8523, "matched": ["cancer"]}, {"id": "https://doi.org/10.64898/2026.05.28.728215", "title": "Label-free 3D virtual histology of human formalin-fixed paraffin-embedded (FFPE) prostate needle biopsies with propagation-based phase-contrast micro-CT (PBCT)", "abstract": "For over a century, the goal of estimating clinical outcome from tumor biopsies has been based on histomorphology of 2D tissue slices that represent a small fraction of collected samples. Its power derives from histologys 1) unbiased representation of cell types, 2) subcellular resolution that allows the characterization of health and disease states across cell types, and 3) multi-millimeter fields of view that allow assessment of tumor heterogeneity. Histologys dependence upon physical slices, however, limits assessment of 3-dimensional cellular volumes and tissue architecture. Here, we used propagation-based phase-contrast micro-CT (PBCT) to create 3D histological images of residual formalin-fixed, paraffin-embedded (FFPE) prostate needle biopsies. The resulting isotropic, grey-scale, 0.5 micron voxel matrices were used to explore the potential of for the 3D virtual histology to distinguish diagnostic categories including benign prostatic tissue and prostatic adenocarcinoma of Gleason patterns 3, 4, and 5. Maximum intensity projections of stacks of digital slices totaling 5 microns \"slices\" allowed the study of virtual sections corresponding to actual serial H&E-stained sections of tissue cut after micro-CT imaging. Like histology, our PBCT reconstructions allowed us to distinguish between non-infiltrative and undulating glands of benign prostatic tissue, infiltrative round glands of Gleason pattern 3, cribriform structures of Gleason pattern 4, and comedonecrosis of Gleason pattern 5. Unlike histology, micro-CT allowed us to further probe 3D tissue architecture in volumetric context. User-friendly exploration of sample volumes was achieved using a customized Neuroglancer multiplanar and 3D rendering interface. Sparsely trained cycleGAN produced plausible virtual H&E staining from the unstained micro-CT reconstructions. Unlike tissue-section based histology, micro-CT-based virtual histology yields nondestructive 3D characterization of cancer cell and tissue architecture, including glandular spaces, without the undersampling or cutting artifacts of histology. These findings demonstrate the feasibility of PBCT-based 3D virtual histology of prostate cancer and suggest the exploration of derived quantitative analyses of tumor properties for potential contributions to patient care.", "authors": "Sugarman, A. L.; Vanselow, D. J.; Chen, G.; Clark, E.; Parki…", "date": "2026-06-07", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6176, "score_semantic": 0.6176, "score_lexical": 0.5465, "matched": ["cancer"]}, {"id": "http://arxiv.org/abs/2606.12346v1", "title": "Atlas H&E-TME: Scalable AI-Based Tissue Profiling at Expert Pathologist-Level Accuracy", "abstract": "Hematoxylin and eosin (H&E) staining is the cornerstone of histopathology, yet scalable, quantitative analysis of H&E whole-slide images (WSIs) remains a central challenge in computational pathology. We present Atlas H&E-TME, an AI-based system built on the Atlas family of pathology foundation models that predicts tissue quality, tissue region, and cell type labels across multiple cancer types, yielding over 4,500 quantitative readouts per slide at cell-level resolution. A key challenge to validating such systems is overcoming morphological ambiguity inherent to H&E-only ground truth and the limited scalability of more informed references drawing on modalities such as immunohistochemistry (IHC). We address this with a dual validation framework combining biologically grounded depth with technical and morphological breadth. For depth, we propose an IHC-informed multi-pathologist consensus protocol that substantially improves inter-rater agreement over conventional H&E-only annotation. This yields a molecularly grounded reference against which we compare Atlas H&E-TME and pathologists working from H&E alone. For breadth, we benchmark Atlas H&E-TME on over 200,000 high-confidence H&E-only pathologist annotations across 1,500+ cases spanning eight cancer types and their most common metastatic sites, with subtypes covering >90% of clinical cases per cancer type, drawn from 25+ sources and 8+ scanner models. Benchmarked against the IHC-informed consensus, Atlas H&E-TME matches or exceeds pathologist H&E-only performance and generalizes consistently and robustly across this broad morphological and technical scope. In doing so, Atlas H&E-TME turns the H&E slide -- the most ubiquitous data in pathology -- into a scalable, quantitative window into the tumor and its microenvironment, laying a foundation for the next generation of tissue-based biomarkers in translational and clinical research.", "authors": "Kai Standvoss, Miriam Hägele, Rosemarie Krupar, Julika Ribba…", "date": "2026-06-10", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.6164, "score_semantic": 0.6164, "score_lexical": 0.6909, "matched": ["histopathology", "cancer"]}, {"id": "https://doi.org/10.64898/2026.06.04.730217", "title": "Fluctuating DNA methylation sites encode colorectal tumour growth history", "abstract": "Determining the nature of human tumour growth is challenging given the impracticality of obtaining detailed data across time. A promising solution is to examine DNA regions whose methylation states fluctuate on clinically relevant timescales, permitting their use as high-resolution lineage tracers. However, existing methods developed for analysing the fluctuating methylation loci of normal tissue and lymphoid cancers are inapplicable to large solid tumours. Here we introduce a mechanistic computational model that tracks the evolution of heritable methylation marks as a tumour grows from a single gland to a mass of many cubic centimetres, and a coupled ABC-SMC inference workflow to estimate tumour growth parameters from multi-region bulk methylation arrays. We applied this framework to data from multiple regions of 10 resected colorectal tumours, including 3 adenomas and 7 carcinomas of diverse sizes and clinical stages. By exploring alternative models, we show that intratumour diversity, in terms of methylation errors, stems more from tumour growth via gland fission than from cell turnover within glands. Moreover, the extent of intratumour diversity varies widely between patients, mainly because of eight-fold variation in gland fission rates but also due to differences in methylation and demethylation rates. Intergland divergence patterns are consistent with neutral evolution of colorectal tumours and a cancer stem cell fraction of approximately 1%. As well as helping to resolve the nature of colorectal cancer growth and evolution, our results provide proof of principle for a method that may be adapted to other types of solid tumour.", "authors": "Manojlovic, V.; Gabbutt, C.; Shibata, D.; Noble, R. J.", "date": "2026-06-09", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6156, "score_semantic": 0.6156, "score_lexical": 0.6176, "matched": ["cancer"]}, {"id": "https://doi.org/10.1016/j.immuni.2026.05.009", "title": "Fibroblasts hold the key to TLS formation.", "abstract": "The presence of tertiary lymphoid structures (TLSs) associates with improved anti-tumor immunity, and as such, understanding why some tumors develop TLSs is of prime interest. In the current issue of Cancer Cell, Kirschstein et al. demonstrate that TGFβ-driven programming of myofibroblastic cancer-associated fibroblasts blocks reticular fibroblast differentiation and TLS formation in pancreatic cancer, a barrier reversible by TGFβR1 inhibition.", "authors": "Bouloudani T, Sautès-Fridman C", "date": "2026-Jun-09", "source": "PubMed", "journal": "Immunity", "if": 25.5, "score": 0.6152, "score_semantic": 0.6152, "score_lexical": 0.9127, "matched": ["cancer"]}, {"id": "http://arxiv.org/abs/2606.20174v1", "title": "Computational Methods and Challenges in Cell-Free DNA Analysis for Multi-Cancer Early Detection", "abstract": "Cell-free DNA (cfDNA) is a promising avenue for non-invasive multicancer early detection (MCED), in that, it can enable multiple cancer detection simultaneously from a single blood draw, with particular sensitivity to cancers that currently lack established screening programs. Here we review the computational methods developed between 2022 and 2025 for cfDNA-based MCED. We focus on how fragmentomics and epigenetic features are extracted and analyzed to detect cancer at early stages. We first briefly outline the biological basis of cfDNA signals, then review classical statistical and machine learning approaches alongside deep learning frameworks including autoencoder-based models. For each method we discuss biological interpretability, validation strategy, and readiness for clinical integration. Furthermore, we categorize the current challenges into technical, computational, and methodological while outlining open problems in the field. This review shows that multimodal ensemble approaches have the strongest promise for clinical integration and the highest readiness. However, for better assessment of future work and side-by-side comparison, standardization of evaluation protocols and reporting results will be crucial.", "authors": "Nicko Starkey, Marcin W. Wojewodzic, Krzysztof Rzecki", "date": "2026-06-18", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.614, "score_semantic": 0.614, "score_lexical": 0.7902, "matched": ["cancer"]}, {"id": "https://doi.org/10.64898/2026.06.04.730067", "title": "TGF-β1-induced differentiation enhances chemotherapy response in metastatic colorectal cancer organoids", "abstract": "BackgroundIn metastatic colorectal cancer, systemic therapies frequently fail, partly due to underlying phenotypic plasticity rooted in pre-existing multi-type cell populations. Intratumoral lineage hierarchies within colorectal tumors require renovated efforts to decode growth principles, design rational therapeutic approaches, and accurately interpret drug response. Understanding the cell-state dynamics of untreated tumors and the degree of cell responsiveness to exogenous stimuli is therefore crucial to improving currently underwhelming therapeutic outcomes.  MethodsHere, we leveraged patient-derived organoids established from hepatic metastases of colorectal cancer patients to deconstruct population hierarchies by combining single-cell transcriptomics with single-molecule RNA fluorescent in situ hybridization. Computational frameworks were used to identify independent gene modules. We then employed flow cytometry analysis to track cytokine-induced population shifts using a cell surface marker, validating our findings through bulk RNA analysis, functional assays, and viability assays in response to oxaliplatin.  ResultsOur data substantiate the existence of a dual population configuration within untreated metastatic colorectal cancer organoids with diverse genetic backgrounds. Gene modules detected via single-cell transcriptomics delineate a stem-like (LGR5+) and a differentiated-like (KRT20+) population that fluctuate dynamically over time. Spatially and temporally resolved, single-cell level analysis through single molecule FISH captures the inherent stochasticity in cell fate decisions revealing surprising phenotypic variability even across different organoids derived from the same patient. By using GABRA2 as a surface marker we track the emergence of differentiated cells over the course of time and investigate the respective roles of TGF-{beta}1 and IL-6 in the differentiation of organoids. Our findings indicate that IL-6 exerts no major effect within our cell autonomous setting. In stark contrast, TGF-{beta}1 triggered cell cycle arrest and differentiation, while simultaneously reducing clonogenic capacity and significantly amplifying the cytotoxic potency of oxaliplatin.  ConclusionsOur findings provide evidence of the dual Stem and Differentiated population hierarchy in metastatic colorectal cancer organoids, and demonstrate how this axis can be effectively hijacked by TGF-{beta}1 to suppress tumor growth. Our results suggest that further mechanistic exploitation of this cell-autonomous, tumor-suppressive arm of TGF-{beta}1 signalling could open unappreciated therapeutic windows in advanced colorectal cancer.", "authors": "Fletcher, S. J.; Pizzini, L.; Catalano, I.; Palmiero, M.; Ga…", "date": "2026-06-08", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6054, "score_semantic": 0.6054, "score_lexical": 0.8266, "matched": ["cancer"]}, {"id": "http://arxiv.org/abs/2606.08538v1", "title": "Routine laboratory trajectories encode the onset of organ-level complications in cancer", "abstract": "Routine laboratory panels drawn during cancer treatment constitute longitudinal physiological recordings of organ function, yet their temporal structure is discarded by single-timepoint prognostic tools. A transformer trained on 2,777,595 laboratory measurements from 3,905 patients with multiple myeloma or ovarian cancer predicted the two-year onset of 162 treatment-associated complications, including therapy-related myelodysplastic syndromes, spanning eight clinical categories, achieving 1.5- to 6.1-fold enrichment above prevalence at the group level. It matched or outperformed non-sequential baselines across grouped endpoints (AUROC gains up to +0.11), demonstrating that longitudinal laboratory trajectories capture evolving complication-specific physiology inaccessible from isolated measurements. Predictions generalised across both cancers, divergence concentrating in disease-specific complications, and biomarker masking recovered signatures consistent with established pathophysiology. External validation on MIMIC-IV and MMRF CoMMpass confirmed transferability across independent healthcare systems (AUROC up to 0.85). Routine oncological laboratory data encode organ deterioration weeks to months before clinical onset, enabling complication-specific surveillance without additional testing infrastructure.", "authors": "Jannik Lübberstedt, Krischan Braitsch, Jacqueline Lammert, C…", "date": "2026-06-07", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.6044, "score_semantic": 0.6044, "score_lexical": 0.7957, "matched": ["cancer"]}, {"id": "https://doi.org/10.1038/s41467-026-73930-3", "title": "The cumulative impact of passenger mutations on cancer development.", "abstract": "The traditional binary classification of somatic mutations in cancer as either drivers or passengers overlooks the potential cumulative impact of smaller-effect mutations. Here, we analyze more than 11,000 whole-genome-sequenced primary tumors across 3 cancer cohorts to assess the functional contribution of passenger mutations in cancer development. We find that in the absence of canonical driver mutations, passenger mutations in cancer genes are significantly enriched, exhibit higher predicted pathogenicity, and are associated with aberrant expression, splicing disruption, altered transcription factor binding, and clinical outcomes that resemble those in the presence of driver mutations. The accumulation of passenger mutations in tumor suppressor genes correlates with significantly reduced expression and poorer prognosis, suggesting that progressive mutational burden may contribute to gradual impairment of tumor suppressor function, mirroring the functional outcomes of driver mutations. Together, these results support a continuum model of mutational impact, where the collective influence of passenger mutations contributes to oncogenesis and clinical outcomes. This work advocates for integrative cancer models that incorporate all somatic mutations to more accurately reflect the complexity of tumor evolution.", "authors": "Nayak A, Chan CSY, Mouratidis I, Georgakopoulos-Soares I", "date": "2026-Jun-04", "source": "PubMed", "journal": "Nature communications", "if": 14.7, "score": 0.6042, "score_semantic": 0.6042, "score_lexical": 0.93, "matched": ["tumor evolution", "cancer"]}, {"id": "https://doi.org/10.1126/scitranslmed.aed2424", "title": "Immune microenvironment and noncoding RNA shape early colorectal carcinogenesis in patients with premalignant lesions.", "abstract": "Early cancer detection and prophylactic intervention remain the primary strategies for reducing colorectal carcinoma incidence and mortality. Although the immune microenvironment and tumor-associated antigens have been shown to play a pivotal role in carcinogenesis, the factors shaping immune dynamics during the premalignant phase remain poorly understood. In this study, we performed a comprehensive multimodal characterization of the immune microenvironment in 258 longitudinal premalignant colorectal lesions. Using a discovery cohort of 135 lesions from 26 patients stratified by low versus high polyp development rate, we identified distinct immune states associated with polyp burden. These findings were validated in an independent cohort of 123 lesions from 43 patients. Lesions from patients with low polyp development rates exhibited signatures of robust immune surveillance characterized by enhanced adaptive immune infiltration, including defined T cell subsets, and a higher prevalence of mature tertiary lymphoid structures compared with lesions from patients with high polyp frequency. These immune features were accompanied by increased expression of noncoding RNAs. These transcripts were predicted to encode noncanonical antigens with high MHC-I (major histocompatibility complex class I) binding affinity, potentially increasing lesion immunogenicity. We propose that early carcinogenesis is shaped by the immune microenvironment in association with noncoding RNAs, revealing potential early biomarkers in individuals at high risk of developing colorectal cancer.", "authors": "Morgand E, Van den Eynde M, Nguyen H, Batto AF, Mlecnik B, B…", "date": "2026-Jun-10", "source": "PubMed", "journal": "Science translational medicine", "if": 15.8, "score": 0.6025, "score_semantic": 0.6025, "score_lexical": 0.645, "matched": ["cancer"]}, {"id": "https://doi.org/10.1038/s41467-026-74384-3", "title": "Clonal evolution and mutational trajectories of metastatic colorectal cancer shaped by anticancer therapies.", "abstract": "The evolutionary dynamics of cancer genomes at single-cell resolution under therapeutic pressure remain elusive. Hence, we perform whole-genome sequencing of 58 single-cell-derived tumoroids and 18 matched bulk tumors from six patients with metastatic colorectal cancer. High-resolution phylogenies reveal the clonal evolution of cancer with quantitative and qualitative profiling of therapy-associated mutations at the single-cell level. We uncover pronounced inter- and intra-patient heterogeneity in burden and spectrum of chemotherapy-induced mutations, with preferential enrichment in more proliferative lineages, highlighting differential mutagenic effects across co-existing cancer cell populations. Late-stage mutational trajectories uncover strikingly dynamic genomic alterations, including complex structural variants, extrachromosomal DNA amplifications, and LINE-1 retrotranspositions, often involving alterations in cancer driver genes. Together, we show the clonal architecture and mutational landscapes of advanced cancers under therapeutic pressure, providing an important foundation for future studies of late-stage cancer evolution under therapies.", "authors": "Lee WH, Kim B, Nam CH, Yeo HY, Lee DW, Park SC, Oh JH, Han S…", "date": "2026-Jun-13", "source": "PubMed", "journal": "Nature communications", "if": 14.7, "score": 0.6017, "score_semantic": 0.6017, "score_lexical": 1.0, "matched": ["clonal evolution", "cancer"]}, {"id": "https://doi.org/10.1158/0008-5472.CAN-25-5645", "title": "Counterfactual Diffusion Models Provide Interpretable Explanations of Artificial Intelligence Models in Pathology.", "abstract": "Deep learning can extract predictive and prognostic biomarkers from histopathology whole-slide images. However, explainable artificial intelligence approaches widely used in digital pathology, such as attention heatmaps and class activation mapping, provide limited insight into the image features associated with classifier outputs. Here, we developed MoPaDi (Morphing histoPathology Diffusion), a framework for generating counterfactual explanations for histopathology images that help identify morphological or stain-related features linked to model predictions. MoPaDi combined diffusion autoencoders with task-specific multiple instance learning classifiers to manipulate images and induce prediction shifts by modifying classifier-associated features. The framework was evaluated on multiple datasets spanning colorectal, breast, liver, and lung cancers, including tasks for tissue type, cancer subtype, and biomarker (microsatellite instability) classification. MoPaDi generated perceptually realistic counterfactual histopathology images, enabling pathologists to identify morphological features associated with changes in model predictions, complementing conventional inspection of highly attended regions in digital pathology. In the microsatellite instability status prediction task, MoPaDi highlighted morphological features linked to classifier predictions, including mucinous differentiation, altered glandular architecture, and lymphocytic infiltration, consistent with prior literature. Analyses separating stain-related from morphology-related components suggested that, in this setting, prediction changes were predominantly associated with morphology-related rather than stain-related alterations. Overall, MoPaDi is a practical framework for counterfactual explanations in computational pathology that supports the evaluation of model-specific decision cues and hypothesis generation.", "authors": "Žigutytė L, Lenz T, Han T, Reitsam NG, Foersch S, Hewitt KJ,…", "date": "2026-Jun-17", "source": "PubMed", "journal": "Cancer research", "if": 11.2, "score": 0.5756, "score_semantic": 0.5756, "score_lexical": 1.0, "matched": ["digital pathology", "histopathology", "cancer"]}, {"id": "https://doi.org/10.64898/2026.06.07.730664", "title": "Extracellular Matrix Mechanobiology in Pancreatic Ductal Adenocarcinoma: Correlating In Vivo Patient Magnetic Resonance Elastography with Ex Vivo Tissue Mechanics and Histopathology", "abstract": "Pancreatic ductal adenocarcinoma (PDAC) is characterized by a dense desmoplastic extracellular matrix (ECM) that contributes to tumor progression, therapeutic resistance, and poor patient survival. However, the relationship between in vivo imaging-derived mechanical properties, ex vivo tissue biomechanics, ECM architecture, and cellularity remains incompletely understood. Here, we combined pre-operative in vivo clinical magnetic resonance elastography (MRE) with ex vivo biomechanical testing of fresh human PDAC tissue and histopathological analyses. Nine patients undergoing pancreatic resection were prospectively enrolled. Quantitative MRE was performed pre-operatively to assess tissue stiffness through shear wave speed (c) and relative viscosity or fluidity through the loss angle ({varphi}). Fresh tumor and adjacent non-malignant tissue biopsies were subsequently analyzed ex vivo by unconfined uniaxial compression testing to determine elastic moduli and stress relaxation halftime. Histological analyses quantified collagen-rich fibrous tissue area, cell nuclei density, and nuclear morphology. Tumor tissue exhibited significantly increased stiffness and collagen fraction compared with adjacent non-malignant tissue, together with reduced cellularity, smaller nuclear area and more elongated nuclei. Ex vivo stiffness positively correlated with collagen content and negatively correlated with patient survival. Reduced stress relaxation halftime, indicative of increased tissue viscosity, was associated with lower cellularity and elongated nuclei. Importantly, pre-operative MRE parameters of the intact surrounding environment correlated significantly with ex vivo tumor mechanics, cellular organization, and survival. Specifically, a softer and less viscous surrounding environment was associated with stiffer and more viscous tumors, with lower cellularity and elongated nuclei, and poorer prognosis. These findings demonstrate that MRE-derived mechanical biomarkers reflect underlying ECM remodeling and tumor mechanobiology in PDAC. Integrating in vivo imaging with ex vivo tissue mechanics and histopathology may improve non-invasive disease characterization and support biomechanically-informed therapeutic strategies.", "authors": "Mitxelena-Iribarren, O.; Garske, D. S.; Wulsten, D.; Mendiza…", "date": "2026-06-10", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5746, "score_semantic": 0.5746, "score_lexical": 0.711, "matched": ["histopathology"]}, {"id": "https://doi.org/10.1016/j.cell.2026.05.031", "title": "Cellular architecture and neighborhood-informed virtual spatial tumor profiling from histopathology.", "abstract": "The tumor microenvironment (TME) critically shapes disease progression and therapeutic resistance. However, a comprehensive understanding of its spatial architecture remains elusive, and clinical translation is challenging. Here, we present cellular architecture and neighborhood-informed virtual AI-driven spatial profiling (CANVAS), an artificial intelligence platform that infers tumor ecological habitats from hematoxylin and eosin (H&E) histopathology. Built on an atlas of over 18 million cells profiled by 41-plex spatial proteomics across 457 patients with non-small cell lung cancer, CANVAS establishes 10 reproducible cellular neighborhoods (CNs) capturing conserved spatial organization of the TME. Through multimodal alignment and foundation-model-based morphological encoding, CANVAS predicts CN-anchored habitat structures from H&E slides and enables clinical evaluation in over 5,000 patients spanning 9 cancer types. Across patient cohorts, CANVAS supports prognostic modeling, spatial ecotype stratification, and immunotherapy outcome prediction. These results establish CANVAS as a clinically scalable platform for spatial profiling, bridging single-cell analysis to population-level insight and enabling precision oncology.", "authors": "Li Y, Li Z, Quinton R, Ji Y, Zhang X, Xiang J, Wang X, Yang …", "date": "2026-Jun-16", "source": "PubMed", "journal": "Cell", "if": 45.5, "score": 0.5733, "score_semantic": 0.5733, "score_lexical": 0.8559, "matched": ["histopathology", "cancer"]}, {"id": "https://doi.org/10.1186/s13059-026-04151-6", "title": "DNA-contact mutant p53 displaces BRCA2 from chromatin and drives R-loop-associated genome instability.", "abstract": "Mutations in the tumor suppressor p53 are among the most frequent events in human cancers. Mutant p53 acquires oncogenic activities beyond the loss of tumor suppressive function. However, how different mutation subtypes differ in their contributions to tumorigenesis remains incompletely understood. Through pan-cancer TCGA analysis, we find that patients with p53 DNA contact mutations exhibit worse clinical outcomes than those carrying conformational mutations. Mechanistically, we demonstrate that the DNA contact mutation p53-R273H forms aberrant condensates that sequester BRCA2 and displace it from chromatin, leading to R-loop accumulation and genomic instability. We further identify the DEAD-box helicase DDX3X as a critical factor required for BRCA2-dependent R-loop resolution. Pharmacological inhibition of DDX3X with RK-33 synergizes with the PARP inhibitor Olaparib, enhancing therapeutic efficacy in p53 DNA contact mutant cancer cells. Our study establishes a pathogenic axis through which the clinically aggressive p53 DNA contact mutations drive genomic instability by dislodging BRCA2 from chromatin and disrupting R-loop homeostasis. These findings suggest a potential therapeutic avenue for treating cancers harboring high-risk p53 DNA contact mutations.", "authors": "Li F, Fang K, Si S, Zhang Q, Fan M, Guo C, Sun J, Xie Z, Che…", "date": "2026-Jun-11", "source": "PubMed", "journal": "Genome biology", "if": 10.7, "score": 0.5726, "score_semantic": 0.5726, "score_lexical": 1.0, "matched": ["genomic instability", "cancer"]}, {"id": "http://arxiv.org/abs/2606.07222v1", "title": "DualGate-Net: A Prior-Gated Dual-Encoder Framework for Histopathology Cell Detection", "abstract": "Cell detection in histopathology images strongly depends on surrounding tissue context, where visually similar cells may belong to different classes under different microenvironments. Recent tissue-aware methods incorporate contextual priors, but often rely on static fusion strategies that may propagate noisy information. In this work, we propose DualGate-Net, a prior-aware dual-encoder framework that combines a ConvNeXtV2-based local encoder and a SegFormer-based global encoder through a learnable prior-gated fusion mechanism. The proposed module adaptively regulates the influence of tissue priors across spatial locations, while an auxiliary foreground reconstruction branch preserves high-frequency cellular structures during training. In addition, auxiliary cellness-guided cues are incorporated to further improve localization robustness. Experiments on the OCELOT benchmark demonstrate consistent improvements, achieving macro F1-scores of 0.7722 on the validation set and 0.7345 on the test set, highlighting the effectiveness of adaptive prior integration for robust histopathology cell detection.", "authors": "Bahman Jafari Tabaghsar, Son Tran, K. Devaraja, Atul Sajjanh…", "date": "2026-06-05", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.57, "score_semantic": 0.57, "score_lexical": 0.995, "matched": ["histopathology"]}, {"id": "https://doi.org/10.1038/s41467-026-74398-x", "title": "Meiotic pairing through barcode-like satellite DNA repeats.", "abstract": "During meiosis, chromosomes must find, pair, and synapse with their homologous partners in the crowded milieu of the nucleus. Although homology detection generally relies on recombination, pairing can occur in its absence, suggesting alternative mechanisms. Here, we show that the barcode-like arrangement of non-coding satellite DNA repeats facilitates homologue pairing during meiosis. Using satellite DNA deletion, duplication, and translocation strains, we demonstrate that repeat mismatches perturb meiotic pairing, particularly at centromeres and pericentromeres. Notably, pairing defects are also observed in the progeny of D. melanogaster natural populations that have diverged in their satellite DNA content. In the absence of satellite DNA homology, pairing is antagonised by the HORMAD protein, Mad2, while a Pachytene checkpoint 2 (Pch2)-dependent meiotic delay restores pairing. In addition, compromised meiotic pairing is strongly correlated with mid-oogenesis cell death, a quality control mechanism that likely culls defective oocytes to prevent chromosome mis-segregation and aneuploidy. Taken together, our findings reveal an important role for satellite DNA repeats during meiotic homology detection. We propose that this repeat-based pairing mechanism exerts an underappreciated selective pressure, constraining the divergence of rapidly evolving satellite DNA within interbreeding natural populations.", "authors": "Skrutl L, Chavan A, Sintsova A, Ceppi I, Ropp CJ, Sunagawa S…", "date": "2026-Jun-16", "source": "PubMed", "journal": "Nature communications", "if": 14.7, "score": 0.5643, "score_semantic": 0.5643, "score_lexical": 0.6822, "matched": ["aneuploidy"]}, {"id": "https://doi.org/10.1158/0008-5472.CAN-25-3977", "title": "Deficiency in POLE Exonuclease Causes Synthetic Lethality in Highly Aneuploid Cancer Cells.", "abstract": "Aneuploidy is a hallmark of cancer and is associated with drug resistance and poor clinical outcomes across diverse cancer types. However, no therapies have been clinically established to target highly aneuploid tumors. By analyzing nearly half a million tumor samples subjected to comprehensive genomic profiling, we identified a striking mutual exclusivity between POLE exonuclease domain mutations and high aneuploidy burden. This observation was independently validated using data from The Cancer Genome Atlas (TCGA) and the Cancer Cell Line Encyclopedia (CCLE). Probabilistic modeling revealed that the elevated quantity and unique spectrum of mutations induced by POLE exonuclease deficiency increase the likelihood of inactivating essential genes on chromosome arms harboring losses, leading to a synthetic lethal phenotype in highly aneuploid cells. Functional experiments demonstrated that POLE exonuclease activity is essential for the viability of highly aneuploid cancer cell lines but dispensable in diploid cells. These findings suggest that selective inhibition of POLE exonuclease activity may represent a promising therapeutic strategy for targeting highly aneuploid tumors.", "authors": "Kim EJ, Jin DX, Chibly AM, Dorighi K, Sivakumar S, Kamm J, J…", "date": "2026-Jun-08", "source": "PubMed", "journal": "Cancer research", "if": 11.2, "score": 0.5557, "score_semantic": 0.5557, "score_lexical": 1.0, "matched": ["aneuploidy", "cancer"]}, {"id": "https://doi.org/10.1038/s41467-026-74360-x", "title": "Natural killer cell-mediated immunosurveillance modulates liver cancer evolution through cancer stemness enhancement and lipid metabolism reprogramming.", "abstract": "Tumor evolution enables liver cancer cells to acquire survival advantages and evade therapy-induced cell death. However, the role of natural killer (NK) cells in liver cancer evolution remains unclear. Here, we establish immune-humanized spatiotemporal liver cancer models and integrate single-cell, spatial transcriptomic, and CRISPR/Cas9 screening analyses to investigate this process. We demonstrate that early NK cell-mediated immunosurveillance promotes tumor cell state transition and impairs subsequent adaptive immune responses. Mechanistically, NK cells induce lipid metabolic reprogramming, particularly cholesterol accumulation, and enhance tumor stemness, both of which promote liver cancer evolution. Furthermore, combined anti-LAG-3 treatment and liver X receptor activation suppress tumor evolution and improve the efficacy and durability of immune checkpoint blockade in advanced liver cancer. Collectively, our findings identify that NK cell-mediated early immunosurveillance promotes liver cancer evolution and suggest immunometabolic therapy as a potential strategy for advanced liver cancer.", "authors": "Shi L, Liu B, Sun R, He J, Shen H, Li W, Wang Y, Zhao W, Jin…", "date": "2026-Jun-11", "source": "PubMed", "journal": "Nature communications", "if": 14.7, "score": 0.5548, "score_semantic": 0.5548, "score_lexical": 1.0, "matched": ["tumor evolution", "cancer"]}, {"id": "https://doi.org/10.64898/2026.06.05.730343", "title": "DNMT mRNA stability and YB-1 cooperatively regulate ABCB1 to drive cisplatin chemoresistance in cholangiocarcinoma", "abstract": "Background and AimsIntrahepatic cholangiocarcinoma (iCCA) is a tumor type with a high lethality due to late diagnosis and profound resistance to conventional chemotherapy. To date the molecular mechanisms underlying multidrug resistance remain poorly defined. Here, we integrate single-cell transcriptomics, clinicopathological analysis, and functional genomics to elucidate the molecular basis of cisplatin resistance in iCCA.  Approach and ResultsSingle-cell RNA sequencing of iCCA and adjacent liver tissues revealed pronounced expression of Y-box-binding protein 1 (YB-1) in aneuploid malignant cholangiocarcinoma cells, with YB-1 expression progressively increasing during malignant evolution and strongly associated with chemoresistance. Clinically, elevated YB-1 expression-particularly its nuclear localization-robustly predicts poor overall survival and chemotherapy failure in patients with iCCA. Mechanistically, we demonstrate that cisplatin induces phosphorylation-dependent nuclear translocation of YB-1, enabling direct transcriptional activation of the drug efflux transporter ABCB1. Importantly, this process requires ABCB1 promoter demethylation, which is driven by cisplatin-induced, mA-dependent destabilization of DNMT1 and DNMT3B mRNAs. This destabilization occurs through disruption of the YB-1-IGF2BP1/3-DNMT mRNA stabilizing complex and subsequent recruitment of DNMT transcripts to YTHDF2-mediated processing bodies for degradation.  ConclusionsOur findings uncover a previously unrecognized YB-1-mA-DNMT regulatory axis that drives chemotherapeutic resistance in iCCA, highlighting YB-1 as both a prognostic biomarker and a promising therapeutic target.", "authors": "Lin, T.; Huang, C.; Tong, C.; liu, H.; Liebe, R.; Lu, L.; Li…", "date": "2026-06-07", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5507, "score_semantic": 0.5507, "score_lexical": 0.7149, "matched": ["tumor evolution", "genomics"]}, {"id": "https://doi.org/10.64898/2026.06.06.722969", "title": "A U1-U3 snRNA-snoRNA interaction couples SF3B1 mutation to chromatin-state rewiring and genome instability", "abstract": "Mutations in spliceosome factors such as SF3B1 are recurrent across human diseases, including myelodysplastic syndromes and leukemia1-4, yet splicing defects alone do not fully explain the widespread chromatin alterations and genome instability in mutant cells5. Here, by comprehensively mapping snRNA-directed RNA-RNA interactions, we identify two previously unrecognized interaction motifs in U1 snRNA beyond canonical 5' splice-site pairing6,7. These motifs enable U1 RNA to i) bind intronic and other chromatin-associated RNA (caRNA) regions outside of splice sites, and ii) base pair specifically with snoRNA. We uncover a U1-U3 snRNA-snoRNA interaction that recruits the H3K36 methyltransferase SETD2 to caRNA, promoting gene-body H3K36me3 and antagonizing H3K27me3 to modulate chromatin accessibility. The snRNA-snoRNA interface is essential for this previously unrecognized layer of chromatin and transcriptional regulation mediated through SETD2. SF3B1 mutation enhances U1-U3 binding and increases the association of the U1-U3 complex with caRNA, driving chromatin-accessibility remolding, R-loop formation, DNA damage, and copy-number abnormalities that promote tumorigenesis. A U1-specific 2'-O-methoxyethyl antisense oligonucleotide that selectively blocks U1-U3 pairing suppresses these genomic abnormalities, reduces leukemic infiltration, and prolongs survival in xenograft and patient-derived models, establishing pathological snRNA-snoRNA rewiring as a critical driver of SF3B1-mutant leukemogenesis.", "authors": "Xia, P.; Li, H.; Ji, Y.; Ju, C.-w.; Pan, Y.; Mo, J.; Zhu, X.…", "date": "2026-06-08", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5506, "score_semantic": 0.5506, "score_lexical": 0.6668, "matched": ["genomic instability"]}, {"id": "https://doi.org/10.1016/j.ccell.2026.05.014", "title": "Spatial biomarker discovery via interpretable semantic learning in histopathology.", "abstract": "Spatial biomarkers are critical for precision oncology but remain challenging to systematically discover due to the complexity of whole-slide images. We present PathPrism, an interpretable AI framework for spatial biomarker discovery and virtual experimentation. Unlike black-box models, PathPrism encodes tissue architecture into pathologically informed spatial features, enabling transparent modeling of prognosis, molecular alterations, and therapy response. Applied to 7,000 patients with colorectal cancer across 11 cohorts, PathPrism uncovered hundreds of biomarkers predictive of survival, MSI, BRAF, and TP53 mutations, and stratified chemotherapy benefit in stage II/III disease. Building on these interpretable findings, PathPrism uses large language models as auxiliary tools to generate hypotheses grounded in spatial semantics. We further introduce VirtualWSI, a platform for semantic perturbation within an interpretable spatial biomarker atlas. PathPrism provides a scalable and interpretable framework for spatial biomarker discovery.", "authors": "Liang J, Jiang X, Reitsam NG, Lenz T, Zhang L, Gustav M, Car…", "date": "2026-Jun-11", "source": "PubMed", "journal": "Cancer cell", "if": 38.6, "score": 0.5134, "score_semantic": 0.5134, "score_lexical": 0.6605, "matched": ["histopathology", "cancer"]}, {"id": "https://doi.org/10.64898/2026.06.10.731255", "title": "Variable ectopic heterochromatin islands provide an alternative route to antifungal heteroresistance in Cryptococcus neoformans", "abstract": "The fungal pathogen Cryptococcus neoformans is estimated to cause approximately 180,000 deaths annually, primarily among immunocompromised HIV patients in resource-limited countries in central and southern Africa. Economic constraints regularly restrict treatment to fluconazole monotherapy. Unstably resistant cells arise in any otherwise fluconazole-sensitive C. neoformans population, with such  heteroresistance often involving chromosome 1 disomy. Here we uncover a form of heteroresistance that occurs by a mechanism distinct from aneuploidy. Transient islands of histone H3 lysine 9 methylation-dependent heterochromatin occur at several locations across the genomes of clinical isolates from African patients. Some islands dissipate in the absence of fluconazole selection but are restored upon re-exposure. Deletion of specific heterochromatin island-located genes increased fluconazole resistance in an otherwise wild-type background, suggesting that heterochromatin-mediated alterations in gene expression elicit unstable resistance. Thus, in addition to aneuploidy, transient heterochromatin islands also appear to contribute to C. neoformans fluconazole heteroresistance. Heterochromatin islands have recently been shown to confer unstable antifungal resistance in the ascomycete fungus Schizosaccharomyces pombe (fission yeast) and fungal species of the Mucor circinelloides complex. Thus, similar unstable resistant epimutations may be widespread in pathogenic fungi, however, their instability and inaccessibility to detection by direct sequencing poses challenges for monitoring this form of heteroresistance in clinical settings.", "authors": "Yeboah, R.; Catania, S.; Tong, P.; Navarro-Mendoza, M. I.; P…", "date": "2026-06-11", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5092, "score_semantic": 0.5092, "score_lexical": 0.927, "matched": ["aneuploidy"]}, {"id": "https://doi.org/10.1186/s13073-026-01684-0", "title": "Geospatial genetic evolution and phenotypic plasticity in triple-negative breast cancer.", "abstract": "The interplay between genotype and phenotype in shaping spatial heterogeneity and metastatic evolution in triple-negative breast cancer (TNBC) remains poorly understood. Here, we developed a pathology-guided geospatial genomic and transcriptomic sequencing workflow (pGeo-G&T-seq) and applied it to TNBC specimens from primary tumors and matched metastatic sites. Using laser capture microdissection (LCM) we isolated mRNA and gDNA for whole-exome sequencing, whole-genome sequencing and whole-transcriptome sequencing to analyze spatial genomic heterogeneity and transcriptomic plasticity. Findings were further evaluated using independent bulk transcriptomic, single-cell immunotherapy, and spatial transcriptomic TNBC datasets. The analysis unveiled spatial intratumoral heterogeneity at genomic and transcriptomic levels characterized by distinct spatial patterns of \"decay\" or \"uniformity\", demonstrating regional clonal expansion and genetic mosaicism, including heterogeneity in driver alterations and molecular subtypes. Notably, we identified a previously uncharacterized oxidative phosphorylation (OXPHOS)-associated transcriptional state associated with poor prognosis and features of limited immunotherapy responsiveness in single-cell cohorts. Intriguingly, genetic ancestry was associated with relatively stable transcriptional programs in a subset of cases. Furthermore, phylogenetically closely related clones from primary tumors and lymph node metastases shared convergent biological processes, suggesting that phenotypic traits may be partially retained during metastatic colonization. These findings support a model in which genetic evolution and phenotypic retention contribute to the spatial heterogeneity and metastatic progression of TNBC. More broadly, our pathology-guided spatial multi-omics framework enables the dissection of genotype-phenotype coupling in intact tissue, while the identification of an OXPHOS-associated transcriptional program may inform biologically guided patient stratification and generate hypotheses for future therapeutic studies.", "authors": "Hong R, Wu P, Qiu Y, Dong S, Huang Y, Lee K, Wang H, Li M, Z…", "date": "2026-Jun-10", "source": "PubMed", "journal": "Genome medicine", "if": 10.4, "score": 0.5074, "score_semantic": 0.5074, "score_lexical": 0.6052, "matched": ["clonal evolution", "cancer"]}, {"id": "https://doi.org/10.64898/2026.06.07.730560", "title": "Human 3D epithelioids enable continuous long-term clonal evolution studies across multiple epithelial tissues", "abstract": "Modeling human epithelia in vitro remains challenging because current systems do not fully preserve the combination of architecture, heterogeneity, clonal composition, and long-term dynamics shown in vivo. While 3D approaches such as organoids and organotypic cultures capture important aspects of lineage differentiation and niche signaling, they often lose stable organization over time, limiting studies of long-lasting processes such as clonal evolution and cell competition. Here, we present human epithelioids as continuous long-term, 3D epithelial cultures efficiently derived from eight adult human epithelia, including trachea, skin, buccal mucosa, esophagus, blader, urethra, submandibular gland and endometrium. Using immunostaining, electron microscopy, single-cell RNA sequencing, functional assays and somatic mutation analyses, we deeply characterized human epithelioids and confirmed that they recapitulate native architecture and cell diversity, sustain regenerative capacity, and preserve donor-specific mutational landscapes, establishing a robust and versatile platform for longitudinal interrogation of clonal evolution, tissue dynamics and responses to clinically relevant perturbations, including radiotherapy and chemotherapy, over extended timescales.", "authors": "Ferreira, I. S.; Pradilla-Dieste, A.; Valverde-Lopez, J. A.;…", "date": "2026-06-08", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4962, "score_semantic": 0.4962, "score_lexical": 0.9858, "matched": ["clonal evolution"]}, {"id": "https://doi.org/10.1038/s41467-026-73923-2", "title": "Towards robust foundation models for digital pathology.", "abstract": "Biomedical Foundation Models (FMs) are transforming AI-enabled healthcare research and entering clinical validation. However, their susceptibility to learning non-biological features - including variations in laboratory procedures and scanner hardware - poses risks for clinical deployment. We introduce PathoROB, a public benchmark quantifying FM robustness to non-biological features. Representation-level robustness is assessed using the robustness index, while output-level robustness is evaluated across clinically relevant settings, including patch- and slide-level prediction, case retrieval, and clustering tasks. Our experiments reveal robustness deficits across all 20 evaluated FMs, with substantial differences between them. We find that non-robust FM representations can cause major diagnostic downstream errors preventing safe clinical adoption. Using more robust FMs, vision-language alignment, and post-hoc robustification reduces (but does not yet eliminate) the risk of such errors. This work establishes that robustness evaluation is essential for validating pathology FMs before clinical adoption and provides a blueprint for assessing and improving robustness across biomedical domains.", "authors": "Kömen J, de Jong ED, Hense J, Marienwald H, Dippel J, Nauman…", "date": "2026-Jun-11", "source": "PubMed", "journal": "Nature communications", "if": 14.7, "score": 0.4939, "score_semantic": 0.4939, "score_lexical": 0.8082, "matched": ["digital pathology"]}, {"id": "https://doi.org/10.64898/2026.06.02.729542", "title": "Tumor extracellular vesicle RNA profiling predicts treatment response in pediatric diffuse midline glioma", "abstract": "Detection of reliable markers of therapy response and drug resistance remains a major unmet need in brain cancer, as serial tumor biopsy is often not feasible. This challenge is particularly acute in diffuse midline glioma (DMG), a fatal pediatric brain tumor for which new targeted therapies are entering clinical use, yet tools for real-time molecular analysis of tumor evolution during therapy remain lacking. Here, we demonstrate that plasma tumor-derived extracellular vesicle (EV) profiling provides a minimally invasive and complementary approach for diagnosis and longitudinal molecular monitoring in H3K27M-mutant DMG. Across patient-derived tumor models and clinical plasma samples, EV mRNA levels correlated strongly with parental tumor transcriptomes. EV H3K27M mRNA enabled discrimination of DMG from non-DMG controls, and exploratory EV response-associated mRNAs were linked to radiographic response and progression-free survival in patients receiving ONC201. To enable tumor-selective EV enrichment and multiplexed molecular profiling within a clinically practical workflow, we developed a new integrated platform supporting same-day EV analysis from small plasma volumes. This work represents the first proof-of-concept demonstration of the diagnostic and treatment response relevance of tumor-derived EV RNA in pediatric DMG and establishes a generalizable framework for minimally invasive longitudinal molecular monitoring in diseases where tissue access is inherently limited.", "authors": "Kim, C.; Kim, J.; Ji, S.; Choi, J.; Bong, K.; Pearson, A.; L…", "date": "2026-06-05", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4899, "score_semantic": 0.4899, "score_lexical": 0.5182, "matched": ["tumor evolution", "cancer"]}, {"id": "https://doi.org/10.64898/2026.06.10.731490", "title": "Multimodal PET Defines a Goldilocks Thermal Window for Focused Ultrasound Ablation and Immunotherapy Combinations", "abstract": "BackgroundThermally ablative focused ultrasound (T-FUS) offers a noninvasive, spatially precise strategy for local tumor destruction, with the added potential to remodel tumor architecture and immune dynamics in ways that influence downstream therapeutic delivery and efficacy. Despite promising preclinical and clinical findings, the T-FUS parameters that best balance tumor debulking with preservation of local biologic, e.g. immunotherapy, penetrance remain unclear. Thermal dose, defined by the relationship between tissue heating, exposure duration, and biological effect, is likely a critical determinant of this balance. Excessive thermal dose may eliminate the vascular and stromal features needed to support immunotherapy access, whereas insufficient thermal dose may fail to achieve meaningful cytoreduction. Here, we deploy multimodal PET, contrast-enhanced ultrasound, and tissue profiling to define a \"Goldilocks Zone\" for T-FUS that balances bulk tumor destruction with immunotherapy delivery.  MethodSubtotal T-FUS was applied to 4T1 tumors using three thermal dose regimens resolved by in silico modeling. Ablation was quantified by H&E and TTC staining. Post-ablative perfusion and microvascular coverage were assessed by contrast-enhanced ultrasound and immunofluorescence, respectively. Tumor oxygenation was measured by intravenous hypoxyprobe labeling. After T-FUS, mice underwent dynamic [18F]-FDG PET and immunoPET with a model tumor-targeted antibody, [89Zr]-CD47, to relate cytoreduction to antibody penetrance. ImmunoPET findings were further evaluated by ex vivo biodistribution analysis.  ResultsIn silico modeling established three T-FUS regimens that generated distinct thermal dose profiles and were deployed in vivo in a solid breast tumor model. Histopathology, perfusion imaging, and hypoxia analysis revealed dose-dependent and dose-divergent biological effects that informed a candidate Goldilocks thermal window. Low thermal dose produced measurable but limited tumor debulking, whereas high thermal dose caused disproportionate functional perfusion collapse. An intermediate thermal dose achieved robust partial ablation, broad hypoxia relief, and preservation of residual tumor physiology sufficient to support antibody access. Dynamic [18F]-FDG PET confirmed a marked reduction in metabolically active tumor burden after Goldilocks T-FUS. Serial [89Zr]-CD47 immunoPET showed that bulk antibody signal was maintained after ablation, and integration of immunoPET with matched [18F]-FDG PET revealed approximately 3-fold enrichment of antibody exposure within the residual viable tumor compartment of ablated tumors. These findings demonstrate that appropriately tuned thermal ablation can debulk tumor while preserving, and potentially concentrating, immunotherapy access within the remaining targetable tumor niche.  ConclusionThis study identifies thermal dose as a critical consideration for T-FUS immunotherapy combinations and establishes a PET-informed framework for balancing cytoreduction with therapeutic delivery. Rather than functioning solely as a local debulking modality, we demonstrate that T-FUS can be tuned to yield a post-ablation tumor state that remains accessible to large biologics. These findings provide timely, translationally relevant guidance for tailoring T-FUS regimens to achieve local tumor destruction while preserving an immunotherapy-permissive niche for combination treatment.", "authors": "Demir, Z. E. F.; Sherlock, T.; DeWitt, M. R.; Talebibarmi, P…", "date": "2026-06-11", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4784, "score_semantic": 0.4784, "score_lexical": 0.3663, "matched": ["histopathology"]}], "imported": true, "reports": [{"date": "2026-09-28", "label": "Sep 28, 2026", "n": 21}, {"date": "2026-09-21", "label": "Sep 21, 2026", "n": 24}, {"date": "2026-09-14", "label": "Sep 14, 2026", "n": 26}, {"date": "2026-09-07", "label": "Sep 07, 2026", "n": 34}, {"date": "2026-08-31", "label": "Aug 31, 2026", "n": 19}, {"date": "2026-08-24", "label": "Aug 24, 2026", "n": 24}, {"date": "2026-08-17", "label": "Aug 17, 2026", "n": 18}, {"date": "2026-08-10", "label": "Aug 10, 2026", "n": 34}, {"date": "2026-08-03", "label": "Aug 03, 2026", "n": 17}, {"date": "2026-07-27", "label": "Jul 27, 2026", "n": 24}, {"date": "2026-07-20", "label": "Jul 20, 2026", "n": 26}, {"date": "2026-06-26", "label": "Jun 26, 2026", "n": 14}, {"date": "2026-06-19", "label": "Jun 19, 2026", "n": 38}], "prefix": "", "home": "../papers.html"}</script>

(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const papers = DATA.papers;

  // Slider floor: the pipeline threshold, or lower if older data scored below it
  const FLOOR = Math.floor(Math.min(DATA.threshold, ...papers.map(p => p.score)) * 100) / 100;
