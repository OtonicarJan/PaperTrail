l and clinical consequences. Sequence-to-function models can quantify these effects directly from DNA sequence. Here, we use AlphaGenome and AlphaMissense to quantify the disruption imposed by somatic mutations across 8,800 patients and 33 cancer types from The Cancer Genome Atlas. At the individual-variant level, recurrent hotspot mutations showed substantially larger predicted protein-level effects, whereas non-hotspot mutations exhibited larger regulatory effects across most cancer types. We then aggregated the variant-level predictions to construct patient-gene disruption profiles capturing transcriptional activity, chromatin accessibility, transcription factor binding, and splicing. These profiles were gene- and modality-specific, and reflected tissue of origin, cancer type, and microsatellite-instability status while retaining information beyond tumor mutational burden. Among patients lacking recurrent hotspot mutations in a given cancer gene, higher predicted disruption was associated with overall survival, with the strongest and most consistent signal observed for chromatin accessibility. In an independent treatment-annotated cohort, gene-level disruption was also associated with survival within treatment-defined subgroups. Together, these findings show that recurrent hotspots are enriched for strong predicted protein-level effects, whereas regulatory consequences are distributed more broadly across other variants, supporting a continuous, multidimensional view of cancer-gene perturbation beyond discrete drivers.", "authors": "Nayak, A.; Lee, T.-R.; Agarwal, V.; Georgakopoulos-Soares, I.", "date": "2026-09-21", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.6794, "score_semantic": 0.6794, "score_lexical": 0.9375, "matched": ["genomic instability", "genomics", "cancer"]}, {"id": "http://arxiv.org/abs/2609.25838v1", "title": "Mutation Order and Selection Shape Intratumor Heterogeneity in Tumor Evolution", "abstract": "Cancer progression often requires multiple driver mutations, but the same drivers may be acquired in different orders. How these pathways jointly shape tumor clonal structure remains unclear. We develop a multitype branching-process model in which malignant transformation requires two driver mutations, distinguishing malignant cells by mutation order and the independent transformation event that founded their clone. Under a successive exponential approximation, we establish point-process limits for pathway-specific clone sizes and derive a closed-form expression for the limiting expected Simpson's index of the combined malignant population. When both mutation orders yield malignant cells with the same net growth rate, the index decomposes into effective pathway weights, determined by mutation rates and birth-death dynamics at preceding stages, and within-pathway concentration terms, determined by intermediate-to-malignant growth-rate ratios. A driver's effect on heterogeneity thus depends critically on when it is acquired. A strong driver acquired early expands the intermediate lineage and increases the supply of independent malignant founders, whereas the same driver acquired last strengthens the growth and age advantage of early-founded malignant clones. Under additive fitness effects, these opposing mechanisms can produce a non-monotone relationship between selective advantage and clonal concentration. Threshold-like non-additive fitness effects can generate highly concentrated malignant populations, while order-dependent terminal fitness causes the faster-growing pathway to dominate asymptotically. These results show how mutation order, mutational accessibility, selection, and epistasis jointly determine lineage-level intratumor heterogeneity.", "authors": "Yichen Chu, Xiaoxia Sheng, Xuanming Zhang, Zicheng Wang", "date": "2026-09-22", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.6637, "score_semantic": 0.6637, "score_lexical": 0.748, "matched": ["tumor evolution", "clonal evolution", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.20.752979", "title": "Copy number signatures in targeted gene panels associate with patient outcomes in routine clinical data", "abstract": "Targeted gene panels (TGPs) dominate clinical sequencing, yet most copy-number (CN) signature studies rely on genome-wide assays. Whether signatures can be recovered from TGPs and retain clinical relevance remains unclear. We analyzed two real-world TGP cohorts comprising 1,726 patients across 62 tumor types, including 825 with clinical annotations, and made the underlying data publicly available. TGP-derived signatures recapitulated established biological associations, including links to homologous recombination deficiency and TP53 alterations, concordant with published genome-wide assay-derived CN signatures. Using our detailed clinical data, we found TGP-derived CN signatures associated with overall survival under standard therapies in ovarian, pancreatic, and colorectal cancer. In ovarian cancer, CN2 was associated with CCNE1 amplification and shorter survival under paclitaxel/carboplatin, with the survival association validated in an independent SNP-array cohort. These findings demonstrate that routine TGPs yield biologically and clinically relevant CN signatures with potential as biomarkers for therapy stratification.", "authors": "Netz, E.; Moris, C.; Hasanovic, A.; Möbs, M.; Schlomm, T.; Frost, N.; Mohr, R.; Stintzing, S.; Braicu, E.; Sehouli, J.; Rieke, D. T.; Benary, M.; Horst, D.; Dubois, F.", "date": "2026-09-25", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6444, "score_semantic": 0.6444, "score_lexical": 0.7087, "matched": ["cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.25.754334", "title": "Scaling of structural variability of ecDNA polymer condensates with copy number boosts and stabilises oncogene regulatory contacts", "abstract": "Extrachromosomal DNAs (ecDNAs) form highly heterogeneous condensates in cancer cells that drive oncogene overexpression, yet how structural variability coexists with stable gene regulation remains unclear. Here, we develop a minimal polymer physics model of MYC-harbouring COLO320-DM ecDNAs, where BRD4-like complexes bind and bridge cognate sites along ecDNA rings. Above a critical binder concentration, ecDNAs phase separate into condensates exhibiting diverse conformations because of their thermodynamic folding degeneracy. Despite this variability, condensates retain conserved interaction scaffolds that give rise to reproducible contact patterns, including in-trans associated domains (I-TADs), genomic regions enriched in intermolecular regulatory contacts between distinct ecDNAs. We find that condensate 3D architecture follows universal scaling relations with ecDNA copy number, n, remaining robust to model parameter changes. Regulatory contacts within I TADs increase linearly with n, yet they are one order of magnitude stronger than in size matched control regions outside I TADs, whereas their relative fluctuations are markedly suppressed as n increases. This scaling produces enhanced, low-noise regulatory environments for oncogenes embedded within I-TADs, such as PVT1-MYC fusions, whereas the canonical MYC copy, located outside, is less amplified as experimentally observed. Our findings reveal universal polymer physics principles underlying ecDNA condensate organization, offering a mechanistic basis for selective oncogene amplification and potential advantages in cancer progression.", "authors": "Conte, M.; Kundu, S.; Guha, S.; Nicodemi, M.", "date": "2026-09-26", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6226, "score_semantic": 0.6226, "score_lexical": 0.6502, "matched": ["cancer"]}, {"id": "http://arxiv.org/abs/2609.24004v1", "title": "Retracing the Process of Translation: Proteome-wide mapping of stable transcriptomic predictors of protein abundance in cancer cell lines", "abstract": "Understanding the relationship between gene expression and protein abundance is central to molecular and systems biology. While gene expression reflects transcriptional activity, proteins are the functional molecules that determine cellular phenotypes. However, numerous post-transcriptional and translational regulatory layers complicate this relationship, and prior studies have reported only weak to moderate correlations between RNA and protein levels. Predicting protein abundance from transcriptomic data remains challenging, but it is a valuable goal for biological insight, especially when proteomic data is limited or unavailable.   In this study, we applied a large-scale, Ridge regression-based feature selection strategy to identify predictive gene expression features for each of 8,423 proteins across 940 cancer cell lines. To our knowledge, this is the first work to perform such comprehensive protein-wise feature selection at this scale. Our analysis revealed both globally predictive and context-specific gene features. These included biologically meaningful modules such as immune-related genes, HOX transcription factor targets, and cytoskeletal components. The models identified stable candidate gene-protein associations that remained interpretable at the level of individual proteins and recurrent transcriptomic predictor patterns.   Our approach enables interpretable modeling of protein expression from transcriptomic data and provides insight into transcriptomic features associated with protein abundance. This framework may support hypothesis generation, protein imputation in incomplete datasets, and deeper understanding of post-transcriptional regulation in cancer biology.", "authors": "Johannes Schlüter, Alexander Schönhuth", "date": "2026-09-21", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.621, "score_semantic": 0.621, "score_lexical": 0.7459, "matched": ["cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.09.15.26363151", "title": "Cancer type-specific profiling of chromatin regulator mutations identifies recurrent and co-occurring gene sets associated with improved survival following immune checkpoint therapy", "abstract": "Mutations in chromatin regulator (CR) genes are frequent across human cancers and have been associated with increased tumor mutational burden (TMB) and improved response to immune checkpoint inhibitor (ICI) treatment. Here, using discovery and independent validation cohorts, we resolved these associations at the level of individual cancer types and investigated whether shared CR mutation patterns emerge across colorectal cancer, melanoma, renal cell carcinoma, head and neck squamous cell carcinoma, non-small cell lung cancer, bladder cancer, esophagogastric cancer, pancreatic adenocarcinoma, prostate cancer, and breast cancer. For each cancer type, we identified a distinct set of pro-survival CR genes, whose mutations were associated with improved survival following ICI treatment. We further identified a subset of recurrent CRs that were associated with improved ICI outcomes across many cancer types, although the magnitude of the association varied between cancers. Co-occurrence of mutations in two or more CRs was associated with further improvement in survival, while several individual CR genes showed particularly robust associations with favorable ICI outcomes. Across cancer types, CR-altered groups consistently displayed higher TMB than their corresponding CR-unaltered groups. Transcriptomics-based deconvolution further revealed cancer-type-specific differences in the tumor microenvironment associated with CR mutations. Together, these findings demonstrate both cancer-specific and recurrent patterns of CR mutations associated with improved outcomes following ICI treatment and further establish a relationship between CR alterations, increased TMB, and ICI response.", "authors": "Bukovec, D.; Gjorgjievska, M.; Kocevska, S.; Nikolova, M.; Mirkovikj, L.; Kungulovski, I.; Mitrev, Z.; Kungulovski, G.", "date": "2026-09-21", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.6136, "score_semantic": 0.6136, "score_lexical": 0.9899, "matched": ["cancer"]}, {"id": "http://arxiv.org/abs/2609.26920v1", "title": "Cross-Modal Contrastive Learning from Histopathology and CT for Automated Renal Cell Carcinoma Grading", "abstract": "Background: Clear cell renal cell carcinoma (ccRCC) exhibits substantial clinical heterogeneity, and accurate grade assessment is essential for risk stratification and treatment planning. However, conventional grading requires invasive tissue sampling. We developed RCC-Align, a cross-modal contrastive learning framework that leverages paired histopathology and computed tomography (CT) data during training to improve noninvasive CT-based ccRCC grade prediction. Methods: RCC-Align aligns paired whole-slide histopathology images (WSIs) and CT scans through contrastive cross-modal objectives, transferring grade-discriminative information from microscopic tissue morphology to macroscopic radiologic representations. The framework was trained and evaluated on paired TCGA and CPTAC cohorts using patient-level five-fold cross-validation. Performance for low- versus high-grade ccRCC classification was compared against CT-only baselines (DINOv2-Base and DINOv2-Finetuned) and a WSI-based reference model (GigaPath-Finetuned). Cross-modal alignment was assessed using cosine similarity analysis. Results: RCC-Align achieved an AUC of 0.601 (95% CI, 0.524-0.673) and AUPRC of 0.599 (95% CI, 0.541-0.676), outperforming DINOv2-Finetuned (AUC 0.545; AUPRC 0.543) with significantly improved low-grade prediction (p = 0.004). RCC-Align also demonstrated stronger paired WSI-CT embedding alignment compared with baselines. The WSI-based GigaPath reference achieved an AUC of 0.719. Conclusion: Pathology-guided contrastive learning improves CT-based ccRCC grading while requiring only CT at inference. This approach may complement tissue diagnosis when biopsy is unsafe, infeasible, or limited by intratumoral heterogeneity. Validation in larger, multi-institutional cohorts with external testing is needed before clinical translation.", "authors": "Amit Das, Tanmay Shukla, Naofumi Tomita, Faraz Farhadi, Jessica Sin, Ari Hakimi, Chad Vanderbilt, Jie-Fu Chen, Ritesh Kotecha, Weijie Ma, Bing Ren, Saeed Hassanpour", "date": "2026-09-22", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.6091, "score_semantic": 0.6091, "score_lexical": 0.9665, "matched": ["histopathology"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.14.751548", "title": "Correlation-aware discovery of co-occurring mutational signatures in cancer", "abstract": "Somatic mutations in cancer genomes record the activities of diverse mutational processes. Mutational signature analysis has advanced mechanistic understanding of mutagenesis and informed clinical decision-making, yet existing methods assume independence among signatures--an unrealistic assumption that can produce composite or contaminated signatures, reduce detection power, and yield inconsistent results. Here we present Cornet (CORrelated NMF ExTraction), a framework for mutational signature discovery that explicitly models co-occurring processes and jointly infers signatures and their correlation structure. Benchmarking on simulated data shows Cornet more accurately recovers distinct signatures under strong correlations. Applied to cancer genomes, Cornet enables unsupervised discovery of the colibactin-associated signature SBS88 in oral cancers and identifies the tobacco smoking signature SBS4 in bladder cancer, where it was previously thought absent. Cornet also uncovers a novel mutational process implicated in early-onset colorectal cancer and a signature arising from the interplay between tobacco smoking and ERCC2-mutation-driven nucleotide-excision repair deficiency. Together, these results demonstrate that modeling correlations among mutational processes is essential for high-resolution signature discovery and dissecting the mutational etiology of human cancer.", "authors": "Jin, H.; Geiger, B.; Glodzik, D.; Gulhan, D. C.; Park, P. J.", "date": "2026-09-21", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.608, "score_semantic": 0.608, "score_lexical": 0.9187, "matched": ["cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.23.753948", "title": "Impact of Realistic 3D Tumor Microarchitecture on Cellular Dosimetry and Radiobiological Response in Targeted Radionuclide Therapy", "abstract": "Background: Patient-specific dosimetry in targeted radionuclide therapy (TRT) is increasingly supported by quantitative imaging; however, voxel-scale dose estimates cannot resolve cellular and subcellular heterogeneity present within tumor tissue. Conventional cellular dosimetry models often represent cells as regularly packed spheres, which may not capture realistic tumor microarchitecture. This study investigated how histopathology-informed three-dimensional (3D) tumor microarchitecture influences cellular absorbed-dose distributions, predicted radiobiological response, and treatment-related conclusions in TRT. Methods: Realistic 3D cellular tumor models were constructed from thick-section 3D cyclic immunofluorescence (3D CyCIF) imaging data. Monte Carlo radiation-transport simulations were performed for Lu-177, Pd-103, Tb-161 and Y-90, with activity localized in cancer-cell subcellular compartments and in non-cancer targets. Absorbed dose per total cluster decay was calculated individually for each cell nucleus and compared with corresponding simplified spherical tumor models. Cell survival fractions were estimated using the linear-quadratic model, and tumor control probability (TCP) was calculated from the individual cancer-cell survival probabilities. Results: Simplified model overestimated mean cancer-cell nuclear absorbed dose by 9.54% to 14.51% for nuclear localization and by 33.23% to 44.88% for cytoplasmic and membrane localization. In larger tissue models, simplified and realistic geometries produced comparable mean absorbed doses in several cases; however, the realistic models consistently generated broader cellular dose distributions, including low-dose cancer-cell subpopulations not captured by the simplified models. These dose-distribution differences propagated into wider survival-fraction distributions and altered TCP predictions. In the spatially heterogeneous tumor region, the realistic model required 1.11- to 1.33-fold higher activity to reach TCP90 for nuclear localization, and 1.49- to 5.93-fold higher activity for cytoplasmic and membrane localization. For similar tumor control, the radionuclide and source-localization combination associated with the greatest preservation of surrounding non-cancer cells differed between the simplified and realistic models. The intra-voxel analysis further showed that homogeneous voxel-scale activity assumptions can obscure biologically relevant microscopic dose heterogeneity. Conclusion: Native 3D tumor microarchitecture substantially influences cellular absorbed-dose distributions, predicted biological response, and treatment-related conclusions. Histopathology-informed 3D cellular models can be used as a complementary framework for characterizing cellular dose heterogeneity and may improve the evaluation of radionuclides and subcellular targeting strategies in heterogeneous tumor tissue.", "authors": "Peirispulle, T. A.; Ware, R.; Korevaar, S.; Hetti Mudiyanselage, P.; Thangarajah, J.; Tennakoon, R.", "date": "2026-09-24", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6062, "score_semantic": 0.6062, "score_lexical": 0.8153, "matched": ["histopathology", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.22.753531", "title": "A platform for deep topographic multiomic mapping of the bone marrow environment in multiple myeloma", "abstract": "Multiple myeloma is a genetically complex plasma cell malignancy in which profound intratumoral heterogeneity shapes disease progression and therapeutic resistance. Genomic subclones dynamically emerge and evolve under treatment pressure, yet their spatial organization within intact bone marrow remains poorly defined. We hypothesized that genetically distinct myeloma subclones occupy spatially discrete ecological niches associated with unique molecular and microenvironmental states. To test this, we here demonstrate a proof-of-concept spatial tri-omics workflow combining laser capture microdissection-based genomics and deep LC-MS/MS proteomics with single-cell spatial transcriptomics, integrated by digital co-registration of adjacent tissue sections. Applied to a myeloma bone marrow trephine, this approach enabled coordinated profiling of matched anatomical regions demonstrating that genomic, transcriptomic and proteomic profiles converged to define clone-specific microenvironmental programmes. We show that genetically distinct myeloma subclones occupy mutually exclusive regions of the same bone marrow biopsy. Remarkably, an aggressive del(17p) clone and a gain(12q) clone occupied defined anatomical territories within the same trephine-biopsied section, each clone exhibiting distinct genomic, transcriptomic, proteomic and cellular ecosystems. The del(17p) clone localized to a fibrotic, osteolytic and angiogenic niche enriched for activated stromal cells, osteoblasts, osteoclasts and immunoregulatory myeloid populations, whereas the gain(12q) clone occupied a comparatively quiescent marrow niche with limited stromal remodelling. Together, these findings demonstrate that genetically distinct myeloma subclones establish spatially and biologically discrete ecological niches through coordinated remodelling of stromal, immune and bone compartments, providing a framework for understanding clonal evolution within the bone marrow microenvironment.", "authors": "Lu, J.; Wang, C.-Y.; Davis, S.; Watson, E.; Jiang, C.; Baker, W.; Calcutt, E.; Gooding, S.; Hester, J.; Issa, F.; Benevent Bellver, P.; Lagana, A.; Bjorklund, C.; Napolitani, G.; Griffin, S.; Thakurta, A.; Ramasamy, K.; Sozanska, A.; Cooper, R.; Royston, D.; Athanasou, N.; Cribbs, A. P.; Fischer, R.; Oppermann, U.; Rao, S.", "date": "2026-09-23", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5927, "score_semantic": 0.5927, "score_lexical": 0.7104, "matched": ["clonal evolution", "genomics"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.09.18.26363369", "title": "Errors, Hallucinations, and Clinical Impact of General-Purpose Multimodal Large Language Models in Histopathology", "abstract": "BackgroundGeneral-purpose large language models (LLMs) are increasingly evaluated in diagnostic pathology, but prior studies have largely emphasized diagnostic accuracy rather than how models fail. We evaluated four LLMs for diagnostic performance, pathology-relevant errors and hallucinations, their burden, and potential clinical impact across multi-organ pathology cases.  DesignIn this retrospective multicenter study, 153 pathology cases from two institutions spanning 20 organs were evaluated using ChatGPT-5.3 (LLM1), Gemini 3 (LLM2), Grok 4.20 (LLM3), and Claude Opus 4.6 (LLM4). Each LLM received multi-magnification histologic images with clinical context and generated a microscopic description and diagnosis. No data splitting, training, or fine-tuning was performed. Twenty-one pathologists assessed 612 outputs for diagnostic correctness, error and hallucination type and burden, clinical impact (0-4), and overall performance (1-5).  ResultsStrict diagnostic accuracy was 48.9% overall (60.1% including partially correct diagnoses) and ranged from 36.6% to 58.2% across LLMs. Errors occurred in 82.0% of outputs and hallucinations in 76.6%; 90.2% contained at least one error or hallucination. Misinterpretation was the most frequent error (72.1%), while fabricated histologic features were the dominant hallucination type (74.5%). LLM2 had significantly lower misinterpretation rates than the other three LLMs, while LLM3 had significantly higher fabricated-feature hallucination rates than LLM1 and LLM2. Errors were more frequent in incorrect than correct diagnoses (97.5% vs 66.2%), as were hallucinations (95.1% vs 59.9%; both p < 0.001). Every strictly incorrect diagnosis contained an error and/or hallucination, while 79.9% of strictly correct diagnoses also contained at least one. In multivariable analysis, LLM3 was independently associated with higher odds of an incorrect diagnosis. Diagnostic correctness was the strongest determinant of high clinical impact; each one-point increase in hallucination burden increased the odds by 63% (adjusted OR, 1.63).  ConclusionDiagnostic accuracy alone substantially underestimates the safety limitations of general-purpose LLMs in histopathology. Errors and hallucinations were common even when the final diagnosis was correct, and their burden was independently associated with clinical impact. Evaluation frameworks should therefore assess both diagnostic correctness and the reliability and potential consequences of accompanying generated content.", "authors": "Lami, K.; Agarwal, S.; Asaturova, A.; Balci, S.; Harahap, A.; Kang, H.; Kim, J.; Komuta, M.; Laohawetwanit, T.; Menon, S.; Munkhdelger, J.; Pham, H. H. N.; Pinto, D. G.; Sahay, A.; Satturwar, S.; Seki, K.; Sughayer, M.; Tachibana, Y.; Turkmen, I.; Wu, Q.; Ullah, E.; Bychkov, A.; Fukuoka, J.", "date": "2026-09-24", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.5897, "score_semantic": 0.5897, "score_lexical": 0.7333, "matched": ["histopathology"]}, {"id": "https://www.medrxiv.org/content/10.1101/2025.06.30.25330543", "title": "Advancing sarcoma diagnostics with expanded DNA methylation-based classification", "abstract": "PurposeSarcomas pose a severe diagnostic challenge. A wide variety of these distinct entities need to be distinguished from each other and from less aggressive types of mesenchymal tumors, to ensure correct clinical management. A machine learning based classifier for sarcomas utilizing DNA methylation data from 1077 tumors recognizing 62 sarcoma types has already been developed and termed the sarcoma classifier, which we published in 2021. Here we present a major advancement of the scale and precision of the sarcoma classifier.  MethodsDNA methylation profiles and histologic data from an unprecedented multi-institutional cohort of mesenchymal tumors were collected and analyzed. Utilizing a machine learning approach, the classifier was rigorously validated through five-fold nested cross-validation, achieving a 98% class-level accuracy and a Brier score of 0.017, indicative of well-calibrated probability estimates.  ResultsThe sarcoma classifier v13.1 was developed based on a training set of 4377 methylation profiles from sarcomas and less aggressive mesenchymal tumors comprising 116 tumor sub-classes and 4 control groups forming 93 distinct methylation classes. Performance was validated using four independent cohorts, comprising a total of 1547 mesenchymal tumors. A methylation-based classifier prediction was obtained in 73% of cases in the validation sets, of which 91% matched the original histopathology diagnosis, thereby increasing diagnostic confidence. The classifier enabled a definitive molecular diagnosis or tumor reclassification in 6% of cases with inconclusive or ambiguous histological findings.  ConclusionAdding new sarcoma types and expanding tumor sample numbers in each methylation class in the new sarcoma classifier decisively increased the number of diagnostic predictions and improved match with histologic evaluation. This substantial advancement will promote clinical implementation of the tool for the diagnosis of mesenchymal tumor lesions.", "authors": "Jäger, N.; Reuss, D. E.; Sill, M.; Schrimpf, D.; Suwala, A. K.; Sievers, P.; Banan, R.; Hinz, F.; Rahmanzade, R.; Bogumil, H.; Aras, K. F.; Patel, A.; Korshunov, A.; Bewerunge-Hudler, M.; Cleven, A. H.; Esteller, M.; Glimm, H.; Hartmann, W.; Kreutzfeld, S.; Heilig, C.; Milde, T.; Petersen, I.; Vokuhl, C. M.; Wick, W.; Witt, O.; Kervarrec, T.; Miele, E.; Serrano, J.; Frank, S.; Kashofer, K.; Leer, A. M.; Pfaff, E.; Pages, M.; Tauziede-Espariat, A.; Toberer, F.; Boldt, H. B.; Martinek, P.; Brandner, S.; Euzebio, M.; Siegfried, A.; Chalker, J.; Harter, P.; Appay, R.; Dietmaier, W.; Hasselblatt, ", "date": "2026-09-24", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.5824, "score_semantic": 0.5824, "score_lexical": 0.5573, "matched": ["histopathology"]}, {"id": "http://arxiv.org/abs/2609.24524v1", "title": "Preoperative Prediction of Microvascular Invasion in Hepatocellular Carcinoma by Integrating Multimodal Ultrasound and Clinical Data: A Multicenter Study", "abstract": "Background: Microvascular invasion (MVI) predicts recurrence and survival in hepatocellular carcinoma (HCC) but requires postoperative histopathology for diagnosis. We developed and validated a model integrating multimodal ultrasound and clinical data for preoperative MVI prediction. Methods: This multicenter study included 489 patients with HCC from eight centers. All patients had B-mode ultrasound (BUS), color Doppler flow imaging (CDFI), dynamic contrast-enhanced ultrasound (DCE-US), and clinical information. Data from seven centers (n = 421) were used for model development with five-fold cross-validation; data from the remaining center (n = 68) formed an independent external validation cohort. The proposed multimodal information fusion network used modality-specific encoders, a hemodynamic temporal change module for bidirectional DCE-US perfusion changes, and a representation consistency learning module to align heterogeneous ultrasound representations before Transformer-based fusion. Results: In external validation, DCE-US achieved the highest single-modality area under the receiver operating characteristic curve (AUC; 0.8545+/-0.0198), versus clinical information (0.6715+/-0.0156), CDFI (0.6435+/-0.0344), and BUS (0.6087+/-0.0417). Pixel-difference sampling and the proposed temporal module outperformed alternative sampling and video representation methods. The full model achieved the best performance, with an AUC of 0.8953+/-0.0180, accuracy of 81.18%+/-2.83%, sensitivity of 86.40%+/-6.69%, and specificity of 78.14%+/-6.28. Conclusions: Integrating multimodal ultrasound and clinical information enabled promising preoperative MVI prediction in HCC. DCE-US was the main source of predictive information, while BUS, CDFI, and clinical information provided complementary value. The proposed framework may support preoperative risk stratification and individualized clinical decision-making.", "authors": "Jun Cheng, Yuanyuan Kong, Qing Huang, Xiaotong Tan, Licong Dong, Yulong Han, Wufeng Xue, Ruobing Huang, Dong Ni, Qi Yang, Jie Yu, Ping Liang", "date": "2026-09-21", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.5689, "score_semantic": 0.5689, "score_lexical": 0.561, "matched": ["histopathology"]}, {"id": "https://doi.org/10.1038/s44321-026-00519-0", "title": "Pharmacological inhibition of UBASH3B induces mitotic arrest and selectively reduces tumor growth.", "abstract": "Cancer cells tolerate mitotic errors to sustain proliferation, yet the molecular dependencies enabling this tolerance remain poorly understood and largely unexploited therapeutically. UBASH3B ensures mitotic fidelity by regulating Aurora B localization and is overexpressed in tumors. We investigated whether pharmacological disruption of this pathway exposes a mitotic dependency in cancer. We demonstrate that the UBASH3B 2HP domain represents a druggable interface for disrupting UBASH3B-dependent Aurora B regulation. We identify UBASHIN, a small-molecule inhibitor targeting this domain. UBASHIN phenocopies UBASH3B depletion, causing Aurora B mislocalization, mitotic arrest and mitotic cell death. UBASHIN impairs UBASH3B localization to the mitotic spindle and selectively inhibits cancer cell proliferation while sparing non-cancerous cells. UBASH3B protein levels and the cellular ability to sustain mitotic arrest, but not global aneuploidy, predict UBASHIN sensitivity, supporting a cancer-specific on-target mechanism. In colorectal and triple-negative breast cancer mouse models, UBASHIN reduces tumor volume comparably to docetaxel, without detectable toxicity in wild-type animals. These findings identify the UBASH3B pathway as a cancer-specific mitotic vulnerability and highlight its pharmacological inhibition as a selective therapeutic strategy.", "authors": "Pangou E, Awal S, Meode M, Kleiss C, Cloarec M, Grandgirard E, Vivot K, Guerber L, Krupina K, Jerabkova-Roda K, Costa PJD, Alpy F, Martinet A, Lodi M, Cousido-Siah A, Wendling O, Hany R, Riché S, Daubeuf F, Gizzi P, Villa P, Nominé Y, Tomasetto C, Bonnet D, Sumara I", "date": "2026-Sep-22", "source": "PubMed", "journal": "EMBO molecular medicine", "if": 11.0, "score": 0.5673, "score_semantic": 0.5673, "score_lexical": 0.917, "matched": ["aneuploidy", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.01.08.698349", "title": "Lung-mimicking click alginate-dECM model of breast cancer lung metastasis reveals the role of ECM mechanics in tumor growth dynamics and genomic instability", "abstract": "Metastatic breast cancer (BC) is the main cause of cancer-related death in women. Accumulating evidence highlights the prominent changes within the lung metastatic niche, resulting in stiffening of the extracellular matrix (ECM). The prevailing concept of cancer evolution encompasses the acquisition of beneficial traits due to genomic instability, yet it remains elusive to what extend altered lung ECM mechanics feed into this. To investigate this, a tunable 3D bioengineered model, capturing the biophysical and biochemical characteristics of the BC metastatic lung niche is developed. Porcine derived lung decellularized ECM (dECM), combined with norbornene and tetrazine modified click-crosslinkable alginate, recapitulates composition and mechanics of healthy soft (3 kPa) and metastatic stiff (12 kPa) lung niches. Proof-of-concept evaluation using label-free optical microscopy revealed preferential ECM fiber orientation in human lung metastatic tissue and in stiff hydrogels. Encapsulation of MDA-MB-231, MCF7 and patient-derived triple negative BC cells demonstrated that stiffer matrices were associated with DNA damage, indicated by yH2AX and altered Lamin A/C. Pharmacological perturbation of FAK mediated mechanotransduction reversed this phenotype in stiff conditions. These findings underscore the critical role of tissue mechanics in regulating BC metastasis and demonstrate the utility of the herein developed tunable, physiologically relevant platform for patient-based models.", "authors": "Fallert, L.; Urigoitia-Asua, A.; Pardo-Sanchez, J. M.; Batiz, E. A.; Zubizarreta Susperregui, R. M.; Jimenez de Aberasturi, D.; Cipitria, A.", "date": "2026-09-27", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.565, "score_semantic": 0.565, "score_lexical": 1.0, "matched": ["tumor evolution", "genomic instability", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.17.752335", "title": "Scalable Computational Phenomics of Nuclear Morphology", "abstract": "Interpretable computational pathology is constrained by a trade-off between scalable learned representations and biologically explicit phenotypes. Here we present NucXplore, a nuclear phenomics framework that converts each hematoxylin-and-eosin (H&E)-stained nucleus into 129 explicitly defined features spanning morphology, chromatin, intensity, texture, color, and spatial context. A Rust-based implementation accelerates extraction 17.6-fold over the Python reference implementation. Across three histopathology cohorts, NucXplore outperformed classical descriptors and larger deep-learning embeddings while retaining feature attribution. Applied to human skin, hierarchical multiple-instance models resolved eight cellular compartments and decoded age and sun-exposure states, revealing a largely shared aging program with age and cell-specific exposure-dependent recalibration. Conditional flow matching and neural ODE integration transformed cross-sectional phenotypes into model-implied trajectories, uncovering a midlife velocity minimum, late-life re-acceleration, and cell-specific changes in trajectory magnitude and direction. Source-free domain adaptation enabled preliminary transfer of age-associated predictions to an independent hospital cohort. NucXplore thus unifies interpretable representation, high-performance computing, and dynamical modeling for cellular phenotyping from routine histology.", "authors": "Duari, S.; Shome, R.; Raza, A.; Solanki, S.; Satija, S.; Sinha, S.; Kumar, S.; Chauhan, S.; Sharma, A.; Gautam, V.; Gupta, M.; Sengupta, D.; Ahuja, G.", "date": "2026-09-23", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5562, "score_semantic": 0.5562, "score_lexical": 0.6733, "matched": ["histopathology"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.04.10.717785", "title": "Multi-Stain Fusion of Histopathology Images Using Deep Learning for Pediatric Brain Tumor Classification", "abstract": "The classification of pediatric brain tumors is investigated using deep learning on hematoxylin and eosin (H&E) and antigen Ki-67 (Ki-67) whole slide images (WSIs) from the Children's Brain Tumor Network (CBTN) dataset. A total of 1,662 unregistered WSIs (1,047 H&E and 615 Ki-67 images) were analyzed, including low-grade glioma/astrocytoma (grades 1, 2) (LGG), high-grade glioma/astrocytoma (grades 3, 4) (HGG), medulloblastoma (MB), ependymoma (EP) and ganglioglioma. The The aim of this study was to effectively classify pediatric brain tumors using H&E and Ki-67 WSIs individually, and to investigate whether early, intermediate, and late fusion could improve the predictive performance. From each WSI, 224x224 pixel patches were extracted, and the instance (patch)-level features were obtained using the histology foundation model CONCHv1_5. The instances were aggregated using clustering-constrained attention multiple instance learning (CLAM) for patient-level classification. Model interpretability and explainability was assessed through attention heatmaps, cell density and Ki-67 labelling index (LI) maps. In the binary grade classification between LGG and HGG, the intermediate concatenation fusion achieved the best performance with a balanced accuracy of 0.88 {+/-} 0.05, (p <0.005) compared to the single-stain models (H&E: 0.84 {+/-} 0.05, Ki-67: 0.86 {+/-} 0.05). For the 5-class tumor type classification, the one-hidden layer late fusion learning model achieved the highest balanced accuracy of 0.83 {+/-} 0.04 (p < 0.005), outperforming the single-stain models (H&E: 0.77 {+/-} 0.05, Ki-67: 0.74 {+/-} 0.05). Overall, most of the fusion approaches outperformed the single-stain models in both classification tasks (p < 0.005). The Ki-67 attention maps demonstrated moderate to strong Spearman correlation ( {rho} = 0.576-0.823) with the cell density and Ki-67 LI maps, suggesting that these features are associated with the model's predictions, although additional features may contribute. The results show that H&E and Ki-67 images provide complementary information, and most of the multi-stain fusion approaches using deep learning improve pediatric brain tumor diagnosis.", "authors": "Spyretos, C.; Tampu, I. E.; Nyman, P.; Shamikh, A.; Lindblad, J.; Haj-Hosseini, N.", "date": "2026-09-23", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5525, "score_semantic": 0.5525, "score_lexical": 0.4964, "matched": ["histopathology"]}, {"id": "http://arxiv.org/abs/2609.24057v1", "title": "Representation-guided in-context learning for medical image interpretation with multimodal large language models", "abstract": "Medical image interpretation is central to diagnosis and care, yet adapting general-purpose multimodal large language models (MLLMs) often requires resource-intensive domain-specific fine-tuning. Here we introduce representation-guided in-context learning (RG-ICL), a training-free inference framework that retrieves query-aligned demonstrations using frozen encoders, without task-specific parameter updates. Across eight datasets spanning histopathology, radiology and retinal fundoscopy, RG-ICL improved classification (mean gain 20 percentage points) and visual question answering (VQA) (mean gain 13 percentage points) over no-context and conventional ICL, approaching or exceeding training-based comparators. Which cases were retrieved mattered more than how many: 6 query-aligned cases outperformed up to 32 randomly selected ones, whereas fixed or random cases often reduced accuracy below baseline. For VQA, aligning reference cases with both image content and question intent produced further gains. These findings indicate that for medical image interpretation, curating which reference cases an MLLM sees is a practical alternative to retraining it.", "authors": "Minda Zhao, Fangyu Hu, Yan Luo, Yutong Yang, Jiahui Cai, Kaichen Zhou, Manling Li, Paul Liang, Yilun Du, Lucy Q. Shen, Mengyu Wang", "date": "2026-09-21", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.5205, "score_semantic": 0.5205, "score_lexical": 0.6871, "matched": ["histopathology"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.21.753357", "title": "Integrative analysis of the MDM2 promoter switch and cellular lineage plasticity in colorectal cancer: a contrast between the autonomous-proliferation type (CIN/CMS2) and the environment-adaptive type (MSI/gastric metaplasia)", "abstract": "Background: Biomarkers that stratify colorectal cancer (CRC) by therapeutic responsiveness and are measurable directly in biopsy specimens remain insufficiently established. We investigated whether usage of the dual MDM2 promoters (P1/P2) acts as a molecular switch separating two diametrically opposed CRC phenotypes: a chromosomal instability type and an environment adaptive type (microsatellite instability/serrated pathway with gastric metaplasia). Methods: Sixty three organoid samples from 22 patients with CRC were classified morphologically by deep learning (VGG16) and molecularly by an MDM2 Splicing Index derived from expression arrays. The P1 and P2 signatures (gene sets characterizing P1 and P2dominant samples) were externally validated in TCGA-COAD/READ (n = 624) and GSE39582 (n = 536), 1,160 cases in total, and therapeutic implications were tested in public cell line panels (GDSC2, DepMap) and in 65 lines of an independent patient derived CRC organoid biobank. Results: Deep learning morphological classification reached 98.5% test accuracy (64/65), and morphology corresponded to P1/P2 isoform usage: Type1 (compact glandular) morphology predominated in P1 dominant samples (median Type1 fraction 0.826 versus 0.444) and non Type1 (cystic mucinous) morphology in P2 dominant samples (AUC 0.79). Both signatures differed across the four consensus molecular subtypes , and the P2 signature was higher in mismatch repair deficient (microsatellite-unstable) tumors. Promoter usage quantified directly (P2_index) was higher in TP53 wild type tumors , consistent with P2 being p53-inducible. TP53 wild type cell lines were more sensitive to the MDM2 inhibitor Nutlin 3a and were more dependent on MDM2 in the DepMap CRISPR screen ; among 198 GDSC2 drugs, Nutlin 3a correlated most strongly with the P2 score. In the independent biobank, TP53 wild type lines (17) were more sensitive to nutlin-3 than mutant lines (48) (median log(IC50) 1.386 versus 4.283). Conclusions: MDM2 promoter choice (P1/P2) co-varies with the lineage identity of cancer cells and with the secretory, mucin rich character of the tumor tissue, consistent with a molecular-switch role alongside p53 suppression. The MDM2 P1/P2 ratio, measurable by RT qPCR or targeted NGS, is a candidate molecular-classification and therapeutic-stratification biomarker corresponding robustly to CMS, MSI, and TP53 mutation status.", "authors": "Tsukui, T.; Tsuda, K.; Yao, R.; Shin, K.", "date": "2026-09-26", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5151, "score_semantic": 0.5151, "score_lexical": 1.0, "matched": ["chromosomal instability", "CIN", "cancer"]}, {"id": "http://arxiv.org/abs/2609.31028v1", "title": "Refining Cytology Predictions with Conditional Random Fields", "abstract": "Vision-language models (VLMs) achieve strong zero-shot (ZS) classification on histology images but do not perform as well on cytology, whose stains and cell morphology differ markedly compared to histology. Conditional random fields (CRFs) can refine noisy VLM predictions by propagating information across patches, but existing CRF frameworks were designed for histopathology and do not transfer to cytology datasets, released as independent patch pools spanning multiple staining protocols. We introduce CytoCRF, which adapts the pairwise terms to cytology by targeting chromatin and cytology-specific staining, and further enrich the neighborhood of each potential term by combining multiple backbones. Across ten cytology datasets, CytoCRF outperforms existing CRF frameworks at every annotation budget, reaching +13.6 percentage points over the best baseline and +33.7 over ZS with only 50 annotations. Combining information from multiple backbones brings further gains, showing that the neighborhood topology matters more than the pairwise potential computed over it.", "authors": "Manon Dausort, Tiffanie Godelaine, Karim El Khoury, Maxime Zanella, Christophe De Vleeschouwer, Benoît Macq", "date": "2026-09-25", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.5135, "score_semantic": 0.5135, "score_lexical": 0.7103, "matched": ["histopathology"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.21.753295", "title": "Chromosomal breakage in Arabidopsis thaliana neo-polyploids occurs preferentially at candidate fragile sites colocalized with ancient genome rearrangements", "abstract": "Newly formed polyploids often suffer extensive aneuploidy and chromosome rearrangement. We explored whether these are predictable and conserved across genotypes. We quantified whole-chromosome and segmental aneuploidy in progeny arrays of neo-polyploid Arabidopsis thaliana from two accessions (Col-0 and Ler). 29% of progeny had whole-chromosome and/or segmental aneuploidies. Strikingly, segmental aneuploidy arose exclusively from Ler, preferentially maternally, showing that genotype and sex of origin matter. Breakpoints of segmental aneuploidies were non-random, with over 2/3 mapping to five potentially fragile regions (PFRs). Two PFRs overlap with junctions of ancient chromosomal fusions that differentiate the A. thaliana genome from that of its relatives and also overlap more broadly with hotspots of recurrent chromosomal rearrangements differentiating species in the Brassicaceae family. Several PFRs overlap with large tandemly repeated disease resistance gene clusters. Our results support the hypothesis of a link between ancestral genome rearrangements and present-day chromosome fragility. Polyploidy serving as a context that makes aneuploidies more likely to arise and survive, with fragile sites lending a degree of predictability.", "authors": "Srikant, T.; Tan, H. S.; Bomblies, K.; Gonzalo, A.", "date": "2026-09-26", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5132, "score_semantic": 0.5132, "score_lexical": 1.0, "matched": ["aneuploidy"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.09.16.26363199", "title": "Intense TP53 pathway selection drives clonal evolution from bone marrow failure to leukemia in ERCC6L2 disease", "abstract": "ERCC6L2 disease (ED) is an inherited bone marrow failure (BMF) syndrome that progresses almost exclusively to erythroid, TP53-mutated myeloid malignancy, but the somatic evolution underlying the progression in patients is unknown. We characterized the genetic landscape of 29 ED patients with longitudinal sampling, integrating whole-genome and single-cell RNA sequencing, and compared the findings with Shwachman-Diamond syndrome (SDS), another TP53 mutation-prone disease, to define somatic evolution across disease stages. ED was defined by early, intense, and recurrent selection of TP53-mutant clones: TP53 mutations were more frequent, more often multiple, and showed steeper age-related expansion than in SDS; all TP53-negative ED patients were children. The burden of multiple TP53 mutations exceeded that of sporadic TP53-mutated myeloid neoplasia and was evident before malignancy. Missense mutations dominated the BMF phase, whereas non-missense mutations were seen in patients with malignancy, consistent with biallelic second hits, marking a stage-dependent shift in p53 inactivation. Beyond TP53, the landscape was strikingly restricted, with PPM1D as the only recurrent driver gene. Notably, despite the DNA-repair function of ERCC6L2, no ED-specific mutational signature emerged; but instead reflected age-associated processes. Malignant progression was accompanied by a complex karyotype, recurrent chromosome 5, 7, and 12p losses enriched in erythroid progenitors, and kataegis, consistent with branched, erythroid-predominant clonal evolution. Our findings establish ED as a paradigm of preleukemic dependency on p53-pathway attenuation. As progression is driven predominantly by p53 and captured longitudinally from the earliest clones, ED offers a model of how TP53-mutated leukemia arises and evolves, with relevance beyond a rare syndrome.", "authors": "Douglas, S.; Kaaja, I.; Ikonen, I.; Langohr, L.; Koski, J.; Hakkarainen, M.; Katainen, L.; Barbany, G.; Hellström-Lindberg, E.; Jahnukainen, K.; Kakko, S.; Siitonen, T.; Niinimäki, R.; Pitkänen, E.; Wartiovaara-Kautto, U.; Kilpivaara, O.", "date": "2026-09-22", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.5119, "score_semantic": 0.5119, "score_lexical": 1.0, "matched": ["clonal evolution"]}, {"id": "http://arxiv.org/abs/2609.27710v1", "title": "FFM-CP: Cross-Backbone Fusion of Vision-Language Foundation Models for Few-Shot Computational Pathology", "abstract": "Pathology vision-language foundation models vary in performance across diseases and tasks, with no single model consistently performing best. The high cost of expert pathology annotation can also limit the labeled data available for task-specific adaptation. Combining complementary pretrained representations is a potential approach to these limitations, yet learning an effective fusion from few labeled examples remains challenging. We introduce Few-shot Fusion Foundation Models of Computational Pathology (FFM-CP), which is a framework that combines multiple pathology vision-language models in the few-shot learning setting. The framework first aligns heterogeneous representations using a closed-form Orthogonal Procrustes transformation estimated from corresponding support images. This alignment preserves within-model feature geometry without training an additional alignment network. Within the aligned space, a unified graph enables information exchange across backbones by jointly refining support-image features and visual and textual class prototypes. These refined representations support complementary text-prototype and case-retrieval branches that capture semantic class knowledge and within-class visual variation, respectively. Each branch learns to combine predictions from all ordered backbone pairs, allowing queries encoded by one model to draw on evidence represented by another. We evaluate three backbone combinations on six histopathology datasets at 4, 8, and 16 shots per class. FFM-CP achieves higher mean macro-F1 than the strongest individually adapted member of each fused set in 50 of 54 comparisons. These findings suggest that combining complementary pretrained representations can improve histopathological classification when annotations are limited.", "authors": "Anh-Tien Nguyen, Trung DQ. Dang, Nghiem Tuong Diep, Bui Ngoc Han Nguyen, Tan-Ha Mai, Miriam Cindy Maurer, Phuong Hoa Nguyen, Thi Thuy Uyen Nguyen, Youngjun Park, Daniel Sonntag, Duy Minh Ho Nguyen, Anne-Christin Hauschild", "date": "2026-09-23", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.5039, "score_semantic": 0.5039, "score_lexical": 0.5864, "matched": ["histopathology"]}, {"id": "http://arxiv.org/abs/2609.30985v1", "title": "Predicting Mutational Signature Exposures from H&E Whole Slide Images: A Pan-Cancer Feasibility Study", "abstract": "Mutational signatures reveal cancer-driving processes with clinical relevance: MMR-deficient tumors respond better to immunotherapy, HRD tumors are sensitive to PARP inhibitors, and POLE-mutant tumors often have high mutation burdens influencing treatment response. Yet signature profiling remains limited by the cost, complexity, and turnaround time of whole-genome sequencing (WGS) or whole-exome sequencing. Histopathology is widely available and cost-effective, and H&E morphology has been linked to MSI, HRD, POLE-related processes, and driver mutations. Whether histology can recover the broader landscape of mutational signature exposures in a pan-cancer setting remains unknown. Here we introduce Hist2Sig, a deep learning framework predicting exposures to 30 COSMIC SBS signatures from H&E-stained slides. Trained on matched WGS and histology data from 7,063 TCGA patients across 29 cancer types, Hist2Sig was compared with a tumor type-only baseline to separate morphology-derived signal from tissue-of-origin priors. In internal cross-validation, it recovered relative signature compositions across most tumor types and achieved higher mean top-three overlap than the baseline in 19 of 29, with the largest gains in COAD, PRAD, GBM, and UCEC. It also recurrently recovered signatures of poorly characterized etiology, including SBS8, SBS12, SBS39, and SBS40a. In an external CPTAC cohort of 193 patients across five tumor types, Hist2Sig retained moderate concordance with observed compositions and outperformed the baseline in glioblastoma and pancreatic adenocarcinoma. These results support the feasibility of inferring mutational signature exposures from routine histology, while highlighting variation across tumor types. Hist2Sig provides a foundation for tumor-specific models that could complement sequencing in pre-sequencing triage or support decisions where WGS is unavailable.", "authors": "Flavio Sartori, Cesare Rollo, Isabella Caranzano, Tiziana Sanavia, Piero Fariselli, Corrado Pancotti", "date": "2026-09-25", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.4974, "score_semantic": 0.4974, "score_lexical": 0.7827, "matched": ["histopathology", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.14.751577", "title": "Improving Data Quality, Model Transparency and Performance in Lung Histopathology with Explainable AI", "abstract": "Convolutional neural networks (CNNs) have shown strong capabilities for image analysis. However, deploying these models in medical settings is complicated by their limited transparency. Over recent years, many approaches have been developed to overcome the so-called \"black box\" problem of deep neural networks. Here, we show how such explainable AI (XAI) approaches can be applied to not only improve transparency but also training data quality and model performance, with classification of lung damage in histopathology images as use case. First, we conducted a thorough exploratory data analysis and visually compared the compressed multi-dimensional representations of the histology images from the last CNN layers with labels given by pathologists to reveal flaws in the training data. Second, we used Gradient-based Class Activation Mapping (Grad-CAM) as well as SHapley Additive exPlanations (SHAP) values to identify image regions that significantly contributed to the model decisions. To overcome identified shortcomings, we then finetuned additional top layers of the CNNs and introduced model architectures with attention which improved model performance. In summary, we developed a practical workflow that uses interpretability analyses to examine model perception, assess label consistency, and guide model refinement on the example of lung histopathology scoring, demonstrating how XAI approaches can increase both transparency and model performance. The code for this paper is shared at https://github.com/Aitslab/Histology_XAI.git.", "authors": "Rashed, S. K.; Nilsson, M.; Aits, S.", "date": "2026-09-21", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.493, "score_semantic": 0.493, "score_lexical": 1.0, "matched": ["histopathology"]}, {"id": "http://arxiv.org/abs/2609.28590v1", "title": "TAM-Chain: Multi-Scale Thyroid Cytology Classification via Absorbing Markov Chains and Shannon Entropy Uncertainty Quantification for False-Negative Suppression and Domain-Shift Adaptation", "abstract": "Background & Problem: Thyroid Fine-Needle Aspiration Biopsy (FNAB) cytology based on the Bethesda System plays a pivotal role in early thyroid cancer detection; however, deep learning approaches face substantial challenges regarding high false-negative rates and overconfidence under clinical domain shift.   Methods: In this study, we propose TAM-Chain, a multi-scale (10x, 20x, 40x) thyroid cytology classification framework leveraging Absorbing Markov Chain theory combined with Shannon Entropy-based Uncertainty Quantification. The framework dynamically models multi-magnification feature extraction as an absorbing stochastic process, enabling optimal stopping criteria and a human-in-the-loop referral mechanism to strictly suppress critical diagnostic errors.   Results: Extensive evaluation on an internal test set (N = 235) demonstrates a Macro F1 score of 0.9741 with an absolute False-Negative Rate (FNR) of 0.00%. On an independent external validation set (N = 1015) presenting severe domain shift, TAM-Chain maintains superior stability and classification performance (Macro F1 = 0.7026) by adaptively adjusting the expected stopping step and triggering specialist referrals, significantly outperforming single-magnification baselines.   Conclusion: The TAM-Chain framework proves to be a highly effective, safe, and adaptable solution for digital pathology workflows, successfully harmonizing automated diagnostic efficiency with stringent biological safety.", "authors": "Hai Pham Ngoc", "date": "2026-09-23", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.4871, "score_semantic": 0.4871, "score_lexical": 1.0, "matched": ["digital pathology", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.09.15.26362492", "title": "A Causal Multi-modal AI Model Stratifies Residual Risk and Identifies Candidates for Treatment Escalation in Node-Positive HR+/HER2- Early Breast Cancer", "abstract": "PURPOSEPrognostic biomarkers that estimate residual recurrence risk after standard adjuvant therapy to guide further treatment escalation are an unmet clinical need. This study used Ataraxis Breast CTX, a causal multi-modal AI model integrating clinical variables and histopathology, to stratify residual risk in clinically defined high-risk patients. We aimed to identify patients who have excellent outcomes on standard-of-care chemoendocrine therapy and patients who may benefit from additional therapies such as everolimus or CDK4/6 inhibitors.  METHODSCTX combines clinical variables with image features from H&E images to produce estimates of recurrence risk (CTX-prognostic) and chemotherapy benefit (CTX-benefit). Prospective-retrospective validation was performed in the phase III UNIRAD trial to assess CTX-prognostics performance in the subset of patients who had not received neoadjuvant chemotherapy, who had received adjuvant chemotherapy, and who had H&E slides available (n = 556). The primary endpoint in this study was disease-free survival (DFS). As an exploratory analysis, we evaluated CTX-benefits ability to predict benefit from adjuvant everolimus.  RESULTSCTX-prognostic effectively stratified patients into high- and low-risk groups. Across all patients, 5-year DFS was significantly higher in the low-risk group (93%) than in the high-risk group (80%). Additionally, treatment benefit from everolimus differed significantly by CTX-benefit score in an exploratory multivariable analysis adjusting for age, tumor size, nodal status, grade, and menopausal status (interaction p = 0.01).  CONCLUSIONCTX identified patients with good outcomes under chemoendocrine therapy alone and patients with residual risk who may benefit from treatment escalation. Additionally, CTX was found to be predictive of everolimus benefit. These results suggest that CTX may effectively stratify clinically high-risk HR+/HER2- patients by residual risk and may inform selection of adjuvant escalation strategies.", "authors": "Bachelot, T.; Chabaud, S.; Lemonnier, J.; Cottu, P. H.; Dalenc, F.; Howard, F. M.; Pusztai, L.; Tang, C.; Biswas, D.; Zeng, K.; Witowski, J.; Geras, K. J.; Andre, F.; Penault-Llorca, F. M.", "date": "2026-09-21", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.4857, "score_semantic": 0.4857, "score_lexical": 0.5368, "matched": ["histopathology", "cancer"]}, {"id": "http://arxiv.org/abs/2609.31150v1", "title": "FedHisto-PAST: Parameter-Efficient Stain-Aware Federated Learning for Cross-Site Lung Histopathology Classification", "abstract": "Cross-site lung histopathology classification must account for stain variation, non-IID client data, missing classes, and the cost of adapting large pathology encoders. This study evaluates FedHisto-PAST v2 for three-way classification of adenocarcinoma (ACA), Normal, and squamous cell carcinoma (SCC). FedHisto-PAST v2 combines a frozen HIBOU-B foundation model with parameter-efficient adaptation, stain-conditioned paired-view prediction and feature consistency, reliability-aware prototype learning, and adaptive federated aggregation. Experiments used a five-client, non-IID, raw-data-local simulation with fixed internal evaluation, client-level analysis, component ablations, communication accounting, and a development-influenced exploratory LungHist700 cohort. All principal methods achieved near- ceiling internal performance, which limited discrimination on the fixed split. On LungHist700, FedHisto- PAST v2 achieved a Macro-F1 of 0.728560 and a balanced accuracy of 0.730454. Higher recognition of Normal and SCC was accompanied by lower ACA recall, and calibration remained imperfect. Prediction-level consistency was the only component with a clearly supported independent contribution in the external ablation analysis. Feature consistency and prototype regularization showed no conclusive independent overall gains in Macro-F1. The framework updated 1.253841% of the model parameters. The results provide exploratory cross-dataset evidence for stain-aware, parameter-efficient federation; they do not establish formal privacy, patient-level independence, prospective deployment, or clinical validation.", "authors": "Muhammad Muhtasim Shahriar, M. M. Golam Hafiz, Saad Aloteibi, Mohammad Ali Moni", "date": "2026-09-25", "source": "arXiv", "journal": "preprint", "if": null, "score": 0.4808, "score_semantic": 0.4808, "score_lexical": 0.8654, "matched": ["histopathology"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.21.753385", "title": "GapDream: Active Synthetic Evidence Acquisition for Long-Tailed Medical Imaging", "abstract": "Synthetic medical data are commonly generated from manually chosen prompts, inverse frequency sampling, or fixed subgroup balancing rules. These strategies increase sample count but do not answer a more consequential question: which missing observations would most improve the current model? We introduce GAP DREAM, a closed-loop framework that treats a medical image generator as a queryable source of candidate evidence rather than an unlimited source of augmentation. At each round, GAP DREAM maps model failures into an evidence gap score that combines scarcity, predictive uncertainty, local representation density, and gradient novelty. A query policy translates high-value gaps into structured clinical requests, a modality specific generator proposes candidate imagetext pairs, and an independent selector retains only diagnostically consistent, diverse, non-duplicative candidates. The downstream model is then updated and the gap map recomputed. The central objective is therefore not image realism in isolation, but reduction of measurable evidence gaps under a fixed synthetic budget. Across a multi-modality protocol spanning long-tailed chest radiography, dermoscopy, clinical dermatology, and histopathology, GAPDREAM reaches stronger held-out real-data performance with substantially fewer generated samples than random,class-balanced, uncertainty-only, and static targeted augmentation. Results show gains in CXRLT tail mAP, HAM10000 macroAUROC, Came lyon17 out-of-domain accuracy, and worst group dermatology accuracy while reducing redundant synthetic samples. GAPDREAM reframes medical generation as active evidence acquisition: generate the examples the learner needs, not simply more examples of what is rare.", "authors": "Chen, J.; Chen, W.", "date": "2026-09-23", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4681, "score_semantic": 0.4681, "score_lexical": 0.5958, "matched": ["histopathology"]}, {"id": "https://doi.org/10.1038/s41467-026-76928-z", "title": "TTC33 forms a complex with WDR61 and PHF5A to recruit factors relevant to genomic integrity.", "abstract": "The functions of many human proteins remain unknown, highlighting major gaps in our understanding of cellular biology. TTC33 is an evolutionarily conserved tetratricopeptide repeat (TPR) protein expressed across human tissues, whose molecular role is not defined. Here we identify the TTC33 partners using comparative label-free mass spectrometry. The TTC33-associated network (TAN) comprises WDR61, CCDC97, UNG1/2, PP2A-B55α, PHF5A, and components of the SF3B U2 spliceosomal complex. Using a combination of biochemical assays, structural modeling and molecular dynamics we show that TTC33 directly recruits WDR61 and PHF5A to assemble into a trimeric core complex (TANC), which then forms distinct interactions with either UNG1/2 or SF3B-CCDC97. Somatic TTC33 mutations at key TANC interface residues reduce complex stability and weaken the interaction network. We further show that WDR61 stabilizes TTC33 by protecting it from proteolytic degradation. Loss of network components induces genomic instability and activates DNA damage markers, including γH2AX and p53 phosphorylation.", "authors": "Tomecki R, Drabko M, Siek M, Matykiewicz M, Ludwinek M, Borowski ŁS, Jurkiewicz A, Kobyłecki K, Jabłońska A, Cysewski D, Malinowska A, Bakun M, Płoski R, Szczęsny RJ, Tudek A", "date": "2026-Aug-21", "source": "PubMed", "journal": "Nature communications", "if": 14.7, "score": 0.4525, "score_semantic": 0.4525, "score_lexical": 0.8021, "matched": ["genomic instability"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.09.18.752756", "title": "Passenger co-deletion confounds glutaminolysis signatures anchored on PTEN loss: a cautionary case for location-aware signature design", "abstract": "PTEN-deficient tumors are widely assumed to be glutamine-dependent, a view that has helped motivate the clinical development of glutaminase inhibitors. Whether glutaminolytic transcription scales with PTEN copy-number loss in human tumors, and by what mechanism, has not been established. We classified TCGA PanCancer Atlas tumors by GISTIC copy number as PTEN intact, hemizygous, or homozygous deletion, and scored a five-gene glutaminolysis signature (GLS, SLC1A5, GOT1, GLUD1, GPT2) against loss severity across fourteen tumor types, testing MYC mediation and chromosome-10 co-deletion as alternative mechanisms, with GLS dependence assessed in DepMap CRISPR data. The signature decreased with PTEN loss in all fourteen types, significantly in twelve, but was not MYC-mediated. The decline tracked chromosomal position rather than pathway membership: GLUD1 and GOT1 flank PTEN on 10q, and thirty-seven neighboring genes carrying no glutaminolysis annotation tracked PTEN copy number just as closely (mean rho 0.843 compared with 0.842), with co-deletion fidelity falling monotonically with distance from PTEN (rho = -0.993). Adjustment for genome-wide aneuploidy left the association intact, whereas conditioning on each gene's own copy number abolished it for the chromosome-10 genes and left the others unchanged. In a natural experiment contrasting PTEN point-mutant, copy-neutral tumors with copy-neutral wild-type tumors, GLUD1 was lower in the mutant group when all cohorts were pooled (P = 1.0 x 10^-8), an effect attributable to endometrial carcinoma, the one lineage in which mutation alone lowered GLUD1; excluding that lineage in a post hoc sensitivity analysis left no detectable difference (P = 0.22, equivalence P = 0.015), whereas hemizygous and homozygous deletion lowered GLUD1 dose-dependently in every analysis. GLS dependence did not differ across dosage tiers. Prostate carcinoma was the sole departure in the negative direction, its off-chromosome-10 decline surviving adjustment for tumor purity, stage, ERG status and proliferation, opposite in direction to the signaling prediction; breast and stomach showed small positive associations. The inverse PTEN-glutaminolysis relationship in this transcript signature is therefore explained predominantly by passenger co-deletion rather than by a P
