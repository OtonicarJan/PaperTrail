androgen independence in a patient-specific magnitude set by the broader expression background. This provides a model-based route from genomic data at diagnosis to personalized prediction of ADT resistance risk. Together, these findings establish that CRPC emergence is an emergent property of the intrinsic-extrinsic coupling, that neither molecular nor spatial analyses in isolation can predict clinical trajectories, and that mechanistic integration of both is required for accurate patient stratification.", "authors": "Kemkar, S.; Tao, M.; Ghosh, A.; Ramamurthy, A.; Radhakrishnan, R.", "date": "2026-07-17", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.623, "score_semantic": 0.623, "score_lexical": 0.5771, "matched": ["cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.07.16.738931", "title": "Retrotransposon Activity in Chronic Lymphocytic Leukemia: Associations with RNA Splicing and TP53 Dysfunction", "abstract": "Retroelements (RE), particularly autonomous Long Interspersed Element-1 (LINE-1), function as potent drivers of genomic instability in various malignancies. While normally silenced by epigenetic mechanisms, their reactivation in cancer cells can drive tumor evolution. TP53 is known to repress LINE-1 transcription; however, the consequences of TP53 dysfunction on retrotransposition and transcriptional activity in chronic lymphocytic leukemia (CLL) remain unknown. To investigate the relationship between TP53 status, LINE-1 retrotranspositional potential, and transcriptomic alterations, we utilized a multi-omics approach, combining a highly sensitive NGS protocol for detecting novel LINE-1 insertions with transcriptomic profiling of transposable elements and protein-coding genes. We applied these methods to a cohort of CLL patients stratified by the presence or absence of TP53 clonal evolution and to CLL-derived cell lines MEC1 and HG3, including CRISPR/Cas9-engineered TP53 mutants. Genomic analysis revealed no evidence of widespread somatic retrotransposition, suggesting that CLL exhibits resistance against de novo LINE-1 insertions. Conversely, transcriptomic profiling uncovered distinct transposon expression signatures aligned with patterns of TP53 mutation status evolution. Notably, differentially expressed genes were significantly enriched in the RNA splicing pathway, indicating that while LINE-1 elements remain largely constrained at the genomic level, their transcriptomic activity may influence cellular rewiring, affecting patterns of TP53 mutation clonal evolution. Based on these results, we argue that the pathogenic contribution of retroelements in CLL lies in transcriptomic dysregulation and splicing alterations, rather than in direct DNA damage caused by LINE-1 insertions.", "authors": "Volakhava, A.; Pavlova, S.; Radova, L.; Tausova, K.; Svozilova, H.; Zenatova, M.; Doubek, M.; Mamedov, I.; Pospisilova, S.; Plevova, K.", "date": "2026-07-17", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.621, "score_semantic": 0.621, "score_lexical": 0.8323, "matched": ["tumor evolution", "clonal evolution", "genomic instability", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.07.13.26357987", "title": "From amplicon to antigen: a quantified transmission map that nominates multi-antigen antibody-drug-conjugate co-target sets across cancer types", "abstract": "Somatic copy-number amplification is pervasive in cancer, and the genes it carries are candidate drug targets--but only those whose amplification is transmitted to accessible surface protein can be reached by an antibody-drug conjugate (ADC). We build an integrated map of copy-number-to-protein transmission across six tumour types and ask, for every amplified gene, whether its dosage reaches the surface. Copy number transmits to mRNA (median per-gene r = 0.21) but is attenuated at the protein level in 85% of genes, and the mRNA ranking is largely preserved to protein ({rho} = 0.70); the ranking is set principally at the chromatin/transcription step--among directly measured regulatory inputs, promoter DNA methylation and tumour chromatin accessibility each explain about an order of magnitude more of the transmission variance than gene structure, and do so complementarily. Critically, transmissibility is a stable, gene-intrinsic property: it is predictable from gene properties alone, with no proteomic input, at a leave-gene-out rank correlation of 0.52 (R2 = 0.29); it is not positional (holding out whole chromosome arms changes accuracy by 0.001); and it transfers across lineages (Kendall W = 0.97 across leave-one-lineage-out refits). This licenses a predictor that nominates surface targets in cancer types that lack a tissue-referenced proteome, combining direct protein measurement where it is available with prediction where it is not. Requiring co-elevation on a recurrent amplicon with measured transmissibility and an accessible extracellular ectodomain nominates 22 surface antigens on 18 distinct recurrent amplicons across four cancer types (renal, endometrial and both lung subtypes)--for example ITGB8+TSPAN13+TTYH3 on lung 7p, NCSTN+HSD17B7+MPZL1 on 1q (recurrent in several types), the transferrin receptor TFRC on squamous 3q, and FZD1 on clear-cell renal 7q; 21 of the 22 are non-driver passengers and 10 are confirmed on the experimental Cell Surface Protein Atlas. In single malignant cells, against a null that controls for per-cell sequencing depth, the co-detected constructs sit at a modest 1.05-1.45x above independence (p < 0.001, donor-block bootstrap intervals clear of 1.0), and at binding-relevant thresholds the normal-tissue co-expression collapses--so an avidity AND-gate that binds stably only where the antigens co-occur would spare normal cells that carry only one. Observed transmissibility itself transfers strongly between the two lung subtypes ({rho} = 0.88) and remains positive across distant lineages, consistent with the shared cell-of-origin regulation the map implies. Single-cell co-detection is demonstrated wherever a malignant single-cell atlas exists (both lung subtypes and glioblastoma -- the latter entirely from prediction, using no GBM surface-abundance measurement); the remaining cohorts are nominated on the same genetic and topological evidence. The result is a pan-cancer, confidence-tiered catalogue of multi-antigen ADC co-target sets with a concrete plan to test them.", "authors": "Lam, J. M.; Walker-Samuel, S.; Pennycuick, A.", "date": "2026-07-16", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.6092, "score_semantic": 0.6092, "score_lexical": 0.7298, "matched": ["cancer"]}, {"id": "https://doi.org/10.1038/s41467-026-75021-9", "title": "Oncogene inactivation-induced senescence facilitates tumor relapse.", "abstract": "Oncogene-directed therapies can induce profound tumor regression in oncogene-addicted cancers, but their long-term benefit is often limited by resistance and relapse. Here we show that oncogene inactivation rapidly induces senescence and a pro-inflammatory senescence-associated secretory phenotype (SASP). In vivo, oncogene inactivation-induced senescence (OIIS) predisposes tumors to relapse, accompanied by polyploidy, chromosomal instability, acquisition of alternative oncogenic pathways including mouse double minute 2 homolog (Mdm2) upregulation, and tumor microenvironmental remodeling toward neovascularization and immunosuppression. Spectral flow cytometry reveals a shift from an immune-activated to an immunosuppressive milieu during relapse. OIIS features are also observed in human BRAFV600E melanoma cells treated with vemurafenib, supporting clinical relevance. Together, our findings establish OIIS as a double-edged process: it initially restrains tumor growth but simultaneously creates conditions that favor recurrence. By defining the genetic, metabolic and microenvironmental hallmarks of OIIS, our study highlights adaptations to oncogene deprivation that limit the durability of targeted therapies.", "authors": "Schmitt P, Hönig K, Norcia MT, Nogueira MF, Flore V, Vesperinas IS, Villoro-Agud M, Peng L, Safyürek Z, Tariq M, Milojkovic A, Anders K, Schröck E, Sauer S, Uyar B, Akalin A, Willimsky G, Haas S, Martínez-Reyes I, Blankenstein T", "date": "2026-Jul-15", "source": "PubMed", "journal": "Nature communications", "if": 14.7, "score": 0.6084, "score_semantic": 0.6084, "score_lexical": 1.0, "matched": ["chromosomal instability"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.07.06.736651", "title": "LeafRank: A phylodynamic framework for inferring relative fitness from single-cell phylogenies in chromosomally unstable tumors", "abstract": "Tumors contain cancer cells with diverse growth potentials that shape evolutionary trajectories, yet this fitness diversity remains difficult to quantify in cases of whole-genome duplication (WGD) and chromosomal instability. We present LeafRank, a mathematical framework that leverages single-cell DNA-seq phylogenies to infer the relative fitness of individual cells. Using a multi-type branching process model, LeafRank integrates full tree topology, including branch lengths and bifurcation patterns, to estimate marginal fitness probabilities under punctuated evolutionary regimes driven by rare driver events. To account for elevated aberration rates following WGD, we introduce a tree-rescaling strategy that adjusts for lineage-specific genomic instability. Unlike methods focused on predefined subclones, LeafRank ranks all sampled cells, enabling flexible assessment of growth heterogeneity. Simulations demonstrate high accuracy across spatial and non-spatial virtual tumors. Applied to ovarian cancer, LeafRank reveals directional and parallel selection in WGD tumors and identifies recurrent copy number events enriched in high-fitness lineages. WGD lineages do not show immediate growth advantages but acquire fitness through subsequent alterations.", "authors": "Wu, C.; Leder, K.; Wang, Z.; Sun, R.", "date": "2026-07-18", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.6056, "score_semantic": 0.6056, "score_lexical": 0.9578, "matched": ["chromosomal instability", "genomic instability", "cancer"]}, {"id": "https://doi.org/10.1038/s41375-026-03043-9", "title": "DNA methylation signatures distinguish extranodal NK/T-cell lymphoma and EBV-positive nodal T/NK-cell lymphoma and identify prognostic subgroups.", "abstract": "Extranodal NK/T-cell lymphoma (ENKTL) and primary Epstein-Barr virus (EBV)-positive nodal T/NK-cell lymphoma (nodal-TNKL) are aggressive lymphomas with overlapping clinicopathologic features but distinct underlying biology. While their genomic landscapes have been increasingly defined, comparative epigenetic characterization remains limited. We performed methylated DNA immunoprecipitation sequencing (MeDIP-seq) on formalin-fixed paraffin-embedded samples from ENKTL, nodal-TNKL, ENKTL cell lines, and control tissues. ENKTL displayed extensive promoter hypermethylation associated with repression of tumor suppressor genes, lineage regulators, and lymphoid signaling genes, including LEF1 and BANK1, together with focal hypomethylation of immune- and interferon-responsive genes such as IFITM1. In contrast, nodal-TNKL showed global hypomethylation, particularly affecting cytotoxicity, immune-response, and antigen-presentation pathways; TET2-mutated nodal-TNKL cases exhibited locus-specific methylation changes. Across all samples, global DNA methylation levels correlated with genomic instability. Unsupervised clustering identified two epigenetically distinct ENKTL subgroups, one characterized by higher global methylation, TP53 loss, increased copy number alterations and loss of heterozygosity and significantly poorer overall survival. Together, this study defines fundamental epigenetic differences between ENKTL and nodal-TNKL and links DNA methylation dynamics to genomic instability and clinical outcome, highlighting the value of methylation profiling for refined classification, risk stratification and therapeutic guidance.", "authors": "Phyu T, Leong SM, Chen S, Gu W, Fischer A, Sun QY, Yang H, Syn NL, Deng L, Low LCY, Chuang SS, Kato S, Khoury JD, Ko YH, Ban KHK, Poon L, Quintanilla-Martinez L, Siebert R, Ding LW, Ng SB", "date": "2026-Oct", "source": "PubMed", "journal": "Leukemia", "if": 12.8, "score": 0.6024, "score_semantic": 0.6024, "score_lexical": 0.8197, "matched": ["genomic instability"]}, {"id": "https://doi.org/10.1186/s12943-026-02699-2", "title": "Mutation-specific dynamics of dedifferentiation trajectories and tumor-stromal interactions in thyroid cancer.", "abstract": "Progression from differentiated thyroid cancer to anaplastic thyroid cancer (ATC) involves profound epithelial plasticity and remodeling of the tumor microenvironment (TME), but how BRAFV600E and RAS driver mutations shape these processes remains unclear. Here, we integrated single-nucleus RNA-seq, spatial transcriptomics, and bulk RNA-seq across BRAFV600E- and RAS-driven thyroid tumors to delineate mutation-specific progression trajectories. BRAFV600E-driven tumors exhibited a gradual dedifferentiation trajectory with immune pathway activation, whereas RAS-driven tumors displayed abrupt transitions characterized by aneuploidy, epithelial-mesenchymal transition, hypoxia, and extracellular matrix remodeling. Cancer-associated fibroblasts (CAFs) emerged as key regulators, with mutation-specific ligand-receptor interactions: integrin-based signaling predominated in BRAFV600E-mutant ATCs, while PLAU-PLAUR, TNFSF10-TNFRSF10B, and AREG-EGFR were additionally enriched in RAS-driven ATCs. These CAF-epithelial circuits were spatially validated and associated with poor prognosis. Together, our findings reveal mutation-dependent epithelial and TME dynamics associated with thyroid cancer dedifferentiation and highlight the potential importance of molecular-tailored approaches in the management of advanced thyroid cancer.", "authors": "Joo EH, Song YS, Lee HS, Jung G, Chung EJ, Kim SJ, Kim YH, Cho SW, Choi H, Won JK, Park WY, Park YJ", "date": "2026-Jul-16", "source": "PubMed", "journal": "Molecular cancer", "if": 27.7, "score": 0.5975, "score_semantic": 0.5975, "score_lexical": 0.914, "matched": ["aneuploidy", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.02.18.26346396", "title": "Genomic characterization of upper urinary tract urothelial carcinoma and clonal evolution of intravesical recurrences", "abstract": "Background and ObjectivePatients with upper urinary tract urothelial carcinoma (UTUC) undergoing radical surgery are at high risk of developing intravesical recurrences (IVR). Molecular correlates of IVR after UTUC surgery are poorly understood, while therapeutic targets for UTUC and diagnostic markers for IVR are lacking. To address these needs, we investigated the genomic landscape of UTUC and paired IVR samples.  MethodsWe performed targeted DNA-sequencing of 571 genes in a multi-institutional international cohort of 414 UTUC patients who received radical surgery. Clonality and evolution were assessed in 79 UTUC paired with 104 IVR.  Key Findings and LimitationsThe mutually exclusive mutational profile of 414 UTUC samples revealed five genomic subtypes with distinct clinicopathological and molecular characteristics, and potential vulnerabilities to targeted therapy. Surgical intervention, specifically diagnostic ureteroscopy, showed a stronger association with IVR than genomic subtypes or individual genes. Clonal evolution occurred in 92% of UTUC-IVR cases via four evolutionary paths with mutations in FGFR3, HRAS and the TERT promoter as potential markers for surveillance after surgery. Limitations include cohort heterogeneity and the selected gene-targeted sequencing approach.  Conclusions and Clinical ImplicationsOur findings resolve the genomic heterogeneity of UTUC and its clonal relationship with IVR, providing a framework for molecularly guided surveillance and targeted therapeutic strategies for UTUC.", "authors": "Nakauma-Gonzalez, J. A.; Bahlinger, V.; van Doeveren, T.; van de Werken, H. J. G.; Helleman, J.; Pasanisi, J.; Masliah-Planchon, J.; Bieche, I.; Wilhelm, T.; van Leenders, G. J. L. H.; Lara, M. F.; Porcel-Pastrana, F.; Gomez-Gomez, E.; Luque, R. M.; Garcia-Morales, L.; Eckstein, M.; Stöhr, R.; Sikic, D.; Garcia Munoz, I.; Prieto Cuadra, J. D.; Lozano, M. J.; Alvarez, M.; Matas-Rico, E.; Hartmann, A.; Herrera-Imbroda, B.; Allory, Y.; Boormans, J. L.", "date": "2026-07-15", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.5965, "score_semantic": 0.5965, "score_lexical": 1.0, "matched": ["clonal evolution"]}, {"id": "https://doi.org/10.1038/s41587-026-03184-3", "title": "Multiscale in vivo imaging of tumor evolution using a germline conditional triple-reporter mouse.", "abstract": "Imaging reporter genes are essential tools in cancer research for monitoring tumor evolution, cell dissemination, gene activation and treatment response. However, germline reporter models typically rely on single imaging modalities operating over limited spatial scales. To address these limitations, we developed an inducible triple-reporter mouse model (Rosa26LSL-NRL) that integrates three reporters for complementary imaging modalities, fluorescence, bioluminescence and positron emission tomography (PET), along with inducible Cre-lox functionality for precise spatiotemporal control of reporter expression in genetically engineered mouse models. Using a multiscale, multimodal approach, we visualize deep tissue oncogenesis in models of hepatocellular carcinoma and lung adenocarcinoma and, guided by whole-body imaging with bioluminescence and [18F]tetrafluoroborate PET/magnetic resonance imaging (MRI), resolve cell-cell interactions within tumor microenvironments using in situ microscopy. This triple-reporter system enables multiscale investigation of biological processes within whole animals, facilitating sensitive, tissue-specific, in vivo cell tracking from whole-body to cellular resolution.", "authors": "Raffo-Iraolagoitia XL, Alyamani A, May S, Stevenson D, Mackintosh A, McGarry L, Anand J, Soloviev D, Brown G, Nixon C, Kapeni C, De La Roche M, Blyth K, Bird TG, Strathdee D, Lyons SK, Fruhwirth G, Carlin LM, Lewis DY", "date": "2026-Jul-15", "source": "PubMed", "journal": "Nature biotechnology", "if": 33.1, "score": 0.5962, "score_semantic": 0.5962, "score_lexical": 0.9957, "matched": ["tumor evolution", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.07.04.736459", "title": "Thematic Shifts in Early-High-Impact Cancer Genomics and Diagnostics Research: A Bibliometric and Semantic Analysis", "abstract": "Cancer genomics and diagnostics is a rapidly evolving field in which identifying which topics attract early citation prominence can inform laboratory investment, clinical translation, and research strategy. We developed a bibliometric framework to identify and characterize the most influential recent publications in this domain across two consecutive annual cohorts. Using a mathematically exact threshold-expansion algorithm, we ranked over 10,000 OpenAlex-indexed research articles per cohort by 18-month post-publication citation count. Large language model (LLM)-based topical relevance filtering yielded 50 substantively on-topic papers per cohort (100 total). LLM-based concept extraction and a two-stage, embedding-guided normalization pipeline produced 1,090 canonical concepts organized into 77 parent themes, enabling structured cross-cohort comparison of paper-level concept prevalence. The most cited papers in both cohorts were large-scale genomic infrastructure resources rather than single-disease mechanistic studies. Between consecutive cohorts, normalized frequencies increased most for clonal evolution and intratumoral heterogeneity, single-cell and spatial omics technologies, spatial transcriptomics, immune cell infiltration, and copy number variation, while liquid biopsy and ctDNA-related themes showed the largest declines. These findings indicate that early citation impact in cancer genomics is shifting toward integrative, spatially resolved, and heterogeneity-aware research, and demonstrate that LLM-augmented citation ranking provides a replicable, semantically enriched lens for monitoring thematic evolution in precision oncology. A web interface for exploring the results is available at https://pri.pepkio.com/.", "authors": "Su, Z.; Li, T.", "date": "2026-07-18", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5922, "score_semantic": 0.5922, "score_lexical": 0.9368, "matched": ["clonal evolution", "genomics", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.07.09.737559", "title": "Prototype-based AI triage for 3D pathology", "abstract": "Non-destructive 3D pathology enables high-resolution slide-free imaging of intact clinical specimens, providing comprehensive visualization of tissue structures beyond what conventional slide-based 2D histopathology can provide. However, the scale and complexity of volumetric datasets make exhaustive manual review impractical, motivating AI-assisted triage methods to select a small number of high-risk 2D slices for pathologist review. While prior triage models have shown promise, interpretability is poor and performance can be suboptimal, especially in the nascent field of 3D pathology in which labeled data is limited. We present SCOPE, a Segmentation-guided CrOss-slice PrototypE learning framework for comprehensive risk assessment of 2D levels within 3D pathology datasets. SCOPE combines (i) clustering-based pretraining on large-scale unlabeled volumetric data to initialize morphology-aware prototypes, (ii) segmentation-derived structural priors from publicly available models to guide proto-type learning, and (iii) cross-slice (2.5D) prototype aggregation across neighboring slices to generate slice-level risk predictions. In prostate and esophageal data cohorts, SCOPE consistently outperforms attention-based and prototype-based multiple instance learning baselines for both binary and multiclass prediction tasks, enabling depth-resolved risk profiling for 3D triage based on morphological prototypes that are interpretable to pathologists.", "authors": "Yan, R.; Gao, G.; Song, A. H.; Hsieh, H.-C.; Zhao, Y.; Almagro-Perez, C.; Brenes, D.; Chow, S. S. L.; Shen, J.; Reddi, D. M.; True, L. D.; Lal, P.; Madabhushi, A.; Mahmood, F.; Liu, J. T. C.", "date": "2026-07-15", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5833, "score_semantic": 0.5833, "score_lexical": 1.0, "matched": ["histopathology"]}, {"id": "https://doi.org/10.1038/s41467-026-75172-9", "title": "Long-read sequencing of single cell-derived melanoma sublines reveals divergent and parallel genomic and epigenomic evolutionary trajectories.", "abstract": "Tumor evolution is driven by various mutational processes, ranging from single-nucleotide variants (SNVs) to large structural variants (SVs) to dynamic shifts in DNA methylation. Current short-read sequencing methods struggle to accurately capture the full spectrum of these genomic and epigenomic alterations due to inherent technical limitations. To overcome that, here we introduce an approach to identify and analyze the genomic and epigenetic events in different stages of tumoral evolution from long-read sequencing of single-cell derived sublines. We then use it to profile 23 sublines of a mouse cutaneous melanoma cell line, characterized with distinct growth phenotypes and treatment responses. We develop a computational framework for harmonization and joint analysis of different variant types in the evolutionary context. Uniquely, our framework enables detection of recurrent amplifications of putative driver genes, generated by independent SVs across different lineages, suggesting parallel evolution. In addition, our approach revealed gradual and lineage-specific methylation changes associated with aggressive clonal phenotypes. We also show our set of phylogeny-constrained variant calls along with openly released sequencing data can be a valuable resource for the development and benchmarking of computational methods.", "authors": "Liu Y, Goretsky A, Keskus AG, Malikic S, Ahmad T, Gertz EM, Rashidi Mehrabadi F, Kelly M, Hernandez MO, Seibert C, Caravaca JM, Kline K, Zhao Y, Wu Y, Shrestha B, Tran B, Ghosh A, Cui X, Sassano A, Malik L, Baker B, Blauwendraat C, Billingsley KJ, Burkett S, Perez-Guijarro E, Merlino G, Molloy EK, Sahinalp SC, Day CP, Kolmogorov M", "date": "2026-Jul-16", "source": "PubMed", "journal": "Nature communications", "if": 14.7, "score": 0.5707, "score_semantic": 0.5707, "score_lexical": 0.6874, "matched": ["tumor evolution", "clonal evolution"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.07.19.739401", "title": "Genome-wide mapping of persistent long-range correlation in the complete telomere-to-telomere human reference genome", "abstract": "Long-range correlations (LRCs) in DNA sequences have been reported for decades, but their interpretation has been limited by incomplete representation of repetitive and structurally complex regions in earlier human genome assemblies. Here, we use the complete telomere-to-telomere (T2T) human reference genome to systematically map LRC structure across all human chromosomes. Most chromosomes exhibited persistent long-range dependence (LRD), with chromosome-specific scaling intervals spanning kilobase to megabase scales and wavelet Hurst exponents consistently above the uncorrelated expectation of 0.5. Spatially resolved Hurst landscapes revealed that this signal is not uniformly distributed along chromosomes, but instead reflects a heterogeneous genomic mosaic. For the purine-pyrimidine encoding, chromosomes 9, 15, X, and Y showed complex fluctuation profiles not adequately summarized by a single scaling exponent; multifractal detrended fluctuation analysis (MF-DFA) confirmed broad, q-dependent multiscaling consistent with multifractal behavior in these chromosomes, consistent with heterogeneous contributions from satellite-rich and structurally distinct sequence compartments. Surrogate analyses further showed that the observed correlations exceed expectations from base composition alone and are not fully explained by local sequence structure preserved in block-shuffled controls. However, short-memory Autoregressive Moving-Average (ARMA) surrogates reproduced the observed H range in a subset of chromosomes, indicating that the strength of evidence for LRD is chromosome-dependent. Together, these results demonstrate that LRC is a widespread but spatially heterogeneous property of the complete human genome. The T2T assembly reveals that previously unresolved repetitive and satellite-rich regions are strongly associated with chromosome-scale and local scaling variation, providing a framework for future studies of genome evolution, chromatin structure, recombination, structural variation, and genomic instability.", "authors": "Papatheodorou, K.; Megalovasilis, G.; Zaravinos, A.; Georgakopoulos-Soares, I.", "date": "2026-07-19", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5615, "score_semantic": 0.5615, "score_lexical": 0.5302, "matched": ["genomic instability"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.07.10.26357777", "title": "Multi-omic Profiling of Recurrence Risk Across Breast Cancer Subtypes", "abstract": "Recurrence risk greatly varies across intrinsic subtypes in breast cancer, yet the molecular and immune programs within primary tumors that go on to develop recurrence remains poorly understood. We performed multi-omic analysis of 340 breast cancer tumors across Basal-like, Luminal A, and Luminal B subtypes to identify tumor-intrinsic and microenvironmental features associated with recurrence. Within each intrinsic subtype, we compared recurrent and non-recurrent tumors across RNA, copy-number, and pathway-level mutational features. Basal-like tumors in patients who developed recurrence were characterized by reduced lymphocytes and pro-inflammatory M1 macrophages, enrichment of TGF-{beta}/EMT activity, copy number gains within 5p/7p/7q, 4q losses, and increased pathway tumor mutational burden (pTMB) in growth-factor, inflammatory, and motility-associated signaling pathways, each of which was associated with increased recurrence risk. In Luminal A tumors, recurrent cases showed higher lymphocytes and pro-inflammatory M1 macrophages, enrichment of metabolic, stress-response, and stemness/plasticity associated pathways, and higher pTMB in growth-factor, inflammatory, motility-associated, DNA repair and apoptosis signaling pathways all associated with recurrence risk. Among Luminal B tumors, recurrent cases were enriched for proliferation, genomic instability, DNA repair, and stress-response pathways, showed a prominent 1q copy number amplification, and exhibited increased pTMB in Hedgehog signaling which increased recurrence risk. Subtype-specific prediction models were developed to generate recurrence-risk scores and validated using an external cohort (METABRIC; 1,170 total cases). The performance of our recurrence risk scores in METABRIC were associated with recurrence free survival (RFS) across subtypes (Basal: HR=1.27, 95% CI [1.07-1.50], p=0.006, Luminal A: HR=1.18, 95% CI [1.06-1.31], p=0.002, Luminal B: HR=1.41, 95% CI [1.03-1.93], p=0.03). Together, these findings demonstrate that primary tumors in patients who develop recurrence harbor distinct subtype-specific biological programs detectable at diagnosis and support a subtype-informed multi-omic modeling as a framework for recurrence-risk stratification.", "authors": "Cruikshank, A. E.; Chandra, P.; Li, C. I.; Ha, G.", "date": "2026-07-14", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.5464, "score_semantic": 0.5464, "score_lexical": 0.6814, "matched": ["genomic instability", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.07.10.737822", "title": "An immunocompetent model of MCPyV-driven Merkel cell carcinoma reveals tumor evolution under immune selection", "abstract": "Merkel cell carcinoma (MCC) is a neuroendocrine skin tumor that is frequently driven by integration of Merkel cell polyomavirus (MCPyV). In MCC, the MCPyV genome is truncated, but expression of the viral tumor antigens, truncated large tumor antigen (LTT) and small tumor antigen (sT), is maintained and drives uncontrolled proliferation. We introduced constitutive expression of the MCPyV T antigens (TAs) into primary mouse dermal fibroblasts (MDFs) to determine whether these cells are susceptible to MCPyV-driven transformation. TA expression alone in MDFs induced key MCC markers, cytokeratin-20 (CK20) and Sry-box transcription factor 2 (SOX2), and promoted anchorage-independent growth indicative of cellular transformation. Subcutaneous implantation of TA-transformed fibroblasts produced high-grade MCC-like tumors that grew persistently in immunodeficient NSG mice but not in immunocompetent C57BL/6 mice. Serial in vivo passaging of the tumor cell line enhanced tumor growth, reduced expression of p53-target genes and MHC-1, and was accompanied by a shift in T antigen isoform expression, with decreased LTT and increased sT expression. Our data demonstrate that MCPyV-driven tumors acquire immune-evasive adaptions during tumor progression in vivo and suggest that the anti-tumor immune response exerts selective pressure in MCC that favors expression of sT rather than LTT. The model established in this study provides a unique platform for studying evolution of MCPyV-driven tumors under immune pressure and identifying mechanisms of immune evasion in MCC that could be used to develop new therapeutic strategies.  Significance StatementMCPyV tumor antigen expression transforms mouse dermal fibroblasts to generate MCC-like tumors. Serial in vivo passaging reveals tumor evolution under immune pressure, providing a model to study immune evasion mechanisms in MCC.", "authors": "Regan, J. M.; Li, X.; Salvacion, M.; Luo, T. T.; Jia, M.; Ho, G.; Xu, J. R.; Liu, S.; Huang, Z.; Xu, X.; You, J.", "date": "2026-07-13", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.5078, "score_semantic": 0.5078, "score_lexical": 1.0, "matched": ["tumor evolution"]}, {"id": "https://doi.org/10.3324/haematol.2026.300770", "title": "Enteropathy-associated T-cell lymphoma: molecular clonal evolution and its clinical consequences.", "abstract": "Refractory celiac disease (RCD) is a rare complication of celiac disease and bears a high risk for lifethreatening enteropathy-associated T-cell lymphoma (EATL). While RCD is generally considered a direct EATL precursor, supporting evidence is limited and the predictive value for EATL development of molecular aberrations in RCD as risk factors unclear. We aim to dissect the clonal evolution of RCD and EATL to support molecular diagnostics-based clinical decision making. RCD specimens of patients with (n=6) and without (n=21) development of EATL within 5 years after diagnosis, and EATL specimens (n=13) with their paired adjacent small cell lymphocytosis (ASCL) in the vicinity of the tumor were used for mutation and copy-number aberrations analysis using nextgeneration sequencing (NGS). In addition, NGS-based T-cell receptor (TR) clonotype analysis for 11 EATL/ASCL pairs was performed. Clonal evolutionary models were inferred and associations of genetic alterations in RCD to EATL risk assessed. Integrated TR gene rearrangement and mutation profiles for 10/11 EATL and ASCL sample pairs shows mixed clonally shared and independent T-cell populations. Only in 2/5 EATL/RCD pairs, a related precursor population was demonstrated. Genetic aberrations were observed in 19/27 duodenal RCD samples irrespective of progression to EATL and in both RCD1 and RCD2. EATL develops via parallel subclonal evolution and selection from a pool of locally residing jejunal Tcell populations with a restricted TR repertoire and a heterogeneous genetic makeup, but not necessarily from RCD populations in the duodenum. These findings provide leads for modifying current clinical decision-making for RCD and EATL patients.", "authors": "Ylstra B, Groenen PJTA, Los-de Vries T, Janssen J, Rouvroye M, Maertzdorf J, Egthuijsen J, Fu L, Luijks J, Bontkes HJ, Kim Y, Bouma G, De Jong D", "date": "2026-Jul-16", "source": "PubMed", "journal": "Haematologica", "if": 10.1, "score": 0.4701, "score_semantic": 0.4701, "score_lexical": 0.9501, "matched": ["tumor evolution", "clonal evolution"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.07.13.26357430", "title": "Integrated Plasma and Urinary Cell-free DNA Profiling Enables Noninvasive Molecular Detection from Ta to T4 Bladder Cancer", "abstract": "Background and ObjectiveDue to the heterogeneity of bladder cancer, minimally invasive molecular profiling may improve tumor characterization at the time of diagnosis. We evaluated whether integrated genomic and fragmentomic profiling of plasma and urinary circulating tumor DNA (ctDNA) detects BC-derived signals for diagnosis and disease stratification across all tumor stages.  MethodsIn this real-world cohort, 202 plasma and urine samples were obtained from 33 patients with non-muscle-invasive BC (NMIBC), mostly Ta tumors, and 15 patients with muscle-invasive BC (MIBC), as well as from 58 cancer-free controls. Low-coverage whole-genome sequencing was performed to assess ctDNA fragmentation, chromosomal instability and copy number variations. Matched tumor tissue was analyzed to evaluate concordance between liquid biopsy and tissue-derived molecular alterations.  Key Findings and LimitationsComplementary genomic and fragmentomic profiling of cfDNA achieved detection rates of 75.8% in NMIBC patients and 91.7% in MIBC patients with paired plasma and urine. Distinct differences were observed between MIBC, NMIBC and cancer-free controls, consistent with increasing ctDNA signals during disease progression. Tumor tissue analysis confirmed BC-associated molecular alterations. Limitations include the single-center design and limited sample size.  Conclusions and Clinical ImplicationsMultimodal profiling of plasma and urinary cfDNA enabled the detection of tumor-derived molecular signals for all bladder cancer stages, including early-stage disease. By integrating genomic and fragmentomic features, this minimally invasive approach provides molecular tumor characterization at the time of diagnosis and may support future risk-adapted diagnostic, therapeutic and surveillance strategies.  Advancing PracticeO_ST_ABSWhat does this study add?C_ST_ABSOur study demonstrates the potential of integrating multiple biomarkers from two liquid biopsy sources for minimally-invasive bladder cancer (BC) detection. This strategy enhances diagnostic sensitivity and addresses the limitations of single-analyte approaches, making it particularly relevant for future diagnostic and risk stratification in early stages, where circulating tumor-derived DNA levels are low. Multimodal liquid biopsy could serve as a valuable non-invasive method to guide clinical decisions, including additional diagnostics such as imaging and cystoscopy, as well as subsequent therapy management such as adjuvant therapy and follow-up.  Patient SummaryIn this study, we explored a liquid biopsy approach using blood and urine to detect bladder cancer and assess its aggressiveness. We found that combining different genomic and fragmentomic markers improved the identification of tumor signals, even in early-stage cases. In the future, such approaches could help doctors to better assess bladder cancer risk and to personalize treatment decisions.", "authors": "Riediger, A. L.; Schindler, I.; Heller, M.; Huber, J.; Sueltmann, H.; Goertz, M.", "date": "2026-07-15", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.4614, "score_semantic": 0.4614, "score_lexical": 0.8568, "matched": ["chromosomal instability", "genomic instability", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.07.10.737441", "title": "Aberrant expression of stress-related Hsrω-n lncRNA contributes to CGG repeat-mediated toxicity in a Drosophila model of FXTAS", "abstract": "Fragile X-associated tremor/ataxia syndrome (FXTAS) is an adult-onset neurodegenerative disease associated with carriers of premutation (PM) alleles of the fragile X messenger ribonucleoprotein 1 (FMR1) gene. Expanded CGG repeats in the PM alleles are sufficient to cause cellular stress and toxicity in animal and cellular models of FXTAS. Here, we show that in a Drosophila transgenic model of FXTAS, expanded CGG repeats result in the overexpression of heat shock RNA omega-nuclear (Hsr{omega}-n), a stress-related long non-coding RNA (lncRNA) that dominantly enhances expanded CGG-induced neurotoxicity, whereas its reduction suppresses CGG-induced neurotoxicity. Furthermore, overexpression of Hsr{omega}-n lncRNA concomitantly resulted in a significant enhancement in its association with Hrb87F, the fly ortholog of one of the previously identified CGG repeat RNA-binding proteins, hnRNP A2/B1, and with the imitation switch (ISWI) protein, a chromatin remodeling factor. We extended the findings of Hsr{omega}-n to show that the mammalian stress-related lncRNAs SatIII and Neat1 are elevated in cells expressing expanded CGG repeats. Together, these findings highlight the critical roles of stress-related lncRNAs in CGG repeat-mediated toxicity and support a model in which the total steady-state levels of stress-related lncRNAs increase in the presence of expanded CGG repeats as part of the normal regulatory response to combat stress. However, the effects of chronic expanded CGG repeat expression in post-mitotic neurons may result in altered distribution and/or sequestration of specific RNA-binding proteins or chromatin remodeling factors associated with stress-related lncRNAs. This could contribute to the altered cellular homeostasis and genomic instability associated with FXTAS.  SignificanceIndividuals carrying the FMR1 allele with expanded CGG repeats (55-200) in the 5' untranslated region are predisposed to fragile X-associated tremor/ataxia syndrome (FXTAS), a late-onset neurodegenerative disorder. FXTAS demonstrates incomplete penetrance, suggesting the possible involvement of genetic modifiers in its pathogenesis. We used a transgenic Drosophila FXTAS model to conduct genetic, molecular, and biochemical analyses. Our findings revealed that the expression of expanded CGG repeats aberrantly activates stress-related Hsr{omega}-n lncRNA in Drosophila melanogaster. Overexpression of this lncRNA exacerbates CGG-mediated neurodegeneration, whereas its repression alleviates this effect. Extending these findings to mammalian systems, we observed the upregulation of SATIII and Neat I, functional homologs of Hsr{omega}-n lncRNA, in cells expressing expanded CGG repeats. Collectively, these findings identify stress-related lncRNAs as key mediators of CGG-mediated toxicity and underscore their potential as therapeutic targets for FXTAS.", "authors": "Ahmed, N.; Reshi, M. M.; Yousuf, S.; Singh, A. K.; Jin, Y.; Jin, P.; Qurashi, A. A.", "date": "2026-07-16", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4513, "score_semantic": 0.4513, "score_lexical": 0.4285, "matched": ["genomic instability"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.07.15.738736", "title": "G4 DNA structures induced by UV radiation: a multi-omic approach", "abstract": "DNA G quadruplexes (G4s) are secondary structures with critical roles in regulating genome function. G4s in regulatory regions like promoters and enhancers are important for controlling gene expression, while aberrant formation of G4s has been linked to genomic instability and human disease. Despite G4s importance and inherent danger, their dynamic formation remains incompletely understood. Here, we show that ultraviolet (UV) radiation uniquely induces widespread and persistent G4 formation in human cells, distinguishing it from other genotoxins. Through integrated genomic, transcriptomic, and proteomic analyses, we uncovered key features and functions of UV-induced G4s. Proteomic profiling identified RCOR3 as a factor associated with specific UV-induced G4s at late time points. Functional studies revealed that RCOR3 is essential for the formation and persistence of these structures. Furthermore, genes associated with UV G4s that are differentially expressed are enriched in pathways related to response to UV radiation, highlighting their biological relevance. These findings define the multi-omic landscape of UV-induced G4s and reveal new mechanistic insights into the interplay between genotoxic stress responses and the regulation of non-canonical DNA structures.  GRAPHICAL ABSTRACT  O_FIG O_LINKSMALLFIG WIDTH=200 HEIGHT=80 SRC=\"FIGDIR/small/738736v1_ufig1.gif\" ALT=\"Figure 1\"> View larger version (19K): org.highwire.dtl.DTLVardef@8c2e32org.highwire.dtl.DTLVardef@12d1379org.highwire.dtl.DTLVardef@5971a3org.highwire.dtl.DTLVardef@33bcee_HPS_FORMAT_FIGEXP  M_FIG C_FIG", "authors": "Julio, L. R.; Turrieta Vejar, D. V.; Walborsky, C. H.; Salpukas, A.; Chee, E.; Murthy, J. C.; MacLeod, S. G.; Vandeuren, A. L.; Ferguson, M.; Muriph, R. E.; Evans, J. J.; Day, T. A.", "date": "2026-07-16", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4327, "score_semantic": 0.4327, "score_lexical": 0.5764, "matched": ["genomic instability"]}, {"id": "https://doi.org/10.1158/0008-5472.CAN-26-1818", "title": "PDE5a Inhibition Restricts Cancer Metastasis by Disrupting NPC1-Mediated Cholesterol Trafficking Through a Non-canonical cGMP-Dependent Pathway.", "abstract": "Non-canonical metabolic functions of signaling molecules contribute to cancer plasticity and metastatic progression. Here, we demonstrated that PDE5a inhibitors, including sildenafil (Viagra), induced lysosomal cholesterol accumulation across multiple mouse and human cancer models, reducing cholesterol bioavailability and impairing cancer cell migration and metastasis. Cancer cells exhibited heightened sensitivity due to reduced lysosomal gene expression, rendering them particularly vulnerable to disrupted cholesterol trafficking. Mechanistically, elevated cGMP bound the lysosomal cholesterol transporter NPC1, impairing cholesterol export and phenocopying Niemann-Pick type C pathology. The resulting cholesterol depletion disrupted membrane lipid rafts and mitochondrial bioenergetics, thereby limiting metastatic capacity and triggering compensatory SREBP2 activation with increased cholesterol synthesis. Combining sildenafil with statins yields additive antimetastatic effects by concurrently blocking lysosomal cholesterol export and cholesterol biosynthesis. Consistently, analysis of digital health records demonstrated significantly improved survival among sildenafil users, with a dose-dependent additive benefit observed when combined with statins. Together, these findings identify increasing cGMP levels through PDE5a inhibition as a potential strategy to restrict metastasis and offer a potential mechanistic basis for the beneficial effects of sildenafil.", "authors": "Ariav Y, Hayek S, Cantore T, Sanghvi N, Adler LN, Darzi N, Pal LR, Crawford DR, Malleron T, Silverbeck J, Yardeni E, Hajaj E, Ben-Zeev E, Sinha S, Ziman S, Shlomai A, Malitsky S, Itkin M, Levin-Zaidman S, Goliand I, Goldman O, Tishler H, Brandis A, Mehlman T, Kuznetsov Y, Kozer N, Shamash K, Itzhaki E, Ben-Chaim Moskovits N, Ranmar D, Stemmer SM, Ben-Shachar S, Ruppin E, Erez A", "date": "2026-Jul-14", "source": "PubMed", "journal": "Cancer research", "if": 11.2, "score": 0.4202, "score_semantic": 0.4202, "score_lexical": 1.0, "matched": ["digital pathology", "cancer"]}, {"id": "https://www.biorxiv.org/content/10.64898/2026.07.15.738694", "title": "Transposable elements shape olaparib response according to BRCA1 status in triple-negative breast cancer", "abstract": "BackgroundTriple-negative breast cancer (TNBC) is an aggressive subtype with limited therapeutic options. While PARP inhibitors, such as olaparib, show promise in BRCA1-deficient TNBC through synthetic lethality, up to 50% of patients fail to respond, highlighting the need to understand the molecular mechanisms underlying PARP inhibitors efficacy. Transposable elements (TEs), particularly LINE-1 elements, are increasingly recognized as modulators of genomic instability associated with DNA repair processes and potential key players in synthetic lethality. Here, we investigate the functional relationship between TE activity and olaparib treatment in TNBC with distinct BRCA1 functional status.  MethodsWe performed comprehensive multi-OMICs analysis of four TNBC cell lines (two BRCA1-deficient: SUM1315 and MDA-MB-436; two BRCA1-proficient: MDA-MB-468 and BT549) treated with olaparib. We analyzed expression and differential expression of protein-coding genes, TEs, and gene-TE chimeric transcripts. Long-read whole-genome sequencing was employed to detect de novo TE insertions, complemented by a functional assay to quantify LINE-1 retrotransposition activity in olaparib-treated cells.  ResultsOlaparib treatment induces extensive transcriptomic and genomic disorganization mediated by TEs, especially LINE-1, exclusively in BRCA1-deficient cells. We observed aberrant overexpression of both genes and TEs, including gene-TE chimeric transcripts harboring poison exons within tumorigenic genes and multi-exonic TE-TE chimeras capable of forming immunostimulatory double-stranded RNA (dsRNA) structures. Functional enrichment analyses revealed activation of antiviral immune pathways linked to LINE-1 activity. Consistently, orthogonal assays confirmed LINE-1 retrotransposition in BRCA1-deficient cells following olaparib exposure.  ConclusionsOur findings demonstrate that olaparib treatment induces TE activation especially in BRCA1-deficient cells, a novel mechanism that may underlie synthetic lethality in TNBC. This TE activation triggers immune responses and genomic instability, providing new therapeutic opportunities through immunotherapy combinations and suggesting that TE activity may serve as a potential biomarker for treatment stratification of TNBC.  Graphical Abstract  O_FIG O_LINKSMALLFIG WIDTH=200 HEIGHT=119 SRC=\"FIGDIR/small/738694v1_ufig1.gif\" ALT=\"Figure 1\"> View larger version (39K): org.highwire.dtl.DTLVardef@1cf6ecorg.highwire.dtl.DTLVardef@19725f7org.highwire.dtl.DTLVardef@3d9597org.highwire.dtl.DTLVardef@127f0bb_HPS_FORMAT_FIGEXP  M_FIG C_FIG", "authors": "Moreira Mombach, D.; Mendez-Dorantes, C.; Mercuri, R. L. V.; Schofield, P.; Soares Baal, S. C.; Poersch, M. A.; Burns, K. H.; Carvalho de Oliveira, J.; Loreto, E. L. S.; Galante, P. A. F.", "date": "2026-07-16", "source": "biorxiv", "journal": "preprint", "if": null, "score": 0.4187, "score_semantic": 0.4187, "score_lexical": 0.6985, "matched": ["genomic instability", "cancer"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.07.09.26357661", "title": "Aqueous Humor Liquid Biopsy Enables Multi-Omics Tumor Profiling and Methylation-Based Machine-Learning Stratification of Retinoblastoma", "abstract": "Primary tumor biopsy in retinoblastoma carries an unacceptable risk of extraocular dissemination. As a result, children treated with eye-sparing approaches currently lack access to tumor-derived genomic information at diagnosis, limiting accurate risk stratification, preventing subtype-guided therapy, and obscuring insight into tumor evolution during conservative treatment. Aqueous humor (AH) liquid biopsy has emerged as a promising window into circulating tumor DNA (ctDNA) from eyes managed conservatively, yet its ability to comprehensively capture the genomic and epigenomic landscape of retinoblastoma and to deliver clinically actionable molecular stratification has not been rigorously evaluated. We analyzed 18 matched AH-tumor pairs using genome-wide methylation profiling, copy-number analysis, and targeted sequencing. AH samples consistently contained high ctDNA fractions (median 0.65), enabling robust detection of single-nucleotide variants, canonical copy-number alterations, and methylation signatures defining established retinoblastoma subtypes. Importantly, promoter methylation patterns associated with RB1 inactivation and optic nerve invasion were confidently detected in AH, highlighting that liquid biopsy enables functional interrogation of disease-relevant genes and pathways. To enable biopsy-independent molecular classification, we developed a methylation-based machine learning classifier trained on combined AH and tumor datasets (n=114). The classifier demonstrated exceptional performance, with AUCs of 0.96-1.00 in cross-validation and 0.97-1.00 in independent validation across 63 additional retinoblastoma cases. Together, these findings position AH liquid biopsy as powerful, minimally invasive platform for comprehensive molecular profiling in retinoblastoma. This work establishes the first clinically viable non-invasive molecular stratification tool for the disease, enabling pretreatment risk assessment and paving the way for next-generation precision diagnostics in eye-preserving care.  One Sentence SummaryAqueous humor liquid biopsy enables accurate multi-omics profiling of retinoblastoma and minimally-invasive molecular risk stratification.", "authors": "Volz, S.; Montigel, S. H.; Ryl, T.; Afanasyeva, E.; Haag, D.; Reyes, P.; Mueller, J.; Puranachot, P.; Wedig, T.; Schwarz, N.; Mauermann, M.; Sadeghi Dehcheshmeh, I.; Sill, M.; Autry, R. J.; Sahm, F.; Biewald, E.; Ting, S.; Busch, M.; Jabbarli, L.; Kiefer, T.; Bechrakis, N.; Pfister, S. M.; Pajtler, K. W.; Ketteler, P.; Maass, K. K.", "date": "2026-07-13", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.4152, "score_semantic": 0.4152, "score_lexical": 0.5803, "matched": ["tumor evolution"]}, {"id": "https://www.medrxiv.org/content/10.64898/2026.07.14.26357715", "title": "Integrative analysis of circulating proteolytic biomarkers and genomic landscape in colorectal cancer", "abstract": "Colorectal cancer (CRC) is highly heterogeneous at both clinical and molecular levels, and the integration of circulating biomarkers with comprehensive genomic profiling remains limited. In this study, we measured circulating urokinase-type plasminogen activator (uPA) and its receptor (uPAR) in 53 patients with colorectal neoplasms and performed whole-genome sequencing (WGS) on matched tumor-normal pairs from 51 patients to characterize somatic mutations, copy number alterations (CNAs), tumor mutational burden (TMB), microsatellite instability (MSI), homologous recombination deficiency (HRD), and mutational signatures.  Circulating uPAR levels were significantly elevated in patients with CRC compared with healthy controls, showing a stepwise increase across tumor stages and reaching the highest levels in stage IV disease. In contrast, circulating uPA levels showed only a non-significant trend toward elevation and did not vary significantly by stage. Despite the strong association between uPAR and tumor progression, circulating uPA and uPAR levels were not significantly correlated with TMB, MSI, HRD scores, or the mutational status of major CRC driver genes, including TP53, KRAS, FBXW7, BRAF, NRAS, and PIK3CA. Genomic analysis revealed a heterogeneous mutational landscape dominated by TP53 and APC, with only a minority of tumors exhibiting high TMB or MSI. Mutational signatures were primarily clock-like (SBS1, SBS5), with minimal contribution from MMR- or HRD-related processes.  Together, these findings indicate that circulating uPAR is a robust marker of CRC progression that appears to operate largely independently of established genomic instability metrics. This supports uPAR potential utility in risk stratification and biological monitoring when integrated with molecular profiling.", "authors": "Pankratova, E. D.; Rubina, K. A.; Kakotkin, V. V.; Agapov, M. A.; Klimovich, P. S.; Sysoeva, V. Y.; Kashchenko, A.; Semina, E. V.", "date": "2026-07-14", "source": "medrxiv", "journal": "preprint", "if": null, "score": 0.4091, "score_semantic": 0.4091, "score_lexical": 0.7837, "matched": ["genomic instability", "cancer"]}], "reports": [{"date": "2026-10-05", "label": "Oct 05, 2026", "n": 32}, {"date": "2026-09-28", "label": "Sep 28, 2026", "n": 32}, {"date": "2026-09-21", "label": "Sep 21, 2026", "n": 24}, {"date": "2026-09-14", "label": "Sep 14, 2026", "n": 26}, {"date": "2026-09-07", "label": "Sep 07, 2026", "n": 34}, {"date": "2026-08-31", "label": "Aug 31, 2026", "n": 19}, {"date": "2026-08-24", "label": "Aug 24, 2026", "n": 24}, {"date": "2026-08-17", "label": "Aug 17, 2026", "n": 18}, {"date": "2026-08-10", "label": "Aug 10, 2026", "n": 34}, {"date": "2026-08-03", "label": "Aug 03, 2026", "n": 17}, {"date": "2026-07-27", "label": "Jul 27, 2026", "n": 24}, {"date": "2026-07-20", "label": "Jul 20, 2026", "n": 26}, {"date": "2026-06-26", "label": "Jun 26, 2026", "n": 14}, {"date": "2026-06-19", "label": "Jun 19, 2026", "n": 38}], "prefix": "", "home": "../papers.html"}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const papers = DATA.papers;
  const SHORT = 280;
  // Slider floor: the pipeline threshold, or lower if older data scored below it
  const FLOOR = Math.floor(Math.min(DATA.threshold, ...papers.map(p => p.score)) * 100) / 100;

  // ── Persistent per-browser state (stars / read), keyed by paper URL ──
  const store = {
    get(k, fallback) {
      try { const v = localStorage.getItem('papertrail:' + k); return v ? JSON.parse(v) : fallback; }
      catch { return fallback; }
    },
    set(k, v) {
      try { localStorage.setItem('papertrail:' + k, JSON.stringify(v)); } catch {}
    },
  };
  const starred = new Map(Object.entries(store.get('starred', {})));  // id -> paper snapshot
  const read    = new Set(store.get('read', []));
  const saveStars = () => store.set('starred', Object.fromEntries(starred));
  const saveRead  = () => store.set('read', [...read]);

  const prefs = store.get('prefs', {});
  const state = {
    q: '',
    view: 'all',
    sort: prefs.sort || 'score',
    min: FLOOR,
    sources: new Set(),
    keyword: null,
    expanded: new Set(),
    scope: 'week',        // 'week' = this report, 'all' = every archived week
    limit: 100,           // cards rendered before "Show more"
  };
  const PAGE = 100;

  // ── All-weeks index: loaded on demand from reports/search-index.js ──
  let ALL = null, loadingAll = false;
  function loadAll() {
    if (ALL || loadingAll) return;
    loadingAll = true;
    const s = document.createElement('script');
    s.src = (DATA.prefix || '') + 'search-index.js';
    s.onload = () => { ALL = window.PAPERTRAIL_INDEX || []; loadingAll = false; render(); };
    s.onerror = () => {
      loadingAll = false; state.scope = 'week'; render();
      $('count').textContent = 'Could not load the all-weeks index (reports/search-index.js).';
    };
    document.head.appendChild(s);
  }
  const pool = () => state.scope === 'all' && ALL ? ALL : papers;

  // ── Helpers ──
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const scoreVar = s => s >= 0.5 ? 'var(--high)' : s >= 0.35 ? 'var(--mid)' : 'var(--low)';
  const isPreprint = p => !p.journal || p.journal === 'preprint';
  const url = p => (p.id && !p.id.startsWith('http')) ? 'https://doi.org/' + p.id : p.id;
  // Dates come as "2026-09-02", "2026-Sep-02" (PubMed) or just "2026-Sep"
  const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const dateKey = d => {
    const m = /^(\d{4})(?:-(\w+))?(?:-(\d+))?/.exec(d || '');
    if (!m) return 0;
    const mon = m[2] ? (/^\d+$/.test(m[2]) ? +m[2] - 1 : MONTHS.indexOf(m[2].slice(0, 3).toLowerCase())) : 0;
    return Date.UTC(+m[1], Math.max(mon, 0), m[3] ? +m[3] : 1);
  };

  // Keyword highlighting: whole-token matches, longest first
  const kwRe = DATA.keywords.length
    ? new RegExp('\\b(' + [...DATA.keywords].sort((a, b) => b.length - a.length).map(reEsc).join('|') + ')\\b', 'gi')
    : null;
  function highlight(text) {
    const parts = [];
    const res = [kwRe];
    const q = state.q.trim();
    if (q.length >= 2) res.push(new RegExp('(' + q.split(/\s+/).map(reEsc).join('|') + ')', 'gi'));
    // Collect ranges from all regexes on raw text, then merge and escape
    const ranges = [];
    for (const re of res) {
      if (!re) continue;
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(text))) { if (!m[0]) { re.lastIndex++; continue; } ranges.push([m.index, m.index + m[0].length]); }
    }
    if (!ranges.length) return esc(text);
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [ranges[0].slice()];
    for (const r of ranges.slice(1)) {
      const last = merged[merged.length - 1];
      if (r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push(r.slice());
    }
    let i = 0;
    for (const [a, b] of merged) { parts.push(esc(text.slice(i, a)), '<mark>', esc(text.slice(a, b)), '</mark>'); i = b; }
    parts.push(esc(text.slice(i)));
    return parts.join('');
  }

  const hayCache = new WeakMap();
  const hay = p => {
    let h = hayCache.get(p);
    if (h === undefined) {
      h = [p.title, p.abstract, p.authors, p.journal, p.source].join(' ').toLowerCase();
      hayCache.set(p, h);
    }
    return h;
  };

  // ── Filtering ──
  function filtered() {
    const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    let list = state.view === 'starred'
      ? [...starred.values()]
      : pool();
    list = list.filter(p => {
      if (state.view !== 'starred' && p.score < state.min) return false;
      if (state.view === 'unread' && read.has(p.id)) return false;
      if (state.sources.size && !state.sources.has(p.source)) return false;
      if (state.keyword && !(p.matched || []).includes(state.keyword)) return false;
      if (terms.length) {
        const h = hay(p);
        if (!terms.every(t => h.includes(t))) return false;
      }
      return true;
    });
    const by = {
      score: (a, b) => b.score - a.score,
      date:  (a, b) => dateKey(b.date) - dateKey(a.date) || b.score - a.score,
      if:    (a, b) => (b.if ?? -1) - (a.if ?? -1) || b.score - a.score,
    }[state.sort];
    return [...list].sort(by);
  }

  // ── Rendering ──
  const ICON_STAR = '<svg viewBox="0 0 24 24" fill="FILL" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  // Link to the report(s) a paper appeared in, when not the one being viewed
  const LABELS = Object.fromEntries((DATA.reports || []).map(r => [r.date, r.label]));
  function weekTag(p) {
    const weeks = (p.weeks || []).filter(w => w !== DATA.date || state.scope === 'all');
    if (!weeks.length || (state.scope !== 'all' && state.view !== 'starred')) return '';
    const [w, ...rest] = weeks;
    const label = w === DATA.date ? 'This week' : 'Week of ' + (LABELS[w] || w);
    return `<a class="week-tag" href="${esc((DATA.prefix || '') + w + '.html')}" title="${esc(weeks.map(x => LABELS[x] || x).join(', '))}">${esc(label)}${rest.length ? ` +${rest.length}` : ''}</a>`;
  }

  function card(p) {
    const s = p.score ?? 0;
    const abs = p.abstract || '';
    const long = abs.length > SHORT;
    const open = state.expanded.has(p.id);
    const shown = long && !open ? abs.slice(0, SHORT) + '…' : abs;
    const ifStr = p.if != null ? ` · IF ${Number(p.if).toFixed(1)}` : '';
    const authors = p.authors || '';
    const isStar = starred.has(p.id), isRead = read.has(p.id);
    const u = url(p);
    return `
      <article class="card${isRead ? ' is-read' : ''}" style="--score-color:${scoreVar(s)}" data-id="${esc(p.id)}">
        <div class="card-top">
          <a class="title" href="${esc(u)}" target="_blank" rel="noopener">${highlight(p.title || '')}</a>
          <div class="score-block" title="semantic ${p.score_semantic ?? '–'} · lexical ${p.score_lexical ?? '–'}">
            <div class="score-pill">${s.toFixed(2)}</div>
            <div class="score-bar-track"><div class="score-bar-fill" style="width:${Math.min(s * 100, 100)}%"></div></div>
          </div>
        </div>
        <div class="card-meta">
          <span class="badge${isPreprint(p) ? ' preprint' : ''}">${esc(p.source)}</span>
          ${!isPreprint(p) ? `<span>${esc(p.journal)}${ifStr}</span>` : ''}
          <span>${esc(p.date)}</span>
          <span title="${esc(authors)}">${esc(authors.length > 60 ? authors.slice(0, 60) + '…' : authors)}</span>
          ${weekTag(p)}
        </div>
        <div class="abstract">${highlight(shown)}${long ? `<button class="toggle-btn" data-act="toggle">${open ? 'Show less' : 'Show more'}</button>` : ''}</div>
        <div class="card-foot">
          <div class="matched">${(p.matched || []).map(k => `<button class="kw" data-kw="${esc(k)}" title="Filter by this keyword">${esc(k)}</button>`).join('')}</div>
          <button class="act${isStar ? ' on' : ''}" data-act="star" aria-pressed="${isStar}">${ICON_STAR.replace('FILL', isStar ? 'currentColor' : 'none')}${isStar ? 'Starred' : 'Star'}</button>
          <button class="act${isRead ? ' read-on' : ''}" data-act="read" aria-pressed="${isRead}">${ICON_CHECK}${isRead ? 'Read' : 'Mark read'}</button>
          <a class="doi-link" href="${esc(u)}" target="_blank" rel="noopener">Open ↗</a>
        </div>
      </article>`;
  }

  const $ = id => document.getElementById(id);

  function renderChips() {
    const counts = {};
    const src = state.view === 'starred' ? [...starred.values()] : pool();
    src.forEach(p => { counts[p.source] = (counts[p.source] || 0) + 1; });
    $('sources').innerHTML = Object.keys(counts).sort().map(src =>
      `<button class="chip" data-src="${esc(src)}" aria-pressed="${state.sources.has(src)}">${esc(src)}<span class="n">${counts[src]}</span></button>`
    ).join('');
    const kwCounts = {};
    src.forEach(p => (p.matched || []).forEach(k => { kwCounts[k] = (kwCounts[k] || 0) + 1; }));
    $('keywords').innerHTML = DATA.keywords.map(k =>
      `<button class="chip" data-kw="${esc(k)}" aria-pressed="${state.keyword === k}">${esc(k)}<span class="n">${kwCounts[k] || 0}</span></button>`
    ).join('');
  }

  // Filter changes start from the first page again
  const update = () => { state.limit = PAGE; render(); };

  function render() {
    const list = filtered();
    const papersEl = $('papers');
    if (state.scope === 'all' && !ALL) {
      papersEl.innerHTML = '<div class="empty">Loading all weeks…</div>';
    } else if (list.length) {
      const rest = list.length - state.limit;
      papersEl.innerHTML = list.slice(0, state.limit).map(card).join('') +
        (rest > 0 ? `<button class="more-btn" data-act="more">Show ${Math.min(rest, PAGE)} more (${rest} left)</button>` : '');
    } else {
      papersEl.innerHTML = `<div class="empty">${state.view === 'starred' && !starred.size
        ? 'No starred papers yet — star papers to build a reading list. It is saved in this browser.'
        : 'No papers match these filters.'}</div>`;
    }
    const base = state.view === 'starred' ? starred.size : pool().length;
    const what = state.view === 'starred' ? 'starred papers'
      : state.scope === 'all' ? `papers across ${(DATA.reports || []).length} weeks` : 'papers';
    $('count').textContent = `Showing ${list.length} of ${base} ${what}`;
    $('star-n').textContent = starred.size ? `(${starred.size})` : '';
    $('export').hidden = state.view !== 'starred' || !starred.size;
    const dirty = state.q || state.sources.size || state.keyword || state.min !== FLOOR;
    $('reset').hidden = !dirty;
    document.querySelectorAll('#view button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === state.view));
    document.querySelectorAll('#scope button').forEach(b => b.setAttribute('aria-pressed', b.dataset.scope === state.scope));
    $('scope').hidden = (DATA.reports || []).length < 2;
    renderChips();
  }

  // ── Header / footer ──
  $('meta').textContent =
    `${papers.length} of ${DATA.total} relevant papers · Past ${DATA.days} days · Generated ${DATA.generated}`;
  $('footer').textContent = `Generated by PaperTrail · Sources: ${DATA.sources.join(', ')}`;
  if (DATA.imported) {
    $('meta').insertAdjacentHTML('afterend',
      '<div class="imported-note">Recovered from an older report: author lists are shortened.</div>');
  }

  // ── Week navigation (reports are listed newest first) ──
  const REPORTS = DATA.reports || [];
  const here = REPORTS.findIndex(r => r.date === DATA.date);
  const href = r => (DATA.prefix || '') + r.date + '.html';
  if (REPORTS.length > 1 && here !== -1) {
    $('weeks').hidden = false;
    $('week').innerHTML = REPORTS.map((r, i) =>
      `<option value="${i}"${i === here ? ' selected' : ''}>${esc(r.label)} · ${r.n} papers${i === 0 ? ' · latest' : ''}</option>`
    ).join('');
    $('week').addEventListener('change', e => { location.href = href(REPORTS[+e.target.value]); });
    const link = (el, r) => r ? (el.href = href(r)) : el.setAttribute('aria-disabled', 'true');
    link($('prev'), REPORTS[here + 1]);
    link($('next'), REPORTS[here - 1]);
    if (here === 0) $('latest').hidden = true; else $('latest').href = DATA.home;
  }

  // ── Controls ──
  const min = $('min');
  min.min = FLOOR;
  min.value = state.min;
  $('min-val').textContent = state.min.toFixed(2);
  $('sort').value = state.sort;

  let t;
  $('q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; update(); }, 120); });
  min.addEventListener('input', e => { state.min = +e.target.value; $('min-val').textContent = state.min.toFixed(2); update(); });
  $('sort').addEventListener('change', e => { state.sort = e.target.value; store.set('prefs', { ...prefs, sort: state.sort }); update(); });
  $('view').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.view = b.dataset.view; update();
  });
  $('scope').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.scope = b.dataset.scope;
    if (state.scope === 'all') loadAll();
    update();
  });
  $('sources').addEventListener('click', e => {
    const b = e.target.closest('[data-src]'); if (!b) return;
    const s = b.dataset.src;
    state.sources.has(s) ? state.sources.delete(s) : state.sources.add(s);
    update();
  });
  const toggleKw = k => { state.keyword = state.keyword === k ? null : k; update(); };
  $('keywords').addEventListener('click', e => { const b = e.target.closest('[data-kw]'); if (b) toggleKw(b.dataset.kw); });
  $('reset').addEventListener('click', () => {
    state.q = ''; $('q').value = '';
    state.sources.clear(); state.keyword = null;
    state.min = FLOOR; min.value = state.min; $('min-val').textContent = state.min.toFixed(2);
    update();
  });
  $('export').addEventListener('click', () => {
    const lines = [...starred.values()].sort((a, b) => b.score - a.score).map(p =>
      `- [${p.title}](${url(p)})  \n  ${p.authors ? p.authors.split(/[,;]/)[0].trim() + ' et al. · ' : ''}${isPreprint(p) ? p.source : p.journal} · ${p.date}`);
    const blob = new Blob([`# PaperTrail — starred papers\n\n${lines.join('\n')}\n`], { type: 'text/markdown' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'papertrail-starred.md' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $('papers').addEventListener('click', e => {
    const kw = e.target.closest('.matched [data-kw]');
    if (kw) { toggleKw(kw.dataset.kw); return; }
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    if (btn.dataset.act === 'more') { state.limit += PAGE; render(); return; }
    const id = btn.closest('.card').dataset.id;
    const p = pool().find(x => x.id === id) || papers.find(x => x.id === id) || starred.get(id);
    const act = btn.dataset.act;
    if (act === 'toggle') { state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); }
    if (act === 'star')   { starred.has(id) ? starred.delete(id) : starred.set(id, { ...p, weeks: p.weeks || [DATA.date] }); saveStars(); }
    if (act === 'read')   { read.has(id) ? read.delete(id) : read.add(id); saveRead(); }
    render();
  });

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
    if (e.key === 'Escape' && document.activeElement === $('q')) { $('q').blur(); }
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (!typing && e.key === '[' && $('prev').href) location.href = $('prev').href;
    if (!typing && e.key === ']' && $('next').href) location.href = $('next').href;
  });

  render();
})();
</script>
</body>
</html>
